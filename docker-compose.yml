services:
  visoto:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: visoto
    expose:
      - "8060"
    volumes:
      # Mount config file for easy customization
      - ./visoto.config:/app/visoto.config:ro
      # Persistent storage for monitoring time-series database
      - visoto_data:/app/data
    environment:
      # Gin mode: debug, release, or test
      - GIN_MODE=release
      # Resolves the ${QLEVER_ACCESS_TOKEN} reference in visoto.config. Empty
      # default so the stack still starts without the qlever profile; config
      # Load() fails loudly if the config references it while unset.
      - QLEVER_ACCESS_TOKEN=${QLEVER_ACCESS_TOKEN:-}
      # Same, for the ${GEMINI_API_KEY} reference (chat feature). Optional:
      # leave gemini_api_key commented out in visoto.config to run without chat.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8060/ping"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - visoto-network
      - qlever-private

  caddy:
    build:
      context: .
      dockerfile_inline: |
        FROM caddy:builder-alpine AS builder
        RUN xcaddy build \
            --with github.com/mholt/caddy-ratelimit \
            --with github.com/caddyserver/cache-handler
        FROM caddy:alpine
        COPY --from=builder /usr/bin/caddy /usr/bin/caddy
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # Access log, written as JSON and rolled by Caddy itself (see the `log`
      # block in the Caddyfile). The goaccess service reads this read-only.
      - caddy_logs:/var/log/caddy
      # The generated analytics report, served read-only at /goaccess/.
      # Not depends_on: Caddy must come up even if goaccess is down — the route
      # just 404s until the first report is written.
      - goaccess_report:/srv/goaccess:ro
    restart: unless-stopped
    depends_on:
      - visoto
    networks:
      - visoto-network

  # Web analytics. Re-parses Caddy's access log every 5 minutes into a static
  # HTML report; Caddy serves it behind basic_auth (see the `route /goaccess/*`
  # block in the Caddyfile). Deliberately NOT real-time:
  # the WebSocket mode would need a CSP change (connect-src 'self') and an extra
  # port for no benefit on a dashboard consulted occasionally.
  goaccess:
    image: allinurl/goaccess:1.9.4
    container_name: goaccess
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -u
        mkdir -p /report /db
        while true; do
          if [ -s /logs/access.log ]; then
            goaccess /logs/access.log \
              -o /report/index.html \
              --log-format=CADDY \
              --date-format=%s \
              --time-format=%s \
              --persist --restore --db-path=/db \
              --anonymize-ip \
              --agent-list \
              --real-os \
              --no-global-config \
              --exclude-ip=10.0.0.0-10.255.255.255 \
              --exclude-ip=172.16.0.0-172.31.255.255 \
              --exclude-ip=192.168.0.0-192.168.255.255 \
              || echo "goaccess: parse failed, retrying next cycle"
          else
            echo "goaccess: waiting for /logs/access.log"
          fi
          sleep 300
        done
    volumes:
      - caddy_logs:/logs:ro
      - goaccess_report:/report
      - goaccess_db:/db
    restart: unless-stopped
    networks:
      - visoto-network

  # QLever private triplestore — opt-in via: docker compose --profile qlever up -d
  # Not started by default. Caddy and the internet cannot reach QLever.
  # To remove: docker compose --profile qlever down [-v to also delete data]

  # Builds a bootstrap index on first run (no-op if index already exists).
  qlever-init:
    image: docker.io/adfreiburg/qlever
    profiles: ["qlever"]
    container_name: qlever-init
    user: root
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        if [ ! -f /data/visoto.index.pos ]; then
          echo "Building bootstrap index..."
          cp /init/init.ttl /data/init.ttl
          /qlever/qlever-index -i visoto -f init.ttl -F ttl
          echo "Bootstrap index complete."
        else
          echo "Index already exists, skipping."
        fi
        # This container runs as root, so everything above is root-owned, but
        # qlever-server runs as the image's default (non-root) user. Without
        # this chown it can read the index yet cannot create
        # visoto.update-triples.tmp, so every --persist-updates write fails with
        # "Permission denied" and the upload modal shows a 500.
        owner=$(stat -c '%u:%g' /qlever/qlever-server)
        echo "Handing /data to ${owner} (qlever-server's user)..."
        chown -R "${owner}" /data
    volumes:
      - qlever_data:/data
      - ./qlever/data/init.ttl:/init/init.ttl:ro
    working_dir: /data
    restart: "no"
    networks:
      - qlever-private

  qlever:
    image: docker.io/adfreiburg/qlever
    profiles: ["qlever"]
    container_name: qlever
    entrypoint: /qlever/qlever-server
    command:
      - -i
      - visoto
      - -p
      - "7001"
      - -m
      - 1.5G
      - -c
      - 1G
      - -e
      - 256M
      - -s
      - 60s
      # Write token, required for SPARQL UPDATE / Graph Store uploads. Supplied
      # via .env (gitignored) so it is not committed; must match the
      # access_token of the visoto-qlever endpoint in visoto.config.
      - -a
      - ${QLEVER_ACCESS_TOKEN:?QLEVER_ACCESS_TOKEN is not set - add it to .env (see .env.example)}
      # Without this, SPARQL UPDATEs (including Graph Store Protocol uploads via
      # /api/upload) live only in memory and are silently lost on restart — the
      # bootstrap index still exists on disk, so qlever-init skips and the server
      # comes back up healthy but empty.
      - --persist-updates
    volumes:
      - qlever_data:/data
    working_dir: /data
    depends_on:
      qlever-init:
        condition: service_completed_successfully
    networks:
      - qlever-private
    restart: unless-stopped

networks:
  visoto-network:
    driver: bridge
  qlever-private:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  visoto_data:
  qlever_data:
  # Caddy's JSON access log. Bounded by roll_size/roll_keep in the Caddyfile.
  caddy_logs:
  # The generated GoAccess HTML report (written by goaccess, read by caddy).
  goaccess_report:
  # GoAccess's on-disk database. This is what makes visitor totals survive log
  # rotation and container restarts — without it every roll resets to zero.
  goaccess_db:
