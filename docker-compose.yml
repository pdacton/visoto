services:
  visoto:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: visoto
    expose:
      - "8060"
    volumes:
      # Mount config file for easy customization
      - ./visoto.config:/app/visoto.config:ro
    environment:
      # Gin mode: debug, release, or test
      - GIN_MODE=release
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8060/ping"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - visoto-network

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - visoto
    networks:
      - visoto-network

networks:
  visoto-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
