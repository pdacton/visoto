services:
  visoto:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: visoto
    expose:
      - "8060"
    volumes:
      # Mount config file for easy customization
      - ./visoto.config:/app/visoto.config:ro
      # Persistent storage for monitoring time-series database
      - visoto_data:/app/data
    environment:
      # Gin mode: debug, release, or test
      - GIN_MODE=release
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8060/ping"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - visoto-network
      - qlever-private

  caddy:
    build:
      context: .
      dockerfile_inline: |
        FROM caddy:builder-alpine AS builder
        RUN xcaddy build --with github.com/mholt/caddy-ratelimit
        FROM caddy:alpine
        COPY --from=builder /usr/bin/caddy /usr/bin/caddy
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - visoto
    networks:
      - visoto-network

  # QLever private triplestore — opt-in via: docker compose --profile qlever up -d
  # Not started by default. Caddy and the internet cannot reach QLever.
  # To remove: docker compose --profile qlever down [-v to also delete data]
  qlever:
    image: docker.io/adfreiburg/qlever
    profiles: ["qlever"]
    container_name: qlever
    entrypoint: /qlever/qlever-server
    command:
      - -i
      - visoto
      - -p
      - "7001"
      - -m
      - 1.5G
      - -c
      - 1G
      - -e
      - 256M
      - -s
      - 60s
    volumes:
      - qlever_data:/data
    working_dir: /data
    networks:
      - qlever-private
    restart: unless-stopped

networks:
  visoto-network:
    driver: bridge
  qlever-private:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  visoto_data:
  qlever_data:
