"page.environment.subtitle" = "Flüsse, alle zehn Minuten gemessen, Wälder einmal pro Jahrzehnt — und eine Rote Liste, die festhält, was die Schweiz bereits verloren hat."
"page.environment.theDatasets" = "Die Datensätze"
