"page.facets.aDemonstrationOfTheSparqlAsyncTable" = "Eine Demonstration des Partials <code>sparqlAsyncTable</code> im Facettenmodus über <strong>ZefixOrganisation</strong> (~790'000 im Handelsregister eingetragene Schweizer Unternehmen). Jede facettierbare Spalte trägt ein <strong>Filter-Bedienelement in ihrem Kopf</strong> (das Trichtersymbol), gesteuert von den <code>&lt;sparql-column&gt;</code>-Deklarationen auf dieser Seite. Eine Auswahl filtert die <strong>geladenen Zeilen sofort</strong> im Browser; da diese Klasse zu gross ist, um sie vollständig zu halten, holt die Anwendung anschliessend still die <strong>echten Treffer der gesamten Klasse</strong> vom Backend und tauscht sie ein — Sie erhalten eine sofortige Vorschau und ein verbindliches Resultat, ohne je mit der Grösse konfrontiert zu werden."
"page.facets.becauseTheClassIsLarge" = "Da die Klasse gross ist, wird die anfängliche (ungefilterte) Ansicht aus Reaktionsgründen begrenzt — öffnen Sie den Filter einer Spalte, um sie einzugrenzen."
"page.facets.legalFormAMultiSelect" = "<strong>Rechtsform</strong> — eine Mehrfachauswahl-Facette über <code>schema:additionalType</code> (Werte aus dem Store aufgezählt, z. B. GmbH, AG, Einzelunternehmen); wählen Sie eine oder mehrere, oder <em>(kein Wert)</em> für Unternehmen ohne erfasste Rechtsform."
"page.facets.nameContainsAFreeText" = "<strong>Name enthält</strong> — eine Freitext-Facette über <code>schema:name</code>, mit einer Option <em>(kein Wert)</em> für Unternehmen ohne erfassten Namen."
