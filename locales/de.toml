"page.plazi.plantae" = "Plantae"
"page.plazi.plantsMostlyPhotosyntheticOrganismsFrom" = "Pflanzen — meist photosynthetische Organismen, von Moosen bis zu Blütenpflanzen."
"page.plazi.plazi" = "<a href=\"https://plazi.org\" target=\"_blank\" rel=\"noopener\">Plazi</a>"
"page.plazi.plaziClassification" = "Plazi-Klassifikation"
"page.plazi.plaziIsANotFor" = "<a href=\"https://plazi.org/\" target=\"_blank\" rel=\"noopener\">Plazi</a> ist eine gemeinnützige Organisation, die taxonomisches Wissen aus der wissenschaftlichen Literatur befreit. Sie überführt Artbeschreibungen — sogenannte <em>Treatments</em> — aus publizierten Artikeln in maschinenlesbare, offen zugängliche Daten und publiziert sie als Linked Data."
"page.plazi.plaziTreatmentBankDealsWithScientific" = "Plazi TreatmentBank befasst sich mit wissenschaftlicher, publizierter biosystematischer Literatur — dem Korpus, der alle rund 1,9 Millionen bekannten Arten der Welt auf geschätzten 500 Millionen publizierten Seiten dokumentiert. Jedes <em>Treatment</em> ist ein klar abgegrenzter Teil eines Artikels, der die Verwendung eines wissenschaftlichen Namens durch eine Autorin oder einen Autor zu einem bestimmten Zeitpunkt festhält; wie bibliografische Referenzen lassen sich Treatments zitieren und bauen auf früheren auf. Zusammen bilden sie den aktuellen wissenschaftlichen Konsens zur biologischen Taxonomie ab, referenzieren die zugrunde liegende Literatur vollständig und verweisen auf bei Zenodo/CERN archivierte Belegexemplare und Bilder. Die zitierten Publikationen sind über das <a href=\"https://zenodo.org/communities/biosyslit/\" target=\"_blank\" rel=\"noopener\">Biodiversity Literature Repository</a> verfügbar."
"page.plazi.plaziTreatmentsRdf" = "<code>plazi-treatments-rdf</code>"
