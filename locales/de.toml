"page.plazi.animalia" = "Animalia"
"page.plazi.animalsMulticellularOrganismsThatFeed" = "Tiere — vielzellige Organismen, die sich von anderen Organismen ernähren."
"page.plazi.bacteria" = "Bacteria"
"page.plazi.bacteriaSingleCelledProkaryoticMicroorganisms" = "Bakterien — einzellige prokaryotische Mikroorganismen, die in nahezu jedem Lebensraum vorkommen."
"page.plazi.cc010PublicDomain" = "<a href=\"https://creativecommons.org/publicdomain/zero/1.0/\" target=\"_blank\" rel=\"noopener\">CC0 1.0 (Gemeinfrei)</a>"
"page.plazi.chromista" = "Chromista"
"page.plazi.chromistsAlgaeAndProtistsSuch" = "Chromisten — Algen und Protisten wie Kieselalgen, Braunalgen und Eipilze."
"page.plazi.classesInTheDataset" = "Klassen im Datensatz"
"page.plazi.everyOrganismDescribedInThe" = "Jeder in der Literatur beschriebene Organismus ist in eine hierarchische <strong>Klassifikation</strong> eingeordnet. Zuoberst stehen einige wenige Reiche, die alle Lebewesen zusammenfassen. Jedes Reich unten ist durch eine <a href=\"/resource?iri=http%3A%2F%2Ftaxon-name.plazi.org%2Fid%2FTaxonName\">TaxonName</a>-Ressource vertreten, die Sie in Visoto erkunden können, um sich durch den Stammbaum des Lebens zu bewegen."
"page.plazi.fungi" = "Fungi"
"page.plazi.fungiMouldsYeastsAndMushrooms" = "Pilze — Schimmelpilze, Hefen und Ständerpilze, die Nährstoffe aus ihrer Umgebung aufnehmen."
"page.plazi.identifier" = "Identifikator"
"page.plazi.landingPage" = "Landing-Page"
"page.plazi.lastModified" = "Zuletzt geändert"
"page.plazi.license" = "Lizenz"
"page.plazi.openUse" = "<a href=\"https://ld.admin.ch/vocabulary/TermsOfUse/Open-Use\" target=\"_blank\" rel=\"noopener\">Freie Nutzung</a>"
"page.plazi.plantae" = "Plantae"
"page.plazi.plantsMostlyPhotosyntheticOrganismsFrom" = "Pflanzen — meist photosynthetische Organismen, von Moosen bis zu Blütenpflanzen."
"page.plazi.plazi" = "<a href=\"https://plazi.org\" target=\"_blank\" rel=\"noopener\">Plazi</a>"
"page.plazi.plaziClassification" = "Plazi-Klassifikation"
"page.plazi.plaziIsANotFor" = "<a href=\"https://plazi.org/\" target=\"_blank\" rel=\"noopener\">Plazi</a> ist eine gemeinnützige Organisation, die taxonomisches Wissen aus der wissenschaftlichen Literatur befreit. Sie überführt Artbeschreibungen — sogenannte <em>Treatments</em> — aus publizierten Artikeln in maschinenlesbare, offen zugängliche Daten und publiziert sie als Linked Data."
"page.plazi.plaziTreatmentBankDealsWithScientific" = "Plazi TreatmentBank befasst sich mit wissenschaftlicher, publizierter biosystematischer Literatur — dem Korpus, der alle rund 1,9 Millionen bekannten Arten der Welt auf geschätzten 500 Millionen publizierten Seiten dokumentiert. Jedes <em>Treatment</em> ist ein klar abgegrenzter Teil eines Artikels, der die Verwendung eines wissenschaftlichen Namens durch eine Autorin oder einen Autor zu einem bestimmten Zeitpunkt festhält; wie bibliografische Referenzen lassen sich Treatments zitieren und bauen auf früheren auf. Zusammen bilden sie den aktuellen wissenschaftlichen Konsens zur biologischen Taxonomie ab, referenzieren die zugrunde liegende Literatur vollständig und verweisen auf bei Zenodo/CERN archivierte Belegexemplare und Bilder. Die zitierten Publikationen sind über das <a href=\"https://zenodo.org/communities/biosyslit/\" target=\"_blank\" rel=\"noopener\">Biodiversity Literature Repository</a> verfügbar."
"page.plazi.plaziTreatmentsRdf" = "<code>plazi-treatments-rdf</code>"
"page.plazi.protozoa" = "Protozoa"
"page.plazi.protozoaSingleCelledEukaryoticOrganisms" = "Protozoen — einzellige eukaryotische Organismen wie Amöben und Flagellaten."
"page.plazi.published" = "<span class=\"badge bg-green-lt\">Veröffentlicht</span>"
"page.plazi.publisher" = "Herausgeber"
"page.plazi.sparqlEndpoint" = "SPARQL-Endpunkt"
"page.plazi.status" = "Status"
"page.plazi.synospeciesPlaziOrg" = "<a href=\"https://synospecies.plazi.org\" target=\"_blank\" rel=\"noopener\">synospecies.plazi.org</a>"
"page.plazi.taxonNamesUnit" = "Taxonnamen"
"page.plazi.termsOfUse" = "Nutzungsbedingungen"
"page.plazi.theClassesBelowAreEvery" = "Die Klassen unten sind alle Klassen, die im Graphen entweder als <code>rdfs:Class</code>/<code>owl:Class</code> deklariert oder als Objekt einer <code>rdf:type</code>-Aussage verwendet werden, geordnet nach der Anzahl ihrer Instanzen. Ist eine Klasse in einem im Store geladenen Vokabular definiert, wird ihre Beschreibung angezeigt. Der Biodiversitätsinhalt steckt in den ersten Zeilen (Materialzitate, Taxon-Konzepte und -Namen, Treatments, Abbildungen und Artikel); die Zeilen mit einer einzigen Instanz beschreiben den Datensatz selbst."
"page.plazi.theDataset" = "Der Datensatz"
"page.plazi.thePlaziClassificationShownAbove" = "Die oben gezeigte Plazi-Klassifikation stützt sich auf den Datensatz <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffoen%2Fplazi\">Plazi Taxonomic Treatments</a>, publiziert auf LINDAS im benannten Graphen <code>https://lindas.admin.ch/foen/plazi</code>."

