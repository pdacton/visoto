"page.connect.visotoShipsAnMCPServer" = "Visoto bringt einen <a href=\"https://modelcontextprotocol.io/\" target=\"_blank\">MCP</a>-Server mit, über den KI-Assistenten dieselben SPARQL-Endpunkte erkunden können, die Sie hier sehen — Klassen entdecken, nach Bezeichnung suchen, Abfragen ausführen — und ihre Antworten mit den Visualisierungen von Visoto verknüpfen. Verbinden Sie ihn mit Ihrem eigenen Assistenten und stellen Sie Ihre Fragen dort, mit Ihrem eigenen Abonnement. Der eingebaute Ressourcen-Assistent bleibt als Standard ohne Einrichtung verfügbar."
