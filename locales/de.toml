# ── Page: statistics ──────────────────────────────────────────────────
"page.statistics.aboutThisTheme" = "Über dieses Thema"
"page.statistics.caveat" = "Vorbehalt"
"page.statistics.contents" = "Inhalt"
"page.statistics.crossLinks" = "Letztlich verweist alles auf dieser Plattform hierher. Gemeinde- und Kantons-IRIs aus diesem Register erscheinen in <a href=\"/energy.html\">Stromtarifen</a>, <a href=\"/agriculture.html\">Tierseuchenmeldungen</a> und <a href=\"/politics.html\">Abstimmungsergebnissen</a> gleichermassen; Unternehmens-UIDs aus Zefix identifizieren die Netzbetreiber hinter diesen Tarifen; die gemeinsamen Dimensionen führen die <a href=\"/environment.html\">Umwelt</a>-Messstationen; und die Klassifikationen liegen den überall verwendeten Cube-Dimensionen zugrunde. Wenn eine Zahl auf einer anderen Seite zu einem Ort, einem Unternehmen oder einem Code auflöst, dann hierhin."
"page.statistics.datasetsIntro" = "Fünf benannte Graphen von drei Herausgebern. Ungewöhnlich für diese Plattform enthält keiner davon eine einzige Beobachtung — es sind durchwegs Definitionen, Identifikatoren und Codelisten."
"page.statistics.fsoPublisher" = "Bundesamt für Statistik (BFS)"
"page.statistics.group" = "Gruppe"
"page.statistics.i14y" = "Die Codelisten, auf die sich alle einigen"
"page.statistics.i14yCaveat" = "I14Y ist konsequent versioniert: Jede Klassifikation besteht aus einer stabilen Identität und je einem Begriffsschema pro veröffentlichter Ausgabe, und die rohen Zahlen liefern die Ausgabe-Schemata. Die Tabelle oben filtert auf Identitäten. Zu beachten ist auch das Präfix <code>DV_</code> bei vielen Identifikatoren — das sind die Kopien aus dem verteilten Vokabular, die gelegentlich eine leicht abweichende Begriffszahl aufweisen als das Original gleichen Namens."
"page.statistics.i14yCaveatCard" = "Jede Klassifikation erscheint einmal als Identität und einmal pro Ausgabe — filtern Sie auf <code>version.link/Identity</code>, sonst wiederholt sich dieselbe Liste mit leicht abweichenden Zahlen"
"page.statistics.i14yContents" = "Der Codelisten-Katalog des Bundes: Berufe (CH-ISCO-19), Krankheiten (ICD-10-GM), Operationen (CHOP), Wirtschaftszweige (NOGA), Sprachen, Länder, Flugplätze, raumbezogene Grundeinheiten"
"page.statistics.i14yGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffso%2Fi14y\">fso/i14y</a>"
"page.statistics.i14yGroup" = "<strong>Interoperabilitätsplattform I14Y</strong>"
"page.statistics.i14yIntro" = "<strong>I14Y</strong> — das Numeronym für <em>Interoperabilität</em> — ist die Plattform des Bundes, auf der Stellen ihre Codelisten publizieren, damit andere dieselben übernehmen können, statt parallele Fassungen zu erfinden. Sie ist mit Abstand der grösste Graph dieses Themas, und ihr Inhalt ist eine treffende Zusammenfassung dessen, was der Schweizer Staat zählt: Berufe, Krankheiten, Operationen, Wirtschaftszweige, Sprachen, Länder, Flughäfen."
"page.statistics.i14yModel" = "Alles ist in <strong>SKOS</strong> modelliert, dem Standardvokabular für Klassifikationssysteme, ergänzt durch <code>xkos:ClassificationLevel</code> zur Kennzeichnung der Hierarchiestufen — so weiss ein vierstelliger Berufscode, dass er unter einer dreistelligen Gruppe liegt. Die Begriffe führen ihre Ober- und Unterbeziehungen mit, und genau das macht eine Klassifikation für die Aggregation brauchbar und nicht bloss zum Nachschlagen."
"page.statistics.i14yNames" = "Die Namen in dieser Tabelle lohnen sich als Liste gelesen. <strong>CH-ISCO-19</strong> ist die Schweizer Berufsnomenklatur, mit rund fünfundzwanzigtausend Einträgen das Grösste hier. <strong>CHOP</strong> ist die Operationsklassifikation und <strong>ICD-10-GM</strong> die Krankheitsklassifikation — beide codiert jedes Schweizer Spital. <strong>NOGA</strong> ist die Wirtschaftszweigklassifikation hinter der Unternehmensstatistik. Zusammen bilden sie das Vokabular, in dem der Staat Arbeit, Krankheit und Wirtschaft beschreibt."
"page.statistics.i14ySize" = "~453'000 SKOS-Begriffe in ~670 Begriffsschemata, ~134'000 Identitäten mit ~320'000 Versionen"
"page.statistics.intro" = "Dieses Thema ist das Fundament. Nichts hier ist eine Messung der Welt — es ist die Mechanik, die Messungen überhaupt vergleichbar macht: <em>welcher</em> Gemeinde eine Zahl zugehört, <em>welchen</em> Beruf eine Person laut Erfassung ausübt, <em>welchem</em> Wirtschaftszweig ein Unternehmen zugeordnet ist. Jede andere Seite dieser Website hängt davon ab, meist ohne es zu erwähnen."
"page.statistics.lindasPublisher" = "LINDAS (gemeinsame Plattformdaten)"
"page.statistics.mergersCaveat" = "Nicht jede Mutation ist eine Fusion — das Register nutzt denselben Mechanismus für Umbenennungen, Grenzkorrekturen und Wechsel zwischen Bezirken, die Ereigniszahl ist also eine Obergrenze für echte Zusammenschlüsse. Ein Ereignis mit mehreren Vorgängern und einem Nachfolger ist die klassische Fusionsform; ein Vorgänger und ein Nachfolger ist meist eine Umbenennung."
"page.statistics.mergersIntro" = "Die Schweiz hatte den grössten Teil des zwanzigsten Jahrhunderts über 3'000 Gemeinden und verliert seither stetig welche — nicht durch eine Politik des Bundes, sondern durch Tausende lokaler Fusionsentscheide. Das Register hält jeden einzelnen als <strong>Mutation</strong> fest, mit den eingegangenen Vorgängern, dem entstandenen Nachfolger und dem Datum des Inkrafttretens. Es ist dasselbe <code>version.link</code>-Modell, das die <a href=\"/government.html\">Bundesverwaltung</a> für ihre eigenen Reorganisationen verwendet."
"page.statistics.mergersWaves" = "Nach Jahren gruppiert kommen die Fusionen in Wellen und nicht als steter Strom. Getrieben werden sie von den Kantonen — ein Kanton stellt finanzielle Anreize in Aussicht, und Dutzende Gemeinden fusionieren auf einen Januar. <strong>2006</strong> und <strong>2010</strong> stechen deutlich hervor und liessen je über vierhundert Gemeinden in Nachfolgern aufgehen. Weil jede Fusion auf den 1. Januar in Kraft tritt, ändert sich die Karte der Schweiz jeweils an einem einzigen Tag im Jahr."
"page.statistics.mergersWhyItMatters" = "Die praktische Folge für alle, die diese Plattform abfragen: Eine Gemeinde-IRI ist eine <em>Version</em> und kein Ort. Verknüpft man eine Statistik von 2005 allein über den Identifikator mit einer Gemeindeliste von 2026, verschwinden die zwischenzeitlich fusionierten Zeilen stillschweigend. Genau dafür gibt es das Register: damit die Verknüpfung sauber gelingt, indem man der Vorgängerkette folgt."
"page.statistics.metaTitle" = "Statistik & Register"
"page.statistics.model" = "Modell"
"page.statistics.municipalitiesCaveat" = "Gemeinden führen zudem einen <code>geosparql:hasGeometry</code>-Verweis auf ihr Grenzpolygon in <code>geo.ld.admin.ch</code> sowie einen GeoNames-Feature-Code — das Register ist also auch eine Brücke in die Kartendaten und nicht nur eine Namensliste. Nicht jede Gemeinde hat eine Geometrie hinterlegt; die Abdeckung ist teilweise."
"page.statistics.municipalitiesIntro" = "Die Gemeinde ist das Atom der Schweizer Statistik: Fast jede Zahl, die der Bund publiziert, wird entweder pro Gemeinde erhoben oder aus Gemeinden aggregiert. Das Register definiert die vollständige dreistufige Hierarchie — <strong>Kanton</strong>, <strong>Bezirk</strong>, <strong>Gemeinde</strong> —, und deren Form ist auf eine Weise ungleich, die eher Geschichte als Bevölkerung widerspiegelt. Bern und die Waadt zählen je Hunderte von Gemeinden; Graubünden hat mehr Bezirke als Zürich, bei einem Bruchteil der Einwohner."
"page.statistics.namedGraph" = "Benannter Graph"
"page.statistics.opendataCaveat" = "Deutlich kleiner, als der Name vermuten lässt — dies ist die <em>Liste der publizierenden Stellen</em> hinter dem nationalen Open-Data-Portal und kein Katalog von dessen Datensätzen"
"page.statistics.opendataGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Fsfa%2Fopendataswiss\">sfa/opendataswiss</a>"
"page.statistics.opendataGroup" = "<strong>opendata.swiss-Ernte</strong>"
"page.statistics.opendataSize" = "~175 publizierende Organisationen und ~213 definierte Begriffe"
"page.statistics.publisher" = "Herausgeber"
"page.statistics.registerCaveat" = "Der Kanton liegt <em>zwei</em> Schritte von einer Gemeinde entfernt (über den Bezirk) — es gibt keine direkte Kante, und <code>containedInPlace*</code> erreicht ihn nicht"
"page.statistics.registerGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffso%2Fregister\">fso/register</a>"
"page.statistics.registerGroup" = "<strong>Gemeindeverzeichnis</strong>"
"page.statistics.registerModel" = "<strong>version.link</strong> über dem Standard <code>eCH-0071</code> — stabile Identitäten mit datierten Versionen, dazu <code>ChangeEvent</code>-Ressourcen für Fusionen und Umbenennungen"
"page.statistics.registerSize" = "~3'250 politische Gemeinden, ~5'870 Gemeindeversionen, ~5'845 Mutationen, ~265 Bezirke"
"page.statistics.sfaPublisher" = "Schweizerisches Bundesarchiv"
"page.statistics.sharedDimensions" = "Gemeinsame Dimensionen"
"page.statistics.sharedDimensionsWhy" = "Der Sinn der zentralen Publikation liegt darin, dass zwei Ämter, die denselben See oder denselben Flugplatz messen, dieselbe IRI dafür verwenden. Wenn das Thema <a href=\"/energy.html\">Energie</a> ein Wasserkraftwerk aufführt und das Thema <a href=\"/environment.html\">Umwelt</a> über den Fluss berichtet, an dem es liegt, macht erst die gemeinsame Dimension eine Verknüpfung möglich."
"page.statistics.size" = "Grösse"
"page.statistics.statistics" = "Statistik"
"page.statistics.subtitle" = "Die Referenzdaten, an denen alles andere gemessen wird — jede Gemeinde, jedes eingetragene Unternehmen und die Codelisten, auf die sich die Schweizer Statistik geeinigt hat."
"page.statistics.territorialContents" = "Länder und Kontinente sowie gemeinsame geografische Codelisten — Wasserkraftanlagen, Badegewässer, Waldbrandwarnregionen, Flugplätze, biogeografische Regionen"
"page.statistics.territorialGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Fterritorial\">territorial</a>"
"page.statistics.territorialGroup" = "<strong>Territoriale Referenzdaten</strong>"
"page.statistics.territorialIntro" = "Der Graph <strong>territorial</strong> ist klein, aber überproportional tragend. Er enthält die Länder-, Kantons- und Bezirksressourcen, auf welche Cube-Beobachtungen der ganzen Plattform verweisen, dazu eine Reihe <strong>gemeinsamer Dimensionen</strong> — fertige Codelisten für wiederkehrende Dinge: Wasserkraftanlagen, Badegewässer-Messstationen, Waldbrandwarnregionen, zivile und militärische Flugplätze, biogeografische Regionen."
"page.statistics.territorialSize" = "~284 Länder, ~301 Verwaltungsgebiete, 18 gemeinsame Dimensionen, 6 Kontinente"
"page.statistics.theDatasets" = "Die Datensätze"
"page.statistics.theGreatMerging" = "Die grosse Fusionswelle"
"page.statistics.theMunicipalities" = "Dreieinhalbtausend Gemeinden"
"page.statistics.title" = "Statistik & Register"
"page.statistics.twoProblems" = "Zwei Probleme stehen im Vordergrund, und die beiden Hauptgraphen lösen je eines davon. Referenzdaten <strong>verändern sich</strong> — Gemeinden fusionieren, und eine Statistik über Wald aus dem Jahr 2005 betrifft nicht dasselbe Gebiet wie eine von 2025. Und Referenzdaten müssen <strong>geteilt</strong> werden — erfindet jedes Amt eigene Berufscodes, lassen sich die Zahlen nie zusammenführen. Das <strong>Bundesamt für Statistik</strong> beantwortet beides, mit einem versionierten Gemeindeverzeichnis und der Interoperabilitätsplattform I14Y."

