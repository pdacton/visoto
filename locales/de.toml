"page.health.dailyCasesDeathsAndHospitalizations" = "Tägliche Fälle, Todesfälle und Hospitalisationen pro Kanton; Impfdosen nach Region und Impfstoff; geimpfte Bevölkerung nach Status (24. Feb. 2020 – 1. Jan. 2023)"
"page.health.dailySnapshotsOfOpenDisruptions" = "Tägliche Momentaufnahmen der offenen Störungen pro Arzneimittel (ATC-Code, GTIN, Beginn und erwartetes Ende) sowie eine tägliche Aggregation offen/geschlossen"
"page.health.dataset" = "Datensatz"
"page.health.dosesAdministeredByRegionAnd" = "Verabreichte Dosen nach Region und Impfstoff — der grösste der drei Cubes, weil jeder Tag nach Hersteller aufgeschlüsselt ist."
"page.health.fonesFederalOfficeForNational" = "BWL — Bundesamt für wirtschaftliche Landesversorgung"
"page.health.fophFederalOfficeOfPublic" = "BAG — Bundesamt für Gesundheit"
"page.health.from24February2020The" = "Vom 24. Februar 2020 — dem Tag, an dem die Schweiz ihren ersten Fall bestätigte — bis zum 1. Januar 2023 hat das Bundesamt für Gesundheit die Pandemie Tag für Tag festgehalten: <span hx-get=\"/api/metric/healthReportingDays\" hx-trigger=\"load\" hx-swap=\"innerHTML\"> <span class=\"spinner-border spinner-border-sm text-muted\" role=\"status\"></span> </span> Meldetage, für das ganze Land und für jeden Kanton. Die Daten sind als drei <a href=\"/resource?iri=https%3A%2F%2Fcube.link%2FCube\">Datenwürfel</a> organisiert, und anders als die meisten LINDAS-Datensätze wird dieser nie wieder wachsen: Er ist die abgeschlossene statistische Chronik eines Ereignisses, aufbewahrt gerade weil sie abgeschlossen ist."
"page.health.groupingTheOpenDisruptionsBy" = "Gruppiert man die offenen Störungen nach dem ersten Buchstaben ihres ATC-Codes — der anatomischen Hauptgruppe —, zeigt sich, <em>welche Arten</em> von Arzneimitteln knapp werden. Es sind selten die alltäglichen Schmerzmittel: Meist dominieren Krebstherapien und Antiinfektiva die Liste, also die Kategorien mit den anfälligsten Lieferketten."
"page.health.health" = "Gesundheit"
"page.health.landingPage" = "Landing-Page"
"page.health.medicineSupplyDisruptions" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffones%2Fsupply-disruptions\">Versorgungsstörungen bei Arzneimitteln</a>"
"page.health.namedGraph" = "Benannter Graph"
"page.health.peopleRatherThanDosesHow" = "Personen statt Dosen: wie viele Einwohnerinnen und Einwohner jedes Kantons welchen Impfstatus hatten, von der ersten Dosis bis zum zweiten Booster."
"page.health.publisher" = "Herausgeber"
"page.health.sixVaccinesWereAdministeredIn" = "In der Schweiz wurden sechs Impfstoffe verabreicht; jeder ist als <a href=\"/resource?iri=http%3A%2F%2Fschema.org%2FTherapeuticProcedure\">therapeutisches Verfahren</a> modelliert und mit seinem Hersteller verknüpft — die beiden bivalenten Varianten sind getrennt von den ursprünglichen Formulierungen erfasst. Der Cube der geimpften Bevölkerung gliedert seine Zahlen nach Impfstatus, einem kleinen kontrollierten Vokabular, das vor einer Abfrage dieses Cubes lesenswert ist."
"page.health.size" = "Grösse"
"page.health.sparqlEndpoint" = "SPARQL-Endpunkt"
"page.health.theDatasets" = "Die Datensätze"
"page.health.theEpidemiologicalCoreDailyAnd" = "Der epidemiologische Kern: tägliche und kumulierte Zahlen pro Kanton und für das ganze Land, jeweils mit der Referenzbevölkerung."
"page.health.theMedicineCabinet" = "Die Hausapotheke"
"page.health.thePandemicRecord" = "Die Pandemie-Chronik"
"page.health.theVaccines" = "Die Impfstoffe"
"page.health.twoLINDASGraphsCoverPublic" = "Zwei LINDAS-Graphen decken die öffentliche Gesundheit ab, und ihr Charakter könnte kaum unterschiedlicher sein. Der <strong>COVID-19-Graph des BAG</strong> ist ein abgeschlossenes Archiv: die vollständige tägliche Chronik der Pandemie in der Schweiz — Fälle, Todesfälle, Hospitalisationen, Impfungen — eingefroren am 1. Januar 2023, als die tägliche Meldepflicht endete. Der <strong>Graph der Versorgungsstörungen des BWL</strong> ist sein Gegenstück, ein lebendiger Datenstrom: Täglich publiziert das Bundesamt für wirtschaftliche Landesversorgung eine neue Momentaufnahme, welche lebenswichtigen Arzneimittel derzeit nicht verfügbar sind und wann sie zurückerwartet werden."
