"page.environment.aboutThisTheme" = "Über dieses Thema"
"page.environment.caveat" = "Vorbehalt"
"page.environment.contents" = "Inhalt"
"page.environment.coverage" = "Abdeckung"
"page.environment.crossLinks" = "Wie überall auf der Plattform verweisen diese Graphen nach aussen, statt Referenzdaten zu duplizieren: Kantone lösen sich in den standardisierten <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Fterritorial\">territorialen</a> Einheiten auf, Organismengruppen und Gefährdungskategorien stammen aus <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Fcube%2Fdimension\">gemeinsamen Cube-Dimensionen</a> mit Wikidata-Verknüpfungen, und die erhebenden Stellen — das BAFU selbst, die WSL für das Landesforstinventar — sind dieselben <code>ld.admin.ch</code>-Organisationsressourcen wie in ganz LINDAS."
"page.environment.cubeCaveat" = "Die 121 Cubes sind rund 18 Datensätze in vielen Versionen — es ist stets die Cube-IRI mit der höchsten Nummer zu nehmen, ausser man vergleicht Ausgaben"
"page.environment.cubeContents" = "Treibhausgase, Luftschadstoffe, Verkehrslärm, Bodenbelastung, Badewasserqualität, Rote Liste, Holzflüsse"
"page.environment.cubeGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffoen%2Fcube\">foen/cube</a>"
"page.environment.cubeSize" = "121 Cubes, ~469'000 Beobachtungen"
"page.environment.datasetsIntro" = "Sieben benannte Graphen, alle vom selben Amt publiziert, alle unter dem Vokabular-Namensraum <code>https://environment.ld.admin.ch/</code>."
"page.environment.emissionsAndPollution" = "Emissionen und Belastungen"
"page.environment.environment" = "Umwelt"
"page.environment.environmentalStatisticsGroup" = "<strong>Umweltstatistik</strong>"
"page.environment.fireDangerIntro" = "Die Schweiz ist in 143 <strong>Waldbrand-Warnregionen</strong> unterteilt, jede mit einer Gefahrenstufe von 1 (gering) bis 5 (sehr gross). Bemerkenswert an diesem Graphenpaar ist, dass Gefahr und <em>Reaktion</em> getrennt publiziert werden: Das BAFU beurteilt das Risiko, die Kantone entscheiden über die Verbote. Die Tabelle unten führt beides zusammen, sodass jede Region die Gefahr neben dem dort tatsächlich geltenden Feuerverbot zeigt — von der Mahnung zur Vorsicht bis zum absoluten Feuerverbot im Freien."
"page.environment.fireLabelCaveat" = "Die Gefahrenstufen und die Beschreibungen der Verbote tragen <em>keine Sprachmarkierung</em> — die deutsche, französische, italienische und englische Formulierung liegen als vier nicht markierte Literale auf derselben Ressource — weshalb eine Stufe in jener Sprache erscheinen kann, welche die Label-Auflösung zuerst findet. Identifiziert wird die Stufe durch die IRI; die Formulierung ist bloss ein Label darauf."
"page.environment.forestFireDanger" = "Waldbrandgefahr"
"page.environment.forestGroup" = "<strong>Landesforstinventar</strong>"
"page.environment.ghgIntro" = "Das <strong>Treibhausgasinventar</strong> ist der Datensatz hinter der Klimaberichterstattung der Schweiz und reicht von 1990 bis zum letzten abgeschlossenen Jahr. Es ist nach Sektor und nach Gas aufgeschlüsselt, und beides ist hierarchisch: Das nationale Total teilt sich in Gebäude, Verkehr, Industrie und Übrige, die Gase in CO₂, Methan, Lachgas und die synthetischen Gase — mit einem Element <em>alle Treibhausgase</em>, das alles in CO₂-Äquivalenten ausdrückt."
"page.environment.ghgLandUse" = "Ein Teil des Modells verdient besondere Beachtung: <strong>Die Landnutzung wird separat ausgewiesen und ist nicht im Gesamttotal enthalten</strong>, ebenso wenig der internationale Flugverkehr. Namentlich der Wald ist in der Regel eine Netto-<em>Senke</em> — eine negative Zahl —, weil wachsende Bäume mehr Kohlenstoff aufnehmen, als die Holznutzung freisetzt. Sie in die nationale Zahl einzurechnen würde die Emissionen zu tief ausweisen; sie auszuklammern ist die Konvention, und der Cube weist dies ausdrücklich aus, statt es dem Rätselraten zu überlassen."
"page.environment.group" = "Gruppe"
"page.environment.hydroIntro" = "Das <strong>hydrologische Messnetz</strong> ist der unmittelbarste Datensatz dieser Plattform. Rund 230 Stationen melden Wasserstand, Abfluss und — an einem Teil davon — die Wassertemperatur, laufend aktualisiert; der Zeitstempel jeder Zeile gibt an, wann das Instrument tatsächlich gemessen hat, nicht wann die Datei publiziert wurde. Jede Station ist mit dem <a href=\"/resource?iri=http%3A%2F%2Fschema.org%2FBodyOfWater\">Gewässer</a> verknüpft, an dem sie liegt, und trägt geografische Koordinaten — dieselbe Messung beantwortet damit sowohl <em>wie warm ist der Rhein</em> als auch <em>wo genau</em>."
"page.environment.hydroUnits" = "Der Wasserstand ist in Metern über Meer angegeben (nicht als Tiefe), der Abfluss in m³/s, die Temperatur in °C. Eine Station kann kurzzeitig zweimal erscheinen, wenn ein neuer Messwert eintrifft, während ein älterer noch ersetzt wird — der Messzeitpunkt unterscheidet die beiden."
"page.environment.hydroWhatIsMissing" = "Zu beachten ist, wie lückenhaft einzelne Spalten sind. Jede Station meldet einen Wasserstand, die meisten einen Abfluss, aber nur etwa ein Drittel misst die Temperatur — und Seestationen melden naturgemäss gar keinen Abfluss. Diese Lücken liegen in den Daten und nicht in der Abfrage: Die Messgrössen sind <code>OPTIONAL</code>, weil eine Station schlicht nicht die Instrumente führt, die sie nicht hat."
"page.environment.liveDataIntro" = "Zwei dieser Datensätze sind <strong>live</strong>, was in LINDAS selten ist. Der grösste Teil der Plattform hält fest, was bereits geschehen ist; der Hydrologie-Graph und die Waldbrandwarnungen beschreiben das Land so, wie es in diesem Augenblick ist. Es sind zugleich die beiden, nach denen man sich richten könnte — ob man baden geht, ob man ein Feuer entfacht."
"page.environment.liveFrequency" = "Laufend — diese Graphen enthalten nur den <em>aktuellen</em> Zustand, keine Geschichte"
"page.environment.liveGraphs" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffoen%2Fhydro\">foen/hydro</a>, <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffoen%2Fforest-fire-risk-warning\">forest-fire-risk-warning</a>, <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffoen%2Fforest-fire-prevention-measures-cantons\">forest-fire-prevention-measures-cantons</a>"
"page.environment.liveMonitoringGroup" = "<strong>Laufende Überwachung</strong>"
"page.environment.liveSize" = "~230 hydrologische Messstationen, 143 Waldbrand-Warnregionen"
"page.environment.metaTitle" = "Umwelt & Natur"
"page.environment.namedGraph" = "Benannter Graph"
"page.environment.namedGraphs" = "Benannte Graphen"
"page.environment.nfiCantonCaveat" = "Vierundzwanzig Zeilen, nicht sechsundzwanzig: <strong>Basel-Stadt und Basel-Landschaft werden in diesem Cube nicht einzeln ausgewiesen</strong> — sie erscheinen nur als gemeinsame Region —, und das Inventar publiziert dieselben Themen zudem für die gesamte Schweiz, für Wirtschaftsregionen und für Schutzwaldregionen. Die <em>Bezugseinheit</em> ist eine eigenständige Dimension; der Kanton ist somit eine von mehreren Möglichkeiten, den Wald zu gliedern, und nicht die einzige."
"page.environment.nfiContents" = "Mehrere hundert Waldthemen, jedes als eigenes Prädikat und jedes mit einem publizierten Standardfehler; erhoben von der <a href=\"/resource?iri=https%3A%2F%2Fregister.ld.admin.ch%2Fopendataswiss%2Forg%2Fwsl\">WSL</a>"
"page.environment.nfiCoverage" = "Fünf Inventuren seit den frühen 1980er-Jahren, dazu die Veränderungsperioden dazwischen"
"page.environment.nfiGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffoen%2Fnational-forest-inventory\">foen/national-forest-inventory</a>"
"page.environment.nfiIntro" = "Das <strong>Landesforstinventar</strong> ist der sorgfältigst modellierte Datensatz dieses Themas und derjenige, bei dem es sich lohnt, das Modell vor den Zahlen zu lesen. Feldteams besuchen ein Raster von Stichprobenflächen im ganzen Land; ein vollständiger Durchgang dauert Jahre. Seit den frühen 1980er-Jahren wurden fünf Inventuren abgeschlossen, und — wesentlich — die Daten behandeln auch die <em>Zeiträume dazwischen</em> (LFI1–LFI2, LFI2–LFI3, …) als eigenständige Inventurperioden. Die Veränderung über die Zeit ist damit ein Wert erster Ordnung und nicht etwas, das man durch Subtraktion errechnet."
"page.environment.nfiSize" = "125 Cubes, ~630'000 Beobachtungen"
"page.environment.nfiStandardError" = "Weil jede Zahl eine <em>Schätzung aus einer Stichprobe</em> ist und keine Vollerhebung, führt jede Messgrösse ihren eigenen <strong>Standardfehler</strong> mit: Neben dem Thema <code>21</code> (Holzvorrat) steht <code>SE21</code>, der Fehler dieser Schätzung in Prozent. Für offene Verwaltungsdaten ist das ungewöhnlich, und es verändert die Lesart der Tabelle — ein kantonaler Wert mit ±15% ist nicht in dem Sinne mit einem Wert mit ±6% vergleichbar, wie es die blossen Zahlen nahelegen. Kleine Kantone haben weniger Stichprobenflächen, ihre Schätzungen sind entsprechend unsicherer."
"page.environment.nfiTopicCaveat" = "Das Inventar publiziert jede Messgrösse als eigenes <em>Prädikat</em> und nicht als Wert einer gemeinsamen Dimension — <code>Topic/21</code> ist der Holzvorrat, <code>Topic/13</code> sind Nutzung und Mortalität, und so weiter für mehrere hundert Themen, jedes mit einer <code>r</code>-Variante für die Angabe pro Hektare. Was diese Tabelle ausweist, ändert man deshalb über ein Prädikat und nicht über einen Filter."
"page.environment.oneOfficeManyClocks" = "Dieses Thema hat einen einzigen Herausgeber — das <strong>Bundesamt für Umwelt</strong> — und gerade das macht es ungewöhnlich. Alles hier stammt aus einem Amt, doch die Datensätze folgen völlig unterschiedlichen Takten. Das hydrologische Messnetz meldet <em>alle zehn Minuten</em>. Waldbrandwarnungen werden neu ausgegeben, wenn das Wetter umschlägt. Das Landesforstinventar braucht rund ein Jahrzehnt für einen Durchgang. Die Rote Liste wird einmal pro Generation überarbeitet."
"page.environment.otherPollutionCubes" = "Mehrere kleinere Cubes runden das Bild der Umweltbelastung ab, und jeder ist bemerkenswert, auch wenn hier keiner tabelliert ist. Der <strong>Verkehrslärm</strong> schätzt, wie viele Menschen Strassen-, Bahn- und Fluglärm über den gesetzlichen Grenzwerten ausgesetzt sind. Die <strong>Schwermetallbelastung des Bodens</strong> weist gemessene Konzentrationen an Beobachtungsstandorten aus. Die <strong>Badewasserqualität</strong> umfasst rund zwölftausend einzelne Laborergebnisse — E.-coli- und Enterokokken-Werte je Probenahmedatum und Standort —, eine ausgesprochen feinkörnige Reihe zur öffentlichen Gesundheit. Und eine Cube-Familie verfolgt die <strong>Luftbelastung entlang der A2 und A13</strong>, den beiden Autobahnen des alpenquerenden Transitverkehrs, mit Messungen von NO₂, Feinstaub und Russ am Strassenrand."
"page.environment.plaziClassification" = "Plazi-Klassifikation"
"page.environment.plaziDesc" = "Taxonomische Namen, Treatments und die Publikationen, aus denen sie stammen — Hunderttausende von Artnachweisen."
"page.environment.plaziIntro" = "Der grösste Graph, den das BAFU publiziert, hat mit Messungen nichts zu tun. <strong>Plazi</strong> ist ein Korpus taxonomischer Treatments — jener formalen Beschreibungen, mit denen Arten benannt und abgegrenzt werden —, aus veröffentlichten Arbeiten extrahiert und in Linked Data überführt. Er beantwortet eine andere Art von Frage als alles Vorstehende: nicht <em>wie viel</em> oder <em>wie warm</em>, sondern <em>wer diese Art wo und unter welchem Namen beschrieben hat</em>. Er hat hier eine eigene Seite, weil seine Struktur mit den Cubes nichts gemein hat."
"page.environment.readTheClockFirst" = "Diese Spannweite gilt es beim Lesen der Tabellen im Kopf zu behalten. Eine Zahl aus dem Hydrologie-Graphen ist ein <em>Messwert</em> und hat sich beim nächsten Aufruf bereits geändert; eine Zahl aus dem Landesforstinventar ist eine <em>Schätzung</em> mit ausgewiesener Unsicherheit; eine Zahl aus der Roten Liste ist eine <em>Beurteilung</em>, die bis zur nächsten Überarbeitung gilt. Das Datenmodell sagt einem, was wovon ist — das Inventar liefert sogar seine eigenen Standardfehler mit —, aber nur, wenn man hinschaut."
"page.environment.redListDataDeficient" = "Zu beachten sind die Zeilen <em>ungenügende Datengrundlage</em>. Sie bezeichnen keine Gefährdungskategorie, sondern das Eingeständnis, dass zu wenig bekannt ist, um die Art überhaupt zu beurteilen — und bei manchen Gruppen übertreffen sie alle Gefährdungskategorien zusammen. Das ist eine Aussage über den Erhebungsaufwand und nicht über die Organismen."
"page.environment.redListIntro" = "Die <strong>Rote Liste</strong> beurteilt die Arten der Schweiz nach den <a href=\"/resource?iri=https%3A%2F%2Fenvironment.ld.admin.ch%2Fvocabulary%2Fiucn_conservation_categories\">IUCN-Gefährdungskategorien</a> — von <em>nicht gefährdet</em> über <em>verletzlich</em>, <em>stark gefährdet</em> und <em>vom Aussterben bedroht</em> bis zu <em>regional ausgestorben</em>. Jede Kategorie ist hier eine eigene Ressource und kein Code in einer Zeichenkette: Sie führt ihren Namen in vier Sprachen, eine <code>owl:sameAs</code>-Verknüpfung zu Wikidata und sogar die offizielle Farbe, mit der das BAFU sie in seinen eigenen Grafiken darstellt."
"page.environment.redListStructure" = "Die Arten sind nach einer BAFU-Klassifikation gruppiert, die über <code>skos:broader</code> verschachtelt ist — <em>alle Organismen</em> enthält <em>Tiere</em>, diese enthalten <em>Insekten</em>, diese wiederum <em>Schmetterlinge</em>. Derselbe Cube beantwortet damit sowohl die nationale Kernaussage als auch die Frage, welcher Gruppe es am schlechtesten geht. Beim Summieren ist eine Ebene zu wählen, sonst werden dieselben Arten mehrfach gezählt. Die Spalte <code>part</code> gibt den Anteil der beurteilten Arten dieser Gruppe in der jeweiligen Kategorie an — das macht kleine und grosse Gruppen vergleichbar."
"page.environment.referenceContents" = "Taxonomische Treatments von Plazi (mit Abstand der grösste Graph dieses Themas — siehe die <a href=\"/plazi.html\">Plazi-Seite</a>), dazu die gemeinsamen Dimensionen, aus denen die Cubes ihre Begriffe beziehen"
"page.environment.referenceGraphs" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffoen%2Fplazi\">foen/plazi</a>, <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffoen%2Fthemes\">foen/themes</a>"
"page.environment.referenceGroup" = "<strong>Literatur und Vokabular</strong>"
"page.environment.rightNow" = "Gerade jetzt"
"page.environment.riversAndLakes" = "Flüsse und Seen, in dieser Minute"
"page.environment.size" = "Umfang"
