"page.plazi.taxonNames" = "<span class=\"h2 m-0\" hx-get=\"/api/metric/AnimaliaCount\" hx-trigger=\"load\" hx-swap=\"innerHTML\"> <span class=\"spinner-border spinner-border-sm text-muted\" role=\"status\"></span> </span> <span class=\"text-secondary\">Taxonnamen</span>"
