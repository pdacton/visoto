# ── Page: media ───────────────────────────────────────────────────────
"page.media.aboutThisTheme" = "Über dieses Thema"
"page.media.advertisingIntro" = "Die klarste Reihe dieses Themas ist zugleich die trübste für alle, die in Schweizer Medien arbeiten: die <strong>Werbeeinnahmen nach Mediengattung</strong>, Jahr für Jahr. Sie zeigt die Presse weiterhin als umsatzstärkste Einzelkategorie, aber stetig rückläufig — und die Online-Werbung, die sie eigentlich ersetzen sollte, bei weniger als der Hälfte des Pressewerts und ohne Wachstum."
"page.media.advertisingNuance" = "Der Grund: Dieser Cube misst Werbung, die bei <em>Schweizer</em> Medien gebucht wird. Das Geld, das die Zeitungen verlassen hat, ist nicht zu Schweizer Nachrichtenseiten gewandert, sondern grösstenteils ganz aus dem Inlandmarkt zu globalen Plattformen abgeflossen, die das BAKOM nicht erhebt. Lesen Sie die Online-Spalte als «Online-Werbung, die Schweizer Verlage erzielen», nicht als Grösse des digitalen Werbemarkts in der Schweiz."
"page.media.broadband" = "Die Leitung ins Gebäude"
"page.media.caveat" = "Vorbehalt"
"page.media.collectionCaveat" = "Die 533 Cubes sind weit weniger Datensätze, als diese Zahl vermuten lässt — die meisten Familien liegen in acht bis vierzehn Versionen vor, jede eine eigene, auf eine Zahl endende Cube-IRI, und nur die höchste ist aktuell. Verankern Sie eine Abfrage stets in einer einzigen Cube-IRI, sonst werden dieselben Beobachtungen je Ausgabe erneut gezählt."
"page.media.collectionIntro" = "Der Mediengraph des BAKOM ist umfangreich und ungewöhnlich feinkörnig. Über Publikumszahlen hinaus enthält er <strong>Programmanalysen</strong> — Studien, die das Sendeangebot nach Thema und Format codieren, sodass sich fragen lässt, welcher Anteil der Sendezeit eines Regionalradios auf Regionalnachrichten statt auf Musik entfiel. Diese Detailtiefe gibt es, weil private Veranstalter mit Gebührenanteil einen Leistungsauftrag haben und die Analysen der Messung seiner Erfüllung dienen."
"page.media.collectionSpread" = "Die nachstehenden Familien decken die gesamte Medienlandschaft ab: Mediapulse-Publikumsmessung fürs Fernsehen, Reichweite und Programmstruktur von SRG- und Privatradios, Presse-Lesernutzung nach Alter, Online-Medien nach Thema und Genre sowie die Ertragsstruktur des öffentlichen Veranstalters selbst."
"page.media.contents" = "Inhalt"
"page.media.coverage" = "Abdeckung"
"page.media.crossLinks" = "Beide Graphen stützen sich auf gemeinsame Referenzdaten: NGA-Beobachtungen lösen Gemeinde und Kanton in das <a href=\"/statistics.html\">BFS-Register</a> auf, und die Medien-Cubes benennen ihr herausgebendes Amt über <code>cube:observedBy</code> mit Verweis auf die <a href=\"/government.html\">Bundesverwaltung</a>. Das BAKOM erscheint zudem in <a href=\"/statistics.html\">Statistik &amp; Register</a> als Quelle der Radio-Versorgungsgebiete, die als gemeinsame territoriale Dimension publiziert sind."
"page.media.datasetsIntro" = "Zwei benannte Graphen, beide vom BAKOM und beide unter dem Vokabular-Namensraum <code>https://communication.ld.admin.ch/</code> — aber von sehr unterschiedlicher Gestalt."
"page.media.followTheMoney" = "Wohin die Werbung ging"
"page.media.group" = "Gruppe"
"page.media.intro" = "Beide Graphen hier stammen vom <strong>Bundesamt für Kommunikation</strong>, und sie stehen zu beiden Seiten derselben Frage. Der eine beschreibt den <em>Inhalt</em>: wie viele Menschen schauen, lesen und hören, was die Programme tatsächlich enthalten und wohin das Werbegeld fliesst. Der andere beschreibt die <em>Leitung</em>: welche Breitbandgeschwindigkeiten welches Gebäude erreichen, in jeder Gemeinde des Landes."
"page.media.media" = "Medien"
"page.media.mediaCaveat" = "Einige Cubes datieren Beobachtungen mit einer schlichten Jahreszahl als Literal statt mit <code>xsd:gYear</code> — ein typisierter Filter greift dann stillschweigend ins Leere"
"page.media.mediaContents" = "Mediapulse-Fernsehpublikumsdaten, Radio- und TV-Reichweiten, Programm- und Themenanalysen, Presselesernutzung, Online-Mediennutzung, Werbeeinnahmen, SRG-Ertragsstruktur, Medieneigentum"
"page.media.mediaGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Fofcom%2Fcube\">ofcom/cube</a>"
"page.media.mediaGroup" = "<strong>Medienforschung</strong>"
"page.media.mediaSize" = "533 Cubes, ~139'000 Beobachtungen — aber rund 60 verschiedene Datensätze in vielen Versionen"
"page.media.metaTitle" = "Medien & Kommunikation"
"page.media.namedGraph" = "Benannter Graph"
"page.media.ngaCaveat" = "Der gesamte Datensatz ist eine <strong>einzige Monatsaufnahme</strong> und keine Zeitreihe — jede Beobachtung trägt denselben Monat, gezeigt wird also der heutige Zustand des Netzes und nicht sein Werdegang. Zu beachten ist auch, dass Abdeckung heisst: <em>ein Gebäude könnte den Dienst beziehen</em>, nicht dass es jemand tut — es geht um Verfügbarkeit, nicht um Nutzung."
"page.media.ngaCaveatCard" = "Verfügbarkeit, nicht Abonnement — und die Merkmalstexte (<code>DOWN &gt;= 1000</code>) sind schlichte Literale, müssen also exakt übereinstimmen, Leerzeichen inklusive"
"page.media.ngaConditions" = "Abdeckung ist nicht eine Zahl, sondern dreizehn, je eine pro <strong>Merkmal</strong>. Sieben sind Download-Schwellen von 10 Mbit/s bis zu einem Gigabit, vier sind Upload-Schwellen, und drei bezeichnen das physische Medium — Glasfaser, Koaxialkabel oder Kupfer. Als Leiter gelesen zeigen sie, wo das Netz dünner wird: nahezu flächendeckend beim Basis-Breitband, weiterhin stark bei 100 Mbit/s und deutlich abfallend, sobald Gigabit verlangt ist."
"page.media.ngaCoverage" = "Eine einzige Monatsaufnahme über ~1,92 Millionen Gebäude landesweit"
"page.media.ngaGap" = "Beachten Sie die Diskrepanz zwischen den beiden Abdeckungsspalten. Über die Gemeinden gemittelt erreicht Glasfaser rund vierundvierzig Prozent; nach Gebäuden gezählt deutlich über die Hälfte. Die Lücke ist das Stadt-Land-Gefälle in Zahlen — Glasfaser wird dort gebaut, wo die Gebäude ohnehin stehen, und erreicht so viele Menschen an wenigen Orten."
"page.media.ngaGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Fofcom%2Fnga\">ofcom/nga</a>"
"page.media.ngaGroup" = "<strong>Breitbandabdeckung (NGA)</strong>"
"page.media.ngaIntro" = "Der Datensatz <strong>NGA</strong> — für <em>Next Generation Access</em> — ist die nationale Breitbanderhebung, und seine Messeinheit ist bemerkenswert konkret: nicht Haushalte oder Personen, sondern <strong>Gebäude</strong>, also die einzelnen Bauten, an die ein Netz angeschlossen werden könnte. Für jede Gemeinde weist er aus, wie viele Gebäude einen bestimmten Dienst beziehen können, sowohl als absolute Zahl wie als Prozentwert."
"page.media.ngaSize" = "Ein Cube, ~27'400 Beobachtungen — 13 Merkmale × ~2'110 Gemeinden"
"page.media.ofcomPublisher" = "Bundesamt für Kommunikation (BAKOM)"
"page.media.publisher" = "Herausgeber"
"page.media.size" = "Grösse"
"page.media.subtitle" = "Was die Schweiz schaut, liest und hört — wer dafür bezahlt und über welches Netz es ankommt."
"page.media.theCollection" = "Fünfhundert Cubes Medienforschung"
"page.media.theDatasets" = "Die Datensätze"
"page.media.title" = "Medien & Kommunikation"
"page.media.whyOfcom" = "Diese Paarung ist kein Zufall. Das BAKOM reguliert sowohl den Rundfunk — es vergibt Konzessionen, verteilt die Empfangsgebühr und überwacht, ob die Service-public-Pflichten erfüllt werden — als auch die Telekommunikationsinfrastruktur. Die Medienforschung existiert, weil die Regulierungsbehörde Entscheidgrundlagen für Konzessionen braucht; deshalb reichen die Daten bis zur Inhaltsanalyse einzelner Programme und nicht nur bis zu Publikumssummen."

# ── Page: statistics — Zefix ──────────────────────────────────────────
"card.registeredCompanies" = "Eingetragene Unternehmen"
"card.zefixLegalForms" = "Eingetragene Rechtseinheiten nach Rechtsform"
"card.zefixPerCanton" = "Eingetragene Rechtseinheiten pro Kanton"
"page.statistics.fojPublisher" = "Bundesamt für Justiz (BJ)"
"page.statistics.registersToo" = "Daneben stehen die Register der <em>Dinge, die es gibt</em>, statt der Codes: das Handelsregister <strong>Zefix</strong> des Bundesamts für Justiz, das jede Rechtseinheit des Landes verzeichnet, sowie die territorialen Ressourcen, in die Cube-Beobachtungen der ganzen Plattform auflösen."
"page.statistics.zefix" = "Jedes Unternehmen des Landes"
"page.statistics.zefixCaveat" = "Es handelt sich um <em>eingetragene</em> Rechtseinheiten an ihrem rechtlichen Sitz, was nicht dasselbe ist wie wirtschaftliche Tätigkeit: Eine in Zug eingetragene Holding beschäftigt dort möglicherweise niemanden. Zu beachten ist auch, dass das Register die aktuellen Einträge führt — es ist eine Momentaufnahme dessen, wer heute existiert, und keine Geschichte von Gründungen und Auflösungen."
"page.statistics.zefixCaveatCard" = "Rechtlicher Sitz, nicht wirtschaftliche Tätigkeit — und eine Momentaufnahme statt einer Geschichte von Gründungen und Auflösungen"
"page.statistics.zefixContents" = "Der Zentrale Firmenindex — jede Rechtseinheit im Schweizer Handelsregister, bei den meisten Einträgen samt ausformuliertem Gesellschaftszweck"
"page.statistics.zefixForms" = "Drei Formen machen fast das gesamte Register aus: die <strong>GmbH/Sàrl</strong>, die <strong>Aktiengesellschaft</strong> und das Einzelunternehmen. Alles Übrige — Stiftungen, Vereine, Genossenschaften, Personengesellschaften, Zweigniederlassungen ausländischer Unternehmen — bildet einen langen Ausläufer. Dass Stiftungen und Vereine darunter sind, erinnert daran: Dies ist ein Register der <em>Rechtseinheiten</em> und nicht nur gewinnorientierter Betriebe."
"page.statistics.zefixGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffoj%2Fzefix\">foj/zefix</a>"
"page.statistics.zefixGroup" = "<strong>Handelsregister Zefix</strong>"
"page.statistics.zefixIntro" = "<strong>Zefix</strong> — der Zentrale Firmenindex, geführt vom Bundesamt für Justiz — ist das Verzeichnis jeder Rechtseinheit im Schweizer Handelsregister. Mit knapp <strong>800'000 Organisationen</strong> ist es mit Abstand das grösste Register dieser Plattform und das Gegenstück zum Gemeindeverzeichnis: Das eine benennt Orte, das andere die Unternehmen, die darin stehen."
"page.statistics.zefixJoinIntro" = "Weil jedes Unternehmen seine Sitzgemeinde als IRI aus dem oben beschriebenen Register führt, lassen sich die beiden Datensätze direkt verknüpfen — und die Zahl der Unternehmen pro Kanton zeigt etwas, das die Bevölkerungszahlen nicht hergeben. Zürich führt erwartungsgemäss, doch <strong>Zug</strong> steht weit höher, als seine Grösse vermuten liesse: ein Kanton mit rund 130'000 Einwohnern beherbergt Zehntausende eingetragener Rechtseinheiten — seine Steuerpolitik als Unternehmenssitz, sichtbar gemacht in den Daten."
"page.statistics.zefixSize" = "~791'000 eingetragene Rechtseinheiten, jede mit UID, Rechtsform, Adresse und Sitzgemeinde"
"page.statistics.zefixUid" = "Sein tragendes Merkmal ist die <strong>UID</strong>, die Unternehmens-Identifikationsnummer, die jede Einheit führt. Dieser eine Identifikator erlaubt es, ein Unternehmen über ansonsten unverbundene Datensätze hinweg wiederzuerkennen — die Stromnetzbetreiber im Thema <a href=\"/energy.html\">Energie</a> tragen ihre UID, und sie löst hierhin auf, zur juristischen Person. Jeder Eintrag enthält zudem eine Rechtsform nach dem Standard <code>eCH-0097</code>, eine eingetragene Adresse, die Sitzgemeinde und in den meisten Fällen den Gesellschaftszweck in ausformulierter Prosa."

