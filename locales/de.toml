"page.facets.aDemonstrationOfTheSparqlAsyncTable" = "Eine Demonstration des Partials <code>sparqlAsyncTable</code> im Facettenmodus über <strong>ZefixOrganisation</strong> (~790'000 im Handelsregister eingetragene Schweizer Unternehmen). Jede facettierbare Spalte trägt ein <strong>Filter-Bedienelement in ihrem Kopf</strong> (das Trichtersymbol), gesteuert von den <code>&lt;sparql-facet&gt;</code>-Deklarationen auf dieser Seite. Eine Auswahl filtert die <strong>geladenen Zeilen sofort</strong> im Browser; da diese Klasse zu gross ist, um sie vollständig zu halten, holt die Anwendung anschliessend still die <strong>echten Treffer der gesamten Klasse</strong> vom Backend und tauscht sie ein — Sie erhalten eine sofortige Vorschau und ein verbindliches Resultat, ohne je mit der Grösse konfrontiert zu werden."
