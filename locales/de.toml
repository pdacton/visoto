"page.health.companiesThatMarketVitalMedicines" = "Unternehmen, die in der Schweiz lebenswichtige Humanarzneimittel vertreiben, sind gesetzlich verpflichtet, Versorgungsstörungen dem Bundesamt für wirtschaftliche Landesversorgung zu melden. Der Graph verwandelt diese Meldungen in eine fortlaufende Reihe täglicher Momentaufnahmen: Eine Beobachtung ist <em>ein Arzneimittel an einem Tag</em>, mit seinem <abbr title=\"{{.atcTitle}}\">ATC-Code</abbr>, der Packungskennung (GTIN), dem Beginn der Störung, dem erwarteten Ende und einer Empfehlung für Verschreibende. Um die Lage <em>heute</em> zu sehen, liest man die jüngste Momentaufnahme — genau das tun die Tabellen unten. Ein begleitender Cube verfolgt lediglich die täglichen Gesamtzahlen offener und geschlossener Störungen über die Zeit."
