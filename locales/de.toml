# ── Page: politics ────────────────────────────────────────────────
"page.politics.16MillionTriplesOrganization" = "~1,6 Millionen Tripel — organization ist mit ~975'000 der grösste"
"page.politics.19MillionTriplesPopular" = "~1,9 Millionen Tripel — popular-vote allein umfasst ~1,0 Millionen"
"page.politics.2019And2023Populated2027" = "2019 und 2023 befüllt; 2027 registriert, aber leer"
"page.politics.292000Triples18Cubes" = "~292'000 Tripel — 18 Cubes, 5 Themen × 3 Jahre"
"page.politics.42000Triples" = "~42'000 Tripel"
"page.politics.aSeventeenthGraphTermdatHolds" = "Ein siebzehnter Graph, <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Ftermdat\">termdat</a>, enthält die Terminologiedatenbank der Bundesverwaltung. Er ist administrativer und nicht politischer Natur und bleibt in den obigen Gruppen unberücksichtigt."
"page.politics.aboutThisTheme" = "Über dieses Thema"
"page.politics.bkAdminCh" = "<a href=\"https://www.bk.admin.ch\" target=\"_blank\" rel=\"noopener\">bk.admin.ch</a>"
"page.politics.bothRoutesEndAtThe" = "Beide Wege enden am selben Punkt: einer <strong>Volksabstimmung</strong>. Dieser Cube ist das Herzstück des Themas — und der reichhaltigste politische Datensatz in LINDAS. Er erfasst nicht eine Zeile pro Abstimmung, sondern <em>eine Zeile pro Vorlage und Kanton</em>, weshalb aus einigen Hundert Vorlagen fast zwanzigtausend Beobachtungen werden. Jede Zeile enthält Ja- und Nein-Stimmen <em>und</em> Prozentwerte, die Stimmbeteiligung, die Stimmberechtigten, leere und ungültige Stimmzettel sowie die Standesstimme, die Verfassungsänderungen ebenfalls gewinnen müssen."
"page.politics.candidatesListsSeatsPerList" = "Kandidierende, Listen, Sitze pro Liste, Sitze innerhalb von Listenverbindungen, kantonale Statistiken"
"page.politics.cantonalRowsAreOmittedAbove" = "Die kantonalen Zeilen sind oben weggelassen, damit pro Vorlage eine Zeile bleibt — öffnen Sie eine beliebige <a href=\"/resource?iri=https%3A%2F%2Fpolitics.ld.admin.ch%2Fpolitical-rights%2Fpopular-vote%2F1\">Volksabstimmungs</a>-Beobachtung, um alle 26 Aufschlüsselungen zu sehen. Der Cube der Abstimmungstermine führt auch <em>künftige</em> Daten auf, weshalb die neuesten Einträge angesetzte Abstimmungen ohne Resultat sein können."
"page.politics.caveat" = "Vorbehalt"
"page.politics.citizensObjectParliamentHasPassed" = "Die Bürgerinnen und Bürger <em>erheben Einspruch</em>. Das Parlament hat ein Gesetz verabschiedet; 50'000 Unterschriften erzwingen eine Volksabstimmung, bevor es in Kraft treten kann. Dringliches Recht ist ebenfalls erfasst und folgt eigenen, beschleunigten Regeln."
"page.politics.citizensProposeGather100000" = "Die Bürgerinnen und Bürger <em>schlagen vor</em>. Mit 100'000 Unterschriften lässt sich eine Änderung der Bundesverfassung verlangen, ob das Parlament sie will oder nicht. Erfasst seit 1891 und verfolgt von der Unterschriftensammlung bis zum Rückzug oder zur Abstimmung."
"page.politics.contents" = "Inhalt"
"page.politics.coverage" = "Abdeckung"
"page.politics.cubesFor2027AreAlready" = "Cubes für <strong>2027</strong> sind bereits registriert, enthalten aber noch keine Resultate — die Kandidaten- und Listen-Cubes sind leer, und die kantonalen Statistiken enthalten nur das vorbereitete Zeilengerüst. Echte Daten liegen für 2019 und 2023 vor."
"page.politics.curiaFederalCouncilStaatskalenderOrganization" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Fcuria\">curia</a>, <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Ffederal-council\">federal-council</a>, <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Fstaatskalender\">staatskalender</a>, <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Forganization\">organization</a>, <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Fextra-parliamentary-commission\">extra-parliamentary-commission</a>, <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Fpolitical-party-register\">political-party-register</a>, <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Frvov\">rvov</a>"
"page.politics.directDemocracy" = "<strong>Direkte Demokratie</strong>"
"page.politics.directDemocracyHowAVote" = "Direkte Demokratie: wie eine Abstimmung zustande kommt"
"page.politics.elections" = "<strong>Wahlen</strong>"
"page.politics.electionsFillingTheNationalCouncil" = "Wahlen: die Besetzung des Nationalrats"
"page.politics.everyFourYearsSwitzerlandElects" = "Alle vier Jahre wählt die Schweiz die 200 Mitglieder des Nationalrats. LINDAS hält die Resultate als fünf Cube-Familien pro Wahljahr, und zusammen beschreiben sie die gesamte Proporzmechanik: wer kandidierte, auf welcher Liste, wie viele Stimmen jede Liste erhielt und wie die Sitze schliesslich zugeteilt wurden — einschliesslich der Verteilung <em>innerhalb</em> von Listenverbindungen, einer Schweizer Besonderheit, bei der kleine Parteien ihre Stimmen bündeln, um gemeinsam die Hürde zu nehmen."
"page.politics.federalChancelleryFCh" = "Bundeskanzlei (BK)"
"page.politics.governmentAndAdministration" = "Regierung und Verwaltung"
"page.politics.group" = "Gruppe"
"page.politics.interestTiesAndLobbying" = "Interessenbindungen und Lobbying"
"page.politics.landingPage" = "Landing-Page"
"page.politics.membersOfParliamentMustDeclare" = "Parlamentsmitglieder müssen ihre ausserparlamentarischen Mandate offenlegen; die Angaben werden hier als Verknüpfungen zwischen einer Person und einer <a href=\"/resource?iri=http%3A%2F%2Fschema.org%2FLobbyOrganization\">Lobbyorganisation</a> publiziert. Der nützliche Punkt ist, dass jede Bindung als <strong>bezahlt oder unbezahlt</strong> gekennzeichnet ist und die ausgeübte <em>Funktion</em> festhält — die Tabelle unten trennt daher die Sitze, die ein Parlamentsmitglied bloss innehat, von jenen, die es <strong>präsidiert</strong>. Die beiden können stark auseinanderfallen: Von den zwölf Personen mit den meisten bezahlten Bindungen präsidieren einige fast alle davon, andere nur eine."
"page.politics.motionsPostulatesAndInterpellationsWith" = "Motionen, Postulate und Interpellationen mit ihrem Bearbeitungsstand"
"page.politics.namedGraph" = "Benannter Graph"
"page.politics.namedGraphs" = "Benannte Graphen"
"page.politics.namesOfGroupsPartiesAnd" = "Namen von Fraktionen, Parteien und Abstimmungsvorlagen werden in allen vier Landessprachen sowie auf Rätoromanisch publiziert; die Tabellen auf dieser Seite folgen deshalb der Sprachpräferenz Ihres Browsers und weichen auf Englisch, dann Deutsch aus, wo eine Übersetzung fehlt. Personennamen tragen keine Sprachkennzeichnung und werden so gezeigt, wie sie erfasst sind."
"page.politics.nationalCouncilElection" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Fnational-council-election\">national-council-election</a>"
"page.politics.oneGraphInThisTheme" = "Ein Graph dieses Themas ist deutlich anders modelliert als die übrigen. <strong>Vorstösse</strong> — Motionen, Postulate und Interpellationen, mit denen Parlamentsmitglieder die Regierung förmlich zum Handeln auffordern — verwenden die <a href=\"https://ch.paf.link\" target=\"_blank\" rel=\"noopener\">PAF-Ontologie</a>, ein Aktivitäts- und Entitätsmodell, das Provenienzvokabularen entlehnt ist statt den sonst überall verwendeten Cube- oder schema.org-Formen. Jeder Vorstoss ist eine Entität; jeder Schritt seiner Behandlung ist eine Aktivität mit eigenem Statustext aus der Verwaltung."
"page.politics.pafHttpsChPafLink" = "PAF — <code>https://ch.paf.link/</code>, das einzige Nicht-Cube-Modell in diesem Thema"
"page.politics.parliamentariansPartiesGroupsCommitteesLobby" = "Parlamentsmitglieder, Parteien, Fraktionen, Kommissionen, Interessenbindungen, Regierungsmitglieder, Ämter und Kommissionen — modelliert als datierte <code>schema:Role</code>-Mitgliedschaften"
"page.politics.parliamentaryBusiness" = "Parlamentsgeschäfte"
"page.politics.parliamentaryBusiness2" = "<strong>Parlamentsgeschäfte</strong>"
"page.politics.peopleInstitutions" = "<strong>Personen & Institutionen</strong>"
"page.politics.petitions" = "Petitionen"
"page.politics.politicsGovernment" = "Politik & Regierung"
"page.politics.popularVotePopularVoteStat" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Fpopular-vote\">popular-vote</a>, <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Fpopular-vote-stat\">popular-vote-stat</a>, <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Fpopular-initiative\">popular-initiative</a>, <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Fpopular-initiative-stat\">popular-initiative-stat</a>, <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Freferendum\">referendum</a>, <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Freferendum-stat\">referendum-stat</a>, <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Fpetition\">petition</a>"
"page.politics.popularVotesFrom1848Initiatives" = "Volksabstimmungen ab 1848; Initiativen ab 1891; künftige Abstimmungstermine enthalten"
"page.politics.proceduralRequest" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Fprocedural-request\">procedural-request</a>"
"page.politics.publisher" = "Herausgeber"
"page.politics.seventeenGraphsGroupedByWhat" = "Siebzehn Graphen, gruppiert nach ihrem Zweck. Alle werden von der Bundeskanzlei publiziert und tragen das Präfix <code>https://lindas.admin.ch/fch/</code>."
"page.politics.size" = "Grösse"
"page.politics.statusTextsArePublishedIn" = "Die Statustexte werden auf Deutsch, Französisch und Italienisch publiziert und folgen hier Ihrer Browsersprache. Ein einzelner Vorstoss trägt im Verlauf des Verfahrens meist mehrere davon, weshalb derselbe Titel mehrfach erscheinen kann — jede Zeile ist ein Statusbericht zu diesem Vorstoss, nicht ein Vorstoss."
"page.politics.swissCitizensDoNotOnly" = "Die Schweizer Stimmberechtigten wählen nicht nur ein Parlament; sie stimmen mehrmals jährlich über die Gesetze selbst ab. Zwei Instrumente legen dem Volk eine Frage vor, und sie auseinanderzuhalten ist das Nützlichste, was man über diese Daten verstehen kann — sie laufen in entgegengesetzte Richtungen."
"page.politics.theDatasets" = "Die Datensätze"
"page.politics.thePartyRegisterHoldsOnly" = "Das Parteienregister umfasst nur einige Dutzend Einträge und wird ausschliesslich auf Antrag einer Partei aktualisiert"
"page.politics.theQuietestInstrumentAndThe" = "Das leiseste Instrument und das einzige, das allen offensteht — keine Unterschriftenhürde, keine Staatsbürgerschaft, kein Mindestalter. Jede Person darf sich mit einer Petition an die Bundesbehörden wenden; diese müssen davon Kenntnis nehmen, aber nicht handeln."
"page.politics.thisThemeBringsTogetherEverything" = "Dieses Thema führt alles zusammen, was die <strong>Bundeskanzlei</strong> zur Schweizer Politik publiziert, und deckt zwei sehr unterschiedliche Arten von Material ab. Das erste ist, <strong>was die Bürgerinnen und Bürger entschieden haben</strong>: jede Volksabstimmung, Volksinitiative und jedes Referendum seit 1848 — die gestellte Frage, der Abstimmungstag, ob die Vorlage angenommen wurde und wie jeder Kanton gestimmt hat. Das zweite ist, <strong>wer regiert</strong>: die Parlamentsmitglieder und ihre Parteien, die Landesregierung und ihre Departemente, die ihnen unterstellten Ämter sowie die Lobbyistinnen und Lobbyisten mit Zutritt zum Parlamentsgebäude."
"page.politics.threeFurtherRegistersDescribeThe" = "Drei weitere Register beschreiben die Exekutive. Der Graph <strong>Bundesrat</strong> deckt die siebenköpfige Regierung seit 1848 ab — Bundesrätinnen und Bundesräte, Bundeskanzler, welches Departement wer führte, wer in welchem Jahr Präsident war, und eine Kuriosität, die sich in wenigen nationalen Datensätzen findet: die Personen, die <em>gewählt wurden und ablehnten</em>. Der <strong>Staatskalender</strong> ist das Behördenverzeichnis und listet Ämter mit Postadressen und Personal auf. <strong>Ausserparlamentarische Kommissionen</strong> erfasst die Expertengremien, die die Verwaltung von aussen beraten."
"page.politics.togetherTheyAnswerTheTwo" = "Zusammen beantworten sie die beiden Fragen, mit denen die meisten hierherkommen — <em>worüber hat die Schweiz abgestimmt, und wie ist es ausgegangen?</em> und <em>wer hat heute welches Amt inne?</em> Die folgenden Abschnitte gehen beide durch, beginnend damit, wie eine Abstimmung zustande kommt."
"page.politics.vocabulary" = "Vokabular"
"page.politics.whereTheCubesAboveCount" = "Wo die obigen Cubes Stimmen zählen, benennt diese Graphenfamilie Personen. <strong>Curia Vista</strong> ist das Parlamentsregister: jedes Mitglied der Bundesversammlung, lebend und verstorben, mit Partei, Fraktion, den Kommissionen, in denen es sass, und den genauen Daten jedes Mandats. Da Mitgliedschaften als datierte <a href=\"/resource?iri=http%3A%2F%2Fschema.org%2FRole\">Rollen</a> statt als einfache Verknüpfungen modelliert sind, lässt sich die Zusammensetzung des Parlaments für jeden beliebigen Tag rekonstruieren."
"page.politics.whoGovernsPeopleAndInstitutions" = "Wer regiert: Personen und Institutionen"

# ── Page: mobility ────────────────────────────────────────────────
"page.mobility.17MillionTriples18" = "~1,7 Millionen Tripel — 18 Cubes, 3 Themen"
"page.mobility.300Triples15Classes48" = "~300 Tripel — 15 Klassen, 48 Eigenschaften"
"page.mobility.73MillionTriplesThe" = "~7,3 Millionen Tripel — der grösste in diesem Thema"
"page.mobility.983000Triples" = "~983'000 Tripel"
"page.mobility.aFurtherStopsAreRecorded" = "Weitere <span hx-get=\"/api/metric/mobilityMode-unknown\" hx-trigger=\"load\" hx-swap=\"innerHTML\"> <span class=\"spinner-border spinner-border-sm text-muted\" role=\"status\"></span> </span> Haltestellen sind mit einem <em>unbekannten</em> Verkehrsmittel erfasst, und Haltestellen, die von mehreren Verkehrsmitteln bedient werden, zählen einmal pro Verkehrsmittel — die obigen Zahlen summieren sich deshalb auf mehr als die Gesamtzahl der Haltestellen."
"page.mobility.aboutThisTheme" = "Über dieses Thema"
"page.mobility.airTrafficMovements" = "Flugbewegungen"
"page.mobility.anAllianceVerbundIsA" = "Eine <a href=\"/resource?iri=https%3A%2F%2Flod.opentransportdata.swiss%2Fvocab%2FAlliance\">Alliance</a> (<em>Verbund</em>) ist ein regionaler Tarifverbund — jene Organisation, deren Zonenplan dort gilt, wo Sie unterwegs sind. Die meisten Menschen in der Schweiz besitzen ein Abonnement, das von einem solchen ausgegeben wurde."
"page.mobility.annualMovementsPerAerodromeBy" = "Jährliche Bewegungen pro Flugplatz, nach Kategorie. Eine Bewegung ist ein einzelner Start <em>oder</em> eine Landung — ein Hin- und Rückflug zählt als zwei."
"page.mobility.bazlAdminCh" = "<a href=\"https://www.bazl.admin.ch\" target=\"_blank\" rel=\"noopener\">bazl.admin.ch</a>"
"page.mobility.byAirCivilAviation" = "In der Luft: Zivilluftfahrt"
"page.mobility.civilAviationStatistics" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffoca%2Fcube\">Zivilluftfahrtstatistik</a>"
"page.mobility.classesInTheNOVAGraph" = "Klassen im NOVA-Graphen"
"page.mobility.contents" = "Inhalt"
"page.mobility.dataset" = "Datensatz"
"page.mobility.earlierVersionsOfEachCube" = "Frühere Versionen jedes Cubes bleiben publiziert und sind über die <a href=\"/resource?iri=https%3A%2F%2Fcube.link%2FCube\">Cube-Liste</a> erreichbar; zudem ist eine ältere Serie <em>Air traffic statistics movements</em> vorhanden."
"page.mobility.everyStopInTheRegister" = "Jede Haltestelle im Register trägt ein Verkehrsmittel, und die Verteilung dieser Werte erzählt die Schweizer Geschichte besser als jede Zusammenfassung. Busse dominieren um eine Grössenordnung, wie überall. Besonders ist die dritte Gruppe unten: Luftseilbahnen, Sessellifte, Standseilbahnen und Zahnradbahnen sind keine Touristenattraktionen in einem eigenen Verzeichnis — sie stehen im selben nationalen Register wie die Zürcher Trams, mit derselben Art von Identifikator, denn in der Schweiz ist eine Seilbahn auf einen Berg schlicht öffentlicher Verkehr."
"page.mobility.fareNetworks" = "Tarifverbunde"
"page.mobility.focaFederalOfficeOfCivil" = "BAZL — Bundesamt für Zivilluftfahrt"
"page.mobility.fourLINDASGraphsDescribeHow" = "Vier LINDAS-Graphen beschreiben, wie sich Menschen in der Schweiz fortbewegen. Es sind nicht vier unabhängige Datensätze — sie bauen aufeinander auf. Das <strong>Dienststellenregister (DiDok)</strong> enthält die <em>Orte</em>: jede Haltestelle, jeden Bahnhof, jeden Anlegesteg und jede Seilbahnstation des Landes. <strong>NOVA</strong> enthält die <em>Preise</em> zwischen diesen Orten. Das <strong>Open Transport Data schema</strong> ist das <em>Wörterbuch</em>, das die von beiden verwendeten Begriffe definiert. Daneben publiziert das <strong>Bundesamt für Zivilluftfahrt</strong> Luftfahrtstatistiken, die für sich allein stehen."
"page.mobility.landingPage" = "Landing-Page"
"page.mobility.mobilityTransport" = "Mobilität & Verkehr"
"page.mobility.mountain" = "Berg"
"page.mobility.movementsPassengersAndPassengerRights" = "Bewegungen, Passagiere und Meldungen zu Passagierrechten nach Jahr und Flugplatz"
"page.mobility.namedGraph" = "Benannter Graph"
"page.mobility.novaDescribesSwissPublicTransport" = "NOVA beschreibt die Preisbildung im Schweizer öffentlichen Verkehr und ist mit Abstand der grösste Graph dieses Themas. Er enthält weder Fahrpläne noch direkt nachschlagbare Ticketpreise; er enthält die <em>Mechanik</em>, die einen Preis erzeugt. Diese Mechanik gibt es in zwei Ausprägungen — der Schlüssel zum Lesen der Klassenliste unten."
"page.mobility.novaFareData" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Fsbb%2Fnova\">NOVA-Tarifdaten</a>"
"page.mobility.openTransportDataSchema" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Fsbb%2Fotd-schema\">Open Transport Data schema</a>"
"page.mobility.opentransportdataSwiss" = "<a href=\"https://opentransportdata.swiss\" target=\"_blank\" rel=\"noopener\">opentransportdata.swiss</a>"
"page.mobility.passengerRights" = "Passagierrechte"
"page.mobility.passengers" = "Passagiere"
"page.mobility.passengersAtAerodromesAndMountain" = "Passagiere an Flugplätzen und Gebirgslandeplätzen — Letztere eine Kategorie von Flugfeld, die wenige Länder brauchen."
"page.mobility.publisher" = "Herausgeber"
"page.mobility.reportsFiledByAirPassengers" = "Meldungen, die Fluggäste jedes Jahr einreichen. Das BAZL verfolgt jene in seinem Zuständigkeitsbereich; nicht unterzeichnete oder unvollständige Meldungen werden nach sechs Monaten automatisch geschlossen."
"page.mobility.roadRail" = "Strasse & Schiene"
"page.mobility.roughlyHalfOfThisVocabulary" = "Rund die Hälfte dieses Vokabulars ist unübersetztes Deutsch; die Beschreibungen unten stammen daher aus dem Open Transport Data schema und lohnen sich als Glossar: <em>Tarifwertpreisauspraegung</em> und <em>Relationsgebiet</em> erklären sich niemandem von selbst."
"page.mobility.sbbSwissFederalRailways" = "SBB — Schweizerische Bundesbahnen"
"page.mobility.servicePointsDiDok" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Fsbb%2Fdidok\">Dienststellen (DiDok)</a>"
"page.mobility.size" = "Grösse"
"page.mobility.sparqlEndpoint" = "SPARQL-Endpunkt"
"page.mobility.stops" = "Haltestellen"
"page.mobility.stopsWithCoordinatesElevationCanton" = "Haltestellen mit Koordinaten, Höhe, Kanton, Gemeinde und Betreiber; über <code>owl:sameAs</code> mit <code>geo.ld.admin.ch</code> verknüpft"
"page.mobility.theDatasets" = "Die Datensätze"
"page.mobility.theFederalOfficeOfCivil" = "Das Bundesamt für Zivilluftfahrt (BAZL) publiziert seine Statistiken als <a href=\"/resource?iri=https%3A%2F%2Fcube.link%2FCube\">Datenwürfel</a>. Der Graph enthält achtzehn davon, doch diese Zahl überzeichnet die Vielfalt: Es sind neu publizierte Fassungen von lediglich drei Themen. Die Karten unten verweisen auf die jeweils aktuelle Version."
"page.mobility.theNetworkWhereYouCan" = "Das Netz: wohin man fahren kann"
"page.mobility.theOpenTransportDataSchema" = "Das Open Transport Data schema ist winzig — einige Hundert Tripel — definiert aber die Begriffe, in denen die sieben Millionen Tripel von NOVA geschrieben sind. Es ist der Stein von Rosette für alles Obenstehende."
"page.mobility.theVocabulary" = "Das Vokabular"
"page.mobility.theVocabularyUnderpinningDiDokAnd" = "Das Vokabular, auf dem DiDok und NOVA aufbauen"
"page.mobility.usedByTheRegionalFare" = "Von den regionalen Tarifverbunden verwendet. Haltestellen werden zu einer <a href=\"/resource?iri=https%3A%2F%2Flod.opentransportdata.swiss%2Fvocab%2FZone\">Zone</a> gruppiert, Zonen zu einem <a href=\"/resource?iri=https%3A%2F%2Flod.opentransportdata.swiss%2Fvocab%2FZoningPlan\">ZoningPlan</a> zusammengefasst (eine Region kann mehrere führen — einen für Abonnemente, einen weiteren für Einzelfahrten), und der Preis ergibt sich daraus, wie viele Zonen man durchquert."
"page.mobility.usedForJourneysAcrossThe" = "Für Fahrten über das nationale Netz verwendet. Eine <a href=\"/resource?iri=https%3A%2F%2Flod.opentransportdata.swiss%2Fvocab%2FRelation\">Relation</a> ist eine bepreiste Verbindung zwischen zwei Haltestellen, und eine <a href=\"/resource?iri=https%3A%2F%2Flod.opentransportdata.swiss%2Fvocab%2FPreistabelle\">Preistabelle</a> weist den Tarif zu. Mit über einer halben Million Relationen liegt hier der Grossteil des Graphen."
"page.mobility.waterOther" = "Wasser & Übriges"
"page.mobility.whatItCostsTheNOVA" = "Was es kostet: das NOVA-Tarifmodell"
"page.mobility.zonePlansFareNetworksPriced" = "Zonenpläne, Tarifverbunde, bepreiste Relationen und Preistabellen"

