# ── Page: agriculture ─────────────────────────────────────────────────
"page.agriculture.aboutThisTheme" = "Über dieses Thema"
"page.agriculture.agriculture" = "Landwirtschaft"
"page.agriculture.animalDiseaseCoverage" = "Laufend aktualisiert; einzelne Ausbrüche auf Gemeinde und Kanton georeferenziert"
"page.agriculture.animalDiseaseGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffsvo%2Fanimaldisease\">fsvo/animaldisease</a>"
"page.agriculture.animalDiseaseGroup" = "<strong>Tierseuchenmeldungen</strong>"
"page.agriculture.animalDiseaseIntro" = "Der Tierseuchendatensatz ist das Unmittelbarste in diesem Thema: ein <strong>Fallregister</strong>, in dem jede Zeile einem gemeldeten Ausbruch in einem Betrieb entspricht — mit Diagnosedatum, Tierart, Kanton und Gemeinde sowie der Zahl der Tiere im Bestand, die erkrankt, infiziert, getötet oder verendet sind. Es wird laufend nachgeführt; die jüngsten Diagnosen sind meist nur wenige Tage alt."
"page.agriculture.animalDiseaseSize" = "Ein Cube, ~58'000 Fallmeldungen"
"page.agriculture.animalHealth" = "Krankheit im Stall"
"page.agriculture.biologicalAgents" = "Bemerkenswert ist die untere Hälfte dieser Tabelle. Neben den Herbiziden und Fungiziden führt das Register <strong>Nützlinge, Raubmilben und Nematoden</strong> als eigenständige zugelassene Pflanzenschutzmittel — biologische Bekämpfungsmittel, die auf derselben Grundlage bewilligt sind wie ein chemisches Spritzmittel, mit denselben Zulassungsnummern und denselben Bewilligungsinhabern."
"page.agriculture.bluetongueStory" = "Wertet man nach Seuche aus, tritt die jüngere Geschichte des Schweizer Nutztierbestands aus den Daten hervor. Die <strong>Blauzungenkrankheit</strong>, die im August 2024 ausbrach, dominiert alles andere um eine Grössenordnung und erreichte praktisch jeden Kanton; darauf folgt die <strong>Moderhinke</strong>, was das nationale Ausrottungsprogramm widerspiegelt, das die Betriebe zur Meldung verpflichtet. Weiter unten stehen die endemischen Hintergrundseuchen mit einigen Dutzend Fällen pro Jahr."
"page.agriculture.cantonCountCaveat" = "Die Kantonsspalte kann 27 statt 26 anzeigen: Das Register verwendet einen eigenen Code für das Fürstentum Liechtenstein, das zum schweizerischen Veterinärraum gehört. Zu beachten ist ausserdem, dass ein Fall eine <em>Meldung</em> ist und kein Tier — eine Zeile kann einen ganzen betroffenen Bestand abdecken; die Bestandes- und Krankheitszahlen auf der Beobachtung geben an, wie viele es sind."
"page.agriculture.caveat" = "Vorbehalt"
"page.agriculture.contents" = "Inhalt"
"page.agriculture.coverage" = "Abdeckung"
"page.agriculture.cropsIntro" = "Zwei Graphen in diesem Thema enthalten überhaupt keine Messwerte. <strong>Crops</strong> ist eine echte OWL-Ontologie der Schweizer Kulturpflanzen — mehrere hundert Kulturarten, geordnet über <code>rdfs:subClassOf</code>, mit <code>owl:disjointWith</code>-Axiomen, die festhalten, dass eine Parzelle nicht zweierlei zugleich sein kann, und mit beibehaltenen veralteten Klassen, damit ältere Datensätze weiterhin auflösbar bleiben. Entscheidend ist ihre <em>Facettierung</em>: Dieselbe Pflanze erscheint als Pflanzenschutzkultur, als Nährstoffbilanzkultur und als Direktzahlungskultur, weil die drei Regelungsbereiche die Pflanzenwelt unterschiedlich schneiden. <strong>Inspections</strong> ist die zugehörige Checkliste — die einzelnen Punkte, die eine Kontrollperson bei einem Betriebsbesuch prüft, gruppiert in Sammlungen."
"page.agriculture.cropsLabelCaveat" = "Kulturnamen tragen <strong>keinen Sprach-Tag</strong>: <em>Zuckerrüben</em>, <em>Betteraves sucrières</em> und <em>Barbabietole da zucchero</em> sind drei untaggierte Literale auf einer Ressource, und Englisch fehlt ganz. Eine Kultur kann daher unter derjenigen Schreibweise auftauchen, die der Label-Resolver zuerst findet, und eine Sprachfilterung mit <code>lang()</code> verwirft sie ausnahmslos alle. Dasselbe Muster zeigt sich bei den Wirkstoffnamen im Pflanzenschutzregister."
"page.agriculture.crossLinks" = "Die Graphen stützen sich auf gemeinsame Referenzdaten, statt sie zu wiederholen: Ausbruchsorte lösen sich in die <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Fterritorial\">territorialen</a> Kantone und Gemeinden auf, Marktbeobachtungen benennen ihr Erhebungsamt über <code>cube:observedBy</code> mit Verweis auf <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Fstaatskalender\">Staatskalender</a>-Organisationen, und die Zeit wird mit den plattformweiten <code>ld.admin.ch/time/</code>-Ressourcen ausgedrückt. Ein weiterer BLV-Graph, <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffsvo%2Fcube\">fsvo/cube</a>, liegt zwischen diesem Thema und <a href=\"/health.html\">Gesundheit</a> — er enthält Fleischkontrolle und Lebensmittelkontrolle neben der Tierversuchsstatistik und wird unter einem <code>health.ld.admin.ch</code>-Namensraum publiziert."
"page.agriculture.datasetsIntro" = "Sieben benannte Graphen von drei Herausgebern, fast alle unter dem Vokabular-Namensraum <code>https://agriculture.ld.admin.ch/</code> — auch dort, wo das Veterinäramt und nicht das Landwirtschaftsamt der Herausgeber ist."
"page.agriculture.eggs" = "Eier, und was die Haltung kostet"
"page.agriculture.eggsIntro" = "Eier zeigen die Dimension <strong>Produktionssystem</strong> am deutlichsten. Dieselbe Eiergrösse wird für Bio-, Freiland- und Bodenhaltung getrennt bepreist, und die Spanne dazwischen ist gross und stabil — vom günstigsten System bis Bio etwa das Doppelte. Weil die Haltungsform eine codierte Dimension ist und nicht Teil des Produktnamens, ist der Aufpreis eine Subtraktion und kein manueller Vergleich zweier Bezeichnungen."
"page.agriculture.foagPublisher" = "Bundesamt für Landwirtschaft (BLW)"
"page.agriculture.fsvoPublisher" = "Bundesamt für Lebensmittelsicherheit und Veterinärwesen (BLV)"
"page.agriculture.group" = "Gruppe"
"page.agriculture.groupLabelCaveat" = "Produktgruppennamen kommen in <em>gemischten Sprachen</em> zurück — <code>Vegetables</code> und <code>Fruits</code> neben <code>Rohmilch</code>, <code>Käse</code> und <code>Rahm</code>. Für die deutschen fehlt im Register schlicht ein englisches Label, sodass der Resolver auf das Vorhandene zurückfällt. Die Ressourcen selbst sind einwandfrei; uneinheitlich ist allein die Benennung."
"page.agriculture.groupStageIntro" = "Kreuzt man die Produktgruppen mit diesen Stufen, zeigt sich, worauf das Amt seine Erhebung konzentriert. Früchte und Gemüse dominieren und werden ganz überwiegend am Konsumende gemessen — eine wöchentliche Ladenpreiserhebung über gut hundert Positionen. Bei der Milch ist es umgekehrt: Die meisten Zeilen liegen auf der Produktionsstufe, weil der Produzentenmilchpreis für sich genommen eine politisch beachtete Grösse ist."
"page.agriculture.intro" = "Drei Bundesämter publizieren hier und verfolgen gemeinsam den ganzen Weg der Lebensmittel. Das <strong>Bundesamt für Landwirtschaft</strong> beobachtet den Markt — was ein Produkt auf jeder Stufe vom Hoftor bis zur Kasse löst. Das <strong>Bundesamt für Lebensmittelsicherheit und Veterinärwesen</strong> deckt die beiden Dinge ab, die schiefgehen können: Schädlinge im Feld und Krankheit im Stall. <strong>Agroscope</strong>, das landwirtschaftliche Forschungsinstitut des Bundes, steuert eine kleine Forschungsreihe bei."
"page.agriculture.marketDataCaveat" = "Beobachtungen tragen <strong>20 Dimensionen</strong>, jede davon eine IRI. Mächtig, aber eine Abfrage, die eine Dimension weglässt, aggregiert stillschweigend darüber hinweg — prüfen Sie stets, welchen Ausschnitt Sie tatsächlich gewählt haben"
"page.agriculture.marketDataContents" = "Milch und Milchprodukte, Früchte/Gemüse/Kartoffeln, Eier, Fleisch, Brotgetreide, Ölsaaten, Eiweisspflanzen, Futtermittel"
"page.agriculture.marketDataGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffoag%2Fagricultural-market-data\">foag/agricultural-market-data</a>"
"page.agriculture.marketDataGroup" = "<strong>Landwirtschaftliche Marktdaten</strong>"
"page.agriculture.marketDataShape" = "Ein regelmässiges Raster aus <em>Produktgruppe × Wertschöpfungsstufe × Messgrösse × Frequenz</em> — z. B. <code>Eggs/Production_Price_Month</code>, <code>MilkDairyProducts/Consumption_Price_Year</code>"
"page.agriculture.marketDataSize" = "49 Cubes, ~180'000 Beobachtungen, ~1'700 verschiedene Produkte"
"page.agriculture.metaTitle" = "Landwirtschaft & Ernährung"
"page.agriculture.milk" = "Der Milchpreis, im Inland und im Ausland"
"page.agriculture.milkIntro" = "Milch ist das am besten erfasste Produkt dieses Themas, und ihr monatlicher Produzentenpreis-Cube enthält etwas Ungewöhnliches: neben den Schweizer Zahlen führt er <strong>den Preis desselben Monats in Deutschland, Frankreich, Österreich, Italien, der EU insgesamt, den USA und Neuseeland</strong>. Die internationalen Reihen sind gewöhnliche Produkte im selben Cube, sodass sich ein Inlandpreis und sein ausländischer Vergleichswert vergleichen lassen, ohne den Datensatz zu verlassen."
"page.agriculture.milkSegments" = "Die Schweizer Zeilen sind nach <strong>Segment</strong> unterteilt — A für Milch in geschützten Inlandmärkten, B für dem Wettbewerb ausgesetzte Exportprodukte, C für den Rest, der zu Weltmarktpreisen verkauft wird. Die drei bewegen sich auf deutlich verschiedenen Niveaus, und genau der Abstand zwischen ihnen ist der Sinn dieser Segmentierung."
"page.agriculture.milkUnitCaveat" = "Die Preise verstehen sich je 100 kg in Schweizer Franken, sofern das Produkt nichts anderes angibt, und die ausländischen Reihen werden vom Amt in Franken umgerechnet — Bewegungen darin vermischen also eine echte Preisänderung mit einer Wechselkursänderung. Jede Zeile trägt ihre eigene Dimension <code>unit</code> und <code>currency</code>; öffnen Sie eine Beobachtung, um genau zu sehen, was gemessen wurde."
"page.agriculture.namedGraph" = "Benannter Graph"
"page.agriculture.plantProtection" = "Was gespritzt werden darf"
"page.agriculture.plantProtectionContents" = "Das eidgenössische Pflanzenschutzmittelregister: Zulassungen, Bewilligungsinhaber, Wirkstoffe, Kultur-/Schaderreger-Indikationen, Parallelimporte, Ausverkaufsfristen"
"page.agriculture.plantProtectionGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffsvo%2Fplant-protection-products\">fsvo/plant-protection-products</a>"
"page.agriculture.plantProtectionGroup" = "<strong>Pflanzenschutzmittel</strong>"
"page.agriculture.plantProtectionIntro" = "Das Pflanzenschutzmittelregister ist die vollständige Liste der Mittel, die ein Schweizer Landwirt rechtmässig ausbringen darf, und es ist ein Register und keine Statistik — jedes zugelassene Produkt mit eidgenössischer Zulassungsnummer, dem Unternehmen als Bewilligungsinhaber, seinen Wirkstoffen und den genauen Kultur-Schaderreger-Kombinationen, für die es freigegeben ist. Es ist der einzige Datensatz dieses Themas mit echter rechtlicher Wirkung: Was hier nicht steht, darf nicht eingesetzt werden."
"page.agriculture.plantProtectionSize" = "~2'400 zugelassene Produkte, ~7'900 Indikationen, ~450 Wirkstoffe, 24 Produktkategorien"
"page.agriculture.plantProtectionStructure" = "Ein Blick auf die Struktur lohnt sich. Ein Produkt trägt <strong>Indikationen</strong> — Tausende davon —, und jede Indikation ist ein bestimmtes Tripel aus Kultur, Schaderreger und Dosis; deshalb enthält das Register ein Vielfaches mehr Indikationen als Produkte. Zurückgezogene Produkte werden nicht gelöscht, sondern erhalten eine <code>soldOutDeadline</code> und eine <code>exhaustionDeadline</code>: die Fristen, bis zu denen Lagerbestände aus dem Verkauf verschwinden und aufgebraucht sein müssen. Damit dokumentiert das Register auch den Ausstieg und nicht nur die Bewilligung."
"page.agriculture.publisher" = "Herausgeber"
"page.agriculture.referenceCaveat" = "Dies sind Vokabulare, keine Statistiken — <code>foag/crops</code> ist eine OWL-Ontologie und enthält so gut wie keine Beobachtungen"
"page.agriculture.referenceContents" = "Kulturpflanzen-Ontologie (~740 Kulturarten), Kontrollpunkte für Betriebskontrollen (~3'950), die landwirtschaftliche Systemkarte und ein kleiner Agroscope-Forschungscube"
"page.agriculture.referenceData" = "Die Vokabulare darunter"
"page.agriculture.referenceGraphs" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffoag%2Fcrops\">foag/crops</a>, <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffoag%2Finspections\">foag/inspections</a>, <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffoag%2Fsystem-map\">foag/system-map</a>, <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Fagroscope%2Fcube\">agroscope/cube</a>"
"page.agriculture.referenceGroup" = "<strong>Referenzvokabulare und Forschung</strong>"
"page.agriculture.shape" = "Aufbau"
"page.agriculture.size" = "Grösse"
"page.agriculture.stageConsumption" = "Konsum"
"page.agriculture.stageConsumptionDesc" = "Das Verkaufsregal. Mit Abstand der grösste Teil dieses Datensatzes."
"page.agriculture.stageProduction" = "Produktion"
"page.agriculture.stageProductionDesc" = "Das Hoftor. Was der Produzent tatsächlich erhält, bevor die Ware durch weitere Hände geht."
"page.agriculture.stageTrade" = "Import & Export"
"page.agriculture.stageTradeDesc" = "Grenzüberschreitende Mengen und Preise — der Massstab, an dem die Inlandzahlen gelesen werden."
"page.agriculture.stageWholesale" = "Grosshandel / Verarbeitung"
"page.agriculture.stageWholesaleDesc" = "Die Molkerei, die Mühle, der Schlachthof. Wo Rohware zum Produkt wird."
"page.agriculture.stagesIntro" = "Jede Marktbeobachtung ist mit der Wertschöpfungsstufe versehen, zu der sie gehört. Die Stufen sind eine codierte Dimension und kein Freitext, sodass nie unklar ist, in welcher Hand ein Preis gemessen wurde."
"page.agriculture.subtitle" = "Was Schweizer Betriebe produzieren und was es auf jeder Stufe vom Feld bis ins Regal kostet — und was Kultur und Bestand schützt."
"page.agriculture.theDatasets" = "Die Datensätze"
"page.agriculture.theValueChain" = "Vom Hoftor bis zur Kasse"
"page.agriculture.title" = "Landwirtschaft & Ernährung"
"page.agriculture.valueChainIdea" = "Der Ordnungsgedanke hinter den Marktdaten ist die <strong>Wertschöpfungskette</strong>. Dasselbe Produkt wird getrennt bepreist: in der Produktion, im Grosshandel und in der Verarbeitung, im Gastrogrosshandel und im Konsum — dazu Import und Export. Das macht dieses Thema besonders: Bei Milch, Eiern oder einem Kilo Karotten lässt sich <em>dasselbe</em> Gut durch jede Hand verfolgen, durch die es geht, und man sieht, wo die Marge liegt, statt einen Hofpreis mit einem Ladenpreis aus zwei unverbundenen Quellen zu vergleichen."

# ── Page: energy ──────────────────────────────────────────────────────
"page.energy.aboutThisTheme" = "Über dieses Thema"
"page.energy.aidFee" = "Netzzuschlag"
"page.energy.aidFeeDesc" = "Die Bundesabgabe zur Förderung erneuerbarer Energien. National festgelegt und daher in jeder Zeile eines Jahres identisch."
"page.energy.buildingsAndScenarios" = "Gebäude und Szenarien"
"page.energy.buildingsScenariosIntro" = "Zwei weitere Familien runden den BFE-Bestand ab. Das <strong>Gebäudeprogramm</strong> (<em>Programme Bâtiments</em>) weist die Sanierungsförderung in vier parallelen Cubes aus — unterstützte Gesuche, ausbezahlte Franken, eingesparte Energie und vermiedenes CO₂, jeweils nach Massnahmenkategorie und Berichtsjahr —, sodass sich Kosten und Wirkung desselben Programms nebeneinander lesen lassen. Die <strong>Energieperspektiven 2050+</strong> sind anderer Art: kein Abbild des Geschehenen, sondern <em>modellierte Szenarien</em> dafür, wie die Schweiz netto null erreicht, mit Varianten zu Laufzeiten der Kernkraftwerke und zur Importbilanz. Ihre Zahlen sind Projektionen, keine Beobachtungen."
"page.energy.cantonComparisonIntro" = "Nach Kantonen geordnet ist die Spanne so gross, dass der günstigste und der teuerste kaum vergleichbar sind — und die Aufschlüsselung zeigt, woran es liegt. Manche Kantone sind wegen der Energiekomponente teuer, andere wegen der Netznutzung; der Netzzuschlag ist überall gleich hoch und erklärt daher nie einen Unterschied. Die Zahlen unten beziehen sich auf das <strong>Profil H4</strong> (5-Zimmer-Wohnung mit Elektroherd, rund 4'500 kWh pro Jahr) beim Standardprodukt."
"page.energy.cantonLabelsUntagged" = "Kantonsnamen tragen in LINDAS <em>keinen Sprach-Tag</em> — Zug, Zoug und Zugo sind drei untaggierte Literale auf derselben Ressource —, sodass ein Kanton unter derjenigen Schreibweise erscheinen kann, die der Label-Resolver zuerst findet. Gemeint ist in jedem Fall dieselbe Ressource."
"page.energy.caveat" = "Vorbehalt"
"page.energy.communityCharge" = "Abgaben an das Gemeinwesen"
"page.energy.communityChargeDesc" = "Lokale Abgaben, die von der Gemeinde weitergegeben werden. Bei vielen Betreibern null, bei einigen wenigen beträchtlich."
"page.energy.consumptionProfiles" = "Verbrauchsprofile"
"page.energy.contents" = "Inhalt"
"page.energy.coverage" = "Abdeckung"
"page.energy.crossLinks" = "Beide Graphen verweisen nach aussen, statt Referenzdaten zu duplizieren: Gemeinden und Kantone lösen sich in das <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffso%2Fregister\">BFS-Register</a> auf, Netzbetreiber tragen die UID, die auch <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffoj%2Fzefix\">Zefix</a> verwendet, Energieträger stammen aus einer <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Fcube%2Fdimension\">gemeinsamen Cube-Dimension</a>, und die herausgebenden Ämter sind dieselben <code>ld.admin.ch/office</code>-Ressourcen wie auf der ganzen Plattform."
"page.energy.datasetsIntro" = "Zwei benannte Graphen, beide unter dem Vokabular-Namensraum <code>https://energy.ld.admin.ch/</code> und zusammen das nach Tripelzahl drittgrösste Thema in LINDAS."
"page.energy.elcomContents" = "Tarife je Betreiber, Mediane je Kanton und für die Schweiz sowie die regulatorischen Indikator-Cubes <em>Sunshine</em>"
"page.energy.elcomCoverage" = "2011 bis 2026, eine Zeile je Betreiber × Profil × Produkt × Jahr"
"page.energy.elcomPublisher" = "Eidgenössische Elektrizitätskommission (ElCom)"
"page.energy.elcomSize" = "~24 Millionen Tripel — 7 Cubes, ~772'000 Beobachtungen"
"page.energy.electricityTariffs" = "<strong>Stromtarife</strong>"
"page.energy.electricitypriceGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Felcom%2Felectricityprice\">elcom/electricityprice</a>"
"page.energy.energy" = "Energie"
"page.energy.energyBalanceIntro" = "Die <strong>Schweizerische Gesamtenergiestatistik</strong> reicht bis 1980 zurück und weist den Verbrauch in Terajoule pro Jahr nach Energieträger aus. Die Träger stammen aus einer gemeinsamen LINDAS-Dimension und nicht aus Freitext, und sie sind verschachtelt: <em>erneuerbar</em> gliedert sich in Holz, Wasserkraft und übrige erneuerbare Energien, <em>nicht erneuerbar</em> in Kernbrennstoffe, Erdölprodukte, Gas, Kohle und Abfall. Weil die Hierarchie in den Daten steckt, lassen sich Summen und Komponenten aus demselben Cube abfragen, ohne doppelt zu zählen — sofern man sich für eine Ebene entscheidet."
"page.energy.energyComponent" = "Energie"
"page.energy.energyComponentDesc" = "Der Strom selbst. Der einzige dem Wettbewerb ausgesetzte Teil und derjenige, der nach 2022 in die Höhe schoss."
"page.energy.energyStatisticsGroup" = "<strong>Energiestatistik</strong>"
"page.energy.everyTariffIsBrokenIntoFour" = "Jeder Tarif in diesem Cube ist in <strong>vier Komponenten</strong> zerlegt, und das Modell sagt es selbst: Die Gesamtmessgrösse trägt <code>schema:hasPart</code>-Verweise auf jeden Bestandteil, sodass sich die Zerlegung aus den Daten und nicht aus einem Handbuch ablesen lässt. Das ist wichtig, weil sich die Teile sehr unterschiedlich verhalten — nur einer davon ist der Strom."
"page.energy.gridUsage" = "Netznutzung"
"page.energy.gridUsageDesc" = "Die Lieferung über das lokale Netz. Ein natürliches Monopol und oft der grösste Einzelanteil."
"page.energy.group" = "Gruppe"
"page.energy.metaTitle" = "Energie"
"page.energy.namedGraph" = "Benannter Graph"
"page.energy.operatorTableIntro" = "Unterhalb der kantonalen Mediane stehen die Betreiber selbst. Jeder ist eine <a href=\"/resource?iri=http%3A%2F%2Fschema.org%2FOrganization\">schema.org-Organisation</a> mit Postadresse, Website und — praktischerweise — einer <strong>Unternehmens-Identifikationsnummer</strong>, derselben UID, die auch das Handelsregister <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffoj%2Fzefix\">Zefix</a> verwendet. Genau dieser gemeinsame Identifikator erlaubt es, einen Tarif mit der dahinterstehenden juristischen Person zu verknüpfen."
"page.energy.operatorTariffCaveat" = "Ein Betreiber kann mehrere Gemeinden zu unterschiedlichen Tarifen beliefern; die Preisspalten zeigen eine repräsentative Zeile und keinen Durchschnitt — für das vollständige Bild dient die Ressourcenseite des Betreibers. Manche Betreiber publizieren einen einheitlichen Tarif für ihr ganzes Gebiet, andere nicht."
"page.energy.profileDescriptionCaveat" = "Die Profilbeschreibungen werden <strong>nur auf Deutsch</strong> publiziert — anders als die Cube- und Dimensionsnamen, die alle vier Landessprachen führen —, sie erscheinen hier also so, wie die ElCom sie erfasst, unabhängig von Ihrer Spracheinstellung. Zu beachten sind auch die Apostrophe darin: Sie sind das Schweizer Tausendertrennzeichen (<code>4'500</code>) und keine Anführungszeichen."
"page.energy.profilesDefinitions" = "Jedes Profil ist ein eigenständiges SKOS-Konzept und führt seine Definition mit sich: einen Referenzverbrauch in Kilowattstunden pro Jahr und eine Beschreibung des Haushalts oder Betriebs, für den es steht. Das macht den nachstehenden Vergleich erst aussagekräftig — <strong>H4</strong> und <strong>H3</strong> verbrauchen beide 4'500 kWh pro Jahr, doch H3 ist eine 4-Zimmer-Wohnung mit Elektroboiler, H4 eine 5-Zimmer-Wohnung mit Tumbler und ohne Boiler; die beiden werden also gegen wirklich verschiedene Kunden bepreist und nicht gegen eine beliebige Bezeichnung."
"page.energy.profilesIntro" = "Preise werden nie für einen einzigen abstrakten Kunden ausgewiesen. Die ElCom definiert fünfzehn Standardprofile — <strong>H1–H8</strong> für Haushalte, von der 2-Zimmer-Wohnung bis zum grossen Einfamilienhaus mit Wärmepumpe, und <strong>C1–C7</strong> für Betriebe, von der kleinen Werkstatt bis zum mittleren Industriebetrieb. Jedes Profil wird von jedem Betreiber in jedem Jahr einzeln bepreist; daher stammen die 770'000 Beobachtungen: einige hundert Betreiber mal fünfzehn Profile, zwei Produkte und sechzehn Jahre."
"page.energy.publisher" = "Herausgeber"
"page.energy.reservoirIntro" = "Die alpinen Speicherseen sind die Batterie des Landes, und der Cube zum <strong>Füllungsgrad der Speicherseen</strong> ist die einzige wöchentliche Reihe dieses Themas — jeden Sonntag um Mitternacht wird erfasst, wie viele Gigawattstunden gegenüber dem Fassungsvermögen der Becken gespeichert sind. Es ist ein wirklich operativer Datensatz: In der Versorgungsdebatte 2022 war dies die Zahl, auf die alle schauten. Zwei Eigenheiten seines Aufbaus sollte man vor dem Abfragen kennen. Die Regionen sind keine Dimension, sondern eigene <em>Spalten</em> (<code>gr…</code> für Graubünden, <code>ti…</code> für das Tessin), und das <strong>Ablesedatum ist überhaupt keine Eigenschaft</strong> — es steckt nur in der IRI der Beobachtung und muss aus der Zeichenkette herausgelöst werden, bevor sich die Reihe sortieren lässt."
"page.energy.sfoeCaveat" = "Die 91 Cubes sind rund 18 Datensätze in vielen Versionen — nehmen Sie stets die höchstnummerierte Cube-IRI, ausser Sie vergleichen Releases"
"page.energy.sfoeContents" = "Gesamtenergiestatistik, Füllungsgrad der Speicherseen, Solarförderung, Gebäudeprogramm, Forschungsstatistik, geteilte Mobilität, Szenarien 2050+"
"page.energy.sfoeGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Fsfoe%2Fcube\">sfoe/cube</a>"
"page.energy.sfoeIntro" = "Das Bundesamt für Energie publiziert rund neunzig Cubes, doch dahinter stecken weniger Datensätze, als diese Zahl vermuten lässt: Die meisten liegen in mehreren <strong>Versionen</strong> vor, jede eine eigene, auf eine Zahl endende Cube-IRI, und nur die höchste ist aktuell. Die vier nachstehenden Familien tragen den Inhalt."
"page.energy.sfoePublisher" = "Bundesamt für Energie (BFE)"
"page.energy.sfoeSize" = "~31 Millionen Tripel — 91 Cubes, ~1,9 Millionen Beobachtungen"
"page.energy.size" = "Grösse"
"page.energy.solarIntro" = "Die <strong>Einmalvergütung für Photovoltaikanlagen</strong> (<em>EIV</em>) ist die Bundesförderung für Solaranlagen auf Dächern, und ihr Cube ist der am unmittelbarsten vergleichbare Datensatz dieses Themas: je Kanton und Jahr hält er die Zahl der Anlagen, die installierte Leistung in Kilowatt und die ausbezahlten Franken fest — <em>und</em> die ersten beiden zusätzlich normiert auf 100'000 Einwohner. Dieses letzte Paar ist der Grund, weshalb sich ein kleiner Kanton ohne eigene Rechnerei mit Zürich vergleichen lässt."
"page.energy.subsidisedSolar" = "Geförderte Solarenergie"
"page.energy.subtitle" = "Was die Schweiz verbrennt, speichert und erzeugt — und was eine Kilowattstunde kostet, in jeder Gemeinde."
"page.energy.theDatasets" = "Die Datensätze"
"page.energy.thePhysicalSystem" = "Das physische System"
"page.energy.thePriceDataIsTheUnusual" = "Die Preisdaten sind der ungewöhnliche Teil. Strom wird in der Schweiz nicht zu einem nationalen Preis verkauft, sondern von rund 550 lokalen Netzbetreibern, meist kommunalen Werken, die je einen eigenen Tarif festlegen. Die ElCom erhebt sie alle, und damit wird aus einer Haushaltsrechnung etwas Abfragbares: <em>Wer verlangt wo wie viel, und welcher Teil der Rechnung ist überhaupt der Strom?</em>"
"page.energy.thePriceOfAKilowattHour" = "Der Preis einer Kilowattstunde"
"page.energy.title" = "Energie"
"page.energy.twoPublishersTwoQuestions" = "Zwei Herausgeber decken dieses Thema ab, und sie beantworten zwei verschiedene Fragen. Das <strong>Bundesamt für Energie</strong> beschreibt das <em>physische</em> System: wie viel Energie das Land verbraucht und aus welchen Trägern, wie voll die alpinen Speicherseen diese Woche sind, wie viel Solarleistung in jedem Kanton gefördert wurde. Die <strong>Eidgenössische Elektrizitätskommission</strong> beschreibt den <em>Markt</em>: was jeder Netzbetreiber des Landes verlangt, für jedes Verbrauchsprofil, in jedem Jahr seit 2011."
"page.energy.waterInTheMountains" = "Wasser in den Bergen"
"page.energy.whereTheEnergyComesFrom" = "Woher die Energie kommt"
"page.energy.whoChargesWhat" = "Wer wie viel verlangt"

# ── Page: culture ─────────────────────────────────────────────────────
"page.culture.aboutThisTheme" = "Über dieses Thema"
"page.culture.accessIntro" = "Jede Verzeichnungseinheit trägt zudem über <code>isAssociatedWithRule</code> eine <strong>Zugangsregel</strong>. Der Archivzugang wird in der Schweiz über Schutzfristen geregelt — in der Regel dreissig Jahre, länger bei Unterlagen mit Personendaten —, und diese Eigenschaft trennt somit eine lesbare Beschreibung von einem tatsächlich bestellbaren Dokument. Die Beschreibung ist auch dann öffentlich, wenn es das Dokument noch nicht ist."
"page.culture.aisCaveat" = "Vokabular-Labels verwenden <code>ric:name</code> <strong>ohne Sprach-Tags</strong>, je Sprache einmal wiederholt — stets mit <code>SAMPLE</code> behandeln, sonst vervielfacht sich jede Zeile"
"page.culture.aisCoverage" = "1798 bis heute, in acht Hauptabteilungen nach historischen Epochen"
"page.culture.aisGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Fsfa%2Fais\">sfa/ais</a>"
"page.culture.aisGroup" = "<strong>Archivinformationssystem</strong>"
"page.culture.aisModel" = "<strong>RiC-O</strong> (Records in Contexts), die Archivontologie des ICA — <em>nicht</em> das Cube-Vokabular"
"page.culture.aisSize" = "~4,8 Millionen Verzeichnungseinheiten, ~263'000 Einzeldokumente, ~5,1 Millionen Datumsangaben — der grösste Graph in LINDAS"
"page.culture.budgetVsAccounts" = "Jede Zeile ist mit einem <strong>Berichtstyp</strong> versehen, und die Unterscheidung wiegt schwerer, als es zunächst scheint: <code>Voranschlag</code> ist das Budget wie geplant, <code>Rechnung</code> der Abschluss wie er ausfiel. Beide liegen für dasselbe Jahr und dieselbe Position vor, sodass sich die Differenz zwischen dem, was der Bund ausgeben wollte, und dem, was er tatsächlich ausgab, über 175 Jahre hinweg direkt abfragen lässt. Die frühesten Jahre zeigen erkennbar einen anderen Staat — 1850 sind die grössten Posten die Postverwaltung, die Grenzzölle und das Militärdepartement."
"page.culture.caveat" = "Vorbehalt"
"page.culture.contents" = "Inhalt"
"page.culture.coverage" = "Abdeckung"
"page.culture.crossLinks" = "Das Thema verweist nach aussen wie nach innen: Verzeichnungseinheiten benennen ihre besitzende Institution über das <a href=\"/resource?iri=https%3A%2F%2Fschema.ld.admin.ch%2FIsil\">ISIL</a>-Register, Beobachtungen der Staatsrechnung benennen das herausgebende Amt über <code>cube:observedBy</code> mit Verweis auf <code>ld.admin.ch/office</code>-Ressourcen, und die RiC-O-Ontologie selbst ist auf der Plattform separat als <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Fegad%2Fric-o\">egad/ric-o</a> publiziert — das Vokabular, das das Archiv beschreibt, lässt sich also neben dem beschriebenen Archiv durchsehen."
"page.culture.culture" = "Kultur"
"page.culture.datasetsIntro" = "Vier benannte Graphen, publiziert unter dem Namensraum <code>https://culture.ld.admin.ch/</code> — mit einer unten vermerkten Ausnahme. Zusammen machen sie dies zum nach Tripelzahl grössten Thema der Plattform."
"page.culture.divisionsCaveat" = "Die obigen Zahlen zählen nur <em>direkte</em> Untereinheiten — die Bestände unmittelbar unter jeder Hauptabteilung, nicht die Millionen Dossiers darunter. Eine Hauptabteilung mit nur einer Untereinheit ist nicht klein; sie ist lediglich über eine Zwischenebene erschlossen, bevor sie sich auffächert."
"page.culture.divisionsIntro" = "Zuoberst gliedert sich das Archiv in acht <strong>Hauptabteilungen</strong>, und diese sind Epochen der Schweizer Geschichte und keine Sachgebiete. Das <em>Archiv der Helvetik</em> deckt die kurzlebige Helvetische Republik von 1798–1803 ab, gefolgt von Mediation und Tagsatzung; der weitaus grösste Teil liegt unter dem <em>Archiv des Schweizerischen Bundesstaates</em>, dem Bundesstaat ab 1848. Depositen und Schenkungen aus privater Hand bilden daneben eine eigene Abteilung."
"page.culture.group" = "Gruppe"
"page.culture.hierarchyIntro" = "Archivische Verzeichnung ist streng hierarchisch, und die Ebenen tragen Namen, die Archivarinnen und Archivare seit einem Jahrhundert verwenden. Alles ist von oben nach unten verschachtelt: vom Archiv selbst über Hauptabteilungen und Bestände bis zum einzelnen Dossier. Jede Ebene ist ein <code>RecordSet</code> mit einem <code>hasRecordSetType</code>, der angibt, auf welcher Stufe sie steht. Fast das gesamte Volumen liegt zuunterst: Dossiers übertreffen alle anderen Ebenen zusammen um rund das Zehnfache."
"page.culture.intro" = "Dies ist mit grossem Abstand das umfangreichste Thema in LINDAS und zugleich das untypischste. Wo Energie oder Landwirtschaft <em>Messwerte</em> publizieren, publiziert das <strong>Schweizerische Bundesarchiv</strong> <em>Beschreibungen</em>: Ein archivisches Findmittel ist eine verschachtelte Darstellung dessen, was vorhanden ist, wo es im Bestand liegt und wovon es handelt. Die <strong>Schweizerische Nationalbibliothek</strong> ergänzt das Verzeichnis der Institutionen, die solches Material im ganzen Land aufbewahren."
"page.culture.isilCaveat" = "Die Bestandsangaben beruhen auf Selbstdeklaration und folgen keiner einheitlichen Grundlage — manche Institutionen zählen Bände, andere Objekte oder Laufmeter —, die Reihenfolge ist daher als Anhaltspunkt und nicht als Rangliste zu lesen. Nur ein Teil des Registers macht überhaupt eine Angabe; Institutionen ohne Zahl fehlen in dieser Tabelle, sie sind nicht leer."
"page.culture.isilContents" = "Bibliotheken, Archive, Mediatheken und private Sammlungen — mit Gründungsjahr, Bestandsgrösse, Verwaltungsgeschichte und einem Link zum eigenen Katalog der Institution"
"page.culture.isilGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Fnl%2Fisil\">nl/isil</a>"
"page.culture.isilGroup" = "<strong>ISIL-Register</strong>"
"page.culture.isilIntro" = "Eine <strong>ISIL</strong> ist der internationale Standardidentifikator für eine Bibliothek oder ein Archiv — <code>CH-000018-2</code> ist das Bundesarchiv selbst —, und die Nationalbibliothek führt das schweizerische Verzeichnis dazu. Es reicht weit über die nationalen Institutionen hinaus: Gemeindebibliotheken, Schulmediatheken, Pfarreiarchive, Firmensammlungen und Theaterarchive tragen alle eine. Für viele Einträge verzeichnet das Register ein Gründungsjahr, die Bestandsgrösse, eine Verwaltungsgeschichte in Prosa und eine Beschreibung des Sammlungsinhalts."
"page.culture.isilJoin" = "Der Identifikator ist es, der die beiden Archivgraphen verbindet. Jede Verzeichnungseinheit des Bundesarchivs verweist über <code>hasOrHadHolder</code> auf eine ISIL-Ressource, sodass eine Beschreibung und die besitzende Institution über einen gemeinsamen Identifikator statt über eine Namenszeichenkette verknüpft sind — dasselbe Muster, das das Thema Energie für Unternehmens-UIDs nutzt."
"page.culture.isilSize" = "~2'120 Institutionen, jede mit Postadresse und einer Organisationsressource"
"page.culture.metaTitle" = "Kultur & Archive"
"page.culture.model" = "Modell"
"page.culture.namedGraph" = "Benannter Graph"
"page.culture.nlPublisher" = "Schweizerische Nationalbibliothek"
"page.culture.publisher" = "Herausgeber"
"page.culture.recordsIntro" = "Unter den Verzeichnungseinheiten stehen die Einzeldokumente, und sie sind reicher als ein Katalogeintrag. Neben Titel und Signatur kann ein Dokument eine Notiz zu <strong>Inhalt und innerer Ordnung</strong>, eine Autorin oder einen Autor, einen Herausgeber, eine namentlich genannte Kameraperson, ein physisches Format und einen Sachdeskriptor tragen. Diese Mischung verrät, was ein grosser Teil dieses Archivs tatsächlich enthält: nicht nur Papierakten, sondern <strong>Sendematerial</strong> — Fernseh- und Radiobeiträge, die der öffentliche Rundfunk deponiert hat, mit Laufzeiten, Farbangaben und Bandformaten im Feld <code>format</code>."
"page.culture.ricIntro" = "Das Archiv ist in <strong>Records in Contexts</strong> (RiC-O) modelliert, der Archivontologie des Internationalen Archivrats — und nicht im Cube-Vokabular, das auf der Plattform sonst fast überall verwendet wird. Diese Wahl ist das Wichtigste, was man vor dem Abfragen wissen muss. RiC ist auf Beschreibung und nicht auf Aggregation ausgelegt: Sein Kerngedanke ist, dass eine Verzeichnungseinheit erst durch ihren <em>Kontext</em> bedeutungsvoll wird; die Beziehungen (was worin enthalten ist, wer es verwahrte, welche Tätigkeit es hervorbrachte) tragen daher ebenso viel Bedeutung wie die Titel."
"page.culture.sfaCubeCaveat" = "Stark versioniert — allein <code>StateAccounts_Domain</code> umfasst 11 Cubes mit identischen Zeilenzahlen. Verankern Sie jede Abfrage in einer einzigen Cube-IRI, sonst zählen Sie dieselben Zahlen vielfach"
"page.culture.sfaCubeCoverage" = "Ab 1850, Voranschlag und Staatsrechnung, gegliedert nach Bereich / Amt / Funktion / Kategorie"
"page.culture.sfaCubeGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Fsfa%2Fcube\">sfa/cube</a>"
"page.culture.sfaCubeSize" = "41 Cubes in 5 Familien — aber nur ~4 verschiedene Datensätze, der Rest sind Versionen"
"page.culture.sfaPublisher" = "Schweizerisches Bundesarchiv"
"page.culture.shapeOfAnArchive" = "Der Aufbau eines Archivs"
"page.culture.size" = "Grösse"
"page.culture.stapfer" = "Eine Schulumfrage von 1799"
"page.culture.stapferCaveat" = "Es handelt sich um Transkriptionen einer 226-jährigen handschriftlichen Quelle, und das merkt man ihnen an. Einige wenige Einträge führen unplausible Zahlen — eine Schule meldet über tausend Knaben gegenüber fünfundneunzig Mädchen —, die auf die ursprüngliche Rückmeldung oder deren Transkription zurückgehen und nicht auf das Dorf. Sortieren Sie nach einer beliebigen Spalte, und die Ausreisser treten sofort hervor; behandeln Sie sie als Dokumente, nicht als Messwerte."
"page.culture.stapferCaveatCard" = "Verwendet das <strong>alte W3C-Cube-Vokabular</strong> (<code>qb:Observation</code>) und liegt im Namensraum <code>education.ld.admin.ch</code>, nicht <code>culture</code>"
"page.culture.stapferGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Fsfa%2Fstapfer_enquete\">sfa/stapfer_enquete</a>"
"page.culture.stapferGroup" = "<strong>Stapfer-Enquête (1799)</strong>"
"page.culture.stapferIntro" = "Die <strong>Stapfer-Enquête</strong> ist der älteste Datensatz der Plattform und der anschaulichste. 1799 sandte der Minister der Künste und Wissenschaften Philipp Albert Stapfer einen Fragebogen an jeden Schulmeister der Helvetischen Republik und erkundigte sich, wer unterrichtete, wer die Schule besuchte, was gelehrt wurde und wovon die Schule lebte. Tausende Antworten sind erhalten und wurden in einen abfragbaren Datensatz übertragen — das, was einer Volkszählung der Schweizer Schulen im Moment der Entstehung des modernen Staates am nächsten kommt."
"page.culture.stapferSeasons" = "Ein Detail des Aufbaus sagt fast alles über das ländliche Leben im Jahr 1799 aus: Der Schulbesuch ist <strong>getrennt für Winter und Sommer</strong> erfasst und getrennt für Knaben und Mädchen. Die Sommerzahlen sind regelmässig nur ein Bruchteil der Winterzahlen, weil die Kinder im Sommer auf den Feldern arbeiteten. Der saisonale Unterschied in diesen Daten misst landwirtschaftliche Arbeit und nicht Schulbildung."
"page.culture.stapferSize" = "~3'230 Schulrückmeldungen, mit Schülerzahlen nach Geschlecht und Jahreszeit, Schultyp, Konfession und Ort"
"page.culture.stateAccounts" = "Der Bundeshaushalt seit 1850"
"page.culture.stateAccountsGroup" = "<strong>Staatsrechnungen</strong>"
"page.culture.stateAccountsIntro" = "Das Bundesarchiv publiziert auch etwas, das gar kein Findmittel ist: die <strong>Staatsrechnungen</strong>, den Voranschlag und die Rechnung des Bundes als durchgehenden Cube zurück bis <strong>1850</strong> — zwei Jahre nach Gründung des Bundesstaates. Dieselben Zahlen sind auf vier Arten geschnitten, je eine Cube-Familie pro Sicht: nach <em>Bereich</em>, nach <em>Amt</em>, nach <em>Funktion</em> und nach <em>Kategorie</em>."
"page.culture.subtitle" = "Das Gedächtnis des Schweizer Staates — neun Millionen archivische Beschreibungen, ein Verzeichnis aller sammelnden Institutionen und eine Schulumfrage von 1799."
"page.culture.theDatasets" = "Die Datensätze"
"page.culture.title" = "Kultur & Archive"
"page.culture.whatRecordsDescribe" = "Was die Verzeichnungseinheiten beschreiben"
"page.culture.whoHoldsWhat" = "Wer was verwahrt"

