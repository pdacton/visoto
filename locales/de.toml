# ── Page: government ──────────────────────────────────────────────────
"page.government.aboutThisTheme" = "Über dieses Thema"
"page.government.administration" = "Verwaltung"
"page.government.caveat" = "Vorbehalt"
"page.government.contents" = "Inhalt"
"page.government.crossLinks" = "In diesem Thema laufen die Fäden der übrigen Plattform zusammen. Marktbeobachtungen in der <a href=\"/agriculture.html\">Landwirtschaft</a> benennen ihr Erhebungsamt über <code>cube:observedBy</code> mit Verweis auf Staatskalender-Organisationen; die Staatsrechnungen in <a href=\"/culture.html\">Kultur &amp; Archive</a> und die Cubes in der <a href=\"/energy.html\">Energie</a> tun dasselbe über <code>ld.admin.ch/office</code>-Ressourcen. Die Sachgebiete von TERMDAT wiederum lesen sich wie ein Inhaltsverzeichnis von ganz LINDAS — Recht, Politik, Landwirtschaft, Umwelt, Verkehr, Medizin."
"page.government.datasetsIntro" = "Drei benannte Graphen, alle von der Bundeskanzlei herausgegeben, und allesamt Referenzdaten, auf welche die übrige Plattform verweist, statt eigenständiger Statistiken."
"page.government.departmentsIntro" = "Zählt man alles, was unter ihnen liegt, sind die Departemente auffallend ungleich gross. Das <strong>VBS</strong> ist mit Abstand das grösste — es trägt die gesamte Armeestruktur, weshalb sich ein Departement mit überschaubarem Hauptsitz auf Tausende von Einheiten ausdehnt. Die <strong>Bundeskanzlei</strong>, die die Regierung koordiniert statt Leistungen zu erbringen, ist um eine Grössenordnung die kleinste."
"page.government.fchPublisher" = "Bundeskanzlei"
"page.government.federalCouncilNote" = "Fragt man den Bundesrat ab, erhält man die sieben amtierenden Mitglieder mit Namen, jedes über eine Funktion, die schlicht <em>Mitglied</em> heisst. Dasselbe Muster liefert die Richterinnen und Richter jedes Bundesgerichts und die Direktionen jedes Amtes."
"page.government.fourLanguagesCaveat" = "Hier erscheinen nur Einträge, die in allen vier Sprachen eine Abkürzung führen; sehr viele Begriffe sind in den drei Landessprachen erfasst, ohne englische Entsprechung, und fehlen in dieser Tabelle, statt unvollständig zu sein. Englisch ist eine Arbeitsergänzung von TERMDAT und keine Amtssprache des Bundes — deshalb wiederholen einige Zeilen in der englischen Spalte die französische Form, wenn keine eigene englische Abkürzung existiert."
"page.government.group" = "Gruppe"
"page.government.hierarchyIntro" = "Der Staatskalender ist ein einziger Baum, zusammengehalten von <code>schema:parentOrganization</code>, und seine oberste Ebene ist die schweizerische Verfassungsordnung als Daten. Der <strong>Bundesrat</strong> steht an der Spitze von sieben Departementen und der Bundeskanzlei; die <strong>eidgenössischen Gerichte</strong> — Bundesgericht, Bundesverwaltungsgericht, Bundesstrafgericht und Bundespatentgericht — stehen neben ihm und nicht unter ihm, wie es die Gewaltenteilung verlangt; und die Kantone bilden einen eigenen Ast neben dem Bund."
"page.government.intro" = "Alle drei Graphen stammen hier von der <strong>Bundeskanzlei</strong>, und zusammen beantworten sie eine Frage, welche die übrigen Themen als gegeben voraussetzen: <em>Wer genau ist der Staat?</em> Jede andere Seite dieser Website verweist auf ein Amt — eine herausgebende Behörde, eine Quelle einer Statistik. Hier werden diese Ämter überhaupt erst definiert."
"page.government.metaTitle" = "Regierung & Verwaltung"
"page.government.model" = "Modell"
"page.government.namedGraph" = "Benannter Graph"
"page.government.organizationCaveat" = "Verwendet <code>ld.admin.ch/ou/</code>-IRIs, die <em>nicht</em> mit den Organisations-IRIs des Staatskalenders übereinstimmen — beide Graphen beschreiben dieselben Körperschaften, lassen sich aber nicht direkt verknüpfen"
"page.government.organizationGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Forganization\">fch/organization</a>"
"page.government.organizationGroup" = "<strong>Organisationsdaten</strong>"
"page.government.organizationModel" = "<strong>version.link</strong> — eine stabile <code>Identity</code> je Einheit mit einer datierten Kette von <code>Version</code>-Ressourcen, verbunden durch <code>predecessor</code>/<code>successor</code>"
"page.government.organizationSize" = "~20'200 Organisationsidentitäten mit ~38'600 datierten Versionen, davon ~30'600 als veraltet markiert"
"page.government.peopleInRoles" = "Menschen und die Funktionen, die sie innehaben"
"page.government.publisher" = "Herausgeber"
"page.government.rolesCaveat" = "Die Funktionsbezeichnungen sind hier auf Deutsch gefiltert, damit jede Funktion einmal erscheint; dieselben Ressourcen führen auch französische und italienische Bezeichnungen, und beim Öffnen einer Funktion sind alle sichtbar. Zu beachten ist ausserdem, dass nur rund die Hälfte der Personen im Verzeichnis ein erfasstes Geschlecht und nur ein Teil eine direkte Telefonnummer hat — das Register verzeichnet in erster Linie Funktionen und erst in zweiter Personen."
"page.government.rolesIntro" = "Eine Person ist nie direkt einer Amtsstelle zugeordnet. Dazwischen steht eine <strong>OrganizationRole</strong> — eine kleine Ressource, welche die Funktion benennt und mit <code>schema:member</code> auf die Person und mit <code>schema:memberOf</code> auf die Einheit verweist. Diese Modellierungsentscheidung verdient Beachtung: Weil die Funktion eine eigene Ressource ist, kann eine Person mehrere verschiedene Funktionen in mehreren Körperschaften innehaben, ohne dass sie vermischt werden, und die Funktion selbst (<em>Mitglied</em>, <em>Direktor</em>, <em>Juge fédéral suppléant</em>) ist Datum und nicht eine in einer Zeichenkette vergrabene Bezeichnung."
"page.government.shapeOfTheState" = "Der Aufbau des Staates"
"page.government.size" = "Grösse"
"page.government.staatskalenderContents" = "Der Bund, wie er heute besteht: Regierung, Departemente, Ämter, eidgenössische Gerichte, Bundesanwaltschaft, Parlamentsdienste und die Kantone"
"page.government.staatskalenderGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Fstaatskalender\">fch/staatskalender</a>"
"page.government.staatskalenderGroup" = "<strong>Staatskalender</strong>"
"page.government.staatskalenderModel" = "Reines schema.org — <code>GovernmentOrganization</code> in einem Eltern-Kind-Baum, mit <code>OrganizationRole</code> als Bindeglied zwischen Personen und Einheiten"
"page.government.staatskalenderSize" = "~11'500 Verwaltungseinheiten, ~6'800 Personen, ~3'570 Funktionen, ~9'800 Postadressen"
"page.government.subtitle" = "Wer für den Bund arbeitet, in welchem Amt, unter welcher Bezeichnung — und das viersprachige Vokabular, mit dem der Staat es ausdrückt."
"page.government.termdat" = "Dasselbe in vier Sprachen sagen"
"page.government.termdatCaveat" = "Begriffe verweisen auf ein <em>Unter</em>-Sachgebiet, nicht auf ein Sachgebiet — das Sachgebiet liegt zwei Schritte entfernt über <code>schema:isPartOf</code>, und eine einstufige Abfrage liefert stillschweigend nichts"
"page.government.termdatContents" = "Die Terminologiedatenbank des Bundes — Begriffe mit ihren Vorzugsbenennungen, Synonymen, Abkürzungen und Phraseologie auf Deutsch, Französisch, Italienisch und Englisch, viele mit Definitionen samt Angabe des Erlasses, aus dem sie stammen"
"page.government.termdatGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Ftermdat\">fch/termdat</a>"
"page.government.termdatGroup" = "<strong>TERMDAT</strong>"
"page.government.termdatIntro" = "Ein Bundesstaat mit vier Amtssprachen hat ein Problem, das keine einsprachige Verwaltung kennt: Jedes Gesetz, jedes Formular und jede Medienmitteilung muss auf Deutsch, Französisch und Italienisch vorliegen, und die Wörter müssen in jeder Sprache genau dasselbe bedeuten. <strong>TERMDAT</strong> ist die Antwort der Bundeskanzlei darauf — die Terminologiedatenbank der Bundesverwaltung und die grösste Ressource ihrer Art im Land."
"page.government.termdatLawNote" = "Das Recht dominiert die Sammlung mit grossem Abstand, die Politik folgt weit dahinter — ein zutreffendes Bild dessen, was der Bund am häufigsten präzise übersetzen muss. Darunter folgen die Sachgebiete fast genau dem Rest dieser Website: Land- und Forstwirtschaft, Umwelt, Medizin, Finanzwesen, Verkehr."
"page.government.termdatSize" = "~78'000 Begriffe, ~63'000 Synonyme, ~35'000 validierte Einträge, ~8'900 Abkürzungen, 41 Sachgebiete"
"page.government.termdatStatus" = "Einträge tragen zudem ihren Bearbeitungsstand. Die meisten sind <strong>validiert</strong> — von der Sektion Terminologie geprüft und freigegeben —, andere sind als in Bearbeitung oder veraltet markiert, sodass eine Abfrage sich auf die tatsächlich massgebliche Terminologie beschränken kann. Viele Einträge ergänzen eine Definition mit einer <em>Angabe des Erlasses, aus dem sie stammt</em>, was die Datenbank zu einem Weg vom Wort zurück zum definierenden Gesetzesartikel macht."
"page.government.termdatStructure" = "Das Modell stellt den <em>Begriff</em> voran, nicht das Wort. Ein Eintrag ist ein Begriff; die Benennungen der einzelnen Sprachen hängen über <code>schema:hasPart</code> daran, jede mit einer Position, die angibt, ob sie die Vorzugsbenennung oder eine zulässige Variante ist. Diese Umkehrung macht die Datenbank als Übersetzungshilfe brauchbar: Das Öffentlichkeitsgesetz ist ein Eintrag, der <code>BGÖ</code>, <code>LTrans</code>, <code>LTras</code> und <code>FoIA</code> als vier Benennungen einer einzigen Sache führt, statt vier getrennter Datensätze, die darauf hoffen, einander zugeordnet zu werden. Die Tabelle weiter unten zeigt genau das, für jeden Bundeserlass, der in allen vier Sprachen abgekürzt wird."
"page.government.theDatasets" = "Die Datensätze"
"page.government.threeAnswers" = "Sie beantworten sie auf drei verschiedene Arten. Der <strong>Staatskalender</strong> ist das Verzeichnis, wie es heute besteht: jede Einheit, ihre Adresse und die Personen, die darin Funktionen innehaben. Die <strong>Organisationsdaten</strong> zeigen dieselbe Verwaltung im Zeitverlauf, wobei jede Umbenennung und Reorganisation als datierte Version erhalten bleibt. <strong>TERMDAT</strong> ist das Vokabular selbst — die Terminologie der Verwaltung auf Deutsch, Französisch, Italienisch und Englisch, damit derselbe Rechtsbegriff in allen vier Sprachen korrekt benannt werden kann."
"page.government.throughTime" = "Die Verwaltung im Zeitverlauf"
"page.government.title" = "Regierung & Verwaltung"
"page.government.topLevelIntro" = "Über den Departementen stehen jene Körperschaften, die innerhalb der Verwaltung niemandem unterstellt sind. Listet man die Organisationen ohne jedes übergeordnete Element auf, ergibt sich die verfassungsmässige Spitze des Baumes in einer einzigen Abfrage — die Regierung, die vier eidgenössischen Gerichte, die Bundesanwaltschaft und ihre Aufsichtsbehörde, die Parlamentsdienste und die Kantone."
"page.government.versioningCaveat" = "Eine hohe Versionszahl ist weniger ein Zeichen von Instabilität als von feinkörniger Nachführung — eine Adressänderung oder eine korrigierte Abkürzung erzeugt eine Version ebenso wie eine Fusion. Zu beachten ist auch, dass dieser Graph <code>ld.admin.ch/ou/</code>-IRIs verwendet, während der Staatskalender <code>register.ld.admin.ch/staatskalender/organization/</code> nutzt: Sie beschreiben dieselbe Verwaltung, sind aber nicht dieselben Ressourcen und lassen sich nicht über die IRI verknüpfen."
"page.government.versioningConsequence" = "Die Folge ist, dass das meiste in diesem Graphen bewusst <em>historisch</em> ist: Die grosse Mehrheit der Versionen ist als veraltet markiert, weil sie abgelöst wurde. Das ist der Zweck und kein Mangel. Wird ein Amt umbenannt oder eingegliedert, wird die alte Version nicht überschrieben — sie wird mit einem Enddatum abgeschlossen und mit dem verknüpft, was an ihre Stelle trat, sodass ein Verweis aus einem 2015 verfassten Dokument weiterhin auf die damals bestehende Körperschaft auflöst."
"page.government.versioningIntro" = "Der Organisationsgraph ist das ungewöhnlichste Modell dieses Themas und womöglich der ganzen Plattform. Er beschreibt nicht die Verwaltung, wie sie ist, sondern <em>jeden Zustand, in dem die Verwaltung je war</em>. Jede Einheit hat eine stabile <strong>Identität</strong>, und an dieser Identität hängt eine Kette datierter <strong>Versionen</strong>, jede mit Anfangsdatum, Enddatum und <code>predecessor</code>- und <code>successor</code>-Verweisen auf ihre zeitlichen Nachbarn."

