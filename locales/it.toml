# ── Page: politics ────────────────────────────────────────────────
"page.politics.16MillionTriplesOrganization" = "~1,6 milioni di triple — organization è il più grande con ~975 000"
"page.politics.19MillionTriplesPopular" = "~1,9 milioni di triple — popular-vote da solo ne conta ~1,0 milioni"
"page.politics.2019And2023Populated2027" = "2019 e 2023 popolati; 2027 registrato ma vuoto"
"page.politics.292000Triples18Cubes" = "~292 000 triple — 18 cubi, 5 soggetti × 3 anni"
"page.politics.42000Triples" = "~42 000 triple"
"page.politics.aSeventeenthGraphTermdatHolds" = "Un diciassettesimo grafo, <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Ftermdat\">termdat</a>, contiene la banca dati terminologica dell'Amministrazione federale. Di natura amministrativa più che politica, non compare nei gruppi qui sopra."
"page.politics.aboutThisTheme" = "Informazioni su questo tema"
"page.politics.bkAdminCh" = "<a href=\"https://www.bk.admin.ch\" target=\"_blank\" rel=\"noopener\">bk.admin.ch</a>"
"page.politics.bothRoutesEndAtThe" = "Entrambe le vie sfociano nello stesso punto: una <strong>votazione popolare</strong>. Questo cubo è il fulcro del tema — e il set di dati politici più ricco di LINDAS. Non registra una riga per votazione, ma <em>una riga per oggetto e per Cantone</em>, motivo per cui poche centinaia di oggetti diventano quasi ventimila osservazioni. Ogni riga riporta i sì e i no <em>e</em> le percentuali, la partecipazione, gli aventi diritto di voto, le schede bianche e nulle, nonché il voto dei Cantoni (<em>Standesstimme</em>), che anche le modifiche costituzionali devono ottenere."
"page.politics.candidatesListsSeatsPerList" = "Candidati, liste, seggi per lista, seggi all'interno delle congiunzioni di liste, statistiche cantonali"
"page.politics.cantonalRowsAreOmittedAbove" = "Le righe cantonali sono omesse qui sopra per mantenere una riga per oggetto — apri una qualsiasi osservazione di <a href=\"/resource?iri=https%3A%2F%2Fpolitics.ld.admin.ch%2Fpolitical-rights%2Fpopular-vote%2F1\">votazione popolare</a> per vedere tutte le 26 ripartizioni. Il cubo delle date di votazione elenca anche date <em>future</em>: le voci più recenti possono quindi essere votazioni previste, senza risultato."
"page.politics.caveat" = "Avvertenza"
"page.politics.citizensObjectParliamentHasPassed" = "I cittadini <em>si oppongono</em>. Il parlamento ha approvato una legge; 50 000 firme la sottopongono al voto popolare prima che possa entrare in vigore. Anche il diritto d'urgenza è coperto e segue regole accelerate proprie."
"page.politics.citizensProposeGather100000" = "I cittadini <em>propongono</em>. Con 100 000 firme si può chiedere una modifica della Costituzione federale, che il parlamento la voglia o no. Registrate dal 1891 e seguite dalla raccolta delle firme fino al ritiro o alla votazione."
"page.politics.contents" = "Contenuto"
"page.politics.coverage" = "Copertura"
"page.politics.cubesFor2027AreAlready" = "I cubi per il <strong>2027</strong> sono già registrati ma non contengono ancora risultati — i cubi dei candidati e delle liste sono vuoti e le statistiche cantonali contengono solo lo scheletro di righe pre-creato. Dati reali esistono per il 2019 e il 2023."
"page.politics.curiaFederalCouncilStaatskalenderOrganization" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Fcuria\">curia</a>, <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Ffederal-council\">federal-council</a>, <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Fstaatskalender\">staatskalender</a>, <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Forganization\">organization</a>, <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Fextra-parliamentary-commission\">extra-parliamentary-commission</a>, <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Fpolitical-party-register\">political-party-register</a>, <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Frvov\">rvov</a>"
"page.politics.directDemocracy" = "<strong>Democrazia diretta</strong>"
"page.politics.directDemocracyHowAVote" = "Democrazia diretta: come si arriva a una votazione"
"page.politics.elections" = "<strong>Elezioni</strong>"
"page.politics.electionsFillingTheNationalCouncil" = "Elezioni: comporre il Consiglio nazionale"
"page.politics.everyFourYearsSwitzerlandElects" = "Ogni quattro anni la Svizzera elegge i 200 membri del Consiglio nazionale. LINDAS conserva i risultati come cinque famiglie di cubi per anno elettorale, che insieme descrivono l'intero meccanismo proporzionale: chi si è candidato, su quale lista, quanti voti ha raccolto ciascuna lista e come sono stati infine attribuiti i seggi — compresa la ripartizione <em>all'interno</em> delle congiunzioni di liste, una specialità svizzera con cui i piccoli partiti mettono in comune i voti per superare insieme la soglia."
"page.politics.federalChancelleryFCh" = "Cancelleria federale (CaF)"
"page.politics.governmentAndAdministration" = "Governo e amministrazione"
"page.politics.group" = "Gruppo"
"page.politics.interestTiesAndLobbying" = "Legami d'interesse e lobbismo"
"page.politics.landingPage" = "Pagina di destinazione"
"page.politics.membersOfParliamentMustDeclare" = "I parlamentari devono dichiarare i loro mandati esterni, e le dichiarazioni sono pubblicate qui come collegamenti tra una persona e un'<a href=\"/resource?iri=http%3A%2F%2Fschema.org%2FLobbyOrganization\">organizzazione lobbistica</a>. Il dettaglio utile è che ogni legame è contrassegnato come <strong>retribuito o non retribuito</strong> e registra la <em>funzione</em> ricoperta — la tabella qui sotto separa quindi i seggi che un parlamentare semplicemente occupa da quelli che <strong>presiede</strong>. I due possono divergere nettamente: delle dodici persone con più legami retribuiti, alcune ne presiedono quasi tutti e altre uno solo."
"page.politics.motionsPostulatesAndInterpellationsWith" = "Mozioni, postulati e interpellanze con il relativo stato di trattazione"
"page.politics.namedGraph" = "Grafo denominato"
"page.politics.namedGraphs" = "Grafi denominati"
"page.politics.namesOfGroupsPartiesAnd" = "I nomi di gruppi, partiti e oggetti in votazione sono pubblicati in tutte e quattro le lingue nazionali oltre che in romancio; le tabelle di questa pagina seguono quindi la preferenza linguistica del tuo browser e ripiegano sull'inglese, poi sul tedesco, dove manca una traduzione. I nomi di persona non portano alcuna etichetta di lingua e sono mostrati così come registrati."
"page.politics.nationalCouncilElection" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Fnational-council-election\">national-council-election</a>"
"page.politics.oneGraphInThisTheme" = "Un grafo di questo tema è modellato in modo nettamente diverso dagli altri. Gli <strong>interventi parlamentari</strong> — mozioni, postulati e interpellanze con cui i parlamentari chiedono formalmente al governo di agire — usano l'<a href=\"https://ch.paf.link\" target=\"_blank\" rel=\"noopener\">ontologia PAF</a>, un modello attività-entità mutuato dai vocabolari di provenienza anziché dalle forme cube o schema.org usate ovunque altrove. Ogni intervento è un'entità; ogni fase della sua trattazione è un'attività con il proprio testo di stato emesso dall'amministrazione."
"page.politics.pafHttpsChPafLink" = "PAF — <code>https://ch.paf.link/</code>, l'unico modello non-cube di questo tema"
"page.politics.parliamentariansPartiesGroupsCommitteesLobby" = "Parlamentari, partiti, gruppi, commissioni, legami d'interesse, membri del governo, uffici e commissioni — modellati come appartenenze <code>schema:Role</code> datate"
"page.politics.parliamentaryBusiness" = "Affari parlamentari"
"page.politics.parliamentaryBusiness2" = "<strong>Affari parlamentari</strong>"
"page.politics.peopleInstitutions" = "<strong>Persone e istituzioni</strong>"
"page.politics.petitions" = "Petizioni"
"page.politics.politicsGovernment" = "Politica & governo"
"page.politics.popularVotePopularVoteStat" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Fpopular-vote\">popular-vote</a>, <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Fpopular-vote-stat\">popular-vote-stat</a>, <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Fpopular-initiative\">popular-initiative</a>, <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Fpopular-initiative-stat\">popular-initiative-stat</a>, <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Freferendum\">referendum</a>, <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Freferendum-stat\">referendum-stat</a>, <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Fpetition\">petition</a>"
"page.politics.popularVotesFrom1848Initiatives" = "Votazioni popolari dal 1848; iniziative dal 1891; date di votazione future incluse"
"page.politics.proceduralRequest" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Fprocedural-request\">procedural-request</a>"
"page.politics.publisher" = "Editore"
"page.politics.seventeenGraphsGroupedByWhat" = "Diciassette grafi, raggruppati in base alla loro finalità. Tutti sono pubblicati dalla Cancelleria federale e portano il prefisso <code>https://lindas.admin.ch/fch/</code>."
"page.politics.size" = "Dimensione"
"page.politics.statusTextsArePublishedIn" = "I testi di stato sono pubblicati in tedesco, francese e italiano e seguono qui la lingua del tuo browser. Un singolo intervento ne porta di norma diversi nel corso della procedura, per cui lo stesso titolo può comparire più volte — ogni riga è un rapporto sullo stato di quell'intervento, non un intervento."
"page.politics.swissCitizensDoNotOnly" = "I cittadini svizzeri non eleggono soltanto un parlamento; votano sulle leggi stesse, più volte all'anno. Due strumenti sottopongono una domanda al popolo, e distinguerli è la cosa più utile da capire di questi dati — vanno in direzioni opposte."
"page.politics.theDatasets" = "I set di dati"
"page.politics.thePartyRegisterHoldsOnly" = "Il registro dei partiti contiene solo poche decine di righe e viene aggiornato unicamente su richiesta di un partito"
"page.politics.theQuietestInstrumentAndThe" = "Lo strumento più silenzioso, e l'unico aperto a tutti — nessuna soglia di firme, nessun requisito di cittadinanza, nessuna età minima. Chiunque può rivolgere una petizione alle autorità federali, che sono tenute a prenderne atto ma non ad agire."
"page.politics.thisThemeBringsTogetherEverything" = "Questo tema riunisce tutto ciò che la <strong>Cancelleria federale</strong> pubblica sulla politica svizzera e copre due tipi di materiale molto diversi. Il primo è <strong>ciò che i cittadini hanno deciso</strong>: ogni votazione popolare, iniziativa popolare e referendum dal 1848 — la domanda posta, il giorno della votazione, l'esito e il voto di ciascun Cantone. Il secondo è <strong>chi governa</strong>: i parlamentari e i loro partiti, il Governo federale e i suoi dipartimenti, gli uffici che ne dipendono e i lobbisti con accesso a Palazzo federale."
"page.politics.threeFurtherRegistersDescribeThe" = "Altri tre registri descrivono l'esecutivo. Il grafo <strong>Consiglio federale</strong> copre il governo a sette membri dal 1848 — consiglieri federali, cancellieri, quale dipartimento ciascuno ha diretto, chi è stato presidente in quale anno, e una curiosità presente in pochi set di dati nazionali: le persone <em>elette che hanno rifiutato</em>. L'<strong>Annuario federale</strong> (Staatskalender) è il repertorio delle autorità e elenca gli uffici con i loro indirizzi postali e il personale. Le <strong>commissioni extraparlamentari</strong> coprono gli organi di esperti che consigliano l'amministrazione dall'esterno."
"page.politics.togetherTheyAnswerTheTwo" = "Insieme rispondono alle due domande con cui di solito ci si avvicina — <em>su cosa ha votato la Svizzera e come è andata a finire?</em> e <em>chi ricopre oggi quale carica?</em> Le sezioni seguenti percorrono entrambe, cominciando da come nasce una votazione."
"page.politics.vocabulary" = "Vocabolario"
"page.politics.whereTheCubesAboveCount" = "Dove i cubi qui sopra contano voti, questa famiglia di grafi nomina persone. <strong>Curia Vista</strong> è il registro parlamentare: ogni membro dell'Assemblea federale, vivente o defunto, con il suo partito, il suo gruppo parlamentare, le commissioni di cui ha fatto parte e le date esatte di ogni mandato. Poiché le appartenenze sono modellate come <a href=\"/resource?iri=http%3A%2F%2Fschema.org%2FRole\">ruoli</a> datati anziché come semplici collegamenti, è possibile ricostruire la composizione del parlamento a qualsiasi data."
"page.politics.whoGovernsPeopleAndInstitutions" = "Chi governa: persone e istituzioni"

# ── Page: mobility ────────────────────────────────────────────────
"page.mobility.17MillionTriples18" = "~1,7 milioni di triple — 18 cubi, 3 soggetti"
"page.mobility.300Triples15Classes48" = "~300 triple — 15 classi, 48 proprietà"
"page.mobility.73MillionTriplesThe" = "~7,3 milioni di triple — il più grande di questo tema"
"page.mobility.983000Triples" = "~983 000 triple"
"page.mobility.aFurtherStopsAreRecorded" = "Altre <span hx-get=\"/api/metric/mobilityMode-unknown\" hx-trigger=\"load\" hx-swap=\"innerHTML\"> <span class=\"spinner-border spinner-border-sm text-muted\" role=\"status\"></span> </span> fermate sono registrate con un mezzo di trasporto <em>sconosciuto</em>, e le fermate servite da più mezzi sono contate una volta per mezzo: le cifre qui sopra sommano quindi a più del totale delle fermate."
"page.mobility.aboutThisTheme" = "Informazioni su questo tema"
"page.mobility.airTrafficMovements" = "Movimenti aerei"
"page.mobility.anAllianceVerbundIsA" = "Un'<a href=\"/resource?iri=https%3A%2F%2Flod.opentransportdata.swiss%2Fvocab%2FAlliance\">Alliance</a> (<em>Verbund</em>) è una comunità tariffaria regionale — l'ente il cui piano delle zone si applica dove state viaggiando. La maggior parte delle persone in Svizzera possiede un abbonamento emesso da una di esse."
"page.mobility.annualMovementsPerAerodromeBy" = "Movimenti annuali per aerodromo, per categoria. Un movimento è un singolo decollo <em>o</em> atterraggio — un volo di andata e ritorno conta doppio."
"page.mobility.bazlAdminCh" = "<a href=\"https://www.bazl.admin.ch\" target=\"_blank\" rel=\"noopener\">bazl.admin.ch</a>"
"page.mobility.byAirCivilAviation" = "In volo: l'aviazione civile"
"page.mobility.civilAviationStatistics" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffoca%2Fcube\">Statistiche dell'aviazione civile</a>"
"page.mobility.classesInTheNOVAGraph" = "Classi del grafo NOVA"
"page.mobility.contents" = "Contenuto"
"page.mobility.dataset" = "Set di dati"
"page.mobility.earlierVersionsOfEachCube" = "Le versioni precedenti di ciascun cubo restano pubblicate e sono raggiungibili dall'<a href=\"/resource?iri=https%3A%2F%2Fcube.link%2FCube\">elenco dei cubi</a>; è presente anche una vecchia serie <em>Air traffic statistics movements</em>."
"page.mobility.everyStopInTheRegister" = "Ogni fermata del registro porta un mezzo di trasporto, e la distribuzione di questi valori racconta la Svizzera meglio di qualsiasi sintesi. Gli autobus dominano di un ordine di grandezza, come ovunque. Ciò che è particolare è il terzo gruppo qui sotto: funivie, seggiovie, funicolari e ferrovie a cremagliera non sono attrazioni turistiche archiviate in un registro separato — figurano nello stesso registro nazionale dei tram di Zurigo, con lo stesso tipo di identificatore, perché in Svizzera una funivia che sale su una montagna è semplicemente trasporto pubblico."
"page.mobility.fareNetworks" = "Comunità tariffarie"
"page.mobility.focaFederalOfficeOfCivil" = "UFAC — Ufficio federale dell'aviazione civile"
"page.mobility.fourLINDASGraphsDescribeHow" = "Quattro grafi LINDAS descrivono come ci si sposta in Svizzera. Non sono quattro set di dati indipendenti — si sovrappongono. Il <strong>registro dei punti di servizio (DiDok)</strong> contiene i <em>luoghi</em>: ogni fermata, stazione, imbarcadero e stazione di funivia del Paese. <strong>NOVA</strong> contiene i <em>prezzi</em> tra questi luoghi. L'<strong>Open Transport Data schema</strong> è il <em>dizionario</em> che definisce i termini usati da entrambi. Accanto a essi, l'<strong>Ufficio federale dell'aviazione civile</strong> pubblica statistiche aeronautiche, che stanno da sole."
"page.mobility.landingPage" = "Pagina di destinazione"
"page.mobility.mobilityTransport" = "Mobilità & trasporti"
"page.mobility.mountain" = "Montagna"
"page.mobility.movementsPassengersAndPassengerRights" = "Movimenti, passeggeri e segnalazioni sui diritti dei passeggeri per anno e aerodromo"
"page.mobility.namedGraph" = "Grafo denominato"
"page.mobility.novaDescribesSwissPublicTransport" = "NOVA descrive la tariffazione dei trasporti pubblici svizzeri ed è di gran lunga il grafo più grande di questo tema. Non contiene orari né prezzi dei biglietti consultabili direttamente; contiene il <em>meccanismo</em> che produce un prezzo. Questo meccanismo esiste in due varianti, ed è la chiave per leggere l'elenco di classi qui sotto."
"page.mobility.novaFareData" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Fsbb%2Fnova\">Dati tariffari NOVA</a>"
"page.mobility.openTransportDataSchema" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Fsbb%2Fotd-schema\">Open Transport Data schema</a>"
"page.mobility.opentransportdataSwiss" = "<a href=\"https://opentransportdata.swiss\" target=\"_blank\" rel=\"noopener\">opentransportdata.swiss</a>"
"page.mobility.passengerRights" = "Diritti dei passeggeri"
"page.mobility.passengers" = "Passeggeri"
"page.mobility.passengersAtAerodromesAndMountain" = "Passeggeri negli aerodromi e nelle aree di atterraggio in montagna — quest'ultima una categoria di campo d'aviazione di cui pochi Paesi hanno bisogno."
"page.mobility.publisher" = "Editore"
"page.mobility.reportsFiledByAirPassengers" = "Segnalazioni presentate ogni anno dai passeggeri aerei. L'UFAC dà seguito a quelle di sua competenza; le segnalazioni non firmate o incomplete vengono chiuse automaticamente dopo sei mesi."
"page.mobility.roadRail" = "Strada e ferrovia"
"page.mobility.roughlyHalfOfThisVocabulary" = "Circa metà di questo vocabolario è tedesco non tradotto; le descrizioni qui sotto provengono quindi dall'Open Transport Data schema e vale la pena leggerle come un glossario: <em>Tarifwertpreisauspraegung</em> e <em>Relationsgebiet</em> non si spiegano da sé a nessuno."
"page.mobility.sbbSwissFederalRailways" = "FFS — Ferrovie federali svizzere"
"page.mobility.servicePointsDiDok" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Fsbb%2Fdidok\">Punti di servizio (DiDok)</a>"
"page.mobility.size" = "Dimensione"
"page.mobility.sparqlEndpoint" = "Endpoint SPARQL"
"page.mobility.stops" = "fermate"
"page.mobility.stopsWithCoordinatesElevationCanton" = "Fermate con coordinate, altitudine, Cantone, Comune e operatore; collegate a <code>geo.ld.admin.ch</code> tramite <code>owl:sameAs</code>"
"page.mobility.theDatasets" = "I set di dati"
"page.mobility.theFederalOfficeOfCivil" = "L'Ufficio federale dell'aviazione civile (UFAC / BAZL) pubblica le sue statistiche come <a href=\"/resource?iri=https%3A%2F%2Fcube.link%2FCube\">cubi di dati</a>. Il grafo ne contiene diciotto, ma questa cifra esagera la varietà: sono versioni ripubblicate di soli tre soggetti. Le schede qui sotto rimandano alla versione attuale di ciascuno."
"page.mobility.theNetworkWhereYouCan" = "La rete: dove si può andare"
"page.mobility.theOpenTransportDataSchema" = "L'Open Transport Data schema è minuscolo — qualche centinaio di triple — ma definisce i termini in cui sono scritti i sette milioni di triple di NOVA. È la stele di Rosetta di tutto quanto precede."
"page.mobility.theVocabulary" = "Il vocabolario"
"page.mobility.theVocabularyUnderpinningDiDokAnd" = "Il vocabolario su cui si fondano DiDok e NOVA"
"page.mobility.usedByTheRegionalFare" = "Usato dalle comunità tariffarie regionali. Le fermate sono raggruppate in una <a href=\"/resource?iri=https%3A%2F%2Flod.opentransportdata.swiss%2Fvocab%2FZone\">Zone</a>, le zone riunite in uno <a href=\"/resource?iri=https%3A%2F%2Flod.opentransportdata.swiss%2Fvocab%2FZoningPlan\">ZoningPlan</a> (una regione può gestirne più d'uno — uno per gli abbonamenti, un altro per le corse singole), e il prezzo deriva da quante zone si attraversano."
"page.mobility.usedForJourneysAcrossThe" = "Usato per i viaggi sulla rete nazionale. Una <a href=\"/resource?iri=https%3A%2F%2Flod.opentransportdata.swiss%2Fvocab%2FRelation\">Relation</a> è un collegamento tariffato tra due fermate, e una <a href=\"/resource?iri=https%3A%2F%2Flod.opentransportdata.swiss%2Fvocab%2FPreistabelle\">Preistabelle</a> (tabella dei prezzi) assegna la tariffa. Con oltre mezzo milione di relazioni, è qui che risiede la maggior parte del grafo."
"page.mobility.waterOther" = "Acqua e altro"
"page.mobility.whatItCostsTheNOVA" = "Quanto costa: il modello tariffario NOVA"
"page.mobility.zonePlansFareNetworksPriced" = "Piani di zone, comunità tariffarie, relazioni tariffate e tabelle di prezzo"

