# ── Page: agriculture ─────────────────────────────────────────────────
"page.agriculture.aboutThisTheme" = "Informazioni su questo tema"
"page.agriculture.agriculture" = "Agricoltura"
"page.agriculture.animalDiseaseCoverage" = "Aggiornato in continuo; singoli focolai georeferenziati a comune e cantone"
"page.agriculture.animalDiseaseGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffsvo%2Fanimaldisease\">fsvo/animaldisease</a>"
"page.agriculture.animalDiseaseGroup" = "<strong>Notifica delle epizoozie</strong>"
"page.agriculture.animalDiseaseIntro" = "Il set di dati sulle epizoozie è il più immediato di questo tema: un <strong>registro dei casi</strong> in cui ogni riga corrisponde a un focolaio notificato in un'azienda, con la data della diagnosi, la specie animale, il cantone e il comune, nonché il numero di animali dell'effettivo malati, infetti, abbattuti o morti. Viene aggiornato in continuo; le diagnosi più recenti risalgono di norma a pochi giorni."
"page.agriculture.animalDiseaseSize" = "Un cubo, ~58 000 notifiche di casi"
"page.agriculture.animalHealth" = "La malattia nella stalla"
"page.agriculture.biologicalAgents" = "Si osservi la metà inferiore della tabella. Accanto a erbicidi e fungicidi, il registro elenca <strong>insetti utili, acari predatori e nematodi</strong> come prodotti fitosanitari autorizzati a pieno titolo — agenti di lotta biologica omologati sulla stessa base di un trattamento chimico, con gli stessi numeri di omologazione e gli stessi titolari dell'autorizzazione."
"page.agriculture.bluetongueStory" = "Interrogando i dati per malattia emerge la storia recente del patrimonio zootecnico svizzero. L'epizoozia della <strong>febbre catarrale ovina</strong> iniziata nell'agosto 2024 domina tutto il resto di un ordine di grandezza e ha raggiunto praticamente ogni cantone; segue la <strong>zoppina</strong>, che riflette il programma nazionale di eradicazione che obbliga le aziende a notificarla. Più in basso figurano le malattie endemiche di fondo, con qualche decina di casi all'anno."
"page.agriculture.cantonCountCaveat" = "La colonna dei cantoni può indicare 27 anziché 26: il registro utilizza un codice distinto per il Principato del Liechtenstein, che fa parte dello spazio veterinario svizzero. Si noti inoltre che un caso è una <em>notifica</em>, non un animale — una riga può riguardare un intero effettivo colpito, e i conteggi dell'effettivo e dei malati riportati sull'osservazione ne indicano il numero."
"page.agriculture.caveat" = "Avvertenza"
"page.agriculture.contents" = "Contenuto"
"page.agriculture.coverage" = "Copertura"
"page.agriculture.cropsIntro" = "Due grafi di questo tema non contengono alcuna misurazione. <strong>Crops</strong> è una vera e propria ontologia OWL delle piante coltivate in Svizzera — diverse centinaia di tipi di coltura organizzati tramite <code>rdfs:subClassOf</code>, con assiomi <code>owl:disjointWith</code> che stabiliscono che una particella non può essere due cose contemporaneamente, e con classi obsolete conservate affinché i dati più vecchi restino risolvibili. Soprattutto è <em>sfaccettata</em>: la stessa pianta compare come coltura fitosanitaria, come coltura del bilancio dei nutrienti e come coltura per i pagamenti diretti, perché i tre regimi normativi suddividono il mondo vegetale in modo diverso. <strong>Inspections</strong> è la lista di controllo corrispondente — i singoli punti che un ispettore verifica durante una visita aziendale, raggruppati in raccolte."
"page.agriculture.cropsLabelCaveat" = "I nomi delle colture non recano <strong>alcun tag di lingua</strong>: <em>Zuckerrüben</em>, <em>Betteraves sucrières</em> e <em>Barbabietole da zucchero</em> sono tre letterali privi di tag sulla stessa risorsa, e l'inglese manca del tutto. Una coltura può quindi presentarsi con la grafia che il resolver incontra per prima, e un filtro linguistico con <code>lang()</code> le scarta tutte senza eccezione. Lo stesso schema si ritrova nei nomi delle sostanze del registro fitosanitario."
"page.agriculture.crossLinks" = "I grafi si appoggiano a dati di riferimento condivisi anziché ripeterli: i luoghi dei focolai si risolvono nei cantoni e comuni <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Fterritorial\">territoriali</a>, le osservazioni di mercato indicano l'ufficio di rilevazione tramite <code>cube:observedBy</code> che punta a organizzazioni dello <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Fstaatskalender\">Staatskalender</a>, e il tempo è espresso con le risorse <code>ld.admin.ch/time/</code> comuni alla piattaforma. Un ulteriore grafo dell'USAV, <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffsvo%2Fcube\">fsvo/cube</a>, si colloca tra questo tema e quello della <a href=\"/health.html\">salute</a> — contiene il controllo delle carni e il controllo delle derrate alimentari accanto alle statistiche sulla sperimentazione animale, ed è pubblicato sotto uno spazio dei nomi <code>health.ld.admin.ch</code>."
"page.agriculture.datasetsIntro" = "Sette grafi denominati di tre editori, quasi tutti sotto lo spazio dei nomi di vocabolario <code>https://agriculture.ld.admin.ch/</code>, anche laddove l'editore è l'ufficio veterinario e non quello dell'agricoltura."
"page.agriculture.eggs" = "Le uova, e quanto costa il sistema di allevamento"
"page.agriculture.eggsIntro" = "Le uova illustrano nel modo più chiaro la dimensione <strong>sistema di produzione</strong>. Un uovo della stessa pezzatura è prezzato separatamente per l'allevamento biologico, all'aperto e a terra, e lo scarto tra i sistemi è ampio e stabile — all'incirca il doppio dal sistema più economico al biologico. Poiché il sistema di allevamento è una dimensione codificata e non parte del nome del prodotto, il sovrapprezzo si ottiene con una sottrazione e non confrontando manualmente due diciture."
"page.agriculture.foagPublisher" = "Ufficio federale dell'agricoltura (UFAG)"
"page.agriculture.fsvoPublisher" = "Ufficio federale della sicurezza alimentare e di veterinaria (USAV)"
"page.agriculture.group" = "Gruppo"
"page.agriculture.groupLabelCaveat" = "I nomi dei gruppi di prodotti tornano in <em>lingue miste</em> — <code>Vegetables</code> e <code>Fruits</code> accanto a <code>Rohmilch</code>, <code>Käse</code> e <code>Rahm</code>. Per quelli tedeschi manca semplicemente un'etichetta inglese nel registro, così il resolver ripiega su ciò che esiste. Le risorse in sé sono perfettamente formate; disomogenea è soltanto la denominazione."
"page.agriculture.groupStageIntro" = "Incrociando i gruppi di prodotti con queste fasi si vede dove l'ufficio concentra le rilevazioni. Frutta e verdura dominano e sono misurate in larghissima parte al consumo — una rilevazione settimanale dei prezzi al dettaglio su un centinaio di articoli. Il latte presenta l'immagine opposta: la maggior parte delle sue righe si colloca alla produzione, perché il prezzo del latte alla stalla è di per sé una grandezza politicamente osservata."
"page.agriculture.intro" = "Qui pubblicano tre uffici federali che insieme seguono le derrate alimentari lungo tutto il loro percorso. L'<strong>Ufficio federale dell'agricoltura</strong> osserva il mercato — quanto rende un prodotto in ciascuna fase, dalla stalla alla cassa. L'<strong>Ufficio federale della sicurezza alimentare e di veterinaria</strong> copre le due cose che possono andare storte: i parassiti nel campo e la malattia nella stalla. <strong>Agroscope</strong>, il centro di ricerca agronomica della Confederazione, contribuisce con una piccola serie di ricerca."
"page.agriculture.marketDataCaveat" = "Le osservazioni portano <strong>20 dimensioni</strong>, tutte IRI. Potente, ma una query che omette una dimensione vi aggrega silenziosamente sopra — verificate sempre quale sezione avete effettivamente selezionato"
"page.agriculture.marketDataContents" = "Latte e latticini, frutta/verdura/patate, uova, carne, cereali panificabili, semi oleosi, colture proteiche, alimenti per animali"
"page.agriculture.marketDataGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffoag%2Fagricultural-market-data\">foag/agricultural-market-data</a>"
"page.agriculture.marketDataGroup" = "<strong>Dati del mercato agricolo</strong>"
"page.agriculture.marketDataShape" = "Una griglia regolare di <em>gruppo di prodotti × fase della catena del valore × misura × frequenza</em> — p. es. <code>Eggs/Production_Price_Month</code>, <code>MilkDairyProducts/Consumption_Price_Year</code>"
"page.agriculture.marketDataSize" = "49 cubi, ~180 000 osservazioni, ~1 700 prodotti distinti"
"page.agriculture.metaTitle" = "Agricoltura & alimentazione"
"page.agriculture.milk" = "Il prezzo del latte, in Svizzera e all'estero"
"page.agriculture.milkIntro" = "Il latte è il prodotto meglio documentato del tema, e il suo cubo mensile dei prezzi alla produzione contiene qualcosa di insolito: accanto ai dati svizzeri riporta <strong>il prezzo dello stesso mese in Germania, Francia, Austria, Italia, nell'UE nel suo complesso, negli Stati Uniti e in Nuova Zelanda</strong>. Le serie internazionali sono normali prodotti dello stesso cubo, per cui un prezzo interno e il suo riferimento estero si confrontano senza uscire dal set di dati."
"page.agriculture.milkSegments" = "Le righe svizzere sono suddivise per <strong>segmento</strong> — A per il latte destinato ai mercati interni protetti, B per i prodotti d'esportazione esposti alla concorrenza, C per la parte residua venduta ai prezzi mondiali. I tre si collocano su livelli realmente diversi, e proprio la distanza tra loro è il senso di questa segmentazione."
"page.agriculture.milkUnitCaveat" = "I prezzi si intendono per 100 kg in franchi svizzeri, salvo diversa indicazione del prodotto, e le serie estere sono convertite in franchi dall'ufficio — i loro movimenti mescolano quindi una variazione di prezzo reale e una variazione di cambio. Ogni riga porta le proprie dimensioni <code>unit</code> e <code>currency</code>; aprite un'osservazione per vedere esattamente che cosa è stato misurato."
"page.agriculture.namedGraph" = "Grafo denominato"
"page.agriculture.plantProtection" = "Che cosa è omologato per essere irrorato"
"page.agriculture.plantProtectionContents" = "Il registro federale dei prodotti fitosanitari: omologazioni, titolari dell'autorizzazione, sostanze attive, indicazioni coltura/organismo nocivo, importazioni parallele, termini di smaltimento"
"page.agriculture.plantProtectionGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffsvo%2Fplant-protection-products\">fsvo/plant-protection-products</a>"
"page.agriculture.plantProtectionGroup" = "<strong>Prodotti fitosanitari</strong>"
"page.agriculture.plantProtectionIntro" = "Il registro dei prodotti fitosanitari è l'elenco completo dei pesticidi che un agricoltore svizzero può applicare legalmente, ed è un registro e non una statistica — ogni prodotto omologato, il suo numero federale di omologazione, l'azienda titolare dell'autorizzazione, le sue sostanze attive e le combinazioni precise di coltura e organismo nocivo per cui è ammesso. È l'unico set di dati del tema con effettiva portata normativa: se un prodotto non figura qui, il suo impiego è illecito."
"page.agriculture.plantProtectionSize" = "~2 400 prodotti omologati, ~7 900 indicazioni, ~450 sostanze, 24 categorie di prodotto"
"page.agriculture.plantProtectionStructure" = "Vale la pena soffermarsi sulla struttura. Un prodotto porta <strong>indicazioni</strong> — a migliaia —, e ogni indicazione è una tripletta precisa di coltura, organismo nocivo e dose; per questo il registro contiene diverse volte più indicazioni che prodotti. I prodotti ritirati non vengono cancellati ma ricevono una <code>soldOutDeadline</code> e una <code>exhaustionDeadline</code>: le date entro cui le scorte devono lasciare gli scaffali ed essere esaurite. Il registro documenta così anche l'uscita dal mercato, non solo l'autorizzazione."
"page.agriculture.publisher" = "Editore"
"page.agriculture.referenceCaveat" = "Questi sono vocabolari, non statistiche — <code>foag/crops</code> è un'ontologia OWL e non contiene quasi alcuna osservazione"
"page.agriculture.referenceContents" = "Ontologia delle colture (~740 tipi di coltura), punti di controllo delle ispezioni aziendali (~3 950), la carta di riferimento del sistema agricolo e un piccolo cubo di ricerca Agroscope"
"page.agriculture.referenceData" = "I vocabolari sottostanti"
"page.agriculture.referenceGraphs" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffoag%2Fcrops\">foag/crops</a>, <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffoag%2Finspections\">foag/inspections</a>, <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffoag%2Fsystem-map\">foag/system-map</a>, <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Fagroscope%2Fcube\">agroscope/cube</a>"
"page.agriculture.referenceGroup" = "<strong>Vocabolari di riferimento e ricerca</strong>"
"page.agriculture.shape" = "Struttura"
"page.agriculture.size" = "Dimensione"
"page.agriculture.stageConsumption" = "Consumo"
"page.agriculture.stageConsumptionDesc" = "Lo scaffale del negozio. Di gran lunga la parte più consistente di questo set di dati."
"page.agriculture.stageProduction" = "Produzione"
"page.agriculture.stageProductionDesc" = "L'azienda agricola. Quanto riceve effettivamente il produttore, prima che la merce passi in altre mani."
"page.agriculture.stageTrade" = "Importazione & esportazione"
"page.agriculture.stageTradeDesc" = "Quantità e prezzi transfrontalieri — il metro con cui si leggono i dati interni."
"page.agriculture.stageWholesale" = "Commercio all'ingrosso / trasformazione"
"page.agriculture.stageWholesaleDesc" = "Il caseificio, il mulino, il macello. Dove la materia prima diventa prodotto."
"page.agriculture.stagesIntro" = "Ogni osservazione di mercato è contrassegnata dalla fase della catena a cui appartiene. Le fasi sono una dimensione codificata e non testo libero, così un prezzo non è mai ambiguo riguardo alla mano in cui è stato misurato."
"page.agriculture.subtitle" = "Che cosa producono le aziende agricole svizzere e quanto costa in ogni fase, dal campo allo scaffale — e che cosa protegge la coltura e l'effettivo."
"page.agriculture.theDatasets" = "I set di dati"
"page.agriculture.theValueChain" = "Dall'azienda agricola alla cassa"
"page.agriculture.title" = "Agricoltura & alimentazione"
"page.agriculture.valueChainIdea" = "L'idea ordinatrice dei dati di mercato è la <strong>catena del valore</strong>. Lo stesso prodotto è prezzato separatamente alla produzione, al commercio all'ingrosso e alla trasformazione, all'ingrosso per la ristorazione e al consumo — cui si aggiungono importazione ed esportazione. È questo a rendere singolare il tema: per il latte, le uova o un chilo di carote si può seguire lo <em>stesso</em> bene attraverso ogni mano che lo tocca e vedere dove sta il margine, invece di confrontare un prezzo alla stalla con un prezzo al negozio provenienti da due fonti scollegate."

# ── Page: energy ──────────────────────────────────────────────────────
"page.energy.aboutThisTheme" = "Informazioni su questo tema"
"page.energy.aidFee" = "Supplemento rete"
"page.energy.aidFeeDesc" = "Il tributo federale a sostegno delle energie rinnovabili. Fissato a livello nazionale, è quindi identico in ogni riga di un dato anno."
"page.energy.buildingsAndScenarios" = "Edifici e scenari"
"page.energy.buildingsScenariosIntro" = "Altre due famiglie completano il patrimonio dell'UFE. Il <strong>Programma Edifici</strong> (<em>Gebäudeprogramm</em>) documenta gli incentivi al risanamento in quattro cubi paralleli — domande sostenute, franchi versati, energia risparmiata e CO₂ evitata, ogni volta per categoria di misura e anno di rendiconto —, così che costo ed effetto dello stesso programma si leggano affiancati. Le <strong>Prospettive energetiche 2050+</strong> sono di natura diversa: non un resoconto di ciò che è accaduto, ma un insieme di <em>scenari modellizzati</em> su come la Svizzera raggiunge il saldo netto zero, con varianti sulla durata di esercizio delle centrali nucleari e sul saldo delle importazioni. I loro numeri sono proiezioni, non osservazioni."
"page.energy.cantonComparisonIntro" = "Ordinata per cantone, la forbice è tanto ampia che il più economico e il più caro non sono più paragonabili — e la scomposizione mostra il perché. Alcuni cantoni sono cari per la componente energia, altri per l'utilizzazione della rete; il supplemento rete è ovunque uguale e non spiega quindi mai una differenza. I dati seguenti si riferiscono al <strong>profilo H4</strong> (appartamento di 5 locali con cucina elettrica, circa 4500 kWh all'anno) per il prodotto standard."
"page.energy.cantonLabelsUntagged" = "I nomi dei cantoni in LINDAS non recano <em>alcun tag di lingua</em> — Zug, Zoug e Zugo sono tre letterali privi di tag sulla stessa risorsa — cosicché un cantone può comparire con la grafia che il resolver delle etichette incontra per prima. In ogni caso si intende la stessa risorsa."
"page.energy.caveat" = "Avvertenza"
"page.energy.communityCharge" = "Tributi agli enti pubblici"
"page.energy.communityChargeDesc" = "Tributi locali trasferiti dal comune. Nulli per molti gestori, considerevoli per alcuni."
"page.energy.consumptionProfiles" = "Profili di consumo"
"page.energy.contents" = "Contenuto"
"page.energy.coverage" = "Copertura"
"page.energy.crossLinks" = "Entrambi i grafi rimandano all'esterno anziché duplicare i dati di riferimento: comuni e cantoni si risolvono nel <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffso%2Fregister\">registro dell'UST</a>, i gestori di rete portano l'IDI usato anche da <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffoj%2Fzefix\">Zefix</a>, i vettori energetici provengono da una <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Fcube%2Fdimension\">dimensione di cubo condivisa</a>, e gli uffici editori sono le stesse risorse <code>ld.admin.ch/office</code> usate su tutta la piattaforma."
"page.energy.datasetsIntro" = "Due grafi denominati, entrambi sotto lo spazio dei nomi di vocabolario <code>https://energy.ld.admin.ch/</code>, che insieme formano il terzo tema di LINDAS per numero di triple."
"page.energy.elcomContents" = "Tariffe per gestore, mediane per cantone e per la Svizzera, oltre ai cubi di indicatori regolatori <em>Sunshine</em>"
"page.energy.elcomCoverage" = "Dal 2011 al 2026, una riga per gestore × profilo × prodotto × anno"
"page.energy.elcomPublisher" = "Commissione federale dell'energia elettrica (ElCom)"
"page.energy.elcomSize" = "~24 milioni di triple — 7 cubi, ~772 000 osservazioni"
"page.energy.electricityTariffs" = "<strong>Tariffe dell'elettricità</strong>"
"page.energy.electricitypriceGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Felcom%2Felectricityprice\">elcom/electricityprice</a>"
"page.energy.energy" = "Energia"
"page.energy.energyBalanceIntro" = "La <strong>statistica globale svizzera dell'energia</strong> risale al 1980 e indica il consumo in terajoule all'anno, ripartito per vettore energetico. I vettori provengono da una dimensione LINDAS condivisa e non da testo libero, e sono annidati: <em>rinnovabile</em> si suddivide in legna, forza idrica e altre rinnovabili, <em>non rinnovabile</em> in combustibili nucleari, prodotti petroliferi, gas, carbone e rifiuti. Poiché la gerarchia è nei dati, totali e componenti si interrogano dallo stesso cubo senza doppi conteggi — a condizione di scegliere un solo livello."
"page.energy.energyComponent" = "Energia"
"page.energy.energyComponentDesc" = "L'elettricità stessa. L'unica parte esposta alla concorrenza, e quella che è schizzata verso l'alto dopo il 2022."
"page.energy.energyStatisticsGroup" = "<strong>Statistiche dell'energia</strong>"
"page.energy.everyTariffIsBrokenIntoFour" = "Ogni tariffa di questo cubo è scomposta in <strong>quattro componenti</strong>, e il modello lo dichiara esso stesso: la misura totale porta collegamenti <code>schema:hasPart</code> verso ciascuna parte, così che la scomposizione si legga dai dati e non da un manuale. Questo conta, perché le parti si comportano in modo molto diverso — una sola di esse è l'elettricità."
"page.energy.gridUsage" = "Utilizzazione della rete"
"page.energy.gridUsageDesc" = "Il trasporto sulla rete locale. Un monopolio naturale, e spesso la quota singola più elevata."
"page.energy.group" = "Gruppo"
"page.energy.metaTitle" = "Energia"
"page.energy.namedGraph" = "Grafo denominato"
"page.energy.operatorTableIntro" = "Sotto le mediane cantonali stanno i gestori stessi. Ognuno è un'<a href=\"/resource?iri=http%3A%2F%2Fschema.org%2FOrganization\">organizzazione schema.org</a> con indirizzo postale, sito web e — assai utilmente — un <strong>numero d'identificazione delle imprese</strong>, lo stesso IDI usato dal registro di commercio <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffoj%2Fzefix\">Zefix</a>. È proprio questo identificatore condiviso a permettere di collegare una tariffa alla persona giuridica che vi sta dietro."
"page.energy.operatorTariffCaveat" = "Un gestore può servire più comuni a tariffe diverse; le colonne dei prezzi mostrano una riga rappresentativa e non una media — per il quadro completo si consulti la pagina della risorsa del gestore. Alcuni gestori pubblicano una tariffa identica su tutto il loro territorio, altri no."
"page.energy.profileDescriptionCaveat" = "Le descrizioni dei profili sono pubblicate <strong>solo in tedesco</strong> — a differenza dei nomi dei cubi e delle dimensioni, che esistono nelle quattro lingue nazionali — e compaiono quindi qui così come le registra l'ElCom, indipendentemente dalla lingua impostata. Si noti anche l'apostrofo che contengono: è il separatore svizzero delle migliaia (<code>4'500</code>), non una virgoletta."
"page.energy.profilesDefinitions" = "Ogni profilo è un concetto SKOS a sé stante e porta con sé la propria definizione: un consumo di riferimento in chilowattora all'anno e una descrizione dell'economia domestica o dell'azienda che rappresenta. È questo a rendere significativo il confronto qui sotto — <strong>H4</strong> e <strong>H3</strong> consumano entrambi 4500 kWh all'anno, ma H3 è un appartamento di 4 locali con scaldacqua elettrico mentre H4 è un appartamento di 5 locali con asciugatrice e senza scaldacqua; i due sono quindi prezzati rispetto a clienti realmente diversi e non a un'etichetta arbitraria."
"page.energy.profilesIntro" = "I prezzi non sono mai indicati per un unico cliente astratto. L'ElCom definisce quindici profili standard — <strong>H1–H8</strong> per le economie domestiche, dall'appartamento di 2 locali alla grande casa unifamiliare con pompa di calore, e <strong>C1–C7</strong> per le aziende, dalla piccola officina allo stabilimento industriale di media grandezza. Ogni profilo è prezzato separatamente da ogni gestore e in ogni anno: di qui provengono le 770 000 osservazioni, alcune centinaia di gestori moltiplicate per quindici profili, due prodotti e sedici anni."
"page.energy.publisher" = "Editore"
"page.energy.reservoirIntro" = "I bacini di accumulazione alpini sono la batteria del Paese, e il cubo sul <strong>grado di riempimento dei bacini</strong> è l'unica serie settimanale di questo tema — ogni domenica a mezzanotte si rileva quanti gigawattora sono immagazzinati rispetto alla capacità massima dei bacini. È un set di dati davvero operativo: durante il dibattito sull'approvvigionamento del 2022 era la cifra che tutti seguivano. Due particolarità della sua struttura vanno conosciute prima di interrogarlo. Le regioni non sono una dimensione bensì <em>colonne</em> distinte (<code>gr…</code> per i Grigioni, <code>ti…</code> per il Ticino), e la <strong>data di rilevazione non è affatto una proprietà</strong> — sopravvive solo all'interno dell'IRI dell'osservazione e va estratta dalla stringa prima di poter ordinare la serie."
"page.energy.sfoeCaveat" = "I 91 cubi corrispondono a circa 18 set di dati in molte versioni — prendete sempre l'IRI del cubo con il numero più alto, salvo che stiate confrontando le versioni"
"page.energy.sfoeContents" = "Statistica globale dell'energia, grado di riempimento dei bacini, incentivi al solare, Programma Edifici, statistiche della ricerca, mobilità condivisa, scenari 2050+"
"page.energy.sfoeGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Fsfoe%2Fcube\">sfoe/cube</a>"
"page.energy.sfoeIntro" = "L'Ufficio federale dell'energia pubblica un centinaio scarso di cubi, ma dietro di essi vi sono meno set di dati di quanto il numero lasci intendere: la maggior parte esiste in più <strong>versioni</strong>, ciascuna con una propria IRI di cubo che termina con un numero, e solo la più alta è aggiornata. Le quattro famiglie seguenti ne contengono la sostanza."
"page.energy.sfoePublisher" = "Ufficio federale dell'energia (UFE)"
"page.energy.sfoeSize" = "~31 milioni di triple — 91 cubi, ~1,9 milioni di osservazioni"
"page.energy.size" = "Dimensione"
"page.energy.solarIntro" = "La <strong>rimunerazione unica per gli impianti fotovoltaici</strong> (<em>Einmalvergütung</em>) è l'incentivo federale al solare sui tetti, e il suo cubo è il set di dati più direttamente confrontabile di questo tema: per cantone e per anno registra il numero di impianti, la potenza installata in chilowatt, i franchi versati — <em>e</em> le prime due grandezze rapportate a 100 000 abitanti. È quest'ultima coppia a permettere di confrontare un piccolo cantone con Zurigo senza fare i calcoli da sé."
"page.energy.subsidisedSolar" = "Il solare incentivato"
"page.energy.subtitle" = "Che cosa la Svizzera brucia, immagazzina e produce — e quanto costa un chilowattora, in ogni comune."
"page.energy.theDatasets" = "I set di dati"
"page.energy.thePhysicalSystem" = "Il sistema fisico"
"page.energy.thePriceDataIsTheUnusual" = "I dati sui prezzi sono la parte insolita. In Svizzera l'elettricità non è venduta a un prezzo nazionale: la vendono circa 550 gestori di rete locali, per lo più aziende municipalizzate, ciascuno con la propria tariffa. L'ElCom le raccoglie tutte, e questo trasforma una bolletta domestica in qualcosa di interrogabile: <em>chi fattura quanto, dove, e quale parte della bolletta è davvero l'elettricità?</em>"
"page.energy.thePriceOfAKilowattHour" = "Il prezzo di un chilowattora"
"page.energy.title" = "Energia"
"page.energy.twoPublishersTwoQuestions" = "Due editori coprono questo tema e rispondono a due domande diverse. L'<strong>Ufficio federale dell'energia</strong> descrive il sistema <em>fisico</em>: quanta energia consuma il Paese e da quali vettori, quanto sono pieni questa settimana i bacini alpini, quanta potenza solare è stata incentivata in ciascun cantone. La <strong>Commissione federale dell'energia elettrica</strong> descrive il <em>mercato</em>: quanto fattura ogni gestore di rete del Paese, per ogni profilo di consumo, in ogni anno dal 2011."
"page.energy.waterInTheMountains" = "L'acqua in montagna"
"page.energy.whereTheEnergyComesFrom" = "Da dove viene l'energia"
"page.energy.whoChargesWhat" = "Chi fattura quanto"

# ── Page: culture ─────────────────────────────────────────────────────
"page.culture.aboutThisTheme" = "Informazioni su questo tema"
"page.culture.accessIntro" = "Ogni unità di descrizione porta inoltre una <strong>regola di accesso</strong> tramite <code>isAssociatedWithRule</code>. In Svizzera l'accesso agli archivi è disciplinato da termini di protezione — di norma trent'anni, di più per gli incarti contenenti dati personali — e questa proprietà distingue quindi una descrizione che si può leggere da un documento che si può effettivamente richiedere. La descrizione è pubblica anche quando il documento non lo è ancora."
"page.culture.aisCaveat" = "Le etichette del vocabolario usano <code>ric:name</code> <strong>senza tag di lingua</strong>, ripetuto una volta per lingua — applicate sempre <code>SAMPLE</code>, altrimenti ogni riga si moltiplica"
"page.culture.aisCoverage" = "Dal 1798 a oggi, in otto dipartimenti principali per periodo storico"
"page.culture.aisGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Fsfa%2Fais\">sfa/ais</a>"
"page.culture.aisGroup" = "<strong>Sistema informativo archivistico</strong>"
"page.culture.aisModel" = "<strong>RiC-O</strong> (Records in Contexts), l'ontologia archivistica del CIA — <em>non</em> il vocabolario cube"
"page.culture.aisSize" = "~4,8 milioni di unità di descrizione, ~263 000 documenti, ~5,1 milioni di intervalli di date — il grafo più grande di LINDAS"
"page.culture.budgetVsAccounts" = "Ogni riga è contrassegnata da un <strong>tipo di rapporto</strong>, e la distinzione pesa più di quanto sembri a prima vista: <code>Voranschlag</code> è il preventivo come pianificato, <code>Rechnung</code> il consuntivo come si è chiuso. Entrambi sono presenti per lo stesso anno e la stessa voce, così che lo scarto tra quanto la Confederazione intendeva spendere e quanto ha effettivamente speso sia interrogabile direttamente su 175 anni. I primi anni mostrano chiaramente uno Stato diverso — nel 1850 le voci maggiori sono l'amministrazione postale, i dazi doganali e il dipartimento militare."
"page.culture.caveat" = "Avvertenza"
"page.culture.contents" = "Contenuto"
"page.culture.coverage" = "Copertura"
"page.culture.crossLinks" = "Il tema rimanda tanto all'esterno quanto all'interno: le unità di descrizione indicano l'istituzione che le conserva tramite il registro <a href=\"/resource?iri=https%3A%2F%2Fschema.ld.admin.ch%2FIsil\">ISIL</a>, le osservazioni dei conti dello Stato indicano l'ufficio editore tramite <code>cube:observedBy</code> che punta a risorse <code>ld.admin.ch/office</code>, e la stessa ontologia RiC-O è pubblicata separatamente sulla piattaforma come <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Fegad%2Fric-o\">egad/ric-o</a> — il vocabolario che descrive l'archivio si può quindi consultare accanto all'archivio che descrive."
"page.culture.culture" = "Cultura"
"page.culture.datasetsIntro" = "Quattro grafi denominati, pubblicati sotto lo spazio dei nomi <code>https://culture.ld.admin.ch/</code> — con un'eccezione segnalata più sotto. Insieme fanno di questo il tema più esteso della piattaforma per numero di triple."
"page.culture.divisionsCaveat" = "I conteggi qui sopra riguardano solo i membri <em>diretti</em> — i fondi collocati immediatamente sotto ciascun dipartimento, non i milioni di dossier sottostanti. Un dipartimento che mostra un solo figlio non è piccolo; è semplicemente descritto attraverso un livello intermedio prima di ramificarsi."
"page.culture.divisionsIntro" = "Al vertice l'archivio si divide in otto <strong>dipartimenti principali</strong>, che sono periodi della storia svizzera anziché materie. L'<em>Archiv der Helvetik</em> copre la breve Repubblica Elvetica del 1798–1803, seguita dalla Mediazione e dalla Dieta federale; la parte preponderante si trova sotto l'<em>Archiv des Schweizerischen Bundesstaates</em>, lo Stato federale dal 1848 in poi. Depositi e donazioni da mani private formano accanto a questi una divisione propria."
"page.culture.group" = "Gruppo"
"page.culture.hierarchyIntro" = "La descrizione archivistica è rigorosamente gerarchica, e i livelli portano nomi che gli archivisti usano da un secolo. Tutto si annida dall'alto verso il basso, dall'archivio stesso ai dipartimenti principali e ai fondi fino al singolo dossier, e ogni livello è un <code>RecordSet</code> dotato di un <code>hasRecordSetType</code> che ne indica il gradino. Quasi tutto il volume si colloca in fondo: i dossier superano tutti gli altri livelli messi insieme di circa dieci volte."
"page.culture.intro" = "Questo è di gran lunga il tema più esteso di LINDAS e il meno simile agli altri. Dove l'energia o l'agricoltura pubblicano <em>misurazioni</em>, l'<strong>Archivio federale svizzero</strong> pubblica <em>descrizioni</em>: uno strumento di ricerca archivistico è un'esposizione annidata di ciò che esiste, di dove si colloca nei fondi e di che cosa tratta. La <strong>Biblioteca nazionale svizzera</strong> vi aggiunge il registro delle istituzioni che conservano tale materiale in tutto il Paese."
"page.culture.isilCaveat" = "Le cifre sui fondi sono autodichiarate e non poggiano su una base comune — alcune istituzioni contano volumi, altre pezzi o metri lineari — l'ordine va quindi letto come indicativo e non come una classifica. Solo una parte del registro fornisce una cifra; le istituzioni che non la indicano mancano da questa tabella, non sono vuote."
"page.culture.isilContents" = "Biblioteche, archivi, mediateche e collezioni private — con anno di fondazione, dimensione dei fondi, storia amministrativa e un collegamento al catalogo proprio dell'istituzione"
"page.culture.isilGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Fnl%2Fisil\">nl/isil</a>"
"page.culture.isilGroup" = "<strong>Registro ISIL</strong>"
"page.culture.isilIntro" = "Un <strong>ISIL</strong> è l'identificatore internazionale standard di una biblioteca o di un archivio — <code>CH-000018-2</code> è l'Archivio federale stesso — e la Biblioteca nazionale tiene il registro svizzero corrispondente. Va ben oltre le istituzioni nazionali: biblioteche comunali, mediateche scolastiche, archivi parrocchiali, collezioni aziendali e archivi teatrali ne possiedono tutti uno. Per molte voci il registro riporta un anno di fondazione, la dimensione dei fondi, una storia amministrativa discorsiva e una descrizione del contenuto della collezione."
"page.culture.isilJoin" = "È l'identificatore a unire i due grafi archivistici. Ogni unità di descrizione dell'Archivio federale punta tramite <code>hasOrHadHolder</code> a una risorsa ISIL, cosicché una descrizione e l'istituzione che la conserva sono collegate da un identificatore condiviso anziché da una stringa di testo — lo stesso schema che il tema dell'energia usa per gli IDI delle imprese."
"page.culture.isilSize" = "~2 120 istituzioni, ciascuna con un indirizzo postale e una risorsa di organizzazione"
"page.culture.metaTitle" = "Cultura & archivi"
"page.culture.model" = "Modello"
"page.culture.namedGraph" = "Grafo denominato"
"page.culture.nlPublisher" = "Biblioteca nazionale svizzera"
"page.culture.publisher" = "Editore"
"page.culture.recordsIntro" = "Sotto le unità di descrizione stanno i documenti stessi, più ricchi di una scheda di catalogo. Oltre a un titolo e a una segnatura, un documento può portare una nota su <strong>contenuto e struttura</strong>, un autore, un editore, un operatore di ripresa indicato per nome, un formato fisico e un descrittore di soggetto. Questa combinazione rivela che cosa contiene realmente gran parte di questo archivio: non solo incarti cartacei ma <strong>materiale radiotelevisivo</strong> — servizi televisivi e radiofonici depositati dall'emittente pubblica, con durate, indicazioni di colore e formati di nastro registrati nel campo <code>format</code>."
"page.culture.ricIntro" = "L'archivio è modellato in <strong>Records in Contexts</strong> (RiC-O), l'ontologia archivistica del Consiglio internazionale degli archivi — e non nel vocabolario cube usato quasi ovunque sulla piattaforma. Questa scelta è la cosa più importante da sapere prima di interrogarlo. RiC è concepito per la descrizione e non per l'aggregazione: la sua idea centrale è che un documento acquista senso solo attraverso il proprio <em>contesto</em>, per cui le relazioni (che cosa contiene che cosa, chi lo ha conservato, quale attività lo ha prodotto) portano tanto significato quanto i titoli."
"page.culture.sfaCubeCaveat" = "Fortemente versionato — il solo <code>StateAccounts_Domain</code> conta 11 cubi con identico numero di righe. Ancorate ogni query a una sola IRI di cubo, altrimenti conterete più volte le stesse cifre"
"page.culture.sfaCubeCoverage" = "Dal 1850 in poi, preventivo e consuntivo, ripartiti per settore / ufficio / funzione / categoria"
"page.culture.sfaCubeGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Fsfa%2Fcube\">sfa/cube</a>"
"page.culture.sfaCubeSize" = "41 cubi in 5 famiglie — ma solo ~4 set di dati distinti, il resto sono versioni"
"page.culture.sfaPublisher" = "Archivio federale svizzero"
"page.culture.shapeOfAnArchive" = "La struttura di un archivio"
"page.culture.size" = "Dimensione"
"page.culture.stapfer" = "Un'inchiesta scolastica del 1799"
"page.culture.stapferCaveat" = "Si tratta di trascrizioni di una fonte manoscritta vecchia di 226 anni, e si vede. Alcune voci riportano cifre inverosimili — una scuola dichiara oltre mille maschi contro novantacinque femmine — che riflettono la risposta originale o la sua trascrizione anziché il villaggio. Ordinate per una qualsiasi colonna e i valori anomali emergono subito; trattateli come documenti, non come misurazioni."
"page.culture.stapferCaveatCard" = "Usa il <strong>vecchio vocabolario cube del W3C</strong> (<code>qb:Observation</code>) e risiede nello spazio dei nomi <code>education.ld.admin.ch</code>, non <code>culture</code>"
"page.culture.stapferGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Fsfa%2Fstapfer_enquete\">sfa/stapfer_enquete</a>"
"page.culture.stapferGroup" = "<strong>Inchiesta Stapfer (1799)</strong>"
"page.culture.stapferIntro" = "L'<strong>Inchiesta Stapfer</strong> è il set di dati più antico della piattaforma e il più vivido. Nel 1799 il ministro delle Arti e delle Scienze Philipp Albert Stapfer inviò un questionario a ogni maestro di scuola della Repubblica Elvetica, chiedendo chi insegnasse, chi frequentasse, che cosa vi si insegnasse e di che cosa vivesse la scuola. Migliaia di risposte si sono conservate e sono state trascritte in un set di dati interrogabile — quanto di più vicino a un censimento delle scuole svizzere nel momento in cui nasce lo Stato moderno."
"page.culture.stapferSeasons" = "Un dettaglio della struttura dice quasi tutto sulla vita rurale del 1799: la frequenza è registrata <strong>separatamente per l'inverno e per l'estate</strong>, e separatamente per maschi e femmine. Le cifre estive sono regolarmente una frazione di quelle invernali, perché d'estate i bambini lavoravano nei campi. Lo scarto stagionale in questi dati misura il lavoro agricolo, non la scolarizzazione."
"page.culture.stapferSize" = "~3 230 risposte di scuole, con effettivi di allievi per sesso e stagione, tipo di scuola, confessione e luogo"
"page.culture.stateAccounts" = "Il bilancio federale dal 1850"
"page.culture.stateAccountsGroup" = "<strong>Conti dello Stato</strong>"
"page.culture.stateAccountsIntro" = "L'Archivio federale pubblica anche qualcosa che non è affatto uno strumento di ricerca: i <strong>conti dello Stato</strong>, il preventivo e il consuntivo della Confederazione come cubo continuo che risale al <strong>1850</strong> — due anni dopo la fondazione dello Stato federale. Le stesse cifre sono ripartite in quattro modi, una famiglia di cubi per ciascuna vista: per <em>settore</em>, per <em>ufficio</em>, per <em>funzione</em> e per <em>categoria</em>."
"page.culture.subtitle" = "La memoria dello Stato svizzero — nove milioni di descrizioni archivistiche, un registro di tutte le istituzioni di conservazione e un'inchiesta scolastica del 1799."
"page.culture.theDatasets" = "I set di dati"
"page.culture.title" = "Cultura & archivi"
"page.culture.whatRecordsDescribe" = "Che cosa descrivono i documenti"
"page.culture.whoHoldsWhat" = "Chi conserva che cosa"

