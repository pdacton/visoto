"page.facets.aDemonstrationOfTheSparqlAsyncTable" = "Una dimostrazione del partial <code>sparqlAsyncTable</code> in modalità sfaccettata su <strong>ZefixOrganisation</strong> (~790 000 imprese svizzere registrate). Ogni colonna sfaccettabile porta un <strong>controllo di filtro nella sua intestazione</strong> (l'icona a imbuto), guidato dalle dichiarazioni <code>&lt;sparql-facet&gt;</code> di questa pagina. Una selezione filtra <strong>istantaneamente le righe caricate</strong> nel browser; poiché questa classe è troppo grande per essere tenuta per intero, l'applicazione recupera poi silenziosamente i <strong>veri risultati dell'intera classe</strong> dal backend e li sostituisce — ottieni un'anteprima immediata e un risultato autorevole senza mai scontrarti con la dimensione."
"page.facets.becauseTheClassIsLarge" = "Poiché la classe è grande, la vista iniziale (non filtrata) è limitata per mantenere la reattività — apri il filtro di una colonna per restringerla."
"page.facets.legalFormAMultiSelect" = "<strong>Forma giuridica</strong> — una sfaccettatura enumerata a selezione multipla su <code>schema:additionalType</code> (valori enumerati dallo store, ad es. Sagl, SA, ditta individuale); scegline una o più, oppure <em>(nessun valore)</em> per le imprese senza forma giuridica registrata."
"page.facets.nameContainsAFreeText" = "<strong>Il nome contiene</strong> — una sfaccettatura a testo libero su <code>schema:name</code>, con un'opzione <em>(nessun valore)</em> per le imprese senza nome registrato."
