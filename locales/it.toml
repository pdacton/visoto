"page.health.companiesThatMarketVitalMedicines" = "Le imprese che commercializzano in Svizzera medicinali vitali per uso umano sono tenute per legge a segnalare le interruzioni di fornitura all'Ufficio federale per l'approvvigionamento economico del Paese. Il grafo trasforma queste segnalazioni in una serie continua di istantanee giornaliere: un'osservazione è <em>un medicinale in un dato giorno</em>, con il suo <abbr title=\"{{.atcTitle}}\">codice ATC</abbr>, l'identificatore di confezione (GTIN), la data d'inizio dell'interruzione, la fine prevista e una raccomandazione per i prescrittori. Per vedere la situazione <em>oggi</em> si legge l'ultima istantanea — che è esattamente ciò che fanno le tabelle qui sotto. Un cubo complementare traccia solo i totali giornalieri delle interruzioni aperte e chiuse nel tempo."
