# ── Page: environment ─────────────────────────────────────────────
"page.environment.aboutThisTheme" = "Informazioni su questo tema"
"page.environment.caveat" = "Avvertenza"
"page.environment.contents" = "Contenuto"
"page.environment.coverage" = "Copertura"
"page.environment.crossLinks" = "Come altrove sulla piattaforma, questi grafi rimandano all'esterno anziché duplicare i dati di riferimento: i cantoni si risolvono nelle unità <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Fterritorial\">territoriali</a> standard, i gruppi di organismi e le categorie di minaccia provengono da <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Fcube%2Fdimension\">dimensioni di cubo condivise</a> che recano collegamenti a Wikidata, e gli enti che effettuano i rilevamenti — l'UFAM stesso, il WSL per l'inventario forestale — sono le stesse risorse di organizzazione <code>ld.admin.ch</code> usate in tutto LINDAS."
"page.environment.cubeCaveat" = "I 121 cubi corrispondono a circa 18 insiemi di dati in molte versioni — si prenda sempre l'IRI di cubo con il numero più alto, salvo che si confrontino le edizioni"
"page.environment.cubeContents" = "Gas serra, inquinamento atmosferico, rumore del traffico, contaminazione del suolo, qualità delle acque di balneazione, Lista Rossa, flussi del legno"
"page.environment.cubeGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffoen%2Fcube\">foen/cube</a>"
"page.environment.cubeSize" = "121 cubi, ~469 000 osservazioni"
"page.environment.datasetsIntro" = "Sette grafi denominati, tutti pubblicati dallo stesso ufficio, tutti sotto lo spazio dei nomi di vocabolario <code>https://environment.ld.admin.ch/</code>."
"page.environment.emissionsAndPollution" = "Emissioni e inquinamento"
"page.environment.environment" = "Ambiente"
"page.environment.environmentalStatisticsGroup" = "<strong>Statistiche ambientali</strong>"
"page.environment.fireDangerIntro" = "La Svizzera è suddivisa in 143 <strong>regioni di allerta incendi di bosco</strong>, ciascuna con un grado di pericolo da 1 (debole) a 5 (molto forte). Ciò che rende questa coppia di grafi interessante da leggere insieme è che il pericolo e la <em>risposta</em> sono pubblicati separatamente: l'UFAM valuta il rischio, i Cantoni decidono che cosa vietare. La tabella qui sotto li unisce, così che ogni regione mostri il pericolo accanto al divieto di fuoco effettivamente in vigore — dall'invito alla prudenza fino al divieto assoluto di accendere fuochi all'aperto."
"page.environment.fireLabelCaveat" = "I gradi di pericolo e le descrizioni dei divieti non recano <em>alcun contrassegno di lingua</em> — le formulazioni tedesca, francese, italiana e inglese figurano sulla stessa risorsa come quattro letterali non contrassegnati — perciò un grado può comparire nella lingua che la risoluzione delle etichette raggiunge per prima. È l'IRI a identificare il grado; la formulazione ne è soltanto un'etichetta."
"page.environment.forestFireDanger" = "Pericolo di incendi di bosco"
"page.environment.forestGroup" = "<strong>Inventario forestale nazionale</strong>"
"page.environment.ghgIntro" = "L'<strong>inventario dei gas serra</strong> è l'insieme di dati alla base del rendiconto climatico della Svizzera e va dal 1990 all'ultimo anno concluso. È scomposto per settore e per gas, entrambi gerarchici: il totale nazionale si suddivide in edifici, trasporti, industria e altri, mentre i gas si suddividono in CO₂, metano, protossido di azoto e gas sintetici — con un membro <em>tutti i gas serra</em> che esprime l'insieme in equivalenti CO₂."
"page.environment.ghgLandUse" = "Un aspetto del modello merita attenzione: <strong>l'uso del suolo è indicato separatamente ed escluso dal totale principale</strong>, come pure l'aviazione internazionale. Il bosco in particolare costituisce di norma un <em>pozzo</em> netto — un valore negativo — poiché gli alberi in crescita assorbono più carbonio di quanto ne liberi l'utilizzazione. Includerlo nella cifra nazionale sottostimerebbe le emissioni; escluderlo è la convenzione, e il cubo lo segnala esplicitamente anziché lasciarlo intuire."
"page.environment.group" = "Gruppo"
"page.environment.hydroIntro" = "La <strong>rete idrologica</strong> è l'insieme di dati più immediato di questa piattaforma. Circa 230 stazioni trasmettono livello dell'acqua, portata e — in una parte di esse — temperatura dell'acqua, aggiornati di continuo; la marca temporale di ogni riga indica quando lo strumento ha effettivamente misurato, non quando il file è stato pubblicato. Ogni stazione è collegata al <a href=\"/resource?iri=http%3A%2F%2Fschema.org%2FBodyOfWater\">corpo idrico</a> su cui si trova e reca coordinate geografiche: la stessa misurazione risponde così sia a <em>quanto è caldo il Reno</em> sia a <em>dove esattamente</em>."
"page.environment.hydroUnits" = "Il livello dell'acqua è espresso in metri sul livello del mare (non come profondità), la portata in m³/s, la temperatura in °C. Una stazione può comparire brevemente due volte quando una nuova misurazione arriva mentre una precedente è ancora in corso di sostituzione — la marca temporale della misurazione le distingue."
"page.environment.hydroWhatIsMissing" = "Si noti quanto siano lacunose alcune colonne. Ogni stazione trasmette un livello, la maggior parte una portata, ma solo circa un terzo misura la temperatura — e le stazioni lacustri non trasmettono naturalmente alcuna portata. Queste lacune stanno nei dati e non nell'interrogazione: le grandezze misurate sono <code>OPTIONAL</code> perché una stazione semplicemente non dispone degli strumenti che non ha."
"page.environment.liveDataIntro" = "Due di questi insiemi di dati sono <strong>in tempo reale</strong>, cosa rara in LINDAS. La maggior parte della piattaforma registra ciò che è già accaduto; il grafo idrologico e le allerte per gli incendi di bosco descrivono il Paese così com'è in questo momento. Sono anche i due su cui una persona potrebbe basare una decisione — se fare il bagno, se accendere un fuoco."
"page.environment.liveFrequency" = "In continuo — questi grafi contengono soltanto lo stato <em>attuale</em>, non uno storico"
"page.environment.liveGraphs" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffoen%2Fhydro\">foen/hydro</a>, <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffoen%2Fforest-fire-risk-warning\">forest-fire-risk-warning</a>, <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffoen%2Fforest-fire-prevention-measures-cantons\">forest-fire-prevention-measures-cantons</a>"
"page.environment.liveMonitoringGroup" = "<strong>Monitoraggio in tempo reale</strong>"
"page.environment.liveSize" = "~230 stazioni idrologiche, 143 regioni di allerta incendi"
"page.environment.metaTitle" = "Ambiente & natura"
"page.environment.namedGraph" = "Grafo denominato"
"page.environment.namedGraphs" = "Grafi denominati"
"page.environment.nfiCantonCaveat" = "Ventiquattro righe, non ventisei: <strong>Basilea Città e Basilea Campagna non sono rilevate separatamente</strong> in questo cubo — compaiono soltanto come regione combinata — e l'inventario pubblica inoltre gli stessi temi per l'intera Svizzera, per le regioni economiche e per le regioni di bosco di protezione. L'<em>unità di riferimento</em> è una dimensione a sé stante: il Cantone è quindi uno dei vari modi di suddividere il bosco, non l'unico."
"page.environment.nfiContents" = "Diverse centinaia di temi forestali, ciascuno come predicato proprio e ciascuno corredato di un errore standard pubblicato; rilevati dal <a href=\"/resource?iri=https%3A%2F%2Fregister.ld.admin.ch%2Fopendataswiss%2Forg%2Fwsl\">WSL</a>"
"page.environment.nfiCoverage" = "Cinque inventari dai primi anni Ottanta, più i periodi di variazione tra l'uno e l'altro"
"page.environment.nfiGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffoen%2Fnational-forest-inventory\">foen/national-forest-inventory</a>"
"page.environment.nfiIntro" = "L'<strong>Inventario forestale nazionale</strong> è l'insieme di dati modellato con maggiore cura di questo tema, e quello per cui conviene leggere il modello prima dei numeri. Squadre sul terreno visitano una griglia di aree di saggio in tutto il Paese; un passaggio completo richiede anni. Dai primi anni Ottanta sono stati conclusi cinque inventari e — aspetto importante — i dati trattano anche gli <em>intervalli tra di essi</em> (IFN1–IFN2, IFN2–IFN3, …) come periodi d'inventario a pieno titolo. La variazione nel tempo è così un valore di prim'ordine e non qualcosa da calcolare per sottrazione."
"page.environment.nfiSize" = "125 cubi, ~630 000 osservazioni"
"page.environment.nfiStandardError" = "Poiché ogni cifra è una <em>stima da un campione</em> e non un censimento, ogni grandezza reca con sé il proprio <strong>errore standard</strong>: accanto al tema <code>21</code> (provvigione legnosa) figura <code>SE21</code>, l'errore di quella stima in percentuale. Per dati pubblici aperti è davvero insolito, e cambia il modo di leggere la tabella — una cifra cantonale con ±15% non è paragonabile a una con ±6% nel senso che i numeri grezzi lascerebbero supporre. I Cantoni piccoli hanno meno aree di saggio, e le loro stime sono quindi corrispondentemente meno certe."
"page.environment.nfiTopicCaveat" = "L'inventario pubblica ogni grandezza come <em>predicato</em> proprio e non come valore di una dimensione condivisa — <code>Topic/21</code> è la provvigione legnosa, <code>Topic/13</code> sono utilizzazioni e mortalità, e così via per diverse centinaia di temi, ciascuno con una variante <code>r</code> che ne esprime il valore per ettaro. Cambiare ciò che questa tabella riporta significa quindi cambiare un predicato, non un filtro."
"page.environment.oneOfficeManyClocks" = "Questo tema ha un unico editore — l'<strong>Ufficio federale dell'ambiente</strong> — ed è proprio questo a renderlo insolito. Tutto qui proviene da un solo ufficio, ma gli insiemi di dati seguono ritmi assai diversi. La rete idrologica trasmette <em>ogni dieci minuti</em>. Le allerte per gli incendi di bosco vengono riemesse quando il tempo cambia. L'Inventario forestale nazionale impiega circa un decennio per un passaggio. La Lista Rossa viene rivista una volta per generazione."
"page.environment.otherPollutionCubes" = "Diversi cubi minori completano il quadro dell'inquinamento, e ciascuno merita di essere conosciuto anche se qui nessuno è riportato in tabella. Il <strong>rumore del traffico</strong> stima quante persone sono esposte al rumore di strada, ferrovia e aerei oltre i valori limite di legge. La <strong>contaminazione del suolo da metalli pesanti</strong> riporta le concentrazioni misurate nei siti di osservazione. La <strong>qualità delle acque di balneazione</strong> comprende circa dodicimila singoli risultati di laboratorio — conteggi di E. coli ed enterococchi per data di campionamento e per luogo —, una serie di sanità pubblica di grana davvero fine. Infine una famiglia di cubi segue l'<strong>inquinamento atmosferico lungo l'A2 e l'A13</strong>, le due autostrade del traffico di transito alpino, con misurazioni di NO₂, polveri fini e fuliggine a bordo strada."
"page.environment.plaziClassification" = "Classificazione Plazi"
"page.environment.plaziDesc" = "Nomi tassonomici, treatment e le pubblicazioni da cui provengono — centinaia di migliaia di segnalazioni di specie."
"page.environment.plaziIntro" = "Il grafo più esteso pubblicato dall'UFAM non ha nulla a che vedere con il monitoraggio. <strong>Plazi</strong> è un corpus di treatment tassonomici — quelle descrizioni formali con cui le specie vengono denominate e delimitate nella letteratura scientifica —, estratti da lavori pubblicati e trasformati in linked data. Risponde a un tipo di domanda diverso da tutto quanto precede: non <em>quanto</em> o <em>quanto caldo</em>, ma <em>chi ha descritto questa specie, dove e con quale nome</em>. Ha qui una pagina propria, perché la sua struttura non ha nulla in comune con i cubi."
"page.environment.readTheClockFirst" = "È questa distanza a dover essere tenuta presente nel leggere queste tabelle. Una cifra del grafo idrologico è una <em>misurazione</em> e sarà già cambiata al prossimo aggiornamento; una cifra dell'inventario forestale è una <em>stima</em> con un margine d'errore dichiarato; una cifra della Lista Rossa è una <em>valutazione</em> che vale fino alla revisione successiva. Il modello dei dati dice quale sia quale — l'inventario fornisce persino i propri errori standard — ma solo se si guarda."
"page.environment.redListDataDeficient" = "Si osservino le righe <em>dati insufficienti</em>. Non costituiscono una categoria di minaccia, bensì l'ammissione che si sa troppo poco per valutare la specie; e per alcuni gruppi superano da sole tutte le categorie di minaccia messe insieme. È un'indicazione sullo sforzo di rilevamento, non sugli organismi."
"page.environment.redListIntro" = "La <strong>Lista Rossa</strong> valuta le specie della Svizzera secondo le <a href=\"/resource?iri=https%3A%2F%2Fenvironment.ld.admin.ch%2Fvocabulary%2Fiucn_conservation_categories\">categorie di minaccia dell'IUCN</a> — da <em>non minacciata</em> a <em>vulnerabile</em>, <em>in pericolo</em> e <em>in pericolo d'estinzione</em>, fino a <em>estinta a livello regionale</em>. Ogni categoria è qui una risorsa a pieno titolo e non un codice in una stringa: reca il proprio nome in quattro lingue, un collegamento <code>owl:sameAs</code> a Wikidata e persino il colore ufficiale con cui l'UFAM la rappresenta nei propri grafici."
"page.environment.redListStructure" = "Le specie sono raggruppate secondo una classificazione dell'UFAM annidata tramite <code>skos:broader</code> — <em>tutti gli organismi</em> contiene gli <em>animali</em>, che contengono gli <em>insetti</em>, che contengono le <em>farfalle</em>. Lo stesso cubo risponde così sia al dato nazionale complessivo sia alla domanda su quale gruppo se la passi peggio. Nel sommare occorre scegliere un solo livello, altrimenti i totali conteggiano più volte le stesse specie. La colonna <code>part</code> indica la quota delle specie valutate di quel gruppo che ricadono nella categoria, ed è ciò che rende confrontabili gruppi di dimensioni molto diverse."
"page.environment.referenceContents" = "Treatment tassonomici di Plazi (di gran lunga il grafo più esteso di questo tema — si veda la <a href=\"/plazi.html\">pagina Plazi</a>), oltre alle dimensioni condivise da cui i cubi traggono i loro termini"
"page.environment.referenceGraphs" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffoen%2Fplazi\">foen/plazi</a>, <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffoen%2Fthemes\">foen/themes</a>"
"page.environment.referenceGroup" = "<strong>Letteratura e vocabolario</strong>"
