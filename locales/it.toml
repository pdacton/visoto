# ── Page: media ───────────────────────────────────────────────────────
"page.media.aboutThisTheme" = "Informazioni su questo tema"
"page.media.advertisingIntro" = "La serie più chiara di questo tema è anche la più cupa per chi lavora nei media svizzeri: i <strong>ricavi pubblicitari per genere di media</strong>, anno dopo anno. Mostra la stampa ancora come categoria singola più consistente per fatturato, ma in calo costante — e la pubblicità online, che avrebbe dovuto sostituirla, a meno della metà del valore della stampa e senza crescita."
"page.media.advertisingNuance" = "Il motivo è che questo cubo misura la pubblicità prenotata presso i media <em>svizzeri</em>. Il denaro uscito dai giornali non si è spostato sui siti d'informazione svizzeri; ha in larga parte lasciato del tutto il mercato interno verso piattaforme globali che l'UFCOM non rileva. Leggete la colonna online come «pubblicità online raccolta dagli editori svizzeri», non come la dimensione del mercato pubblicitario digitale in Svizzera."
"page.media.broadband" = "Il tubo fino all'edificio"
"page.media.caveat" = "Avvertenza"
"page.media.collectionCaveat" = "I 533 cubi corrispondono a molti meno set di dati di quanto il numero suggerisca — la maggior parte delle famiglie esiste in otto-quattordici versioni, ciascuna con una propria IRI di cubo che termina con un numero, e solo la più alta è aggiornata. Ancorate sempre una query a una sola IRI di cubo, altrimenti le stesse osservazioni vengono contate una volta per edizione."
"page.media.collectionIntro" = "Il grafo sui media dell'UFCOM è ampio e insolitamente granulare. Oltre ai dati di ascolto contiene <strong>analisi dei programmi</strong> — studi che codificano l'offerta trasmessa per tema e formato, così da poter chiedere quale quota del tempo d'antenna di una radio regionale fosse informazione regionale anziché musica. Questo livello di dettaglio esiste perché le emittenti private che ricevono una quota del canone hanno un mandato di prestazioni, e le analisi servono a misurarne l'adempimento."
"page.media.collectionSpread" = "Le famiglie qui sotto coprono l'intero panorama mediatico: rilevazione dell'ascolto Mediapulse per la televisione, portata e struttura dei programmi delle radio SRG e commerciali, lettura della stampa per età, media online per tema e genere, nonché la struttura dei ricavi dell'emittente di servizio pubblico."
"page.media.contents" = "Contenuto"
"page.media.coverage" = "Copertura"
"page.media.crossLinks" = "Entrambi i grafi si appoggiano a dati di riferimento condivisi: le osservazioni NGA risolvono comune e cantone nel <a href=\"/statistics.html\">registro dell'UST</a>, e i cubi sui media indicano l'ufficio editore tramite <code>cube:observedBy</code> che punta all'<a href=\"/government.html\">Amministrazione federale</a>. L'UFCOM compare inoltre in <a href=\"/statistics.html\">Statistica &amp; registri</a> come fonte delle zone di copertura radio pubblicate come dimensione territoriale condivisa."
"page.media.datasetsIntro" = "Due grafi denominati, entrambi dell'UFCOM ed entrambi sotto lo spazio dei nomi di vocabolario <code>https://communication.ld.admin.ch/</code> — ma di forma molto diversa."
"page.media.followTheMoney" = "Dove è finita la pubblicità"
"page.media.group" = "Gruppo"
"page.media.intro" = "Entrambi i grafi qui riuniti provengono dall'<strong>Ufficio federale delle comunicazioni</strong> e si collocano ai due lati della stessa domanda. Uno descrive il <em>contenuto</em>: quante persone guardano, leggono e ascoltano, che cosa contengono davvero i programmi e dove va il denaro della pubblicità. L'altro descrive il <em>tubo</em>: quali velocità di banda larga raggiungono quale edificio, in ogni comune del Paese."
"page.media.media" = "Media"
"page.media.mediaCaveat" = "Alcuni cubi datano le osservazioni con un semplice letterale dell'anno anziché con <code>xsd:gYear</code> — un filtro tipizzato non trova quindi nulla, senza segnalarlo"
"page.media.mediaContents" = "Dati di ascolto TV Mediapulse, portata radio e TV, analisi di programmi e temi, lettura della stampa, uso dei media online, ricavi pubblicitari, struttura dei ricavi della SSR, proprietà dei media"
"page.media.mediaGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Fofcom%2Fcube\">ofcom/cube</a>"
"page.media.mediaGroup" = "<strong>Ricerca sui media</strong>"
"page.media.mediaSize" = "533 cubi, ~139 000 osservazioni — ma circa 60 set di dati distinti in molte versioni"
"page.media.metaTitle" = "Media & comunicazione"
"page.media.namedGraph" = "Grafo denominato"
"page.media.ngaCaveat" = "L'intero set di dati è un'<strong>unica istantanea mensile</strong>, non una serie storica — ogni osservazione porta lo stesso mese, per cui mostra lo stato attuale della rete e non come vi si è giunti. Si noti inoltre che copertura significa <em>che un edificio potrebbe abbonarsi</em>, non che qualcuno lo abbia fatto: si tratta di disponibilità, non di adesione."
"page.media.ngaCaveatCard" = "Disponibilità, non abbonamento — e le stringhe di condizione (<code>DOWN &gt;= 1000</code>) sono semplici letterali, da far corrispondere esattamente, spazi inclusi"
"page.media.ngaConditions" = "La copertura non è un numero ma tredici, uno per <strong>condizione</strong>. Sette sono soglie di velocità in download, da 10 Mbit/s fino a un gigabit, quattro sono soglie in upload e tre indicano il mezzo fisico — fibra, cavo coassiale o rame. Lette come una scala mostrano dove la rete si assottiglia: pressoché universale per la banda larga di base, ancora solida a 100 Mbit/s e in netto calo non appena si richiede il gigabit."
"page.media.ngaCoverage" = "Un'unica istantanea mensile relativa a ~1,92 milioni di edifici in tutto il Paese"
"page.media.ngaGap" = "Si noti la discordanza tra le due colonne di copertura. Mediata sui comuni, la fibra raggiunge circa il quarantaquattro per cento; conteggiata per edifici, supera abbondantemente la metà. Il divario è la frattura città-campagna espressa in cifre — la fibra si costruisce dove gli edifici già sono, e copre così molte persone in pochi luoghi."
"page.media.ngaGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Fofcom%2Fnga\">ofcom/nga</a>"
"page.media.ngaGroup" = "<strong>Copertura a banda larga (NGA)</strong>"
"page.media.ngaIntro" = "Il set di dati <strong>NGA</strong> — per <em>next-generation access</em> — è la rilevazione nazionale sulla copertura a banda larga, e la sua unità di misura è insolitamente concreta: non economie domestiche o persone bensì <strong>edifici</strong>, le singole costruzioni a cui una rete potrebbe essere allacciata. Per ogni comune indica quanti edifici possono ottenere un dato servizio, espresso sia in valore assoluto sia in percentuale."
"page.media.ngaSize" = "Un cubo, ~27 400 osservazioni — 13 condizioni × ~2110 comuni"
"page.media.ofcomPublisher" = "Ufficio federale delle comunicazioni (UFCOM)"
"page.media.publisher" = "Editore"
"page.media.size" = "Dimensione"
"page.media.subtitle" = "Che cosa la Svizzera guarda, legge e ascolta — chi lo finanzia e la rete attraverso cui arriva."
"page.media.theCollection" = "Cinquecento cubi di ricerca sui media"
"page.media.theDatasets" = "I set di dati"
"page.media.title" = "Media & comunicazione"
"page.media.whyOfcom" = "L'accostamento non è casuale. L'UFCOM regola sia la radiodiffusione — rilascia le concessioni, ripartisce il canone, verifica l'adempimento degli obblighi di servizio pubblico — sia l'infrastruttura di telecomunicazione. La ricerca sui media esiste perché l'autorità di regolazione ha bisogno di basi decisionali per le concessioni: per questo i dati arrivano fino all'analisi dei contenuti dei singoli programmi e non si fermano ai totali di ascolto."

# ── Page: statistics — Zefix ──────────────────────────────────────────
"card.registeredCompanies" = "Imprese iscritte"
"card.zefixLegalForms" = "Enti iscritti per forma giuridica"
"card.zefixPerCanton" = "Enti iscritti per cantone"
"page.statistics.fojPublisher" = "Ufficio federale di giustizia (UFG)"
"page.statistics.registersToo" = "Accanto a essi stanno i registri delle <em>cose che esistono</em> anziché dei codici: il registro di commercio <strong>Zefix</strong> dell'Ufficio federale di giustizia, che elenca ogni ente giuridico del Paese, e le risorse territoriali in cui si risolvono le osservazioni dei cubi di tutta la piattaforma."
"page.statistics.zefix" = "Tutte le imprese del Paese"
"page.statistics.zefixCaveat" = "Si tratta di enti <em>iscritti</em> presso la loro sede legale, il che non equivale ad attività economica: una holding iscritta a Zugo potrebbe non impiegarvi nessuno. Si noti inoltre che il registro contiene le iscrizioni attuali — è un'istantanea di chi esiste oggi, non una storia di costituzioni e scioglimenti."
"page.statistics.zefixCaveatCard" = "Sede legale, non attività economica — e un'istantanea anziché una storia di costituzioni e scioglimenti"
"page.statistics.zefixContents" = "L'Indice centrale delle ditte — ogni ente giuridico del registro di commercio svizzero, con lo scopo sociale per esteso nella maggior parte delle iscrizioni"
"page.statistics.zefixForms" = "Tre forme costituiscono quasi l'intero registro: la <strong>Sagl</strong>, la <strong>società anonima</strong> e la ditta individuale. Tutto il resto — fondazioni, associazioni, cooperative, società di persone, succursali di imprese estere — forma una lunga coda. La presenza di fondazioni e associazioni ricorda che si tratta di un registro di <em>enti giuridici</em>, non solo di imprese a scopo di lucro."
"page.statistics.zefixGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffoj%2Fzefix\">foj/zefix</a>"
"page.statistics.zefixGroup" = "<strong>Registro di commercio Zefix</strong>"
"page.statistics.zefixIntro" = "<strong>Zefix</strong> — l'Indice centrale delle ditte, tenuto dall'Ufficio federale di giustizia — è il registro di ogni ente giuridico iscritto nel registro di commercio svizzero. Con quasi <strong>800 000 organizzazioni</strong> è di gran lunga il registro più esteso di questa piattaforma, ed è la controparte dell'elenco dei comuni: l'uno identifica i luoghi, l'altro le imprese che vi si trovano."
"page.statistics.zefixJoinIntro" = "Poiché ogni impresa indica il comune di sede come IRI tratta dal registro descritto sopra, i due set di dati si uniscono direttamente — e contare le imprese per cantone mostra qualcosa che i dati sulla popolazione non rivelano. Zurigo è in testa come prevedibile, ma <strong>Zugo</strong> compare assai più in alto di quanto la sua dimensione lasci supporre: un cantone di circa 130 000 abitanti che ospita decine di migliaia di enti iscritti, ossia la sua politica fiscale di domiciliazione resa visibile nei dati."
"page.statistics.zefixSize" = "~791 000 enti iscritti, ciascuno con IDI, forma giuridica, indirizzo e comune di sede"
"page.statistics.zefixUid" = "La sua caratteristica portante è l'<strong>IDI</strong>, il numero d'identificazione delle imprese, che ogni ente possiede. Questo unico identificatore permette di riconoscere un'impresa attraverso set di dati altrimenti scollegati — i gestori della rete elettrica nel tema <a href=\"/energy.html\">energia</a> portano il proprio IDI, che si risolve qui, nella persona giuridica. Ogni iscrizione contiene inoltre una forma giuridica secondo lo standard <code>eCH-0097</code>, un indirizzo iscritto, il comune di sede e, nella maggior parte dei casi, lo scopo sociale dell'impresa per esteso."

