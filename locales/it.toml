# ── Page: statistics ──────────────────────────────────────────────────
"page.statistics.aboutThisTheme" = "Informazioni su questo tema"
"page.statistics.caveat" = "Avvertenza"
"page.statistics.contents" = "Contenuto"
"page.statistics.crossLinks" = "Tutto su questa piattaforma finisce per puntare qui. Le IRI di comuni e cantoni di questo registro compaiono nelle <a href=\"/energy.html\">tariffe elettriche</a>, nelle <a href=\"/agriculture.html\">notifiche di epizoozie</a> e nei <a href=\"/politics.html\">risultati delle votazioni</a>; gli IDI aziendali tratti da Zefix identificano i gestori di rete dietro quelle tariffe; le dimensioni condivise portano le stazioni di misurazione <a href=\"/environment.html\">ambientali</a>; e le classificazioni stanno alla base delle dimensioni dei cubi usate ovunque. Quando una cifra di un'altra pagina si risolve in un luogo, in un'impresa o in un codice, è qui che si risolve."
"page.statistics.datasetsIntro" = "Cinque grafi denominati di tre editori. Fatto insolito per questa piattaforma, nessuno di essi contiene una sola osservazione — sono tutti definizioni, identificatori ed elenchi di codici."
"page.statistics.fsoPublisher" = "Ufficio federale di statistica (UST)"
"page.statistics.group" = "Gruppo"
"page.statistics.i14y" = "Gli elenchi di codici su cui tutti concordano"
"page.statistics.i14yCaveat" = "I14Y è versionato in modo sistematico: ogni classificazione esiste come identità stabile più uno schema di concetti per ciascuna versione pubblicata, e sono gli schemi di versione a comparire nei conteggi grezzi. La tabella qui sopra si limita alle identità. Si noti anche il prefisso <code>DV_</code> su molti identificatori — sono le copie del vocabolario distribuito, talvolta con un numero di concetti leggermente diverso dall'originale omonimo."
"page.statistics.i14yCaveatCard" = "Ogni classificazione compare una volta come identità e una volta per versione pubblicata — filtrate su <code>version.link/Identity</code>, altrimenti lo stesso elenco si ripete con conteggi leggermente diversi"
"page.statistics.i14yContents" = "Il catalogo federale degli elenchi di codici: professioni (CH-ISCO-19), malattie (ICD-10-GM), interventi chirurgici (CHOP), rami economici (NOGA), lingue, Paesi, aeroporti, unità spaziali di base"
"page.statistics.i14yGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffso%2Fi14y\">fso/i14y</a>"
"page.statistics.i14yGroup" = "<strong>Piattaforma di interoperabilità I14Y</strong>"
"page.statistics.i14yIntro" = "<strong>I14Y</strong> — il numeronimo di <em>interoperabilità</em> — è la piattaforma federale su cui i servizi pubblicano gli elenchi di codici che utilizzano, affinché altri possano adottare gli stessi anziché inventarne versioni parallele. È di gran lunga il grafo più esteso di questo tema, e il suo contenuto riassume fedelmente ciò che lo Stato svizzero conta: professioni, malattie, interventi chirurgici, rami economici, lingue, Paesi, aeroporti."
"page.statistics.i14yModel" = "Tutto è modellato in <strong>SKOS</strong>, il vocabolario standard per i sistemi di classificazione, con <code>xkos:ClassificationLevel</code> sovrapposto a indicare i gradini di una gerarchia — così un codice professionale a quattro cifre sa di collocarsi sotto un gruppo a tre cifre. I concetti portano con sé le relazioni di sovraordinazione e subordinazione, ed è proprio questo a rendere una classificazione utilizzabile per l'aggregazione e non solo per la consultazione."
"page.statistics.i14yNames" = "I nomi di quella tabella meritano di essere letti come un elenco. <strong>CH-ISCO-19</strong> è la nomenclatura svizzera delle professioni, la voce più ampia qui con circa venticinquemila entrate. <strong>CHOP</strong> è la classificazione degli interventi chirurgici e <strong>ICD-10-GM</strong> quella delle malattie — entrambe codificate da ogni ospedale svizzero. <strong>NOGA</strong> è la nomenclatura delle attività economiche alla base della statistica delle imprese. Insieme formano il vocabolario con cui lo Stato descrive il lavoro, la malattia e l'economia."
"page.statistics.i14ySize" = "~453 000 concetti SKOS in ~670 schemi di concetti, ~134 000 identità con ~320 000 versioni"
"page.statistics.intro" = "Questo tema è il basamento. Nulla qui è una misurazione del mondo — è il meccanismo che rende confrontabili le misurazioni: a <em>quale</em> comune appartiene una cifra, <em>quale</em> professione è stata registrata per una persona, a <em>quale</em> ramo economico appartiene un'impresa. Ogni altra pagina di questo sito ne dipende, di norma senza dirlo."
"page.statistics.lindasPublisher" = "LINDAS (dati condivisi della piattaforma)"
"page.statistics.mergersCaveat" = "Non ogni mutazione è una fusione — il registro usa lo stesso meccanismo per ridenominazioni, correzioni di confine e passaggi tra distretti, per cui il numero di eventi è un limite superiore delle fusioni vere e proprie. Un evento con più predecessori e un successore è la forma classica della fusione; un predecessore e un successore corrispondono di norma a una ridenominazione."
"page.statistics.mergersIntro" = "La Svizzera ha avuto oltre 3000 comuni per gran parte del Novecento e da allora ne perde costantemente — non per una politica federale, ma per migliaia di decisioni locali di fondersi. Il registro annota ciascuna come <strong>mutazione</strong>, con i predecessori confluiti, il successore che ne è risultato e la data di entrata in vigore. È lo stesso modello <code>version.link</code> che l'<a href=\"/government.html\">Amministrazione federale</a> usa per le proprie riorganizzazioni."
"page.statistics.mergersWaves" = "Raggruppate per anno, le fusioni arrivano a ondate e non con continuità. Sono i cantoni a promuoverle — un cantone offre incentivi finanziari e decine di comuni si fondono in un solo gennaio. Il <strong>2006</strong> e il <strong>2010</strong> spiccano nettamente, assorbendo ciascuno oltre quattrocento comuni in successori. Poiché ogni fusione ha effetto dal 1° gennaio, la carta della Svizzera cambia in un solo giorno all'anno."
"page.statistics.mergersWhyItMatters" = "La conseguenza pratica per chi interroga questa piattaforma: una IRI di comune è una <em>versione</em>, non un luogo. Se unite una statistica del 2005 a un elenco di comuni del 2026 basandovi solo sull'identificatore, le righe fuse nel frattempo spariranno senza segnalazione. Il registro esiste proprio perché l'unione possa essere fatta correttamente, risalendo la catena dei predecessori."
"page.statistics.metaTitle" = "Statistica & registri"
"page.statistics.model" = "Modello"
"page.statistics.municipalitiesCaveat" = "I comuni portano inoltre un collegamento <code>geosparql:hasGeometry</code> al proprio poligono di confine in <code>geo.ld.admin.ch</code> e un codice di entità GeoNames — il registro è dunque anche un ponte verso i dati cartografici e non solo un elenco di nomi. Non tutti i comuni hanno una geometria associata; la copertura è parziale."
"page.statistics.municipalitiesIntro" = "Il comune è l'atomo della statistica svizzera: quasi ogni cifra pubblicata dalla Confederazione è rilevata per comune oppure aggregata a partire dai comuni. Il registro definisce l'intera gerarchia a tre livelli — <strong>cantone</strong>, <strong>distretto</strong>, <strong>comune</strong> — e la sua forma è disomogenea in un modo che riflette la storia più che la popolazione. Berna e Vaud contano ciascuno centinaia di comuni; i Grigioni hanno più distretti di Zurigo, con una frazione degli abitanti."
"page.statistics.namedGraph" = "Grafo denominato"
"page.statistics.opendataCaveat" = "Assai più piccolo di quanto il nome suggerisca — si tratta dell'<em>elenco degli enti editori</em> dietro il portale nazionale dei dati aperti, non di un catalogo dei suoi set di dati"
"page.statistics.opendataGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Fsfa%2Fopendataswiss\">sfa/opendataswiss</a>"
"page.statistics.opendataGroup" = "<strong>Raccolta opendata.swiss</strong>"
"page.statistics.opendataSize" = "~175 organizzazioni editrici e ~213 termini definiti"
"page.statistics.publisher" = "Editore"
"page.statistics.registerCaveat" = "Il cantone si trova a <em>due</em> salti da un comune (tramite il distretto) — non esiste un arco diretto, e <code>containedInPlace*</code> non lo raggiunge"
"page.statistics.registerGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffso%2Fregister\">fso/register</a>"
"page.statistics.registerGroup" = "<strong>Elenco dei comuni</strong>"
"page.statistics.registerModel" = "<strong>version.link</strong> sopra lo standard <code>eCH-0071</code> — identità stabili con versioni datate, più risorse <code>ChangeEvent</code> che registrano fusioni e ridenominazioni"
"page.statistics.registerSize" = "~3250 comuni politici, ~5870 versioni di comuni, ~5845 mutazioni, ~265 distretti"
"page.statistics.sfaPublisher" = "Archivio federale svizzero"
"page.statistics.sharedDimensions" = "Dimensioni condivise"
"page.statistics.sharedDimensionsWhy" = "Il senso di pubblicarle centralmente è che due uffici che misurano lo stesso lago, o lo stesso aerodromo, usino la stessa IRI per designarlo. Quando il tema <a href=\"/energy.html\">energia</a> elenca una centrale idroelettrica e il tema <a href=\"/environment.html\">ambiente</a> riferisce sul fiume su cui sorge, è la dimensione condivisa a permettere di metterli in relazione."
"page.statistics.size" = "Dimensione"
"page.statistics.statistics" = "Statistica"
"page.statistics.subtitle" = "I dati di riferimento rispetto a cui tutto il resto viene misurato — ogni comune, ogni impresa iscritta e gli elenchi di codici che la statistica svizzera concorda di condividere."
"page.statistics.territorialContents" = "Paesi e continenti, oltre a elenchi di codici geografici condivisi — centrali idroelettriche, acque di balneazione, regioni di allerta incendi boschivi, aerodromi, regioni biogeografiche"
"page.statistics.territorialGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Fterritorial\">territorial</a>"
"page.statistics.territorialGroup" = "<strong>Dati di riferimento territoriali</strong>"
"page.statistics.territorialIntro" = "Il grafo <strong>territorial</strong> è piccolo ma sostiene assai più del suo peso. Contiene le risorse di Paesi, cantoni e distretti a cui puntano le osservazioni dei cubi di tutta la piattaforma, oltre a una serie di <strong>dimensioni condivise</strong> — elenchi di codici già pronti per ciò che ricorre da un tema all'altro: centrali idroelettriche, stazioni di misurazione delle acque di balneazione, regioni di allerta incendi boschivi, aerodromi civili e militari, regioni biogeografiche."
"page.statistics.territorialSize" = "~284 Paesi, ~301 aree amministrative, 18 dimensioni condivise, 6 continenti"
"page.statistics.theDatasets" = "I set di dati"
"page.statistics.theGreatMerging" = "La grande ondata di fusioni"
"page.statistics.theMunicipalities" = "Tremilacinquecento comuni"
"page.statistics.title" = "Statistica & registri"
"page.statistics.twoProblems" = "Due problemi dominano, e i due grafi principali ne risolvono uno ciascuno. I dati di riferimento <strong>cambiano</strong> — i comuni si fondono, e una statistica su Wald del 2005 non riguarda lo stesso territorio di una del 2025. E i dati di riferimento devono essere <strong>condivisi</strong> — se l'ufficio della sanità e quello del lavoro inventano ciascuno i propri codici professionali, le loro cifre non potranno mai essere unite. L'<strong>Ufficio federale di statistica</strong> risponde a entrambi, con un elenco dei comuni versionato e la piattaforma di interoperabilità I14Y."

