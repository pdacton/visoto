"page.plazi.bacteriaSingleCelledProkaryoticMicroorganisms" = "Batteri — microrganismi procarioti unicellulari presenti in quasi ogni habitat."
"page.plazi.cc010PublicDomain" = "<a href=\"https://creativecommons.org/publicdomain/zero/1.0/\" target=\"_blank\" rel=\"noopener\">CC0 1.0 (pubblico dominio)</a>"
"page.plazi.chromista" = "Chromista"
"page.plazi.chromistsAlgaeAndProtistsSuch" = "Cromisti — alghe e protisti come diatomee, alghe brune e muffe acquatiche."
"page.plazi.classesInTheDataset" = "Classi nel set di dati"
"page.plazi.everyOrganismDescribedInThe" = "Ogni organismo descritto in letteratura è collocato in una <strong>classificazione</strong> gerarchica. In cima si trovano alcuni regni che raggruppano tutti gli esseri viventi. Ogni regno qui sotto è rappresentato da una risorsa <a href=\"/resource?iri=http%3A%2F%2Ftaxon-name.plazi.org%2Fid%2FTaxonName\">TaxonName</a> che puoi esplorare in Visoto per scendere lungo l'albero della vita."
"page.plazi.fungi" = "Fungi"
"page.plazi.fungiMouldsYeastsAndMushrooms" = "Funghi — muffe, lieviti e funghi superiori che assorbono i nutrienti dall'ambiente circostante."
"page.plazi.identifier" = "Identificatore"
"page.plazi.landingPage" = "Pagina di destinazione"
"page.plazi.lastModified" = "Ultima modifica"
"page.plazi.license" = "Licenza"
"page.plazi.openUse" = "<a href=\"https://ld.admin.ch/vocabulary/TermsOfUse/Open-Use\" target=\"_blank\" rel=\"noopener\">Libero utilizzo</a>"
"page.plazi.plantae" = "Plantae"
"page.plazi.plantsMostlyPhotosyntheticOrganismsFrom" = "Piante — organismi in gran parte fotosintetici, dai muschi alle piante da fiore."
"page.plazi.plazi" = "<a href=\"https://plazi.org\" target=\"_blank\" rel=\"noopener\">Plazi</a>"
"page.plazi.plaziClassification" = "Classificazione Plazi"
"page.plazi.plaziIsANotFor" = "<a href=\"https://plazi.org/\" target=\"_blank\" rel=\"noopener\">Plazi</a> è un'organizzazione senza scopo di lucro che libera il sapere tassonomico dalla letteratura scientifica. Converte le descrizioni delle specie — i cosiddetti <em>trattamenti</em> — dagli articoli pubblicati in dati leggibili dalle macchine e liberamente accessibili, e li pubblica come linked data."
"page.plazi.plaziTreatmentBankDealsWithScientific" = "Plazi TreatmentBank si occupa di letteratura biosistematica scientifica pubblicata — il corpus che documenta tutte le circa 1,9 milioni di specie conosciute al mondo, su una stima di 500 milioni di pagine pubblicate. Ogni <em>trattamento</em> è una porzione ben definita di un articolo che fissa l'uso di un nome scientifico da parte di un autore in un dato momento; come i riferimenti bibliografici, i trattamenti possono essere citati e si basano su quelli precedenti. Insieme rappresentano l'attuale consenso scientifico sulla tassonomia biologica, referenziano integralmente la letteratura sottostante e rimandano a esemplari e immagini archiviati presso Zenodo/CERN. Le pubblicazioni citate sono disponibili tramite il <a href=\"https://zenodo.org/communities/biosyslit/\" target=\"_blank\" rel=\"noopener\">Biodiversity Literature Repository</a>."
"page.plazi.plaziTreatmentsRdf" = "<code>plazi-treatments-rdf</code>"
"page.plazi.protozoa" = "Protozoa"
"page.plazi.protozoaSingleCelledEukaryoticOrganisms" = "Protozoi — organismi eucarioti unicellulari come amebe e flagellati."
"page.plazi.published" = "<span class=\"badge bg-green-lt\">Pubblicato</span>"
"page.plazi.publisher" = "Editore"
"page.plazi.sparqlEndpoint" = "Endpoint SPARQL"
"page.plazi.status" = "Stato"
"page.plazi.synospeciesPlaziOrg" = "<a href=\"https://synospecies.plazi.org\" target=\"_blank\" rel=\"noopener\">synospecies.plazi.org</a>"
"page.plazi.taxonNamesUnit" = "nomi di taxon"
"page.plazi.termsOfUse" = "Condizioni d'uso"
"page.plazi.theClassesBelowAreEvery" = "Le classi qui sotto sono tutte le classi dichiarate nel grafo come <code>rdfs:Class</code>/<code>owl:Class</code> oppure usate come oggetto di un'asserzione <code>rdf:type</code>, ordinate per numero di istanze. Quando una classe è definita in un vocabolario caricato nello store, ne viene mostrata la descrizione. Il contenuto sulla biodiversità è nelle prime righe (citazioni di materiale, concetti e nomi di taxon, trattamenti, figure e articoli); le righe con una sola istanza descrivono il set di dati stesso."
"page.plazi.theDataset" = "Il set di dati"
"page.plazi.thePlaziClassificationShownAbove" = "La classificazione Plazi mostrata sopra si basa sul set di dati <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffoen%2Fplazi\">Plazi Taxonomic Treatments</a>, pubblicato su LINDAS nel grafo denominato <code>https://lindas.admin.ch/foen/plazi</code>."

