"page.health.dailyCasesDeathsAndHospitalizations" = "Casi, decessi e ospedalizzazioni giornalieri per Cantone; dosi di vaccino per regione e per vaccino; popolazione vaccinata per stato (24 feb. 2020 – 1° gen. 2023)"
"page.health.dailySnapshotsOfOpenDisruptions" = "Istantanee giornaliere delle interruzioni aperte per medicinale (codice ATC, GTIN, inizio e fine prevista), più un aggregato giornaliero aperto/chiuso"
"page.health.dataset" = "Set di dati"
"page.health.dosesAdministeredByRegionAnd" = "Dosi somministrate per regione e per vaccino — il più grande dei tre cubi, perché ogni giorno è suddiviso per produttore."
"page.health.fonesFederalOfficeForNational" = "UFAE — Ufficio federale per l'approvvigionamento economico del Paese"
"page.health.fophFederalOfficeOfPublic" = "UFSP — Ufficio federale della sanità pubblica"
"page.health.from24February2020The" = "Dal 24 febbraio 2020 — il giorno in cui la Svizzera ha confermato il primo caso — al 1° gennaio 2023, l'Ufficio federale della sanità pubblica ha registrato la pandemia giorno per giorno: <span hx-get=\"/api/metric/healthReportingDays\" hx-trigger=\"load\" hx-swap=\"innerHTML\"> <span class=\"spinner-border spinner-border-sm text-muted\" role=\"status\"></span> </span> giorni di rilevamento, per l'intero Paese e per ogni Cantone. I dati sono organizzati in tre <a href=\"/resource?iri=https%3A%2F%2Fcube.link%2FCube\">cubi di dati</a> e, a differenza della maggior parte dei set LINDAS, questo non crescerà mai più: è la cronaca statistica conclusa di un evento, conservata proprio perché è chiusa."
"page.health.groupingTheOpenDisruptionsBy" = "Raggruppare le interruzioni aperte secondo la prima lettera del loro codice ATC — il gruppo anatomico principale — mostra <em>quali tipi</em> di medicinali scarseggiano. Raramente sono gli antidolorifici quotidiani: di norma dominano l'elenco le terapie oncologiche e gli antinfettivi, le categorie con le catene di fornitura più fragili."
"page.health.health" = "Salute"
"page.health.landingPage" = "Pagina di destinazione"
"page.health.medicineSupplyDisruptions" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffones%2Fsupply-disruptions\">Interruzioni di fornitura di medicinali</a>"
"page.health.namedGraph" = "Grafo denominato"
"page.health.peopleRatherThanDosesHow" = "Persone anziché dosi: quanti residenti di ciascun Cantone avevano quale stato vaccinale, dalla prima dose al secondo richiamo."
"page.health.publisher" = "Editore"
"page.health.sixVaccinesWereAdministeredIn" = "In Svizzera sono stati somministrati sei vaccini, ciascuno modellato come <a href=\"/resource?iri=http%3A%2F%2Fschema.org%2FTherapeuticProcedure\">procedura terapeutica</a> collegata al proprio produttore — le due varianti bivalenti sono registrate separatamente dalle formulazioni originali. Il cubo della popolazione vaccinata suddivide i suoi conteggi per stato vaccinale, un piccolo vocabolario controllato che vale la pena leggere prima di interrogare quel cubo."
"page.health.size" = "Dimensione"
"page.health.sparqlEndpoint" = "Endpoint SPARQL"
"page.health.theDatasets" = "I set di dati"
"page.health.theEpidemiologicalCoreDailyAnd" = "Il nucleo epidemiologico: cifre giornaliere e cumulate per Cantone e per l'intero Paese, ciascuna con la popolazione di riferimento."
"page.health.theMedicineCabinet" = "L'armadietto dei medicinali"
"page.health.thePandemicRecord" = "La cronaca della pandemia"
"page.health.theVaccines" = "I vaccini"
"page.health.twoLINDASGraphsCoverPublic" = "Due grafi LINDAS coprono la sanità pubblica, e il loro temperamento non potrebbe essere più diverso. Il <strong>grafo COVID-19 dell'UFSP</strong> è un archivio sigillato: la cronaca giornaliera completa della pandemia in Svizzera — casi, decessi, ospedalizzazioni, vaccinazioni — congelata al 1° gennaio 2023, quando è cessato l'obbligo di notifica quotidiana. Il <strong>grafo delle interruzioni di fornitura dell'UFAE</strong> ne è l'opposto, un flusso vivo: ogni giorno l'Ufficio federale per l'approvvigionamento economico del Paese pubblica una nuova istantanea di quali medicinali vitali sono attualmente indisponibili e quando se ne prevede il ritorno."
"page.health.vaccinatedPopulation" = "Popolazione vaccinata"
"page.health.vaccineDoses" = "Dosi di vaccino"
"page.plazi.1July2023" = "1° luglio 2023"
"page.plazi.30May2026" = "30 maggio 2026"
"page.plazi.aboutPlazi" = "Informazioni su Plazi"
"page.plazi.animalia" = "Animalia"
"page.plazi.animalsMulticellularOrganismsThatFeed" = "Animali — organismi pluricellulari che si nutrono di altri organismi."
"page.plazi.bacteria" = "Bacteria"
"page.plazi.bacteriaSingleCelledProkaryoticMicroorganisms" = "Batteri — microrganismi procarioti unicellulari presenti in quasi ogni habitat."
"page.plazi.cc010PublicDomain" = "<a href=\"https://creativecommons.org/publicdomain/zero/1.0/\" target=\"_blank\" rel=\"noopener\">CC0 1.0 (pubblico dominio)</a>"
"page.plazi.chromista" = "Chromista"
"page.plazi.chromistsAlgaeAndProtistsSuch" = "Cromisti — alghe e protisti come diatomee, alghe brune e muffe acquatiche."
"page.plazi.classesInTheDataset" = "Classi nel set di dati"
"page.plazi.everyOrganismDescribedInThe" = "Ogni organismo descritto in letteratura è collocato in una <strong>classificazione</strong> gerarchica. In cima si trovano alcuni regni che raggruppano tutti gli esseri viventi. Ogni regno qui sotto è rappresentato da una risorsa <a href=\"/resource?iri=http%3A%2F%2Ftaxon-name.plazi.org%2Fid%2FTaxonName\">TaxonName</a> che puoi esplorare in Visoto per scendere lungo l'albero della vita."
"page.plazi.fungi" = "Fungi"
