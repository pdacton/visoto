"page.government.caveat" = "Avvertenza"
"page.government.contents" = "Contenuto"
"page.government.crossLinks" = "In questo tema convergono i fili del resto della piattaforma. Le osservazioni di mercato dell'<a href=\"/agriculture.html\">agricoltura</a> indicano il loro ufficio di rilevazione tramite <code>cube:observedBy</code> che punta a organizzazioni dello Staatskalender; i conti dello Stato in <a href=\"/culture.html\">Cultura &amp; archivi</a> e i cubi dell'<a href=\"/energy.html\">energia</a> fanno lo stesso tramite risorse <code>ld.admin.ch/office</code>. I settori di TERMDAT, a loro volta, si leggono come un indice di tutto LINDAS — diritto, politica, agricoltura, ambiente, trasporti, medicina."
"page.government.datasetsIntro" = "Tre grafi denominati, tutti pubblicati dalla Cancelleria federale, e tutti costituiti da dati di riferimento verso cui punta il resto della piattaforma anziché da statistiche a sé stanti."
"page.government.departmentsIntro" = "Contati con tutto ciò che vi è subordinato, i dipartimenti sono di dimensioni assai disuguali. Il <strong>DDPS</strong> è di gran lunga il più grande — porta con sé l'intera struttura dell'esercito, ragione per cui un dipartimento dalla sede contenuta si dispiega in migliaia di unità. La <strong>Cancelleria federale</strong>, che coordina il governo anziché erogare prestazioni, è la più piccola di un ordine di grandezza."
"page.government.fchPublisher" = "Cancelleria federale"
"page.government.federalCouncilNote" = "Interrogandola sul Consiglio federale si ottengono i sette membri in carica con il loro nome, ciascuno tramite una funzione chiamata semplicemente <em>Mitglied</em>. Lo stesso schema restituisce i giudici di ogni tribunale federale e le direzioni di ogni ufficio."
"page.government.fourLanguagesCaveat" = "Qui figurano solo le voci che recano un'abbreviazione in tutte e quattro le lingue; moltissimi concetti sono registrati nelle tre lingue nazionali senza equivalente inglese, e mancano da questa tabella anziché essere incompleti. L'inglese è un'aggiunta di lavoro a TERMDAT e non una lingua ufficiale della Confederazione — per questo alcune righe ripetono la forma francese nella colonna inglese quando non esiste un'abbreviazione inglese distinta."
"page.government.group" = "Gruppo"
"page.government.hierarchyIntro" = "Lo Staatskalender è un unico albero tenuto insieme da <code>schema:parentOrganization</code>, e il suo livello superiore è l'ordinamento costituzionale svizzero tradotto in dati. Il <strong>Consiglio federale</strong> è a capo di sette dipartimenti e della Cancelleria federale; i <strong>tribunali federali</strong> — Tribunale federale, Tribunale amministrativo federale, Tribunale penale federale e Tribunale federale dei brevetti — gli stanno accanto e non al di sotto, come esige la separazione dei poteri; e i cantoni formano un ramo proprio accanto alla Confederazione."
"page.government.intro" = "I tre grafi qui riuniti provengono tutti dalla <strong>Cancelleria federale</strong> e insieme rispondono a una domanda che gli altri temi danno per scontata: <em>chi è lo Stato, esattamente?</em> Ogni altra pagina di questo sito rimanda a un ufficio — un'autorità editrice, la fonte di una statistica. È qui che quegli uffici vengono effettivamente definiti."
"page.government.metaTitle" = "Governo & amministrazione"
"page.government.model" = "Modello"
"page.government.namedGraph" = "Grafo denominato"
"page.government.organizationCaveat" = "Usa IRI <code>ld.admin.ch/ou/</code> che <em>non</em> corrispondono alle IRI di organizzazione dello Staatskalender — i due grafi descrivono gli stessi enti ma non possono essere uniti direttamente"
"page.government.organizationGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Forganization\">fch/organization</a>"
"page.government.organizationGroup" = "<strong>Dati organizzativi</strong>"
"page.government.organizationModel" = "<strong>version.link</strong> — una <code>Identity</code> stabile per unità, con una catena datata di risorse <code>Version</code> collegate da <code>predecessor</code>/<code>successor</code>"
"page.government.organizationSize" = "~20 200 identità organizzative con ~38 600 versioni datate, di cui ~30 600 obsolete"
"page.government.peopleInRoles" = "Le persone e le funzioni che ricoprono"
"page.government.publisher" = "Editore"
"page.government.rolesCaveat" = "Le denominazioni delle funzioni sono qui filtrate in tedesco affinché ogni funzione compaia una sola volta; le stesse risorse recano anche denominazioni francesi e italiane, e aprendo una funzione si vedono tutte. Si noti inoltre che solo circa la metà delle persone nel repertorio ha un genere registrato e solo una parte un numero di telefono diretto — il registro elenca anzitutto funzioni e solo in secondo luogo individui."
"page.government.rolesIntro" = "Una persona non è mai collegata direttamente a un ufficio. Tra i due si inserisce un'<strong>OrganizationRole</strong> — una piccola risorsa che nomina la funzione e punta alla persona con <code>schema:member</code> e all'unità con <code>schema:memberOf</code>. È una scelta di modellazione che merita attenzione: poiché la funzione è una risorsa a sé, una stessa persona può ricoprire più funzioni distinte in più enti senza che vengano confuse, e la funzione stessa (<em>Mitglied</em>, <em>Direktor</em>, <em>Juge fédéral suppléant</em>) è un dato e non un'etichetta sepolta in una stringa."
"page.government.shapeOfTheState" = "La struttura dello Stato"
"page.government.size" = "Dimensione"
"page.government.staatskalenderContents" = "La Confederazione come esiste oggi: governo, dipartimenti, uffici, tribunali federali, Ministero pubblico, Servizi del Parlamento e cantoni"
"page.government.staatskalenderGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Fstaatskalender\">fch/staatskalender</a>"
"page.government.staatskalenderGroup" = "<strong>Staatskalender</strong>"
"page.government.staatskalenderModel" = "Puro schema.org — <code>GovernmentOrganization</code> in un albero padre/figlio, con <code>OrganizationRole</code> a fare da tramite tra persone e unità"
"page.government.staatskalenderSize" = "~11 500 unità amministrative, ~6 800 persone, ~3 570 funzioni, ~9 800 indirizzi postali"
"page.government.subtitle" = "Chi lavora per la Confederazione, in quale ufficio, con quale denominazione — e il vocabolario quadrilingue con cui lo Stato lo esprime."
"page.government.termdat" = "Dire la stessa cosa in quattro lingue"
"page.government.termdatCaveat" = "I termini rimandano a un <em>sotto</em>-settore, non a un settore — il settore si trova a due salti tramite <code>schema:isPartOf</code>, e una query a un solo salto non restituisce nulla senza segnalarlo"
"page.government.termdatContents" = "La banca dati terminologica della Confederazione — concetti con i loro termini preferenziali, sinonimi, abbreviazioni e fraseologia in tedesco, francese, italiano e inglese, molti con definizioni che citano l'atto normativo da cui provengono"
"page.government.termdatGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Ftermdat\">fch/termdat</a>"
"page.government.termdatGroup" = "<strong>TERMDAT</strong>"
"page.government.termdatIntro" = "Uno Stato federale con quattro lingue ufficiali ha un problema che nessuna amministrazione monolingue conosce: ogni legge, modulo e comunicato deve esistere in tedesco, francese e italiano, e le parole devono significare esattamente la stessa cosa in ciascuna lingua. <strong>TERMDAT</strong> è la risposta della Cancelleria — la banca dati terminologica dell'Amministrazione federale e la più ampia risorsa di questo tipo nel Paese."
"page.government.termdatLawNote" = "Il diritto domina la raccolta con ampio margine, la politica segue a notevole distanza — un'immagine fedele di ciò che la Confederazione deve tradurre con precisione più di frequente. Sotto di essi i settori seguono quasi esattamente il resto di questo sito: agricoltura e selvicoltura, ambiente, medicina, finanze, trasporti."
"page.government.termdatSize" = "~78 000 termini, ~63 000 sinonimi, ~35 000 voci validate, ~8 900 abbreviazioni, 41 settori"
"page.government.termdatStatus" = "Le voci recano anche il proprio stato redazionale. La maggior parte è <strong>validata</strong> — verificata e approvata dalla Sezione di terminologia —, mentre altre sono contrassegnate come in lavorazione o obsolete, così che una query possa limitarsi alla terminologia effettivamente autorevole. Molte voci aggiungono una definizione con la <em>citazione dell'atto normativo da cui proviene</em>, il che fa della banca dati un percorso dalla parola all'articolo di legge che la definisce."
"page.government.termdatStructure" = "Il modello mette al primo posto il <em>concetto</em>, non la parola. Una voce è un concetto; i termini di ciascuna lingua vi si agganciano tramite <code>schema:hasPart</code>, ognuno con una posizione che indica se è il termine preferenziale o una variante ammessa. Questa inversione è ciò che rende la banca dati utilizzabile come ausilio alla traduzione: la legge sulla trasparenza è una voce che porta <code>BGÖ</code>, <code>LTrans</code>, <code>LTras</code> e <code>FoIA</code> come quattro nomi di una sola cosa, anziché quattro record distinti che sperano di essere accoppiati. La tabella più sotto mostra esattamente questo, per ogni atto federale abbreviato in tutte e quattro le lingue."
"page.government.theDatasets" = "I set di dati"
"page.government.threeAnswers" = "Vi rispondono in tre modi diversi. Lo <strong>Staatskalender</strong> è il repertorio così com'è oggi: ogni unità, il suo indirizzo e le persone che vi ricoprono funzioni. I <strong>dati organizzativi</strong> mostrano la stessa amministrazione nel tempo, conservando ogni ridenominazione e riorganizzazione come versione datata. <strong>TERMDAT</strong> è il vocabolario stesso — la terminologia dell'amministrazione in tedesco, francese, italiano e inglese, affinché lo stesso concetto giuridico possa essere denominato correttamente in tutte e quattro le lingue."
"page.government.throughTime" = "L'amministrazione nel tempo"
"page.government.title" = "Governo & amministrazione"
"page.government.topLevelIntro" = "Sopra i dipartimenti stanno gli organi che all'interno dell'amministrazione non rispondono a nessuno. Elencare le organizzazioni prive di qualsiasi ente superiore restituisce il vertice costituzionale dell'albero in una sola query — il governo, i quattro tribunali federali, il Ministero pubblico e la sua autorità di vigilanza, i Servizi del Parlamento e i cantoni."
"page.government.versioningCaveat" = "Un numero elevato di versioni è meno un segno di instabilità che di aggiornamento capillare — un cambio di indirizzo o un'abbreviazione corretta genera una versione tanto quanto una fusione. Si noti inoltre che questo grafo usa IRI <code>ld.admin.ch/ou/</code> mentre lo Staatskalender usa <code>register.ld.admin.ch/staatskalender/organization/</code>: descrivono la stessa amministrazione ma non sono le stesse risorse e non si uniscono tramite l'IRI."
"page.government.versioningConsequence" = "Ne consegue che gran parte del contenuto di questo grafo è deliberatamente <em>storica</em>: la larga maggioranza delle versioni è contrassegnata come obsoleta perché è stata sostituita. Questo è lo scopo, non un difetto. Quando un ufficio viene ridenominato o assorbito, la vecchia versione non viene sovrascritta — viene chiusa con una data di fine e collegata a ciò che l'ha sostituita, così che un riferimento tratto da un documento redatto nel 2015 si risolva ancora nell'ente che esisteva allora."
"page.government.versioningIntro" = "Il grafo organizzativo è il modello più insolito di questo tema, e forse dell'intera piattaforma. Non descrive l'amministrazione com'è; descrive <em>ogni stato in cui l'amministrazione si è trovata</em>. Ogni unità ha una <strong>identità</strong> stabile, e a questa identità è agganciata una catena di <strong>versioni</strong> datate, ciascuna con una data di inizio, una data di fine e collegamenti <code>predecessor</code> e <code>successor</code> alle sue vicine nel tempo."

