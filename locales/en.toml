# Base catalog: the English source of truth for the frontend strings only.
#
# UI text for TEMPLATES now lives inline at the call site, as the fallback
# argument to {{ t "key" "English text" }} — the catalog no longer duplicates it.
# Translations for those keys still live in de/fr/it/rm.toml and continue to win
# over the inline text; this file simply no longer restates the English.
#
# What remains here are the js.* strings, which have no template call site: they
# are serialized into a JSON island (see i18n.Catalogs.JSStrings and base.html)
# and read by static/js through window.vsT. Deleting them would silently drop
# every non-English frontend string, so they must stay in the catalog.
#
# This file must exist: i18n.Load treats a missing base catalog as fatal.

