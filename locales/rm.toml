"page.graphHelp.title" = "Lavurar cun grafs"
"page.graphHelp.subtitle" = "Disponer, filtrar, memorisar e parter ils diagrams interactivs da las paginas Visoto."
"page.graphHelp.moveTitle" = "Sa mover"
"page.graphHelp.move1" = "En il modus Spustar (maun) mova il tirar sin surfatscha vida la vista; en il modus Tscherner (rom punctà) dissegna el in rom da selecziun. Shift+tirar dissegna in rom en omadus modus."
"page.graphHelp.move2" = "Zoomar cun ils buttuns + e − u Ctrl+rodella. Adattar mussa l'entir diagram u la selecziun, sch'i dat ina. Il buttun en il chau da la carta avra il graf sin l'entir visur."
"page.graphHelp.move3" = "Sin visurs tactils utilisai il modus Tscherner per tirar nufs e dissegnar roms; en il modus Spustar scrolla in det la surfatscha."
"page.graphHelp.selectTitle" = "Tscherner"
"page.graphHelp.select1" = "Cliccar sin in nuf per al tscherner; Ctrl+clic (⌘+clic sin in Mac) agiunta u allontana in nuf. Ctrl+A tscherna tut, Esc annullescha la selecziun."
"page.graphHelp.select2" = "Uschè ditg che nufs èn tschernids, porscha ina trav giudim: agiuntar tut ils vischins, tscherner ils vischins, disponer la selecziun, fixar, orientar e distribuir, mantegnair mo quests ed allontanar. Tirar in nuf tschernì spusta l'entira selecziun."
"page.graphHelp.layoutTitle" = "Disposiziuns e fixaziuns"
"page.graphHelp.layout1" = "Il menu Disposiziun ordina il diagram sco Rait, sco Planta (da sura engiu u da sanestra a dretga) u radial en rintgs enturn in nuf. Cun dus u dapli nufs tschernids vegn mo la selecziun disponida."
"page.graphHelp.layout2" = "In nuf che Vus tirais u orientais vegn fixà (glimaun): las disposiziuns al laschan nua ch'el è. Cliccai sin il glimaun u utilisai Fixar en la trav da selecziun per al liberar."
"page.graphHelp.layout3" = "Las opziuns da disposiziun enumereschan las proprietads en il diagram; invertai ina per la volver en las disposiziuns da Planta (superclassas sisum è il standard), e smatgai lura Dissegnar da nov."
"page.graphHelp.contentTitle" = "Agiuntar, zuppentar, chattar"
"page.graphHelp.content1" = "Il buttun + chatta resursas tenor designaziun u accepta in IRI encollà. In nuf tschernì mussa era il menu da Graph Explorer per suandar sias colliaziuns. Dapli che 20 nufs novs a la giada dumondan l'emprim ina conferma."
"page.graphHelp.content2" = "Classas e spazis da nums enumerescha tge ch'è en il diagram; l'egl zuppenta u mussa quels nufs senza als perder. Nufs zuppentads restan ordaifer las disposiziuns e l'export."
"page.graphHelp.content3" = "La lupa chatta nufs ch'èn gia en il diagram e zooma sin els; Enter als tscherna."
"page.graphHelp.saveTitle" = "Memorisar e parter"
"page.graphHelp.save1" = "Mintga midada po vegnir revocada. Vossa disposiziun vegn memorisada automaticamain en quest navigatur e returna cura che Vus avris danovamain la pagina; Redefinir il diagram (menu ⋮) returna a la vista da la pagina."
"page.graphHelp.save2" = "Memorisar sco… salva diagrams cun num en quest navigatur (Mes diagrams). Telechargiar la datoteca scriva in .visoto-graph.json che mintgin po avrir cun Avrir ina datoteca…; el sa regorda da ses endpoint SPARQL. Exportar scriva Turtle, SVG, PNG u stampa."
"page.graphHelp.a11yTitle" = "Senza mieur"
"page.graphHelp.a11y1" = "La vista da glista mussa il diagram sco tabellas da nufs e colliaziuns, cun ina chaschetta per nuf che al tscherna era en il diagram — il medem diagram per tastatura e lectur da visur."
"page.graphHelp.a11y2" = "Mintga buttun da la trav d'utensils ha ina inscripziun e po vegnir cuntanschì cun Tab. Il buttun ? enumerescha las scursanidas da tastatura."
