"page.facets.aDemonstrationOfTheSparqlAsyncTable" = "Une démonstration du partial <code>sparqlAsyncTable</code> en mode facettes sur <strong>ZefixOrganisation</strong> (~790 000 entreprises suisses inscrites). Chaque colonne facettable porte un <strong>contrôle de filtre dans son en-tête</strong> (l'icône entonnoir), piloté par les déclarations <code>&lt;sparql-facet&gt;</code> de cette page. Une sélection filtre <strong>instantanément les lignes chargées</strong> dans le navigateur ; comme cette classe est trop grande pour être conservée entièrement, l'application va ensuite chercher discrètement les <strong>vrais résultats de la classe entière</strong> auprès du backend et les substitue — vous obtenez un aperçu immédiat et un résultat faisant autorité, sans jamais être confronté à la taille."
