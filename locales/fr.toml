# ── Page: statistics ──────────────────────────────────────────────────
"page.statistics.aboutThisTheme" = "À propos de ce thème"
"page.statistics.caveat" = "Réserve"
"page.statistics.contents" = "Contenu"
"page.statistics.crossLinks" = "Tout sur cette plateforme finit par pointer ici. Les IRI de communes et de cantons issues de ce registre apparaissent aussi bien dans les <a href=\"/energy.html\">tarifs de l'électricité</a> que dans les <a href=\"/agriculture.html\">déclarations d'épizooties</a> et les <a href=\"/politics.html\">résultats de votations</a> ; les IDE d'entreprises tirés de Zefix identifient les gestionnaires de réseau derrière ces tarifs ; les dimensions partagées portent les stations de mesure <a href=\"/environment.html\">environnementales</a> ; et les classifications sous-tendent les dimensions de cubes utilisées partout. Lorsqu'un chiffre d'une autre page se résout vers un lieu, une entreprise ou un code, c'est ici qu'il se résout."
"page.statistics.datasetsIntro" = "Cinq graphes nommés provenant de trois éditeurs. Fait inhabituel sur cette plateforme, aucun d'eux ne contient la moindre observation — ce sont uniquement des définitions, des identifiants et des listes de codes."
"page.statistics.fsoPublisher" = "Office fédéral de la statistique (OFS)"
"page.statistics.group" = "Groupe"
"page.statistics.i14y" = "Les listes de codes sur lesquelles tout le monde s'accorde"
"page.statistics.i14yCaveat" = "I14Y est versionné de manière systématique : chaque classification existe sous forme d'identité stable plus un schéma de concepts par version publiée, et ce sont les schémas de version que renvoient les comptages bruts. Le tableau ci-dessus se limite aux identités. Notez également le préfixe <code>DV_</code> sur de nombreux identifiants — ce sont les copies du vocabulaire distribué, portant parfois un nombre de concepts légèrement différent de l'original du même nom."
"page.statistics.i14yCaveatCard" = "Chaque classification apparaît une fois comme identité et une fois par version publiée — filtrez sur <code>version.link/Identity</code>, sinon la même liste se répète avec des comptages légèrement différents"
"page.statistics.i14yContents" = "Le catalogue fédéral des listes de codes : professions (CH-ISCO-19), maladies (CIM-10-GM), interventions chirurgicales (CHOP), branches économiques (NOGA), langues, pays, aéroports, unités spatiales de base"
"page.statistics.i14yGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffso%2Fi14y\">fso/i14y</a>"
"page.statistics.i14yGroup" = "<strong>Plateforme d'interopérabilité I14Y</strong>"
"page.statistics.i14yIntro" = "<strong>I14Y</strong> — le numéronyme d'<em>interopérabilité</em> — est la plateforme fédérale où les services publient les listes de codes qu'ils utilisent, afin que d'autres puissent adopter les mêmes au lieu d'en inventer des versions parallèles. C'est de loin le plus grand graphe de ce thème, et son contenu résume assez fidèlement ce que l'État suisse compte : professions, maladies, interventions chirurgicales, branches économiques, langues, pays, aéroports."
"page.statistics.i14yModel" = "Tout est modélisé en <strong>SKOS</strong>, le vocabulaire standard des systèmes de classification, complété par <code>xkos:ClassificationLevel</code> pour marquer les échelons d'une hiérarchie — ainsi un code de profession à quatre chiffres sait qu'il se situe sous un groupe à trois chiffres. Les concepts portent leurs relations génériques et spécifiques, et c'est précisément ce qui rend une classification utilisable pour l'agrégation et non seulement pour la consultation."
"page.statistics.i14yNames" = "Les noms de ce tableau méritent d'être lus comme une liste. <strong>CH-ISCO-19</strong> est la nomenclature suisse des professions, l'élément le plus vaste ici avec quelque vingt-cinq mille entrées. <strong>CHOP</strong> est la classification des interventions chirurgicales et <strong>CIM-10-GM</strong> celle des maladies — les deux étant codées par chaque hôpital suisse. <strong>NOGA</strong> est la nomenclature des activités économiques qui sous-tend la statistique des entreprises. Ensemble, elles forment le vocabulaire dans lequel l'État décrit le travail, la maladie et l'économie."
"page.statistics.i14ySize" = "~453 000 concepts SKOS dans ~670 schémas de concepts, ~134 000 identités portant ~320 000 versions"
"page.statistics.intro" = "Ce thème est le socle. Rien ici n'est une mesure du monde — c'est la mécanique qui permet de comparer les mesures : à <em>quelle</em> commune un chiffre se rapporte, <em>quelle</em> profession a été enregistrée pour une personne, à <em>quelle</em> branche économique une entreprise appartient. Toutes les autres pages de ce site en dépendent, le plus souvent sans le dire."
"page.statistics.lindasPublisher" = "LINDAS (données partagées de la plateforme)"
"page.statistics.mergersCaveat" = "Toute mutation n'est pas une fusion — le registre emploie le même mécanisme pour les changements de nom, les corrections de limites et les transferts entre districts ; le nombre d'événements est donc une borne supérieure des fusions véritables. Un événement à plusieurs prédécesseurs et un successeur est la forme classique de la fusion ; un prédécesseur et un successeur correspondent généralement à un changement de nom."
"page.statistics.mergersIntro" = "La Suisse a compté plus de 3000 communes pendant la majeure partie du XXe siècle et en perd régulièrement depuis — non par une politique fédérale, mais par des milliers de décisions locales de fusionner. Le registre consigne chacune d'elles comme une <strong>mutation</strong>, avec les prédécesseurs absorbés, le successeur qui en résulte et la date d'entrée en vigueur. C'est le même modèle <code>version.link</code> que l'<a href=\"/government.html\">administration fédérale</a> utilise pour ses propres réorganisations."
"page.statistics.mergersWaves" = "Regroupées par année, les fusions arrivent par vagues et non au compte-gouttes. Ce sont les cantons qui les impulsent — un canton offre des incitations financières, et des dizaines de communes fusionnent au même 1er janvier. <strong>2006</strong> et <strong>2010</strong> ressortent nettement, absorbant chacune plus de quatre cents communes dans des successeurs. Comme chaque fusion prend effet au 1er janvier, la carte de la Suisse change en un seul jour par année."
"page.statistics.mergersWhyItMatters" = "Conséquence pratique pour quiconque interroge cette plateforme : une IRI de commune est une <em>version</em>, non un lieu. Si vous joignez une statistique de 2005 à une liste de communes de 2026 sur le seul identifiant, les lignes ayant fusionné entre-temps disparaîtront silencieusement. Le registre existe précisément pour que la jointure puisse se faire correctement, en remontant la chaîne des prédécesseurs."
"page.statistics.metaTitle" = "Statistique & registres"
"page.statistics.model" = "Modèle"
"page.statistics.municipalitiesCaveat" = "Les communes portent en outre un lien <code>geosparql:hasGeometry</code> vers leur polygone de limites dans <code>geo.ld.admin.ch</code>, ainsi qu'un code d'entité GeoNames — le registre est donc aussi une passerelle vers les données cartographiques et pas seulement une liste de noms. Toutes les communes n'ont pas de géométrie rattachée ; la couverture est partielle."
"page.statistics.municipalitiesIntro" = "La commune est l'atome de la statistique suisse : presque tout chiffre publié par la Confédération est soit relevé par commune, soit agrégé à partir des communes. Le registre définit la hiérarchie complète à trois niveaux — <strong>canton</strong>, <strong>district</strong>, <strong>commune</strong> — et sa forme est inégale d'une manière qui reflète l'histoire plutôt que la population. Berne et Vaud comptent chacun des centaines de communes ; les Grisons ont plus de districts que Zurich, pour une fraction des habitants."
"page.statistics.namedGraph" = "Graphe nommé"
"page.statistics.opendataCaveat" = "Bien plus modeste que son nom ne le suggère — il s'agit de la <em>liste des organismes éditeurs</em> derrière le portail national des données ouvertes, et non d'un catalogue de ses jeux de données"
"page.statistics.opendataGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Fsfa%2Fopendataswiss\">sfa/opendataswiss</a>"
"page.statistics.opendataGroup" = "<strong>Moisson opendata.swiss</strong>"
"page.statistics.opendataSize" = "~175 organisations éditrices et ~213 termes définis"
"page.statistics.publisher" = "Éditeur"
"page.statistics.registerCaveat" = "Le canton se trouve à <em>deux</em> sauts d'une commune (via le district) — il n'existe pas d'arête directe, et <code>containedInPlace*</code> ne l'atteint pas"
"page.statistics.registerGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffso%2Fregister\">fso/register</a>"
"page.statistics.registerGroup" = "<strong>Répertoire des communes</strong>"
"page.statistics.registerModel" = "<strong>version.link</strong> par-dessus la norme <code>eCH-0071</code> — des identités stables assorties de versions datées, plus des ressources <code>ChangeEvent</code> consignant fusions et changements de nom"
"page.statistics.registerSize" = "~3250 communes politiques, ~5870 versions de communes, ~5845 mutations, ~265 districts"
"page.statistics.sfaPublisher" = "Archives fédérales suisses"
"page.statistics.sharedDimensions" = "Dimensions partagées"
"page.statistics.sharedDimensionsWhy" = "L'intérêt de les publier de façon centralisée est que deux offices mesurant le même lac, ou le même aérodrome, utilisent la même IRI pour le désigner. Lorsque le thème <a href=\"/energy.html\">énergie</a> répertorie une centrale hydraulique et que le thème <a href=\"/environment.html\">environnement</a> rend compte de la rivière sur laquelle elle se trouve, c'est la dimension partagée qui permet de les relier."
"page.statistics.size" = "Taille"
"page.statistics.statistics" = "Statistique"
"page.statistics.subtitle" = "Les données de référence à l'aune desquelles tout le reste est mesuré — chaque commune, chaque entreprise inscrite, et les listes de codes que la statistique suisse convient de partager."
"page.statistics.territorialContents" = "Pays et continents, ainsi que des listes de codes géographiques partagées — centrales hydrauliques, eaux de baignade, régions d'alerte aux incendies de forêt, aérodromes, régions biogéographiques"
"page.statistics.territorialGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Fterritorial\">territorial</a>"
"page.statistics.territorialGroup" = "<strong>Données de référence territoriales</strong>"
"page.statistics.territorialIntro" = "Le graphe <strong>territorial</strong> est petit mais porteur bien au-delà de sa taille. Il contient les ressources de pays, de cantons et de districts vers lesquelles pointent les observations de cubes de toute la plateforme, ainsi qu'un ensemble de <strong>dimensions partagées</strong> — des listes de codes toutes prêtes pour ce qui revient d'un thème à l'autre : centrales hydrauliques, stations de mesure des eaux de baignade, régions d'alerte aux incendies de forêt, aérodromes civils et militaires, régions biogéographiques."
"page.statistics.territorialSize" = "~284 pays, ~301 zones administratives, 18 dimensions partagées, 6 continents"
"page.statistics.theDatasets" = "Les jeux de données"
"page.statistics.theGreatMerging" = "La grande vague de fusions"
"page.statistics.theMunicipalities" = "Trois mille cinq cents communes"
"page.statistics.title" = "Statistique & registres"
"page.statistics.twoProblems" = "Deux problèmes dominent, et les deux graphes principaux en résolvent chacun un. Les données de référence <strong>changent</strong> — les communes fusionnent, et une statistique portant sur Wald en 2005 ne concerne pas le même territoire qu'une de 2025. Et les données de référence doivent être <strong>partagées</strong> — si l'office de la santé et celui du travail inventent chacun leurs codes de profession, leurs chiffres ne pourront jamais être joints. L'<strong>Office fédéral de la statistique</strong> répond aux deux, avec un répertoire des communes versionné et la plateforme d'interopérabilité I14Y."

