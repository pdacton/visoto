# ── Page: government ──────────────────────────────────────────────────
"page.government.aboutThisTheme" = "À propos de ce thème"
"page.government.administration" = "Administration"
"page.government.caveat" = "Réserve"
"page.government.contents" = "Contenu"
"page.government.crossLinks" = "C'est dans ce thème que convergent les fils du reste de la plateforme. Les observations de marché de l'<a href=\"/agriculture.html\">agriculture</a> désignent leur office source via <code>cube:observedBy</code> pointant vers des organisations du Staatskalender ; les comptes d'État dans <a href=\"/culture.html\">Culture &amp; archives</a> et les cubes de l'<a href=\"/energy.html\">énergie</a> font de même via des ressources <code>ld.admin.ch/office</code>. Les domaines de TERMDAT, quant à eux, se lisent comme une table des matières de tout LINDAS — droit, politique, agriculture, environnement, transports, médecine."
"page.government.datasetsIntro" = "Trois graphes nommés, tous publiés par la Chancellerie fédérale, et tous constitués de données de référence vers lesquelles pointe le reste de la plateforme plutôt que de statistiques à part entière."
"page.government.departmentsIntro" = "Comptés avec tout ce qui leur est subordonné, les départements sont d'une taille remarquablement inégale. Le <strong>DDPS</strong> est de loin le plus grand — il porte toute la structure de l'armée, raison pour laquelle un département au siège modeste se déploie en milliers d'unités. La <strong>Chancellerie fédérale</strong>, qui coordonne le gouvernement au lieu de fournir des prestations, est la plus petite d'un ordre de grandeur."
"page.government.fchPublisher" = "Chancellerie fédérale"
"page.government.federalCouncilNote" = "Interrogez-la sur le Conseil fédéral et vous obtenez les sept membres en exercice par leur nom, chacun via une fonction appelée simplement <em>Mitglied</em>. Le même schéma restitue les juges de chaque tribunal fédéral et les directions de chaque office."
"page.government.fourLanguagesCaveat" = "Seules les entrées portant une abréviation dans les quatre langues figurent ici ; de très nombreux concepts sont consignés dans les trois langues nationales sans équivalent anglais, et ils sont absents de ce tableau plutôt qu'incomplets. L'anglais est un ajout de travail à TERMDAT et non une langue officielle de la Confédération — c'est pourquoi certaines lignes reprennent la forme française dans la colonne anglaise lorsqu'aucune abréviation anglaise distincte n'existe."
"page.government.group" = "Groupe"
"page.government.hierarchyIntro" = "Le Staatskalender est un arbre unique maintenu par <code>schema:parentOrganization</code>, et son niveau supérieur est l'ordre constitutionnel suisse mis en données. Le <strong>Conseil fédéral</strong> est à la tête de sept départements et de la Chancellerie fédérale ; les <strong>tribunaux fédéraux</strong> — Tribunal fédéral, Tribunal administratif fédéral, Tribunal pénal fédéral et Tribunal fédéral des brevets — se tiennent à côté de lui et non en dessous, comme l'exige la séparation des pouvoirs ; et les cantons forment leur propre branche aux côtés de la Confédération."
"page.government.intro" = "Les trois graphes réunis ici proviennent tous de la <strong>Chancellerie fédérale</strong>, et ensemble ils répondent à une question que les autres thèmes tiennent pour acquise : <em>qui est l'État, exactement ?</em> Chaque autre page de ce site renvoie à un office — une autorité éditrice, la source d'une statistique. C'est ici que ces offices sont effectivement définis."
"page.government.metaTitle" = "Gouvernement & administration"
"page.government.model" = "Modèle"
"page.government.namedGraph" = "Graphe nommé"
"page.government.organizationCaveat" = "Utilise des IRI <code>ld.admin.ch/ou/</code> qui ne correspondent <em>pas</em> aux IRI d'organisation du Staatskalender — les deux graphes décrivent les mêmes entités mais ne peuvent pas être joints directement"
"page.government.organizationGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Forganization\">fch/organization</a>"
"page.government.organizationGroup" = "<strong>Données d'organisation</strong>"
"page.government.organizationModel" = "<strong>version.link</strong> — une <code>Identity</code> stable par unité, avec une chaîne datée de ressources <code>Version</code> reliées par <code>predecessor</code>/<code>successor</code>"
"page.government.organizationSize" = "~20 200 identités organisationnelles portant ~38 600 versions datées, dont ~30 600 obsolètes"
"page.government.peopleInRoles" = "Les personnes et les fonctions qu'elles occupent"
"page.government.publisher" = "Éditeur"
"page.government.rolesCaveat" = "Les intitulés de fonction sont filtrés ici en allemand afin que chaque fonction apparaisse une seule fois ; les mêmes ressources portent aussi des intitulés français et italiens, et l'ouverture d'une fonction les montre tous. Notez également que seule la moitié environ des personnes du répertoire a un genre consigné et une partie seulement un numéro de téléphone direct — le registre recense d'abord des fonctions et seulement ensuite des individus."
"page.government.rolesIntro" = "Une personne n'est jamais rattachée directement à un office. Entre les deux s'intercale une <strong>OrganizationRole</strong> — une petite ressource qui nomme la fonction et pointe vers la personne avec <code>schema:member</code> et vers l'unité avec <code>schema:memberOf</code>. Ce choix de modélisation mérite attention : parce que la fonction est une ressource à part entière, une même personne peut occuper plusieurs fonctions distinctes dans plusieurs entités sans qu'elles soient confondues, et la fonction elle-même (<em>Mitglied</em>, <em>Direktor</em>, <em>Juge fédéral suppléant</em>) est une donnée et non un libellé enfoui dans une chaîne de caractères."
"page.government.shapeOfTheState" = "La structure de l'État"
"page.government.size" = "Taille"
"page.government.staatskalenderContents" = "La Confédération telle qu'elle existe aujourd'hui : gouvernement, départements, offices, tribunaux fédéraux, Ministère public, Services du Parlement et cantons"
"page.government.staatskalenderGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Fstaatskalender\">fch/staatskalender</a>"
"page.government.staatskalenderGroup" = "<strong>Staatskalender</strong>"
"page.government.staatskalenderModel" = "Du schema.org pur — <code>GovernmentOrganization</code> dans un arbre parent/enfant, avec <code>OrganizationRole</code> faisant le lien entre personnes et unités"
"page.government.staatskalenderSize" = "~11 500 unités administratives, ~6 800 personnes, ~3 570 fonctions, ~9 800 adresses postales"
"page.government.subtitle" = "Qui travaille pour la Confédération, dans quel office, sous quelle dénomination — et le vocabulaire quadrilingue avec lequel l'État l'exprime."
"page.government.termdat" = "Dire la même chose en quatre langues"
"page.government.termdatCaveat" = "Les termes renvoient à un <em>sous</em>-domaine, non à un domaine — le domaine se trouve à deux sauts via <code>schema:isPartOf</code>, et une requête à un seul saut ne renvoie silencieusement rien"
"page.government.termdatContents" = "La banque de données terminologiques de la Confédération — des concepts avec leurs termes privilégiés, synonymes, abréviations et phraséologie en allemand, français, italien et anglais, beaucoup accompagnés de définitions citant l'acte législatif dont elles proviennent"
"page.government.termdatGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Ftermdat\">fch/termdat</a>"
"page.government.termdatGroup" = "<strong>TERMDAT</strong>"
"page.government.termdatIntro" = "Un État fédéral doté de quatre langues officielles connaît un problème qu'aucune administration monolingue ne rencontre : chaque loi, formulaire et communiqué doit exister en allemand, en français et en italien, et les mots doivent y signifier exactement la même chose. <strong>TERMDAT</strong> est la réponse de la Chancellerie — la banque de données terminologiques de l'administration fédérale, et la plus vaste ressource de ce type dans le pays."
"page.government.termdatLawNote" = "Le droit domine la collection de très loin, la politique venant loin derrière — image fidèle de ce que la Confédération doit le plus souvent traduire avec précision. En dessous, les domaines suivent presque exactement le reste de ce site : agriculture et sylviculture, environnement, médecine, finances, transports."
"page.government.termdatSize" = "~78 000 termes, ~63 000 synonymes, ~35 000 entrées validées, ~8 900 abréviations, 41 domaines"
"page.government.termdatStatus" = "Les entrées portent également leur état de traitement. La plupart sont <strong>validées</strong> — vérifiées et approuvées par la Section de terminologie —, tandis que d'autres sont marquées en cours ou obsolètes, si bien qu'une requête peut se restreindre à la terminologie réellement faisant autorité. De nombreuses entrées ajoutent une définition assortie d'une <em>citation de l'acte législatif dont elle provient</em>, ce qui fait de la banque de données un chemin du mot vers l'article de loi qui le définit."
"page.government.termdatStructure" = "Le modèle place le <em>concept</em> en premier, non le mot. Une entrée est un concept ; les termes de chaque langue s'y rattachent via <code>schema:hasPart</code>, chacun avec une position indiquant s'il est le terme privilégié ou une variante admise. Cette inversion est ce qui fait fonctionner la banque comme aide à la traduction : la loi sur la transparence est une entrée portant <code>BGÖ</code>, <code>LTrans</code>, <code>LTras</code> et <code>FoIA</code> comme quatre noms d'une seule et même chose, plutôt que quatre enregistrements distincts espérant être appariés. Le tableau plus bas montre précisément cela, pour chaque acte fédéral abrégé dans les quatre langues."
"page.government.theDatasets" = "Les jeux de données"
"page.government.threeAnswers" = "Ils y répondent de trois manières différentes. Le <strong>Staatskalender</strong> est le répertoire tel qu'il se présente aujourd'hui : chaque unité, son adresse et les personnes qui y occupent des fonctions. Les <strong>données d'organisation</strong> montrent la même administration à travers le temps, chaque changement de nom et chaque réorganisation étant conservés sous forme de version datée. <strong>TERMDAT</strong> est le vocabulaire lui-même — la terminologie de l'administration en allemand, français, italien et anglais, afin que le même concept juridique puisse être nommé correctement dans les quatre langues."
"page.government.throughTime" = "L'administration à travers le temps"
"page.government.title" = "Gouvernement & administration"
"page.government.topLevelIntro" = "Au-dessus des départements se trouvent les organes qui ne relèvent de personne au sein de l'administration. Énumérer les organisations dépourvues de tout parent donne le sommet constitutionnel de l'arbre en une seule requête — le gouvernement, les quatre tribunaux fédéraux, le Ministère public et son autorité de surveillance, les Services du Parlement et les cantons."
"page.government.versioningCaveat" = "Un nombre élevé de versions est moins le signe d'une instabilité que d'un suivi très fin — un changement d'adresse ou une abréviation corrigée crée une version au même titre qu'une fusion. Notez aussi que ce graphe utilise des IRI <code>ld.admin.ch/ou/</code> alors que le Staatskalender emploie <code>register.ld.admin.ch/staatskalender/organization/</code> : ils décrivent la même administration mais ne sont pas les mêmes ressources et ne se joignent pas par l'IRI."
"page.government.versioningConsequence" = "Il en résulte que l'essentiel du contenu de ce graphe est délibérément <em>historique</em> : la grande majorité des versions est marquée obsolète parce qu'elle a été remplacée. C'est le but, non un défaut. Lorsqu'un office est renommé ou absorbé, l'ancienne version n'est pas écrasée — elle est close par une date de fin et reliée à ce qui lui a succédé, de sorte qu'une référence tirée d'un document rédigé en 2015 se résout encore vers l'entité qui existait alors."
"page.government.versioningIntro" = "Le graphe d'organisation est le modèle le plus inhabituel de ce thème, et peut-être de toute la plateforme. Il ne décrit pas l'administration telle qu'elle est ; il décrit <em>chaque état par lequel l'administration est passée</em>. Chaque unité possède une <strong>identité</strong> stable, à laquelle est rattachée une chaîne de <strong>versions</strong> datées, chacune avec une date de début, une date de fin et des liens <code>predecessor</code> et <code>successor</code> vers ses voisines dans le temps."

