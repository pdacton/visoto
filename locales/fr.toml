"page.plazi.everyOrganismDescribedInThe" = "Chaque organisme décrit dans la littérature est placé dans une <strong>classification</strong> hiérarchique. Tout en haut se trouvent quelques règnes qui regroupent l'ensemble du vivant. Chaque règne ci-dessous est représenté par une ressource <a href=\"/resource?iri=http%3A%2F%2Ftaxon-name.plazi.org%2Fid%2FTaxonName\">TaxonName</a> que vous pouvez explorer dans Visoto pour descendre dans l'arbre du vivant."
"page.plazi.fungi" = "Fungi"
"page.plazi.fungiMouldsYeastsAndMushrooms" = "Champignons — moisissures, levures et champignons supérieurs qui absorbent les nutriments de leur milieu."
"page.plazi.identifier" = "Identifiant"
"page.plazi.landingPage" = "Page d'accueil"
"page.plazi.lastModified" = "Dernière modification"
"page.plazi.license" = "Licence"
"page.plazi.openUse" = "<a href=\"https://ld.admin.ch/vocabulary/TermsOfUse/Open-Use\" target=\"_blank\" rel=\"noopener\">Utilisation libre</a>"
"page.plazi.plantae" = "Plantae"
"page.plazi.plantsMostlyPhotosyntheticOrganismsFrom" = "Plantes — organismes majoritairement photosynthétiques, des mousses aux plantes à fleurs."
"page.plazi.plazi" = "<a href=\"https://plazi.org\" target=\"_blank\" rel=\"noopener\">Plazi</a>"
"page.plazi.plaziClassification" = "Classification Plazi"
"page.plazi.plaziIsANotFor" = "<a href=\"https://plazi.org/\" target=\"_blank\" rel=\"noopener\">Plazi</a> est une organisation à but non lucratif qui libère le savoir taxonomique enfermé dans la littérature scientifique. Elle convertit les descriptions d'espèces — les <em>traitements</em> — issues d'articles publiés en données lisibles par machine et librement accessibles, puis les publie en linked data."
"page.plazi.plaziTreatmentBankDealsWithScientific" = "Plazi TreatmentBank traite de la littérature biosystématique scientifique publiée — le corpus documentant l'ensemble des quelque 1,9 million d'espèces connues, réparties sur environ 500 millions de pages publiées. Chaque <em>traitement</em> est une portion bien définie d'un article qui fixe l'usage d'un nom scientifique par un auteur à un moment donné ; comme des références bibliographiques, les traitements peuvent être cités et s'appuient sur les précédents. Ensemble, ils représentent le consensus scientifique actuel sur la taxonomie biologique, référencent intégralement la littérature sous-jacente et renvoient aux spécimens et images archivés chez Zenodo/CERN. Les publications citées sont accessibles via le <a href=\"https://zenodo.org/communities/biosyslit/\" target=\"_blank\" rel=\"noopener\">Biodiversity Literature Repository</a>."
"page.plazi.plaziTreatmentsRdf" = "<code>plazi-treatments-rdf</code>"
"page.plazi.protozoa" = "Protozoa"
"page.plazi.protozoaSingleCelledEukaryoticOrganisms" = "Protozoaires — organismes eucaryotes unicellulaires tels qu'amibes et flagellés."
"page.plazi.published" = "<span class=\"badge bg-green-lt\">Publié</span>"
"page.plazi.publisher" = "Éditeur"
"page.plazi.sparqlEndpoint" = "Point d'accès SPARQL"
"page.plazi.status" = "Statut"
"page.plazi.synospeciesPlaziOrg" = "<a href=\"https://synospecies.plazi.org\" target=\"_blank\" rel=\"noopener\">synospecies.plazi.org</a>"
"page.plazi.taxonNamesUnit" = "noms de taxons"
"page.plazi.termsOfUse" = "Conditions d'utilisation"
"page.plazi.theClassesBelowAreEvery" = "Les classes ci-dessous sont toutes les classes soit déclarées dans le graphe comme <code>rdfs:Class</code>/<code>owl:Class</code>, soit utilisées comme objet d'une assertion <code>rdf:type</code>, ordonnées par nombre d'instances. Lorsqu'une classe est définie dans un vocabulaire chargé dans le triplestore, sa description est affichée. Le contenu lié à la biodiversité se trouve dans les premières lignes (citations de matériel, concepts et noms de taxons, traitements, figures et articles) ; les lignes à instance unique décrivent le jeu de données lui-même."
"page.plazi.theDataset" = "Le jeu de données"
"page.plazi.thePlaziClassificationShownAbove" = "La classification Plazi présentée ci-dessus s'appuie sur le jeu de données <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffoen%2Fplazi\">Plazi Taxonomic Treatments</a>, publié sur LINDAS dans le graphe nommé <code>https://lindas.admin.ch/foen/plazi</code>."

