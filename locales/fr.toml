"page.health.fonesFederalOfficeForNational" = "OFAE — Office fédéral pour l'approvisionnement économique du pays"
"page.health.fophFederalOfficeOfPublic" = "OFSP — Office fédéral de la santé publique"
"page.health.from24February2020The" = "Du 24 février 2020 — jour où la Suisse a confirmé son premier cas — au 1er janvier 2023, l'Office fédéral de la santé publique a consigné la pandémie jour après jour : <span hx-get=\"/api/metric/healthReportingDays\" hx-trigger=\"load\" hx-swap=\"innerHTML\"> <span class=\"spinner-border spinner-border-sm text-muted\" role=\"status\"></span> </span> jours de relevé, pour le pays entier et pour chaque canton. Les données sont organisées en trois <a href=\"/resource?iri=https%3A%2F%2Fcube.link%2FCube\">cubes de données</a> et, contrairement à la plupart des jeux LINDAS, celui-ci ne grandira plus jamais : c'est la chronique statistique achevée d'un événement, conservée précisément parce qu'elle est close."
"page.health.groupingTheOpenDisruptionsBy" = "Regrouper les ruptures ouvertes selon la première lettre de leur code ATC — le groupe anatomique principal — montre <em>quels types</em> de médicaments viennent à manquer. Ce sont rarement les antalgiques du quotidien : les traitements anticancéreux et les anti-infectieux dominent généralement la liste, soit les catégories aux chaînes d'approvisionnement les plus fragiles."
"page.health.health" = "Santé"
"page.health.landingPage" = "Page d'accueil"
"page.health.medicineSupplyDisruptions" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffones%2Fsupply-disruptions\">Ruptures d'approvisionnement en médicaments</a>"
"page.health.namedGraph" = "Graphe nommé"
"page.health.peopleRatherThanDosesHow" = "Des personnes plutôt que des doses : combien d'habitants de chaque canton présentaient quel statut vaccinal, de la première dose au deuxième rappel."
"page.health.publisher" = "Éditeur"
"page.health.sixVaccinesWereAdministeredIn" = "Six vaccins ont été administrés en Suisse, et chacun est modélisé comme une <a href=\"/resource?iri=http%3A%2F%2Fschema.org%2FTherapeuticProcedure\">procédure thérapeutique</a> liée à son fabricant — les deux variantes bivalentes sont enregistrées séparément des formulations d'origine. Le cube de la population vaccinée ventile ses effectifs par statut vaccinal, un petit vocabulaire contrôlé qu'il vaut la peine de lire avant d'interroger ce cube."
"page.health.size" = "Taille"
