"page.health.companiesThatMarketVitalMedicines" = "Les entreprises qui commercialisent en Suisse des médicaments vitaux à usage humain sont légalement tenues de signaler les ruptures d'approvisionnement à l'Office fédéral pour l'approvisionnement économique du pays. Le graphe transforme ces signalements en une série continue d'instantanés quotidiens : une observation, c'est <em>un médicament un jour donné</em>, avec son <abbr title=\"{{.atcTitle}}\">code ATC</abbr>, l'identifiant d'emballage (GTIN), la date de début de la rupture, la fin attendue et une recommandation aux prescripteurs. Pour voir la situation <em>aujourd'hui</em>, on lit le dernier instantané — c'est exactement ce que font les tableaux ci-dessous. Un cube complémentaire suit uniquement les totaux quotidiens des ruptures ouvertes et closes au fil du temps."
