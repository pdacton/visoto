# ── Page: environment ─────────────────────────────────────────────
"page.environment.aboutThisTheme" = "À propos de ce thème"
"page.environment.caveat" = "Réserve"
"page.environment.contents" = "Contenu"
"page.environment.coverage" = "Couverture"
"page.environment.crossLinks" = "Comme ailleurs sur la plateforme, ces graphes renvoient vers l'extérieur au lieu de dupliquer les données de référence : les cantons se résolvent dans les unités <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Fterritorial\">territoriales</a> standard, les groupes d'organismes et les catégories de menace proviennent de <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Fcube%2Fdimension\">dimensions de cube partagées</a> qui portent des liens vers Wikidata, et les organismes chargés des relevés — l'OFEV lui-même, le WSL pour l'inventaire forestier — sont les mêmes ressources d'organisation <code>ld.admin.ch</code> utilisées dans tout LINDAS."
"page.environment.cubeCaveat" = "Les 121 cubes correspondent à environ 18 jeux de données en plusieurs versions — prendre toujours l'IRI de cube au numéro le plus élevé, sauf si l'on compare les éditions"
"page.environment.cubeContents" = "Gaz à effet de serre, pollution de l'air, bruit du trafic, contamination des sols, qualité des eaux de baignade, Liste rouge, flux de bois"
"page.environment.cubeGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffoen%2Fcube\">foen/cube</a>"
"page.environment.cubeSize" = "121 cubes, ~469 000 observations"
"page.environment.datasetsIntro" = "Sept graphes nommés, tous publiés par le même office, tous sous l'espace de noms de vocabulaire <code>https://environment.ld.admin.ch/</code>."
"page.environment.emissionsAndPollution" = "Émissions et pollution"
"page.environment.environment" = "Environnement"
"page.environment.environmentalStatisticsGroup" = "<strong>Statistiques environnementales</strong>"
"page.environment.fireDangerIntro" = "La Suisse est divisée en 143 <strong>régions d'alerte aux incendies de forêt</strong>, chacune portant un degré de danger de 1 (faible) à 5 (très fort). Ce qui rend cette paire de graphes intéressante à lire ensemble, c'est que le danger et la <em>réponse</em> sont publiés séparément : l'OFEV évalue le risque, les cantons décident de ce qu'ils interdisent. Le tableau ci-dessous les réunit, de sorte que chaque région affiche le danger à côté de l'interdiction de feu qui y est effectivement en vigueur — de l'appel à la prudence jusqu'à l'interdiction absolue de faire du feu en plein air."
"page.environment.fireLabelCaveat" = "Les degrés de danger et les descriptions des interdictions ne portent <em>aucune marque de langue</em> — les formulations allemande, française, italienne et anglaise figurent sur la même ressource sous forme de quatre littéraux non marqués — si bien qu'un degré peut apparaître dans la langue que la résolution des étiquettes atteint en premier. C'est l'IRI qui identifie le degré ; la formulation n'en est qu'une étiquette."
"page.environment.forestFireDanger" = "Danger d'incendie de forêt"
"page.environment.forestGroup" = "<strong>Inventaire forestier national</strong>"
"page.environment.ghgIntro" = "L'<strong>inventaire des gaz à effet de serre</strong> est le jeu de données qui sous-tend les rapports climatiques de la Suisse ; il va de 1990 à la dernière année achevée. Il est ventilé par secteur et par gaz, les deux étant hiérarchiques : le total national se répartit entre bâtiments, transports, industrie et autres, tandis que les gaz se répartissent entre CO₂, méthane, protoxyde d'azote et gaz synthétiques — avec un membre <em>tous les gaz à effet de serre</em> exprimant l'ensemble en équivalents CO₂."
"page.environment.ghgLandUse" = "Un aspect du modèle mérite l'attention : <strong>l'utilisation du sol est indiquée séparément et exclue du total principal</strong>, tout comme l'aviation internationale. La forêt en particulier constitue généralement un <em>puits</em> net — un nombre négatif — car les arbres en croissance absorbent plus de carbone que l'exploitation n'en libère. L'intégrer au chiffre national sous-estimerait les émissions ; l'en exclure est la convention, et le cube le signale explicitement plutôt que de laisser deviner."
"page.environment.group" = "Groupe"
"page.environment.hydroIntro" = "Le <strong>réseau hydrologique</strong> est le jeu de données le plus immédiat de cette plateforme. Environ 230 stations transmettent le niveau d'eau, le débit et — pour certaines d'entre elles — la température de l'eau, actualisés en continu ; l'horodatage de chaque ligne indique le moment où l'instrument a effectivement mesuré, et non celui de la publication du fichier. Chaque station est rattachée au <a href=\"/resource?iri=http%3A%2F%2Fschema.org%2FBodyOfWater\">plan d'eau</a> sur lequel elle se trouve et porte des coordonnées géographiques : la même mesure répond ainsi à la fois à <em>quelle est la température du Rhin</em> et à <em>où exactement</em>."
"page.environment.hydroUnits" = "Le niveau d'eau est exprimé en mètres au-dessus du niveau de la mer (et non en profondeur), le débit en m³/s, la température en °C. Une station peut brièvement apparaître deux fois lorsqu'une nouvelle mesure arrive alors qu'une plus ancienne est encore en cours de remplacement — l'horodatage de mesure permet de les distinguer."
"page.environment.hydroWhatIsMissing" = "Il faut noter le caractère lacunaire de certaines colonnes. Toutes les stations transmettent un niveau, la plupart un débit, mais un tiers seulement mesure la température — et les stations lacustres ne transmettent naturellement aucun débit. Ces lacunes sont dans les données et non dans la requête : les mesures sont <code>OPTIONAL</code> parce qu'une station ne porte tout simplement pas les instruments dont elle est dépourvue."
"page.environment.liveDataIntro" = "Deux de ces jeux de données sont <strong>en temps réel</strong>, ce qui est rare dans LINDAS. L'essentiel de la plateforme consigne ce qui a déjà eu lieu ; le graphe hydrologique et les alertes aux incendies de forêt décrivent le pays tel qu'il est en cet instant. Ce sont aussi les deux sur lesquels une personne pourrait fonder une décision — se baigner ou non, allumer un feu ou non."
"page.environment.liveFrequency" = "En continu — ces graphes ne contiennent que l'état <em>actuel</em>, non un historique"
"page.environment.liveGraphs" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffoen%2Fhydro\">foen/hydro</a>, <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffoen%2Fforest-fire-risk-warning\">forest-fire-risk-warning</a>, <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffoen%2Fforest-fire-prevention-measures-cantons\">forest-fire-prevention-measures-cantons</a>"
"page.environment.liveMonitoringGroup" = "<strong>Surveillance en temps réel</strong>"
"page.environment.liveSize" = "~230 stations hydrologiques, 143 régions d'alerte aux incendies"
"page.environment.metaTitle" = "Environnement & nature"
"page.environment.namedGraph" = "Graphe nommé"
"page.environment.namedGraphs" = "Graphes nommés"
"page.environment.nfiCantonCaveat" = "Vingt-quatre lignes, et non vingt-six : <strong>Bâle-Ville et Bâle-Campagne ne font pas l'objet d'un relevé distinct</strong> dans ce cube — ils n'apparaissent que comme région combinée — et l'inventaire publie en outre les mêmes thèmes pour l'ensemble de la Suisse, pour les régions économiques et pour les régions de forêts protectrices. L'<em>unité de référence</em> est une dimension à part entière : le canton n'est donc qu'une manière parmi d'autres de découper la forêt, et non la seule."
"page.environment.nfiContents" = "Plusieurs centaines de thèmes forestiers, chacun sous forme de prédicat propre et assorti d'une erreur type publiée ; relevés par le <a href=\"/resource?iri=https%3A%2F%2Fregister.ld.admin.ch%2Fopendataswiss%2Forg%2Fwsl\">WSL</a>"
"page.environment.nfiCoverage" = "Cinq inventaires depuis le début des années 1980, plus les périodes de changement entre eux"
"page.environment.nfiGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffoen%2Fnational-forest-inventory\">foen/national-forest-inventory</a>"
"page.environment.nfiIntro" = "L'<strong>Inventaire forestier national</strong> est le jeu de données le plus soigneusement modélisé de ce thème, et celui pour lequel il vaut la peine de lire le modèle avant les chiffres. Des équipes de terrain visitent une grille de placettes d'échantillonnage dans tout le pays ; un passage complet prend des années. Cinq inventaires ont été achevés depuis le début des années 1980 et — c'est important — les données traitent également les <em>intervalles qui les séparent</em> (IFN1–IFN2, IFN2–IFN3, …) comme des périodes d'inventaire à part entière. L'évolution dans le temps est ainsi une valeur de premier ordre, et non quelque chose à calculer par soustraction."
"page.environment.nfiSize" = "125 cubes, ~630 000 observations"
"page.environment.nfiStandardError" = "Comme chaque chiffre est une <em>estimation issue d'un échantillon</em> et non un recensement, chaque mesure est accompagnée de sa propre <strong>erreur type</strong> : à côté du thème <code>21</code> (volume de bois sur pied) figure <code>SE21</code>, l'erreur de cette estimation en pourcentage. C'est réellement inhabituel pour des données publiques ouvertes, et cela change la manière de lire le tableau — un chiffre cantonal assorti de ±15% n'est pas comparable à un chiffre à ±6% de la façon que les nombres bruts laissent supposer. Les petits cantons comptent moins de placettes, leurs estimations sont donc d'autant moins certaines."
"page.environment.nfiTopicCaveat" = "L'inventaire publie chaque mesure sous forme de <em>prédicat</em> propre et non comme valeur d'une dimension partagée — <code>Topic/21</code> est le volume de bois sur pied, <code>Topic/13</code> les coupes et la mortalité, et ainsi de suite pour plusieurs centaines de thèmes, chacun avec une variante <code>r</code> exprimant la valeur par hectare. Changer ce que ce tableau indique revient donc à changer un prédicat, non un filtre."
"page.environment.oneOfficeManyClocks" = "Ce thème n'a qu'un seul éditeur — l'<strong>Office fédéral de l'environnement</strong> — et c'est précisément ce qui le rend singulier. Tout provient ici d'un même office, mais les jeux de données suivent des rythmes très différents. Le réseau hydrologique transmet <em>toutes les dix minutes</em>. Les alertes aux incendies de forêt sont réémises lorsque le temps change. L'Inventaire forestier national met une dizaine d'années à effectuer un passage. La Liste rouge est révisée une fois par génération."
"page.environment.otherPollutionCubes" = "Plusieurs cubes plus modestes complètent le tableau de la pollution, et chacun mérite d'être connu même si aucun n'est présenté ici sous forme de tableau. Le <strong>bruit du trafic</strong> estime combien de personnes sont exposées au bruit de la route, du rail et des avions au-delà des valeurs limites légales. La <strong>contamination des sols par les métaux lourds</strong> indique les concentrations mesurées sur les sites d'observation. La <strong>qualité des eaux de baignade</strong> regroupe environ douze mille résultats de laboratoire individuels — dénombrements d'E. coli et d'entérocoques par date de prélèvement et par lieu —, une série de santé publique d'une granularité remarquable. Enfin, une famille de cubes suit la <strong>pollution de l'air le long de l'A2 et de l'A13</strong>, les deux autoroutes du trafic de transit alpin, avec des mesures de NO₂, de particules fines et de suie en bordure de route."
"page.environment.plaziClassification" = "Classification Plazi"
"page.environment.plaziDesc" = "Noms taxonomiques, traitements et publications dont ils sont issus — des centaines de milliers de mentions d'espèces."
"page.environment.plaziIntro" = "Le plus grand graphe publié par l'OFEV n'a rien à voir avec la surveillance. <strong>Plazi</strong> est un corpus de traitements taxonomiques — ces descriptions formelles par lesquelles les espèces sont nommées et délimitées dans la littérature scientifique —, extraits d'articles publiés et convertis en données liées. Il répond à un autre type de question que tout ce qui précède : non pas <em>combien</em> ou <em>quelle température</em>, mais <em>qui a décrit cette espèce, où et sous quel nom</em>. Il dispose ici de sa propre page, car sa structure n'a rien de commun avec celle des cubes."
"page.environment.readTheClockFirst" = "C'est cet écart qu'il faut garder à l'esprit en lisant ces tableaux. Un chiffre du graphe hydrologique est une <em>mesure</em> et aura changé au prochain rafraîchissement ; un chiffre de l'inventaire forestier est une <em>estimation</em> assortie d'une marge d'erreur publiée ; un chiffre de la Liste rouge est une <em>évaluation</em> qui vaut jusqu'à la prochaine révision. Le modèle de données indique lequel est lequel — l'inventaire fournit même ses propres erreurs types — mais uniquement si l'on y regarde."
"page.environment.redListDataDeficient" = "Il faut prêter attention aux lignes <em>données insuffisantes</em>. Elles ne constituent pas une catégorie de menace, mais l'aveu que l'on en sait trop peu pour évaluer l'espèce ; et pour certains groupes, elles dépassent à elles seules toutes les catégories de menace réunies. C'est une indication sur l'effort de relevé, non sur les organismes."
"page.environment.redListIntro" = "La <strong>Liste rouge</strong> évalue les espèces de Suisse selon les <a href=\"/resource?iri=https%3A%2F%2Fenvironment.ld.admin.ch%2Fvocabulary%2Fiucn_conservation_categories\">catégories de menace de l'UICN</a> — de <em>non menacée</em> à <em>vulnérable</em>, <em>en danger</em> et <em>au bord de l'extinction</em>, jusqu'à <em>éteinte en Suisse</em>. Chaque catégorie est ici une ressource à part entière, et non un code dans une chaîne de caractères : elle porte son nom en quatre langues, un lien <code>owl:sameAs</code> vers Wikidata, et jusqu'à la couleur officielle utilisée par l'OFEV dans ses propres graphiques."
"page.environment.redListStructure" = "Les espèces sont regroupées selon une classification de l'OFEV imbriquée via <code>skos:broader</code> — <em>tous les organismes</em> contient les <em>animaux</em>, qui contiennent les <em>insectes</em>, qui contiennent les <em>papillons</em>. Le même cube répond ainsi tant au constat national qu'à la question de savoir quel groupe se porte le plus mal. Il faut choisir un seul niveau au moment d'additionner, faute de quoi les totaux comptent plusieurs fois les mêmes espèces. La colonne <code>part</code> indique la proportion des espèces évaluées de ce groupe relevant de la catégorie, ce qui rend comparables des groupes de tailles très différentes."
"page.environment.referenceContents" = "Traitements taxonomiques de Plazi (de loin le plus grand graphe de ce thème — voir la <a href=\"/plazi.html\">page Plazi</a>), ainsi que les dimensions partagées dont les cubes tirent leurs termes"
"page.environment.referenceGraphs" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffoen%2Fplazi\">foen/plazi</a>, <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffoen%2Fthemes\">foen/themes</a>"
"page.environment.referenceGroup" = "<strong>Littérature et vocabulaire</strong>"
