"page.media.aboutThisTheme" = "À propos de ce thème"
"page.media.advertisingIntro" = "La série la plus claire de ce thème est aussi la plus sombre pour quiconque travaille dans les médias suisses : les <strong>recettes publicitaires par genre de média</strong>, année après année. Elle montre la presse toujours première catégorie par le chiffre d'affaires, mais en recul constant — et la publicité en ligne, censée la remplacer, à moins de la moitié du niveau de la presse et sans croissance."
"page.media.advertisingNuance" = "La raison en est que ce cube mesure la publicité réservée auprès des médias <em>suisses</em>. L'argent qui a quitté les journaux n'est pas allé vers les sites d'information suisses ; il a largement quitté le marché intérieur pour des plateformes mondiales que l'OFCOM ne recense pas. Lisez la colonne en ligne comme « publicité en ligne captée par les éditeurs suisses », et non comme la taille du marché publicitaire numérique en Suisse."
"page.media.broadband" = "Le tuyau jusqu'au bâtiment"
"page.media.caveat" = "Réserve"
"page.media.collectionCaveat" = "Les 533 cubes représentent bien moins de jeux de données que ce nombre ne le laisse croire — la plupart des familles existent en huit à quatorze versions, chacune étant une IRI de cube distincte se terminant par un numéro, et seule la plus élevée est à jour. Ancrez toujours une requête dans une seule IRI de cube, faute de quoi les mêmes observations sont comptées une fois par édition."
"page.media.collectionIntro" = "Le graphe médias de l'OFCOM est vaste et d'une granularité inhabituelle. Au-delà des chiffres d'audience, il contient des <strong>analyses de programmes</strong> — des études qui codent les contenus diffusés par thème et par format, si bien qu'on peut demander quelle part du temps d'antenne d'une radio régionale relevait de l'information régionale plutôt que de la musique. Ce niveau de détail existe parce que les diffuseurs privés recevant une quote-part de la redevance sont soumis à un mandat de prestations, et que ces analyses servent à en mesurer le respect."
"page.media.collectionSpread" = "Les familles ci-dessous couvrent tout le paysage médiatique : mesure d'audience Mediapulse pour la télévision, portée et structure des programmes des radios SRG et commerciales, lectorat de la presse par âge, médias en ligne par thème et par genre, ainsi que la structure des recettes du diffuseur de service public lui-même."
"page.media.contents" = "Contenu"
"page.media.coverage" = "Couverture"
"page.media.crossLinks" = "Les deux graphes s'appuient sur des données de référence partagées : les observations NGA résolvent leur commune et leur canton dans le <a href=\"/statistics.html\">registre de l'OFS</a>, et les cubes médias désignent leur office éditeur via <code>cube:observedBy</code> pointant vers l'<a href=\"/government.html\">administration fédérale</a>. L'OFCOM apparaît aussi dans <a href=\"/statistics.html\">Statistique &amp; registres</a> comme source des zones de couverture radio publiées en tant que dimension territoriale partagée."
"page.media.datasetsIntro" = "Deux graphes nommés, tous deux de l'OFCOM et tous deux sous l'espace de noms de vocabulaire <code>https://communication.ld.admin.ch/</code> — mais de forme très différente."
"page.media.followTheMoney" = "Où est passée la publicité"
"page.media.group" = "Groupe"
"page.media.intro" = "Les deux graphes réunis ici proviennent de l'<strong>Office fédéral de la communication</strong> et se placent de part et d'autre d'une même question. L'un décrit le <em>contenu</em> : combien de personnes regardent, lisent et écoutent, ce que contiennent réellement les programmes et où va l'argent de la publicité. L'autre décrit le <em>tuyau</em> : quels débits atteignent quel bâtiment, dans chaque commune du pays."
"page.media.media" = "Médias"
"page.media.mediaCaveat" = "Certains cubes datent les observations avec une année sous forme de littéral simple plutôt qu'en <code>xsd:gYear</code> — un filtre typé ne correspond alors silencieusement à rien"
"page.media.mediaContents" = "Données d'audience TV Mediapulse, portée radio et TV, analyses de programmes et de thèmes, lectorat de la presse, usage des médias en ligne, recettes publicitaires, structure des recettes de la SSR, propriété des médias"
"page.media.mediaGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Fofcom%2Fcube\">ofcom/cube</a>"
"page.media.mediaGroup" = "<strong>Recherche sur les médias</strong>"
"page.media.mediaSize" = "533 cubes, ~139 000 observations — mais environ 60 jeux de données distincts en de multiples versions"
"page.media.metaTitle" = "Médias & communication"
"page.media.namedGraph" = "Graphe nommé"
"page.media.ngaCaveat" = "L'ensemble du jeu de données est un <strong>instantané mensuel unique</strong>, non une série temporelle — chaque observation porte le même mois, ce qui montre l'état actuel du réseau et non son évolution. Notez aussi que couverture signifie <em>qu'un bâtiment pourrait souscrire</em>, et non que quelqu'un l'a fait : il s'agit de disponibilité, non de taux de raccordement."
"page.media.ngaCaveatCard" = "Disponibilité, non abonnement — et les libellés de condition (<code>DOWN &gt;= 1000</code>) sont de simples littéraux, à faire correspondre exactement, espaces compris"
"page.media.ngaConditions" = "La couverture n'est pas un chiffre mais treize, un par <strong>condition</strong>. Sept sont des seuils de débit descendant, de 10 Mbit/s jusqu'au gigabit, quatre sont des seuils de débit montant, et trois désignent le support physique — fibre, câble coaxial ou cuivre. Lus comme une échelle, ils montrent où le réseau s'amenuise : quasi universel en haut débit de base, encore solide à 100 Mbit/s, et en net recul dès que le gigabit est exigé."
"page.media.ngaCoverage" = "Un instantané mensuel unique portant sur ~1,92 million de bâtiments dans tout le pays"
"page.media.ngaGap" = "Notez le désaccord entre les deux colonnes de couverture. Moyennée sur les communes, la fibre atteint environ quarante-quatre pour cent ; comptée par bâtiments, elle dépasse largement la moitié. L'écart, c'est la fracture ville-campagne exprimée arithmétiquement — la fibre se construit là où les bâtiments se trouvent déjà, si bien qu'elle couvre beaucoup de monde en peu d'endroits."
"page.media.ngaGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Fofcom%2Fnga\">ofcom/nga</a>"
"page.media.ngaGroup" = "<strong>Couverture haut débit (NGA)</strong>"
"page.media.ngaIntro" = "Le jeu de données <strong>NGA</strong> — pour <em>next-generation access</em> — est l'enquête nationale sur la couverture haut débit, et son unité de mesure est remarquablement concrète : non pas des ménages ou des personnes mais des <strong>bâtiments</strong>, les constructions individuelles auxquelles un réseau pourrait être raccordé. Pour chaque commune, il indique combien de bâtiments peuvent obtenir un service donné, exprimé à la fois en nombre absolu et en pourcentage."
"page.media.ngaSize" = "Un cube, ~27 400 observations — 13 conditions × ~2110 communes"
"page.media.ofcomPublisher" = "Office fédéral de la communication (OFCOM)"
"page.media.publisher" = "Éditeur"
"page.media.size" = "Taille"
"page.media.subtitle" = "Ce que la Suisse regarde, lit et écoute — qui le finance, et le réseau par lequel tout cela arrive."
"page.media.theCollection" = "Cinq cents cubes de recherche sur les médias"
"page.media.theDatasets" = "Les jeux de données"
"page.media.title" = "Médias & communication"
"page.media.whyOfcom" = "Cet appariement n'est pas fortuit. L'OFCOM régule à la fois la radiodiffusion — octroi des concessions, répartition de la redevance, contrôle du respect des obligations de service public — et l'infrastructure de télécommunication. La recherche sur les médias existe parce que le régulateur a besoin d'éléments probants pour ses décisions de concession, ce qui explique que les données aillent jusqu'à l'analyse de contenu des programmes et pas seulement aux totaux d'audience."

# ── Page: statistics — Zefix ──────────────────────────────────────────
"card.registeredCompanies" = "Entreprises inscrites"
"card.zefixLegalForms" = "Entités inscrites par forme juridique"
"card.zefixPerCanton" = "Entités inscrites par canton"
"page.statistics.fojPublisher" = "Office fédéral de la justice (OFJ)"
"page.statistics.registersToo" = "À leurs côtés figurent les registres des <em>choses qui existent</em> plutôt que des codes : le registre du commerce <strong>Zefix</strong> de l'Office fédéral de la justice, qui recense chaque entité juridique du pays, ainsi que les ressources territoriales dans lesquelles se résolvent les observations de cubes de toute la plateforme."
"page.statistics.zefix" = "Toutes les entreprises du pays"
"page.statistics.zefixCaveat" = "Il s'agit d'entités <em>inscrites</em> à leur siège juridique, ce qui n'équivaut pas à une activité économique : une société holding inscrite à Zoug n'y emploie peut-être personne. Notez aussi que le registre contient les inscriptions actuelles — c'est un instantané de qui existe aujourd'hui, non un historique des créations et des dissolutions."
"page.statistics.zefixCaveatCard" = "Siège juridique, non activité économique — et un instantané plutôt qu'un historique des créations et dissolutions"
"page.statistics.zefixContents" = "L'Index central des raisons de commerce — chaque entité juridique du registre du commerce suisse, avec pour la plupart des inscriptions le but social rédigé en toutes lettres"
"page.statistics.zefixForms" = "Trois formes représentent la quasi-totalité du registre : la <strong>Sàrl</strong>, la <strong>société anonyme</strong> et l'entreprise individuelle. Tout le reste — fondations, associations, coopératives, sociétés de personnes, succursales d'entreprises étrangères — forme une longue traîne. La présence de fondations et d'associations rappelle qu'il s'agit d'un registre d'<em>entités juridiques</em>, et pas seulement d'entreprises à but lucratif."
"page.statistics.zefixGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffoj%2Fzefix\">foj/zefix</a>"
"page.statistics.zefixGroup" = "<strong>Registre du commerce Zefix</strong>"
"page.statistics.zefixIntro" = "<strong>Zefix</strong> — l'Index central des raisons de commerce, tenu par l'Office fédéral de la justice — est le registre de toutes les entités juridiques inscrites au registre du commerce suisse. Avec près de <strong>800 000 organisations</strong>, c'est de loin le plus grand registre de cette plateforme, et le pendant du répertoire des communes : l'un identifie les lieux, l'autre les entreprises qui s'y trouvent."
"page.statistics.zefixJoinIntro" = "Comme chaque entreprise indique sa commune de siège sous forme d'IRI issue du registre décrit plus haut, les deux jeux de données se joignent directement — et compter les entreprises par canton révèle ce que les chiffres de population ne montrent pas. Zurich domine sans surprise, mais <strong>Zoug</strong> figure bien plus haut que sa taille ne le laisserait supposer : un canton d'environ 130 000 habitants qui héberge des dizaines de milliers d'entités inscrites, soit sa politique fiscale de domiciliation rendue visible dans les données."
"page.statistics.zefixSize" = "~791 000 entités inscrites, chacune avec un IDE, une forme juridique, une adresse et une commune de siège"
"page.statistics.zefixUid" = "Sa caractéristique porteuse est l'<strong>IDE</strong>, le numéro d'identification des entreprises, que porte chaque entité. Cet identifiant unique permet de reconnaître une entreprise à travers des jeux de données par ailleurs sans lien — les gestionnaires de réseau électrique du thème <a href=\"/energy.html\">énergie</a> portent leur IDE, qui se résout ici vers la personne morale. Chaque inscription contient également une forme juridique issue de la norme <code>eCH-0097</code>, une adresse inscrite, la commune de siège et, dans la plupart des cas, le but social de l'entreprise rédigé en toutes lettres."

