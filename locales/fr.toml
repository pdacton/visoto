"page.facets.legalFormAMultiSelect" = "<strong>Forme juridique</strong> — une facette énumérée à sélection multiple sur <code>schema:additionalType</code> (valeurs énumérées depuis le triplestore, p. ex. Sàrl, SA, entreprise individuelle) ; choisissez-en une ou plusieurs, ou <em>(aucune valeur)</em> pour les entreprises sans forme juridique enregistrée."
