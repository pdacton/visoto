"page.health.dailyCasesDeathsAndHospitalizations" = "Cas, décès et hospitalisations quotidiens par canton ; doses de vaccin par région et par vaccin ; population vaccinée par statut (24 févr. 2020 – 1er janv. 2023)"
"page.health.dailySnapshotsOfOpenDisruptions" = "Instantanés quotidiens des ruptures ouvertes par médicament (code ATC, GTIN, début et fin attendue), plus un agrégat quotidien ouvert/clos"
"page.health.dataset" = "Jeu de données"
