# ── Page: politics ────────────────────────────────────────────────
"page.politics.16MillionTriplesOrganization" = "~1,6 million de triplets — organization est le plus grand avec ~975 000"
"page.politics.19MillionTriplesPopular" = "~1,9 million de triplets — popular-vote représente à lui seul ~1,0 million"
"page.politics.2019And2023Populated2027" = "2019 et 2023 renseignés ; 2027 enregistré mais vide"
"page.politics.292000Triples18Cubes" = "~292 000 triplets — 18 cubes, 5 sujets × 3 années"
"page.politics.42000Triples" = "~42 000 triplets"
"page.politics.aSeventeenthGraphTermdatHolds" = "Un dix-septième graphe, <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Ftermdat\">termdat</a>, contient la banque de données terminologiques de l'administration fédérale. De nature administrative plutôt que politique, il ne figure pas dans les groupes ci-dessus."
"page.politics.aboutThisTheme" = "À propos de ce thème"
"page.politics.bkAdminCh" = "<a href=\"https://www.bk.admin.ch\" target=\"_blank\" rel=\"noopener\">bk.admin.ch</a>"
"page.politics.bothRoutesEndAtThe" = "Les deux voies aboutissent au même endroit : une <strong>votation populaire</strong>. Ce cube est la pièce maîtresse du thème — et le jeu de données politique le plus riche de LINDAS. Il n'enregistre pas une ligne par votation, mais <em>une ligne par objet et par canton</em>, si bien que quelques centaines d'objets deviennent près de vingt mille observations. Chaque ligne porte les oui et les non <em>et</em> les pourcentages, la participation, les électeurs inscrits, les bulletins blancs et nuls, ainsi que la voix des cantons (<em>Standesstimme</em>) que les révisions constitutionnelles doivent également emporter."
"page.politics.candidatesListsSeatsPerList" = "Candidats, listes, sièges par liste, sièges au sein des listes apparentées, statistiques cantonales"
"page.politics.cantonalRowsAreOmittedAbove" = "Les lignes cantonales sont omises ci-dessus afin de garder une ligne par objet — ouvrez n'importe quelle observation de <a href=\"/resource?iri=https%3A%2F%2Fpolitics.ld.admin.ch%2Fpolitical-rights%2Fpopular-vote%2F1\">votation populaire</a> pour voir les 26 ventilations. Le cube des dates de scrutin liste aussi des dates <em>futures</em> : les entrées les plus récentes peuvent donc être des votations prévues, sans résultat."
"page.politics.caveat" = "Réserve"
"page.politics.citizensObjectParliamentHasPassed" = "Les citoyens <em>s'opposent</em>. Le parlement a adopté une loi ; 50 000 signatures la soumettent au vote populaire avant son entrée en vigueur. Le droit d'urgence est également couvert et suit ses propres règles accélérées."
"page.politics.citizensProposeGather100000" = "Les citoyens <em>proposent</em>. Avec 100 000 signatures, on peut exiger une modification de la Constitution fédérale, que le parlement le veuille ou non. Recensées depuis 1891 et suivies de la récolte des signatures jusqu'au retrait ou au scrutin."
"page.politics.contents" = "Contenu"
"page.politics.coverage" = "Couverture"
"page.politics.cubesFor2027AreAlready" = "Les cubes pour <strong>2027</strong> sont déjà enregistrés mais ne contiennent encore aucun résultat — les cubes des candidats et des listes sont vides, et les statistiques cantonales ne contiennent que le squelette de lignes pré-créé. Des données réelles existent pour 2019 et 2023."
"page.politics.curiaFederalCouncilStaatskalenderOrganization" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Fcuria\">curia</a>, <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Ffederal-council\">federal-council</a>, <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Fstaatskalender\">staatskalender</a>, <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Forganization\">organization</a>, <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Fextra-parliamentary-commission\">extra-parliamentary-commission</a>, <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Fpolitical-party-register\">political-party-register</a>, <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Frvov\">rvov</a>"
"page.politics.directDemocracy" = "<strong>Démocratie directe</strong>"
"page.politics.directDemocracyHowAVote" = "Démocratie directe : comment un vote se déroule"
"page.politics.elections" = "<strong>Élections</strong>"
"page.politics.electionsFillingTheNationalCouncil" = "Élections : composer le Conseil national"
"page.politics.everyFourYearsSwitzerlandElects" = "Tous les quatre ans, la Suisse élit les 200 membres du Conseil national. LINDAS conserve les résultats sous forme de cinq familles de cubes par année électorale, qui décrivent ensemble toute la mécanique proportionnelle : qui s'est présenté, sur quelle liste, combien de voix chaque liste a recueillies et comment les sièges ont finalement été attribués — y compris la répartition <em>au sein</em> des listes apparentées, une spécialité suisse par laquelle de petits partis mettent leurs voix en commun pour franchir ensemble le seuil."
"page.politics.federalChancelleryFCh" = "Chancellerie fédérale (ChF)"
"page.politics.governmentAndAdministration" = "Gouvernement et administration"
"page.politics.group" = "Groupe"
"page.politics.interestTiesAndLobbying" = "Liens d'intérêts et lobbying"
"page.politics.landingPage" = "Page d'accueil"
"page.politics.membersOfParliamentMustDeclare" = "Les parlementaires doivent déclarer leurs mandats extérieurs, et ces déclarations sont publiées ici sous forme de liens entre une personne et une <a href=\"/resource?iri=http%3A%2F%2Fschema.org%2FLobbyOrganization\">organisation de lobby</a>. Le détail utile est que chaque lien est signalé comme <strong>rémunéré ou non</strong> et indique la <em>fonction</em> exercée — le tableau ci-dessous sépare donc les sièges qu'un parlementaire occupe simplement de ceux qu'il <strong>préside</strong>. Les deux peuvent fortement diverger : parmi les douze personnes ayant le plus de liens rémunérés, certaines en président presque tous et d'autres un seul."
"page.politics.motionsPostulatesAndInterpellationsWith" = "Motions, postulats et interpellations avec leur état de traitement"
"page.politics.namedGraph" = "Graphe nommé"
"page.politics.namedGraphs" = "Graphes nommés"
"page.politics.namesOfGroupsPartiesAnd" = "Les noms des groupes, des partis et des objets de votation sont publiés dans les quatre langues nationales ainsi qu'en romanche ; les tableaux de cette page suivent donc la préférence linguistique de votre navigateur et se rabattent sur l'anglais, puis l'allemand, lorsqu'une traduction manque. Les noms de personnes ne portent aucune étiquette de langue et sont affichés tels qu'enregistrés."
"page.politics.nationalCouncilElection" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Fnational-council-election\">national-council-election</a>"
"page.politics.oneGraphInThisTheme" = "Un graphe de ce thème est modélisé tout autrement que les autres. Les <strong>interventions parlementaires</strong> — motions, postulats et interpellations par lesquels les parlementaires demandent formellement au gouvernement d'agir — utilisent l'<a href=\"https://ch.paf.link\" target=\"_blank\" rel=\"noopener\">ontologie PAF</a>, un modèle activité-entité emprunté aux vocabulaires de provenance plutôt qu'aux formes cube ou schema.org employées partout ailleurs. Chaque intervention est une entité ; chaque étape de son traitement est une activité avec son propre texte d'état émis par l'administration."
"page.politics.pafHttpsChPafLink" = "PAF — <code>https://ch.paf.link/</code>, le seul modèle non-cube de ce thème"
"page.politics.parliamentariansPartiesGroupsCommitteesLobby" = "Parlementaires, partis, groupes, commissions, liens d'intérêts, membres du gouvernement, offices et commissions — modélisés comme des appartenances <code>schema:Role</code> datées"
"page.politics.parliamentaryBusiness" = "Affaires parlementaires"
"page.politics.parliamentaryBusiness2" = "<strong>Affaires parlementaires</strong>"
"page.politics.peopleInstitutions" = "<strong>Personnes & institutions</strong>"
"page.politics.petitions" = "Pétitions"
"page.politics.politicsGovernment" = "Politique & gouvernement"
"page.politics.popularVotePopularVoteStat" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Fpopular-vote\">popular-vote</a>, <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Fpopular-vote-stat\">popular-vote-stat</a>, <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Fpopular-initiative\">popular-initiative</a>, <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Fpopular-initiative-stat\">popular-initiative-stat</a>, <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Freferendum\">referendum</a>, <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Freferendum-stat\">referendum-stat</a>, <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Fpetition\">petition</a>"
"page.politics.popularVotesFrom1848Initiatives" = "Votations populaires depuis 1848 ; initiatives depuis 1891 ; dates de scrutin futures incluses"
"page.politics.proceduralRequest" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Fprocedural-request\">procedural-request</a>"
"page.politics.publisher" = "Éditeur"
"page.politics.seventeenGraphsGroupedByWhat" = "Dix-sept graphes, regroupés selon leur finalité. Tous sont publiés par la Chancellerie fédérale et portent le préfixe <code>https://lindas.admin.ch/fch/</code>."
"page.politics.size" = "Taille"
"page.politics.statusTextsArePublishedIn" = "Les textes d'état sont publiés en allemand, français et italien, et suivent ici la langue de votre navigateur. Une même intervention en porte généralement plusieurs au fil de la procédure : le même titre peut donc apparaître plusieurs fois — chaque ligne est un rapport d'état sur cette intervention, non une intervention."
"page.politics.swissCitizensDoNotOnly" = "Les citoyens suisses n'élisent pas seulement un parlement ; ils votent sur les lois elles-mêmes, plusieurs fois par an. Deux instruments soumettent une question au peuple, et savoir les distinguer est la chose la plus utile à comprendre dans ces données — ils vont en sens inverse."
"page.politics.theDatasets" = "Les jeux de données"
"page.politics.thePartyRegisterHoldsOnly" = "Le registre des partis ne contient que quelques dizaines de lignes et n'est mis à jour qu'à la demande d'un parti"
"page.politics.theQuietestInstrumentAndThe" = "L'instrument le plus discret, et le seul ouvert à tous — aucun seuil de signatures, aucune condition de nationalité, aucun âge minimum. Toute personne peut adresser une pétition aux autorités fédérales, qui sont tenues d'en prendre acte mais non d'agir."
"page.politics.thisThemeBringsTogetherEverything" = "Ce thème rassemble tout ce que la <strong>Chancellerie fédérale</strong> publie sur la politique suisse, et couvre deux types de matière très différents. Le premier, c'est <strong>ce que les citoyens ont décidé</strong> : chaque votation populaire, initiative populaire et référendum depuis 1848 — la question posée, le jour du scrutin, l'issue, et le vote de chaque canton. Le second, c'est <strong>qui gouverne</strong> : les parlementaires et leurs partis, le gouvernement fédéral et ses départements, les offices qui en dépendent, et les lobbyistes ayant accès au Palais fédéral."
"page.politics.threeFurtherRegistersDescribeThe" = "Trois autres registres décrivent l'exécutif. Le graphe <strong>Conseil fédéral</strong> couvre le gouvernement à sept membres depuis 1848 — conseillers fédéraux, chanceliers, quel département chacun a dirigé, qui fut président quelle année, et une curiosité que peu de jeux de données nationaux contiennent : les personnes <em>élues qui ont décliné</em>. L'<strong>Annuaire fédéral</strong> (Staatskalender) est le répertoire des autorités : il liste les offices avec leurs adresses postales et leur personnel. Les <strong>commissions extraparlementaires</strong> couvrent les organes d'experts qui conseillent l'administration de l'extérieur."
"page.politics.togetherTheyAnswerTheTwo" = "Ensemble, ils répondent aux deux questions que l'on se pose généralement — <em>sur quoi la Suisse a-t-elle voté, et quel en fut le résultat ?</em> et <em>qui occupe quelle fonction aujourd'hui ?</em> Les sections ci-dessous parcourent les deux, en commençant par la manière dont un vote naît."
"page.politics.vocabulary" = "Vocabulaire"
"page.politics.whereTheCubesAboveCount" = "Là où les cubes ci-dessus comptent des voix, cette famille de graphes nomme des personnes. <strong>Curia Vista</strong> est le registre parlementaire : chaque membre de l'Assemblée fédérale, vivant ou décédé, avec son parti, son groupe parlementaire, les commissions où il a siégé et les dates exactes de chaque mandat. Comme les appartenances sont modélisées en <a href=\"/resource?iri=http%3A%2F%2Fschema.org%2FRole\">rôles</a> datés plutôt qu'en simples liens, on peut reconstituer la composition du parlement à n'importe quelle date."
"page.politics.whoGovernsPeopleAndInstitutions" = "Qui gouverne : personnes et institutions"

# ── Page: mobility ────────────────────────────────────────────────
"page.mobility.17MillionTriples18" = "~1,7 million de triplets — 18 cubes, 3 sujets"
"page.mobility.300Triples15Classes48" = "~300 triplets — 15 classes, 48 propriétés"
"page.mobility.73MillionTriplesThe" = "~7,3 millions de triplets — le plus grand de ce thème"
"page.mobility.983000Triples" = "~983 000 triplets"
"page.mobility.aFurtherStopsAreRecorded" = "Un supplément de <span hx-get=\"/api/metric/mobilityMode-unknown\" hx-trigger=\"load\" hx-swap=\"innerHTML\"> <span class=\"spinner-border spinner-border-sm text-muted\" role=\"status\"></span> </span> arrêts sont enregistrés avec un moyen de transport <em>inconnu</em>, et les arrêts desservis par plusieurs modes sont comptés une fois par mode : les chiffres ci-dessus dépassent donc le nombre total d'arrêts."
"page.mobility.aboutThisTheme" = "À propos de ce thème"
"page.mobility.airTrafficMovements" = "Mouvements aériens"
"page.mobility.anAllianceVerbundIsA" = "Une <a href=\"/resource?iri=https%3A%2F%2Flod.opentransportdata.swiss%2Fvocab%2FAlliance\">Alliance</a> (<em>Verbund</em>) est une communauté tarifaire régionale — l'organisme dont le plan de zones s'applique là où vous voyagez. La plupart des personnes en Suisse détiennent un abonnement émis par l'une d'elles."
"page.mobility.annualMovementsPerAerodromeBy" = "Mouvements annuels par aérodrome, par catégorie. Un mouvement est un seul décollage <em>ou</em> atterrissage — un aller-retour compte donc double."
"page.mobility.bazlAdminCh" = "<a href=\"https://www.bazl.admin.ch\" target=\"_blank\" rel=\"noopener\">bazl.admin.ch</a>"
"page.mobility.byAirCivilAviation" = "Par les airs : l'aviation civile"
"page.mobility.civilAviationStatistics" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffoca%2Fcube\">Statistiques de l'aviation civile</a>"
"page.mobility.classesInTheNOVAGraph" = "Classes du graphe NOVA"
"page.mobility.contents" = "Contenu"
"page.mobility.dataset" = "Jeu de données"
"page.mobility.earlierVersionsOfEachCube" = "Les versions antérieures de chaque cube restent publiées et sont accessibles depuis la <a href=\"/resource?iri=https%3A%2F%2Fcube.link%2FCube\">liste des cubes</a> ; une ancienne série <em>Air traffic statistics movements</em> est également présente."
"page.mobility.everyStopInTheRegister" = "Chaque arrêt du registre porte un moyen de transport, et la répartition de ces valeurs raconte la Suisse mieux que n'importe quel résumé. Les bus dominent d'un ordre de grandeur, comme partout. Ce qui est singulier, c'est le troisième groupe ci-dessous : téléphériques, télésièges, funiculaires et chemins de fer à crémaillère ne sont pas des attractions touristiques rangées dans un registre à part — ils figurent dans le même registre national que les trams de Zurich, avec le même type d'identifiant, car en Suisse un téléphérique de montagne est tout simplement un transport public."
"page.mobility.fareNetworks" = "Communautés tarifaires"
"page.mobility.focaFederalOfficeOfCivil" = "OFAC — Office fédéral de l'aviation civile"
"page.mobility.fourLINDASGraphsDescribeHow" = "Quatre graphes LINDAS décrivent la mobilité en Suisse. Ce ne sont pas quatre jeux de données indépendants — ils s'empilent. Le <strong>registre des points de service (DiDok)</strong> contient les <em>lieux</em> : chaque arrêt, gare, débarcadère et station de téléphérique du pays. <strong>NOVA</strong> contient les <em>prix</em> entre ces lieux. L'<strong>Open Transport Data schema</strong> est le <em>dictionnaire</em> qui définit les termes qu'ils emploient tous deux. À côté, l'<strong>Office fédéral de l'aviation civile</strong> publie des statistiques aériennes, qui se suffisent à elles-mêmes."
"page.mobility.landingPage" = "Page d'accueil"
"page.mobility.mobilityTransport" = "Mobilité & transports"
"page.mobility.mountain" = "Montagne"
"page.mobility.movementsPassengersAndPassengerRights" = "Mouvements, passagers et signalements relatifs aux droits des passagers, par année et aérodrome"
"page.mobility.namedGraph" = "Graphe nommé"
"page.mobility.novaDescribesSwissPublicTransport" = "NOVA décrit la tarification des transports publics suisses et constitue de loin le plus grand graphe de ce thème. Il ne contient ni horaires ni prix de billets consultables directement ; il contient la <em>mécanique</em> qui produit un prix. Cette mécanique existe en deux variantes, ce qui est la clé de lecture de la liste de classes ci-dessous."
"page.mobility.novaFareData" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Fsbb%2Fnova\">Données tarifaires NOVA</a>"
"page.mobility.openTransportDataSchema" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Fsbb%2Fotd-schema\">Open Transport Data schema</a>"
"page.mobility.opentransportdataSwiss" = "<a href=\"https://opentransportdata.swiss\" target=\"_blank\" rel=\"noopener\">opentransportdata.swiss</a>"
"page.mobility.passengerRights" = "Droits des passagers"
"page.mobility.passengers" = "Passagers"
"page.mobility.passengersAtAerodromesAndMountain" = "Passagers dans les aérodromes et sur les places d'atterrissage en montagne — cette dernière catégorie, peu de pays en ont l'usage."
"page.mobility.publisher" = "Éditeur"
"page.mobility.reportsFiledByAirPassengers" = "Signalements déposés chaque année par les passagers aériens. L'OFAC donne suite à ceux qui relèvent de sa compétence ; les signalements non signés ou incomplets sont clos automatiquement après six mois."
"page.mobility.roadRail" = "Route & rail"
"page.mobility.roughlyHalfOfThisVocabulary" = "Environ la moitié de ce vocabulaire est de l'allemand non traduit ; les descriptions ci-dessous proviennent donc de l'Open Transport Data schema et méritent d'être lues comme un glossaire : <em>Tarifwertpreisauspraegung</em> et <em>Relationsgebiet</em> ne s'expliquent d'eux-mêmes pour personne."
"page.mobility.sbbSwissFederalRailways" = "CFF — Chemins de fer fédéraux suisses"
"page.mobility.servicePointsDiDok" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Fsbb%2Fdidok\">Points de service (DiDok)</a>"
"page.mobility.size" = "Taille"
"page.mobility.sparqlEndpoint" = "Point d'accès SPARQL"
"page.mobility.stops" = "arrêts"
"page.mobility.stopsWithCoordinatesElevationCanton" = "Arrêts avec coordonnées, altitude, canton, commune et exploitant ; liés à <code>geo.ld.admin.ch</code> via <code>owl:sameAs</code>"
"page.mobility.theDatasets" = "Les jeux de données"
"page.mobility.theFederalOfficeOfCivil" = "L'Office fédéral de l'aviation civile (OFAC / BAZL) publie ses statistiques sous forme de <a href=\"/resource?iri=https%3A%2F%2Fcube.link%2FCube\">cubes de données</a>. Le graphe en contient dix-huit, mais ce nombre exagère la variété : ce sont des versions republiées de trois sujets seulement. Les cartes ci-dessous pointent vers la version actuelle de chacun."
"page.mobility.theNetworkWhereYouCan" = "Le réseau : où l'on peut aller"
"page.mobility.theOpenTransportDataSchema" = "L'Open Transport Data schema est minuscule — quelques centaines de triplets — mais il définit les termes dans lesquels sont écrits les sept millions de triplets de NOVA. C'est la pierre de Rosette de tout ce qui précède."
"page.mobility.theVocabulary" = "Le vocabulaire"
"page.mobility.theVocabularyUnderpinningDiDokAnd" = "Le vocabulaire sur lequel reposent DiDok et NOVA"
"page.mobility.usedByTheRegionalFare" = "Utilisé par les communautés tarifaires régionales. Les arrêts sont regroupés en une <a href=\"/resource?iri=https%3A%2F%2Flod.opentransportdata.swiss%2Fvocab%2FZone\">Zone</a>, les zones réunies en un <a href=\"/resource?iri=https%3A%2F%2Flod.opentransportdata.swiss%2Fvocab%2FZoningPlan\">ZoningPlan</a> (une région peut en exploiter plusieurs — un pour les abonnements, un autre pour les courses simples), et le prix découle du nombre de zones traversées."
"page.mobility.usedForJourneysAcrossThe" = "Utilisé pour les trajets sur le réseau national. Une <a href=\"/resource?iri=https%3A%2F%2Flod.opentransportdata.swiss%2Fvocab%2FRelation\">Relation</a> est une liaison tarifée entre deux arrêts, et une <a href=\"/resource?iri=https%3A%2F%2Flod.opentransportdata.swiss%2Fvocab%2FPreistabelle\">Preistabelle</a> (table de prix) attribue le tarif. Avec plus d'un demi-million de relations, c'est là que réside l'essentiel du graphe."
"page.mobility.waterOther" = "Eau & autres"
"page.mobility.whatItCostsTheNOVA" = "Ce que cela coûte : le modèle tarifaire NOVA"
"page.mobility.zonePlansFareNetworksPriced" = "Plans de zones, communautés tarifaires, relations tarifées et tables de prix"

