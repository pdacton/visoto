# ── Page: agriculture ─────────────────────────────────────────────────
"page.agriculture.aboutThisTheme" = "À propos de ce thème"
"page.agriculture.agriculture" = "Agriculture"
"page.agriculture.animalDiseaseCoverage" = "Mis à jour en continu ; foyers individuels géoréférencés à la commune et au canton"
"page.agriculture.animalDiseaseGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffsvo%2Fanimaldisease\">fsvo/animaldisease</a>"
"page.agriculture.animalDiseaseGroup" = "<strong>Déclaration des épizooties</strong>"
"page.agriculture.animalDiseaseIntro" = "Le jeu de données sur les épizooties est le plus immédiat de ce thème : un <strong>registre de cas</strong> dans lequel chaque ligne correspond à un foyer déclaré dans une exploitation, avec la date du diagnostic, l'espèce animale, le canton et la commune, ainsi que le nombre d'animaux du cheptel malades, infectés, abattus ou morts. Il est actualisé en continu ; les diagnostics les plus récents ne datent généralement que de quelques jours."
"page.agriculture.animalDiseaseSize" = "Un cube, ~58 000 déclarations de cas"
"page.agriculture.animalHealth" = "La maladie à l'étable"
"page.agriculture.biologicalAgents" = "Observez la moitié inférieure de ce tableau. À côté des herbicides et des fongicides, le registre inscrit les <strong>insectes auxiliaires, acariens prédateurs et nématodes</strong> comme produits phytosanitaires autorisés à part entière — des agents de lutte biologique homologués au même titre qu'un traitement chimique, avec les mêmes numéros d'homologation et les mêmes titulaires d'autorisation."
"page.agriculture.bluetongueStory" = "Interrogez ces données par maladie et l'histoire récente du cheptel suisse s'en dégage. L'épizootie de <strong>fièvre catarrhale ovine</strong> apparue en août 2024 domine tout le reste d'un ordre de grandeur et a touché pratiquement chaque canton ; vient ensuite le <strong>piétin</strong>, reflet du programme national d'éradication qui oblige les exploitations à le déclarer. Plus bas figurent les maladies endémiques de fond, à quelques dizaines de cas par an."
"page.agriculture.cantonCountCaveat" = "La colonne des cantons peut indiquer 27 plutôt que 26 : le registre utilise un code distinct pour la Principauté du Liechtenstein, qui fait partie de l'espace vétérinaire suisse. Notez également qu'un cas est une <em>déclaration</em>, non un animal — une ligne peut couvrir tout un cheptel touché, et les effectifs du cheptel et des malades portés sur l'observation en indiquent le nombre."
"page.agriculture.caveat" = "Réserve"
"page.agriculture.contents" = "Contenu"
"page.agriculture.coverage" = "Couverture"
"page.agriculture.cropsIntro" = "Deux graphes de ce thème ne contiennent aucune mesure. <strong>Crops</strong> est une véritable ontologie OWL des plantes cultivées en Suisse — plusieurs centaines de types de cultures organisés par <code>rdfs:subClassOf</code>, avec des axiomes <code>owl:disjointWith</code> affirmant qu'une parcelle ne peut être deux choses à la fois, et des classes obsolètes conservées afin que les enregistrements anciens restent résolubles. Elle est surtout <em>à facettes</em> : la même plante figure comme culture phytosanitaire, comme culture du bilan de fumure et comme culture donnant droit aux paiements directs, parce que les trois régimes réglementaires découpent le monde végétal différemment. <strong>Inspections</strong> en est la liste de contrôle correspondante — les points qu'un inspecteur vérifie lors d'une visite d'exploitation, regroupés en collections."
"page.agriculture.cropsLabelCaveat" = "Les noms de cultures ne portent <strong>aucune étiquette de langue</strong> : <em>Zuckerrüben</em>, <em>Betteraves sucrières</em> et <em>Barbabietole da zucchero</em> sont trois littéraux non étiquetés sur une même ressource, et l'anglais est totalement absent. Une culture peut donc apparaître sous l'orthographe que le résolveur rencontre en premier, et un filtrage linguistique par <code>lang()</code> les écarte toutes sans exception. Le même schéma se retrouve dans les noms de substances du registre phytosanitaire."
"page.agriculture.crossLinks" = "Les graphes s'appuient sur des données de référence partagées plutôt que de les répéter : les lieux des foyers se résolvent en cantons et communes <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Fterritorial\">territoriaux</a>, les observations de marché désignent leur office source via <code>cube:observedBy</code> pointant vers des organisations du <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffch%2Fstaatskalender\">Staatskalender</a>, et le temps est exprimé au moyen des ressources <code>ld.admin.ch/time/</code> communes à la plateforme. Un autre graphe de l'OSAV, <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffsvo%2Fcube\">fsvo/cube</a>, chevauche ce thème et celui de la <a href=\"/health.html\">santé</a> — il contient le contrôle des viandes et le contrôle des denrées alimentaires aux côtés des statistiques d'expérimentation animale, et il est publié sous un espace de noms <code>health.ld.admin.ch</code>."
"page.agriculture.datasetsIntro" = "Sept graphes nommés provenant de trois éditeurs, presque tous sous l'espace de noms de vocabulaire <code>https://agriculture.ld.admin.ch/</code>, y compris lorsque l'éditeur est l'office vétérinaire et non l'office de l'agriculture."
"page.agriculture.eggs" = "Les œufs, et ce que coûte le mode d'élevage"
"page.agriculture.eggsIntro" = "Les œufs illustrent le plus clairement la dimension <strong>système de production</strong>. Un œuf de même calibre est tarifé séparément pour l'élevage biologique, en plein air et au sol, et l'écart entre eux est important et stable — environ du simple au double entre le système le moins cher et le bio. Comme le mode d'élevage est une dimension codée et non une partie du nom du produit, le supplément se calcule par soustraction et non par comparaison manuelle de deux libellés."
"page.agriculture.foagPublisher" = "Office fédéral de l'agriculture (OFAG)"
"page.agriculture.fsvoPublisher" = "Office fédéral de la sécurité alimentaire et des affaires vétérinaires (OSAV)"
"page.agriculture.group" = "Groupe"
"page.agriculture.groupLabelCaveat" = "Les noms de groupes de produits reviennent en <em>langues mélangées</em> — <code>Vegetables</code> et <code>Fruits</code> à côté de <code>Rohmilch</code>, <code>Käse</code> et <code>Rahm</code>. Les allemands n'ont tout simplement pas de libellé anglais dans le registre, si bien que le résolveur se rabat sur ce qui existe. Les ressources elles-mêmes sont parfaitement formées ; seule la dénomination est inégale."
"page.agriculture.groupStageIntro" = "Croiser les groupes de produits avec ces étapes montre où l'office concentre ses relevés. Les fruits et légumes dominent et sont mesurés très majoritairement au stade de la consommation — un relevé hebdomadaire des prix en magasin portant sur une centaine d'articles. Le lait présente l'image inverse : l'essentiel de ses lignes se situe à la production, car le prix du lait à la ferme est en soi une grandeur politiquement surveillée."
"page.agriculture.intro" = "Trois offices fédéraux publient ici et suivent ensemble les denrées alimentaires sur tout leur parcours. L'<strong>Office fédéral de l'agriculture</strong> observe le marché — ce qu'un produit rapporte à chaque étape, de la ferme à la caisse. L'<strong>Office fédéral de la sécurité alimentaire et des affaires vétérinaires</strong> couvre les deux choses qui peuvent mal tourner : les ravageurs au champ et la maladie à l'étable. <strong>Agroscope</strong>, le centre fédéral de recherche agronomique, y ajoute une petite série de recherche."
"page.agriculture.marketDataCaveat" = "Les observations portent <strong>20 dimensions</strong>, toutes des IRI. Puissant, mais une requête qui omet une dimension agrège silencieusement sur celle-ci — vérifiez toujours quel découpage vous avez réellement sélectionné"
"page.agriculture.marketDataContents" = "Lait et produits laitiers, fruits/légumes/pommes de terre, œufs, viande, céréales panifiables, oléagineux, protéagineux, aliments pour animaux"
"page.agriculture.marketDataGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffoag%2Fagricultural-market-data\">foag/agricultural-market-data</a>"
"page.agriculture.marketDataGroup" = "<strong>Données du marché agricole</strong>"
"page.agriculture.marketDataShape" = "Une grille régulière de <em>groupe de produits × étape de la chaîne de valeur × mesure × fréquence</em> — p. ex. <code>Eggs/Production_Price_Month</code>, <code>MilkDairyProducts/Consumption_Price_Year</code>"
"page.agriculture.marketDataSize" = "49 cubes, ~180 000 observations, ~1 700 produits distincts"
"page.agriculture.metaTitle" = "Agriculture & alimentation"
"page.agriculture.milk" = "Le prix du lait, en Suisse et à l'étranger"
"page.agriculture.milkIntro" = "Le lait est le produit le mieux instrumenté du thème, et son cube mensuel des prix à la production contient quelque chose d'inhabituel : à côté des chiffres suisses, il donne <strong>le prix du même mois en Allemagne, en France, en Autriche, en Italie, dans l'ensemble de l'UE, aux États-Unis et en Nouvelle-Zélande</strong>. Les séries internationales sont des produits ordinaires du même cube, de sorte qu'un prix intérieur et sa référence étrangère se comparent sans quitter le jeu de données."
"page.agriculture.milkSegments" = "Les lignes suisses sont réparties par <strong>segment</strong> — A pour le lait vendu sur les marchés intérieurs protégés, B pour les produits d'exportation exposés à la concurrence, C pour le solde écoulé aux prix mondiaux. Les trois se négocient à des niveaux réellement différents, et c'est précisément l'écart entre eux qui justifie cette segmentation."
"page.agriculture.milkUnitCaveat" = "Les prix s'entendent par 100 kg en francs suisses, sauf indication contraire du produit, et les séries étrangères sont converties en francs par l'office — leurs variations mêlent donc une variation de prix réelle et une variation de change. Chaque ligne porte ses propres dimensions <code>unit</code> et <code>currency</code> ; ouvrez une observation pour voir exactement ce qui a été mesuré."
"page.agriculture.namedGraph" = "Graphe nommé"
"page.agriculture.plantProtection" = "Ce qui est homologué pour être pulvérisé"
"page.agriculture.plantProtectionContents" = "Le registre fédéral des produits phytosanitaires : homologations, titulaires d'autorisation, substances actives, indications culture/ravageur, importations parallèles, délais d'écoulement"
"page.agriculture.plantProtectionGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffsvo%2Fplant-protection-products\">fsvo/plant-protection-products</a>"
"page.agriculture.plantProtectionGroup" = "<strong>Produits phytosanitaires</strong>"
"page.agriculture.plantProtectionIntro" = "Le registre des produits phytosanitaires est la liste complète des pesticides qu'un agriculteur suisse peut légalement appliquer, et c'est un registre et non une statistique — chaque produit homologué, son numéro fédéral d'homologation, l'entreprise titulaire de l'autorisation, ses substances actives et les combinaisons précises de culture et de ravageur pour lesquelles il est autorisé. C'est le seul jeu de données du thème doté d'une portée réglementaire véritable : si un produit n'y figure pas, son emploi est illégal."
"page.agriculture.plantProtectionSize" = "~2 400 produits homologués, ~7 900 indications, ~450 substances, 24 catégories de produits"
"page.agriculture.plantProtectionStructure" = "La structure mérite qu'on s'y arrête. Un produit porte des <strong>indications</strong> — par milliers —, et chaque indication est un triplet précis de culture, de ravageur et de dose ; c'est pourquoi le registre compte plusieurs fois plus d'indications que de produits. Les produits retirés ne sont pas supprimés mais reçoivent une <code>soldOutDeadline</code> et une <code>exhaustionDeadline</code> : les dates auxquelles les stocks doivent quitter les rayons et être épuisés. Le registre documente ainsi le retrait autant que l'autorisation."
"page.agriculture.publisher" = "Éditeur"
"page.agriculture.referenceCaveat" = "Ce sont des vocabulaires, non des statistiques — <code>foag/crops</code> est une ontologie OWL et ne contient pratiquement aucune observation"
"page.agriculture.referenceContents" = "Ontologie des cultures (~740 types de cultures), points de contrôle des inspections d'exploitation (~3 950), la carte de référence du système agricole et un petit cube de recherche Agroscope"
"page.agriculture.referenceData" = "Les vocabulaires sous-jacents"
"page.agriculture.referenceGraphs" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffoag%2Fcrops\">foag/crops</a>, <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffoag%2Finspections\">foag/inspections</a>, <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffoag%2Fsystem-map\">foag/system-map</a>, <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Fagroscope%2Fcube\">agroscope/cube</a>"
"page.agriculture.referenceGroup" = "<strong>Vocabulaires de référence et recherche</strong>"
"page.agriculture.shape" = "Structure"
"page.agriculture.size" = "Taille"
"page.agriculture.stageConsumption" = "Consommation"
"page.agriculture.stageConsumptionDesc" = "Le rayon du magasin. De loin la plus grande part de ce jeu de données."
"page.agriculture.stageProduction" = "Production"
"page.agriculture.stageProductionDesc" = "La ferme. Ce que le producteur touche réellement, avant que la marchandise ne passe en d'autres mains."
"page.agriculture.stageTrade" = "Importation & exportation"
"page.agriculture.stageTradeDesc" = "Quantités et prix transfrontaliers — la référence à l'aune de laquelle se lisent les chiffres intérieurs."
"page.agriculture.stageWholesale" = "Commerce de gros / transformation"
"page.agriculture.stageWholesaleDesc" = "La laiterie, le moulin, l'abattoir. Là où la matière première devient un produit."
"page.agriculture.stagesIntro" = "Chaque observation de marché est marquée de l'étape de la chaîne à laquelle elle appartient. Les étapes sont une dimension codée et non du texte libre, de sorte qu'un prix n'est jamais ambigu quant à la main dans laquelle il a été mesuré."
"page.agriculture.subtitle" = "Ce que produisent les exploitations suisses et ce que cela coûte à chaque étape, du champ au rayon — et ce qui protège la culture et le cheptel."
"page.agriculture.theDatasets" = "Les jeux de données"
"page.agriculture.theValueChain" = "De la ferme à la caisse"
"page.agriculture.title" = "Agriculture & alimentation"
"page.agriculture.valueChainIdea" = "L'idée directrice des données de marché est la <strong>chaîne de valeur</strong>. Le même produit est tarifé séparément à la production, au commerce de gros et à la transformation, au commerce de gros pour la restauration et à la consommation — auxquels s'ajoutent l'importation et l'exportation. C'est ce qui rend ce thème singulier : pour le lait, les œufs ou un kilo de carottes, on peut suivre le <em>même</em> bien à travers chaque main par laquelle il passe et voir où se situe la marge, au lieu de comparer un prix à la ferme et un prix en magasin issus de deux sources sans lien."

# ── Page: energy ──────────────────────────────────────────────────────
"page.energy.aboutThisTheme" = "À propos de ce thème"
"page.energy.aidFee" = "Supplément réseau"
"page.energy.aidFeeDesc" = "La redevance fédérale d'encouragement des énergies renouvelables. Fixée au niveau national, elle est donc identique dans chaque ligne d'une même année."
"page.energy.buildingsAndScenarios" = "Bâtiments et scénarios"
"page.energy.buildingsScenariosIntro" = "Deux autres familles complètent le fonds de l'OFEN. Le <strong>Programme Bâtiments</strong> (<em>Gebäudeprogramm</em>) rend compte des subventions à l'assainissement dans quatre cubes parallèles — demandes soutenues, francs versés, énergie économisée et CO₂ évité, chaque fois par catégorie de mesure et année de rapport —, si bien que le coût et l'effet d'un même programme se lisent côte à côte. Les <strong>Perspectives énergétiques 2050+</strong> sont d'une autre nature : non pas le relevé de ce qui s'est produit, mais un ensemble de <em>scénarios modélisés</em> décrivant comment la Suisse atteint la neutralité carbone, avec des variantes sur la durée d'exploitation des centrales nucléaires et le solde des importations. Leurs chiffres sont des projections, non des observations."
"page.energy.cantonComparisonIntro" = "Classé par canton, l'écart est assez large pour que le moins cher et le plus cher ne soient plus comparables — et la décomposition montre pourquoi ils diffèrent. Certains cantons sont chers à cause de la composante énergie, d'autres à cause de l'utilisation du réseau ; le supplément réseau est partout identique et n'explique donc jamais un écart. Les chiffres ci-dessous portent sur le <strong>profil H4</strong> (appartement de 5 pièces avec cuisinière électrique, environ 4500 kWh par an) pour le produit standard."
"page.energy.cantonLabelsUntagged" = "Les noms de cantons dans LINDAS ne portent <em>aucune étiquette de langue</em> — Zug, Zoug et Zugo sont trois littéraux non étiquetés sur la même ressource — de sorte qu'un canton peut apparaître sous l'orthographe que le résolveur de libellés rencontre en premier. Il s'agit dans tous les cas de la même ressource."
"page.energy.caveat" = "Réserve"
"page.energy.communityCharge" = "Redevances aux collectivités publiques"
"page.energy.communityChargeDesc" = "Taxes locales répercutées par la commune. Nulles chez de nombreux gestionnaires, substantielles chez quelques-uns."
"page.energy.consumptionProfiles" = "Profils de consommation"
"page.energy.contents" = "Contenu"
"page.energy.coverage" = "Couverture"
"page.energy.crossLinks" = "Les deux graphes renvoient vers l'extérieur plutôt que de dupliquer les données de référence : communes et cantons se résolvent dans le <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffso%2Fregister\">registre de l'OFS</a>, les gestionnaires de réseau portent l'IDE utilisé par <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffoj%2Fzefix\">Zefix</a>, les agents énergétiques proviennent d'une <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Fcube%2Fdimension\">dimension de cube partagée</a>, et les offices éditeurs sont les mêmes ressources <code>ld.admin.ch/office</code> que sur l'ensemble de la plateforme."
"page.energy.datasetsIntro" = "Deux graphes nommés, tous deux sous l'espace de noms de vocabulaire <code>https://energy.ld.admin.ch/</code>, formant ensemble le troisième thème de LINDAS par nombre de triplets."
"page.energy.elcomContents" = "Tarifs par gestionnaire, médianes par canton et pour la Suisse, ainsi que les cubes d'indicateurs réglementaires <em>Sunshine</em>"
"page.energy.elcomCoverage" = "De 2011 à 2026, une ligne par gestionnaire × profil × produit × année"
"page.energy.elcomPublisher" = "Commission fédérale de l'électricité (ElCom)"
"page.energy.elcomSize" = "~24 millions de triplets — 7 cubes, ~772 000 observations"
"page.energy.electricityTariffs" = "<strong>Tarifs de l'électricité</strong>"
"page.energy.electricitypriceGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Felcom%2Felectricityprice\">elcom/electricityprice</a>"
"page.energy.energy" = "Énergie"
"page.energy.energyBalanceIntro" = "La <strong>statistique globale suisse de l'énergie</strong> remonte à 1980 et indique la consommation en térajoules par an, ventilée par agent énergétique. Les agents proviennent d'une dimension LINDAS partagée et non de texte libre, et ils s'emboîtent : <em>renouvelable</em> se subdivise en bois, force hydraulique et autres renouvelables, <em>non renouvelable</em> en combustibles nucléaires, produits pétroliers, gaz, charbon et déchets. Comme la hiérarchie figure dans les données, totaux et composantes s'interrogent depuis le même cube sans double comptage — à condition de choisir un seul niveau."
"page.energy.energyComponent" = "Énergie"
"page.energy.energyComponentDesc" = "L'électricité elle-même. La seule part soumise à la concurrence, et celle qui s'est envolée après 2022."
"page.energy.energyStatisticsGroup" = "<strong>Statistiques de l'énergie</strong>"
"page.energy.everyTariffIsBrokenIntoFour" = "Chaque tarif de ce cube est décomposé en <strong>quatre composantes</strong>, et le modèle le dit lui-même : la mesure totale porte des liens <code>schema:hasPart</code> vers chaque partie, si bien que la décomposition se lit dans les données et non dans un manuel. Cela compte, car les parties se comportent très différemment — une seule d'entre elles est l'électricité."
"page.energy.gridUsage" = "Utilisation du réseau"
"page.energy.gridUsageDesc" = "L'acheminement sur le réseau local. Un monopole naturel, et souvent la plus grande part isolée."
"page.energy.group" = "Groupe"
"page.energy.metaTitle" = "Énergie"
"page.energy.namedGraph" = "Graphe nommé"
"page.energy.operatorTableIntro" = "Sous les médianes cantonales figurent les gestionnaires eux-mêmes. Chacun est une <a href=\"/resource?iri=http%3A%2F%2Fschema.org%2FOrganization\">organisation schema.org</a> dotée d'une adresse postale, d'un site web et — fort utilement — d'un <strong>numéro d'identification des entreprises</strong>, le même IDE qu'utilise le registre du commerce <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Ffoj%2Fzefix\">Zefix</a>. C'est cet identifiant partagé qui permet de rattacher un tarif à la personne morale qui se trouve derrière."
"page.energy.operatorTariffCaveat" = "Un gestionnaire peut desservir plusieurs communes à des tarifs différents ; les colonnes de prix montrent une ligne représentative et non une moyenne — consultez la page de ressource du gestionnaire pour le tableau complet. Certains gestionnaires publient un tarif identique sur tout leur territoire, d'autres non."
"page.energy.profileDescriptionCaveat" = "Les descriptions de profils sont publiées <strong>en allemand uniquement</strong> — contrairement aux noms de cubes et de dimensions, qui existent dans les quatre langues nationales — et apparaissent donc ici telles que l'ElCom les enregistre, quel que soit votre choix de langue. Notez aussi les apostrophes qu'elles contiennent : c'est le séparateur suisse des milliers (<code>4'500</code>), non des guillemets."
"page.energy.profilesDefinitions" = "Chaque profil est un concept SKOS à part entière et porte sa définition avec lui : une consommation de référence en kilowattheures par an et une description du ménage ou de l'entreprise qu'il représente. C'est ce qui rend la comparaison ci-dessous significative — <strong>H4</strong> et <strong>H3</strong> consomment tous deux 4500 kWh par an, mais H3 est un appartement de 4 pièces avec chauffe-eau électrique tandis que H4 est un appartement de 5 pièces avec sèche-linge et sans chauffe-eau ; les deux sont donc tarifés face à des clients réellement différents et non à une étiquette arbitraire."
"page.energy.profilesIntro" = "Les prix ne sont jamais indiqués pour un client abstrait unique. L'ElCom définit quinze profils standard — <strong>H1–H8</strong> pour les ménages, de l'appartement de 2 pièces à la grande maison individuelle avec pompe à chaleur, et <strong>C1–C7</strong> pour les entreprises, du petit atelier à l'établissement industriel moyen. Chaque profil est tarifé séparément par chaque gestionnaire et pour chaque année, d'où proviennent les 770 000 observations : quelques centaines de gestionnaires multipliés par quinze profils, deux produits et seize ans."
"page.energy.publisher" = "Éditeur"
"page.energy.reservoirIntro" = "Les lacs d'accumulation alpins sont la batterie du pays, et le cube du <strong>taux de remplissage des lacs d'accumulation</strong> est la seule série hebdomadaire de ce thème — un relevé chaque dimanche à minuit du nombre de gigawattheures stockés par rapport au maximum que peuvent contenir les bassins. C'est un jeu de données véritablement opérationnel : lors du débat sur l'approvisionnement de 2022, c'était le chiffre que tout le monde surveillait. Deux particularités de sa structure méritent d'être connues avant de l'interroger. Les régions ne sont pas une dimension mais des <em>colonnes</em> distinctes (<code>gr…</code> pour les Grisons, <code>ti…</code> pour le Tessin), et la <strong>date du relevé n'est pas du tout une propriété</strong> — elle ne subsiste qu'à l'intérieur de l'IRI de l'observation et doit être extraite de la chaîne avant de pouvoir trier la série."
"page.energy.sfoeCaveat" = "Les 91 cubes correspondent à environ 18 jeux de données en de multiples versions — prenez toujours l'IRI de cube au numéro le plus élevé, sauf si vous comparez des versions"
"page.energy.sfoeContents" = "Statistique globale de l'énergie, taux de remplissage des lacs d'accumulation, subventions solaires, Programme Bâtiments, statistiques de la recherche, mobilité partagée, scénarios 2050+"
"page.energy.sfoeGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Fsfoe%2Fcube\">sfoe/cube</a>"
"page.energy.sfoeIntro" = "L'Office fédéral de l'énergie publie quelque nonante cubes, mais ils représentent moins de jeux de données que ce nombre ne le laisse croire : la plupart existent en plusieurs <strong>versions</strong>, chacune étant une IRI de cube distincte se terminant par un numéro, et seule la plus élevée est à jour. Les quatre familles ci-dessous en portent la substance."
"page.energy.sfoePublisher" = "Office fédéral de l'énergie (OFEN)"
"page.energy.sfoeSize" = "~31 millions de triplets — 91 cubes, ~1,9 million d'observations"
"page.energy.size" = "Taille"
"page.energy.solarIntro" = "La <strong>rétribution unique pour les installations photovoltaïques</strong> (<em>Einmalvergütung</em>) est la subvention fédérale au solaire en toiture, et son cube est le jeu de données le plus directement comparable de ce thème : par canton et par année, il consigne le nombre d'installations, la puissance installée en kilowatts, les francs versés — <em>et</em> les deux premières grandeurs rapportées à 100 000 habitants. C'est cette dernière paire qui permet de comparer un petit canton à Zurich sans faire le calcul soi-même."
"page.energy.subsidisedSolar" = "Le solaire subventionné"
"page.energy.subtitle" = "Ce que la Suisse brûle, stocke et produit — et ce que coûte un kilowattheure, dans chaque commune."
"page.energy.theDatasets" = "Les jeux de données"
"page.energy.thePhysicalSystem" = "Le système physique"
"page.energy.thePriceDataIsTheUnusual" = "Les données de prix sont la partie inhabituelle. En Suisse, l'électricité n'est pas vendue à un prix national : elle l'est par quelque 550 gestionnaires de réseau locaux, pour la plupart des services industriels communaux, chacun fixant son propre tarif. L'ElCom les collecte tous, ce qui transforme une facture de ménage en objet interrogeable : <em>qui facture quoi, où, et quelle part de la facture est réellement l'électricité ?</em>"
"page.energy.thePriceOfAKilowattHour" = "Le prix d'un kilowattheure"
"page.energy.title" = "Énergie"
"page.energy.twoPublishersTwoQuestions" = "Deux éditeurs couvrent ce thème et répondent à deux questions différentes. L'<strong>Office fédéral de l'énergie</strong> décrit le système <em>physique</em> : quelle quantité d'énergie le pays consomme et à partir de quels agents, à quel point les lacs d'accumulation alpins sont remplis cette semaine, quelle puissance solaire a été subventionnée dans chaque canton. La <strong>Commission fédérale de l'électricité</strong> décrit le <em>marché</em> : ce que facture chaque gestionnaire de réseau du pays, pour chaque profil de consommation, chaque année depuis 2011."
"page.energy.waterInTheMountains" = "L'eau dans les montagnes"
"page.energy.whereTheEnergyComesFrom" = "D'où vient l'énergie"
"page.energy.whoChargesWhat" = "Qui facture quoi"

# ── Page: culture ─────────────────────────────────────────────────────
"page.culture.aboutThisTheme" = "À propos de ce thème"
"page.culture.accessIntro" = "Chaque unité de description porte en outre une <strong>règle d'accès</strong> via <code>isAssociatedWithRule</code>. En Suisse, l'accès aux archives est régi par des délais de protection — normalement trente ans, davantage pour les dossiers contenant des données personnelles — et cette propriété distingue donc une description que l'on peut lire d'un document que l'on peut effectivement consulter. La description est publique même lorsque le document ne l'est pas encore."
"page.culture.aisCaveat" = "Les libellés du vocabulaire utilisent <code>ric:name</code> <strong>sans étiquette de langue</strong>, répété une fois par langue — appliquez-leur toujours <code>SAMPLE</code>, sinon chaque ligne se multiplie"
"page.culture.aisCoverage" = "De 1798 à nos jours, en huit départements principaux par période historique"
"page.culture.aisGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Fsfa%2Fais\">sfa/ais</a>"
"page.culture.aisGroup" = "<strong>Système d'information archivistique</strong>"
"page.culture.aisModel" = "<strong>RiC-O</strong> (Records in Contexts), l'ontologie archivistique du CIA — et <em>non</em> le vocabulaire cube"
"page.culture.aisSize" = "~4,8 millions d'unités de description, ~263 000 documents, ~5,1 millions d'intervalles de dates — le plus grand graphe de LINDAS"
"page.culture.budgetVsAccounts" = "Chaque ligne est marquée d'un <strong>type de rapport</strong>, et la distinction pèse plus qu'il n'y paraît : <code>Voranschlag</code> est le budget tel que prévu, <code>Rechnung</code> les comptes tels qu'ils ont été bouclés. Les deux existent pour la même année et la même rubrique, si bien que l'écart entre ce que la Confédération entendait dépenser et ce qu'elle a réellement dépensé s'interroge directement sur 175 ans. Les premières années laissent voir un État différent — en 1850, les plus gros postes sont l'administration des postes, les droits de douane et le département militaire."
"page.culture.caveat" = "Réserve"
"page.culture.contents" = "Contenu"
"page.culture.coverage" = "Couverture"
"page.culture.crossLinks" = "Le thème renvoie vers l'extérieur autant que vers l'intérieur : les unités de description désignent l'institution qui les conserve via le registre <a href=\"/resource?iri=https%3A%2F%2Fschema.ld.admin.ch%2FIsil\">ISIL</a>, les observations des comptes d'État désignent l'office éditeur via <code>cube:observedBy</code> pointant vers des ressources <code>ld.admin.ch/office</code>, et l'ontologie RiC-O elle-même est publiée séparément sur la plateforme sous <a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Fegad%2Fric-o\">egad/ric-o</a> — le vocabulaire qui décrit les archives peut donc être parcouru à côté des archives qu'il décrit."
"page.culture.culture" = "Culture"
"page.culture.datasetsIntro" = "Quatre graphes nommés, publiés sous l'espace de noms <code>https://culture.ld.admin.ch/</code> — à une exception près signalée ci-dessous. Ensemble, ils font de ce thème le plus vaste de la plateforme par nombre de triplets."
"page.culture.divisionsCaveat" = "Les nombres ci-dessus ne comptent que les membres <em>directs</em> — les fonds situés immédiatement sous chaque département, et non les millions de dossiers en dessous. Un département n'affichant qu'un seul enfant n'est pas petit ; il est simplement décrit via un niveau intermédiaire avant de se ramifier."
"page.culture.divisionsIntro" = "Tout en haut, les archives se divisent en huit <strong>départements principaux</strong>, et ce sont des périodes de l'histoire suisse plutôt que des sujets. L'<em>Archiv der Helvetik</em> couvre l'éphémère République helvétique de 1798–1803, suivie de la Médiation et de la Diète ; l'essentiel se trouve sous l'<em>Archiv des Schweizerischen Bundesstaates</em>, l'État fédéral à partir de 1848. Les dépôts et donations de mains privées forment à leurs côtés une division propre."
"page.culture.group" = "Groupe"
"page.culture.hierarchyIntro" = "La description archivistique est strictement hiérarchique, et les niveaux portent des noms que les archivistes emploient depuis un siècle. Tout s'emboîte de haut en bas, des archives elles-mêmes aux départements principaux et aux fonds jusqu'au dossier individuel, et chaque niveau est un <code>RecordSet</code> muni d'un <code>hasRecordSetType</code> indiquant l'échelon qu'il occupe. La quasi-totalité du volume se situe tout en bas : les dossiers dépassent tous les autres niveaux réunis d'environ dix fois."
"page.culture.intro" = "C'est de loin le thème le plus vaste de LINDAS, et le moins semblable aux autres. Là où l'énergie ou l'agriculture publient des <em>mesures</em>, les <strong>Archives fédérales suisses</strong> publient des <em>descriptions</em> : un instrument de recherche archivistique est un exposé imbriqué de ce qui existe, de sa place dans les fonds et de ce dont il traite. La <strong>Bibliothèque nationale suisse</strong> y ajoute le registre des institutions qui conservent de tels documents dans tout le pays."
"page.culture.isilCaveat" = "Les chiffres relatifs aux fonds sont autodéclarés et ne reposent pas sur une base commune — certaines institutions comptent des volumes, d'autres des pièces ou des mètres linéaires — l'ordre est donc indicatif et non un classement. Seule une partie du registre fournit un chiffre ; les institutions qui n'en donnent pas sont absentes de ce tableau, elles ne sont pas vides."
"page.culture.isilContents" = "Bibliothèques, archives, médiathèques et collections privées — avec année de fondation, taille des fonds, histoire administrative et lien vers le catalogue propre de l'institution"
"page.culture.isilGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Fnl%2Fisil\">nl/isil</a>"
"page.culture.isilGroup" = "<strong>Registre ISIL</strong>"
"page.culture.isilIntro" = "Un <strong>ISIL</strong> est l'identifiant international normalisé d'une bibliothèque ou d'archives — <code>CH-000018-2</code> désigne les Archives fédérales elles-mêmes — et la Bibliothèque nationale tient le registre suisse correspondant. Il va bien au-delà des institutions nationales : bibliothèques communales, médiathèques scolaires, archives paroissiales, collections d'entreprise et archives de théâtre en possèdent toutes un. Pour de nombreuses entrées, le registre consigne une année de fondation, la taille des fonds, une histoire administrative rédigée et une description du contenu de la collection."
"page.culture.isilJoin" = "C'est l'identifiant qui fait la jonction entre les deux graphes archivistiques. Chaque unité de description des Archives fédérales pointe via <code>hasOrHadHolder</code> vers une ressource ISIL, de sorte qu'une description et l'institution qui la conserve sont reliées par un identifiant partagé plutôt que par une chaîne de caractères — le même schéma que celui utilisé par le thème de l'énergie pour les IDE d'entreprises."
"page.culture.isilSize" = "~2 120 institutions, chacune avec une adresse postale et une ressource d'organisation"
"page.culture.metaTitle" = "Culture & archives"
"page.culture.model" = "Modèle"
"page.culture.namedGraph" = "Graphe nommé"
"page.culture.nlPublisher" = "Bibliothèque nationale suisse"
"page.culture.publisher" = "Éditeur"
"page.culture.recordsIntro" = "Sous les unités de description se trouvent les documents eux-mêmes, plus riches qu'une notice de catalogue. Outre un titre et une cote, un document peut porter une note de <strong>présentation du contenu</strong>, un auteur, un éditeur, un cadreur nommément cité, un format matériel et un descripteur de sujet. Ce mélange révèle ce qu'une grande partie de ces archives contient réellement : non seulement des dossiers papier mais du <strong>matériel de diffusion</strong> — émissions de télévision et de radio déposées par le radiodiffuseur public, avec durées, indications de couleur et formats de bande consignés dans le champ <code>format</code>."
"page.culture.ricIntro" = "Les archives sont modélisées en <strong>Records in Contexts</strong> (RiC-O), l'ontologie archivistique du Conseil international des archives — et non dans le vocabulaire cube employé presque partout ailleurs sur la plateforme. Ce choix est la chose la plus importante à connaître avant de les interroger. RiC est conçu pour la description et non pour l'agrégation : son idée centrale est qu'un document ne prend sens que par son <em>contexte</em>, si bien que les relations (ce qui contient quoi, qui l'a conservé, quelle activité l'a produit) portent autant de sens que les titres."
"page.culture.sfaCubeCaveat" = "Fortement versionné — <code>StateAccounts_Domain</code> compte à lui seul 11 cubes au nombre de lignes identique. Ancrez chaque requête dans une seule IRI de cube, sinon vous compterez plusieurs fois les mêmes chiffres"
"page.culture.sfaCubeCoverage" = "À partir de 1850, budget et comptes, ventilés par domaine / office / fonction / catégorie"
"page.culture.sfaCubeGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Fsfa%2Fcube\">sfa/cube</a>"
"page.culture.sfaCubeSize" = "41 cubes en 5 familles — mais seulement ~4 jeux de données distincts, le reste étant des versions"
"page.culture.sfaPublisher" = "Archives fédérales suisses"
"page.culture.shapeOfAnArchive" = "La structure d'un fonds d'archives"
"page.culture.size" = "Taille"
"page.culture.stapfer" = "Une enquête scolaire de 1799"
"page.culture.stapferCaveat" = "Ce sont des transcriptions d'une source manuscrite vieille de 226 ans, et cela se voit. Quelques entrées portent des chiffres invraisemblables — une école déclare plus de mille garçons contre nonante-cinq filles — qui reflètent la réponse d'origine ou sa transcription plutôt que le village. Triez par n'importe quelle colonne et les valeurs aberrantes apparaissent aussitôt ; traitez-les comme des documents, non comme des mesures."
"page.culture.stapferCaveatCard" = "Utilise l'<strong>ancien vocabulaire cube du W3C</strong> (<code>qb:Observation</code>) et réside dans l'espace de noms <code>education.ld.admin.ch</code>, non <code>culture</code>"
"page.culture.stapferGraph" = "<a href=\"/resource?iri=https%3A%2F%2Flindas.admin.ch%2Fsfa%2Fstapfer_enquete\">sfa/stapfer_enquete</a>"
"page.culture.stapferGroup" = "<strong>Enquête Stapfer (1799)</strong>"
"page.culture.stapferIntro" = "L'<strong>Enquête Stapfer</strong> est le plus ancien jeu de données de la plateforme et le plus vivant. En 1799, le ministre des Arts et des Sciences Philipp Albert Stapfer adressa un questionnaire à chaque maître d'école de la République helvétique, demandant qui enseignait, qui fréquentait l'école, ce qui y était enseigné et de quoi elle vivait. Des milliers de réponses subsistent et ont été transcrites en un jeu de données interrogeable — ce qui se rapproche le plus d'un recensement des écoles suisses au moment où naît l'État moderne."
"page.culture.stapferSeasons" = "Un détail de la structure dit presque tout de la vie rurale en 1799 : la fréquentation est consignée <strong>séparément pour l'hiver et pour l'été</strong>, et séparément pour les garçons et les filles. Les chiffres d'été ne représentent régulièrement qu'une fraction de ceux d'hiver, parce qu'en été les enfants travaillaient aux champs. L'écart saisonnier dans ces données mesure le travail agricole, non la scolarisation."
"page.culture.stapferSize" = "~3 230 réponses d'écoles, avec effectifs d'élèves par sexe et par saison, type d'école, confession et lieu"
"page.culture.stateAccounts" = "Le budget fédéral depuis 1850"
"page.culture.stateAccountsGroup" = "<strong>Comptes d'État</strong>"
"page.culture.stateAccountsIntro" = "Les Archives fédérales publient aussi quelque chose qui n'est nullement un instrument de recherche : les <strong>comptes d'État</strong>, le budget et les comptes de la Confédération sous forme de cube continu remontant à <strong>1850</strong> — deux ans après la fondation de l'État fédéral. Les mêmes chiffres sont découpés de quatre manières, une famille de cubes par vue : par <em>domaine</em>, par <em>office</em>, par <em>fonction</em> et par <em>catégorie</em>."
"page.culture.subtitle" = "La mémoire de l'État suisse — neuf millions de descriptions archivistiques, un registre de toutes les institutions de conservation et une enquête scolaire de 1799."
"page.culture.theDatasets" = "Les jeux de données"
"page.culture.title" = "Culture & archives"
"page.culture.whatRecordsDescribe" = "Ce que décrivent les documents"
"page.culture.whoHoldsWhat" = "Qui conserve quoi"

