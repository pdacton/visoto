"page.health.theDatasets" = "Les jeux de données"
"page.health.theEpidemiologicalCoreDailyAnd" = "Le noyau épidémiologique : chiffres quotidiens et cumulés par canton et pour l'ensemble du pays, chacun avec sa population de référence."
"page.health.theMedicineCabinet" = "L'armoire à pharmacie"
"page.health.thePandemicRecord" = "La chronique de la pandémie"
"page.health.theVaccines" = "Les vaccins"
"page.health.twoLINDASGraphsCoverPublic" = "Deux graphes LINDAS couvrent la santé publique, et leur tempérament ne saurait être plus différent. Le <strong>graphe COVID-19 de l'OFSP</strong> est une archive scellée : la chronique quotidienne complète de la pandémie en Suisse — cas, décès, hospitalisations, vaccinations — figée au 1er janvier 2023, lorsque la déclaration quotidienne obligatoire a pris fin. Le <strong>graphe des ruptures d'approvisionnement de l'OFAE</strong> en est l'opposé, un flux vivant : chaque jour, l'Office fédéral pour l'approvisionnement économique du pays publie un nouvel instantané des médicaments vitaux actuellement indisponibles et de la date de retour prévue."
