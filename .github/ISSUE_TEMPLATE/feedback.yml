# Issue form behind the topbar feedback button (static/js/feedback.js). The
# button prefills `title`, `description` and `context` through query parameters
# named after the field ids below — keep the ids in sync with feedback.js.
name: Feedback
description: Report a bug, suggest an idea or ask a question about a Visoto page.
labels: ["feedback"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, what did you expect, or what would you like to see?
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Filled in by Visoto — the page you were on, endpoint, language and browser.
    validations:
      required: false
