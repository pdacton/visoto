<!--
  Partial template for rendering a single SPARQL count result as a metric card.
  The count is loaded asynchronously via HTMX from /api/metric/:queryId.

  Usage:
    {{ template "sparqlMetric" (dict "queryId" "termSetCount" "title" "Defined Term Sets" "href" "/resource/schema:DefinedTermSet" "icon" "/static/img/resource/DefinedTermSet.fallback.svg") }}

  Parameters (via dict):
    - queryId: ID matching the <sparql-async> element in the page template
    - title: card title and link label
    - href: URL for the title link
    - icon: (optional) path to an SVG image to display alongside the title
-->

{{ define "sparqlMetric" }}

  {{ $queryId := .queryId }}
  {{ $title := .title }}
  {{ $href := .href }}
  {{ $icon := .icon }}

  <div class="col-sm-6 col-lg-3">
    <div class="card card-sm">
      <div class="card-body">
        <div class="d-flex align-items-start">
          {{ if $icon }}
          <div class="me-3">
            <img src="{{ $icon }}" alt="{{ $title }}" width="40" height="40">
          </div>
          {{ end }}
          <div>
            <div class="subheader"><a href="{{ $href }}">{{ $title }}</a></div>
            <div class="h1 mb-0"
                 hx-get="/api/metric/{{ $queryId }}"
                 hx-trigger="load"
                 hx-swap="innerHTML">
              <span class="spinner-border spinner-border-sm text-muted" role="status"></span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

{{ end }}
