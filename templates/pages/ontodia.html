
{{ define "pageTitle" }}Graph Explorer{{ end }}
{{ define "pageIcon" }}<img src="/static/img/graphexplorer.svg" alt="Graph Explorer Icon" width="40" />{{ end }}
{{ define "metaIcon" }}/static/img/graphexplorer.svg{{ end }}

{{ define "pageContent" }}
<!-- Graph Explorer expects Font Awesome icons, but we're replacing them with Lucide via CSS mask-image (see ontodia_overrides.css) -->
<link rel="stylesheet" href="/static/css/ontodia_overrides.css">
<div id="graph-explorer-root" style="height: calc(100vh - 200px); width: 100%; border: 1px solid var(--tblr-border-color); border-radius: var(--tblr-border-radius);"></div>
{{ end }}

{{ define "pageScripts" }}
<script src="https://cdn.jsdelivr.net/npm/graph-explorer@1.3.0/dist/graph-explorer-full.min.js"></script>
<script>
(function() {
  'use strict';
  var GE = window.GraphExplorer;
  var container = document.getElementById('graph-explorer-root');

  if (!GE || !GE.Workspace || !GE.SparqlDataProvider) {
    container.innerHTML = '<div class="alert alert-danger m-3">Failed to load Graph Explorer library</div>';
    return;
  }

  // URL parameter support for deep linking
  var urlParams = new URLSearchParams(window.location.search);
  var startIRI = urlParams.get('iri') || 'https://ld.admin.ch/canton/2';

  function onWorkspaceMounted(workspace) {
    if (!workspace) return;

    // OWLStatsSettings with LINDAS-specific label properties and prefixes.
    var settings = Object.assign({}, GE.OWLStatsSettings, {
      defaultPrefix:
        'PREFIX rdf:    <http://www.w3.org/1999/02/22-rdf-syntax-ns#>\n' +
        'PREFIX rdfs:   <http://www.w3.org/2000/01/rdf-schema#>\n' +
        'PREFIX owl:    <http://www.w3.org/2002/07/owl#>\n' +
        'PREFIX skos:   <http://www.w3.org/2004/02/skos/core#>\n' +
        'PREFIX schema: <http://schema.org/>\n' +
        'PREFIX schch:  <https://schema.ld.admin.ch/>\n' +
        'PREFIX gtfs:   <http://vocab.gtfs.org/terms#>\n' +
        'PREFIX vl:     <https://version.link/>\n' +
        'PREFIX rico:   <https://www.ica.org/standards/RiC/ontology#>\n' +
        'PREFIX regch:  <https://register.ld.admin.ch/>\n' +
        'PREFIX refch:  <https://reference.data.admin.ch/>\n' +
        'PREFIX dcterms: <http://purl.org/dc/terms/>\n',
      dataLabelProperty: 'schema:name | skos:prefLabel | dcterms:title | rdfs:label',
      schemaLabelProperty: 'schema:name | skos:prefLabel | dcterms:title | rdfs:label',
    });

    var dataProvider = new GE.SparqlDataProvider(
      {
        endpointUrl: 'https://lindas.cz-aws.net/query/',
        acceptBlankNodes: false,
        queryMethod: GE.SparqlQueryMethod.GET,
      },
      settings
    );

    var model = workspace.getModel();
    model.importLayout({
      dataProvider: dataProvider,
      preloadedElements: {},
      layoutData: undefined,
    });

    // Load the starting element and fetch its data
    var element = model.createElement(startIRI);
    if (element) {
      element.setPosition({ x: 400, y: 300 });
      model.requestElementData([startIRI]);
      setTimeout(function() {
        workspace.forceLayout();
        workspace.zoomToFit();
      }, 1000);
    }
  }

  var props = {
    ref: onWorkspaceMounted,
    languages: [
      { code: 'en', label: 'English' },
      { code: 'de', label: 'German' },
      { code: 'fr', label: 'French' },
      { code: 'it', label: 'Italian' },
    ],
    language: 'en',
    viewOptions: {
      onIriClick: function(iriEvent) {
        var iri = iriEvent.iri || iriEvent;
        window.open('/resource/' + encodeURIComponent(iri), '_blank');
      },
    },
  };

  GE.renderTo(GE.Workspace, container, props);
})();
</script>
{{ end }}
