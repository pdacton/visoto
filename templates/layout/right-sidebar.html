<aside class="navbar navbar-vertical navbar-expand-lg d-print-none right-sidebar">
  <!-- Resize handle (desktop only) -->
  <div class="right-sidebar-resize-handle"></div>

  <div class="container-fluid">
    <div class="collapse navbar-collapse" id="right-sidebar-menu">
      <div class="chat-container d-flex flex-column h-100">
        <!-- Chat header with clear button -->
        <div class="chat-header p-3 border-bottom d-flex justify-content-between align-items-center">
          <h3 class="mb-0">{{ t "chat.title" "Resource Assistant" }}</h3>
          <div class="d-flex">
            <a href="#" id="chat-clear" class="nav-link" data-bs-toggle="tooltip" data-bs-placement="bottom" aria-label="{{ t "chat.clearHistory" "Clear chat history" }}" data-bs-original-title="{{ t "chat.clearHistory" "Clear chat history" }}">
              <i data-lucide="trash-2" aria-hidden="true"></i>
            </a>
            <a href="#" id="right-sidebar-close" class="nav-link" data-bs-toggle="tooltip" data-bs-placement="bottom" aria-label="{{ t "chat.closeSidebar" "Close sidebar" }}" data-bs-original-title="{{ t "chat.closeSidebar" "Close sidebar" }}">
              <i data-lucide="x" aria-hidden="true"></i>
            </a>
          </div>
        </div>

        <!-- Messages area (scrollable) -->
        <div id="chat-messages" class="flex-grow-1 overflow-auto p-3">
          <!-- Initial state: loading -->
          <div id="chat-initial" class="text-muted text-center mt-5">
            <div class="spinner-border spinner-border-sm mb-2" role="status">
              <span class="visually-hidden">{{ t "graphs.loading" "Loading..." }}</span>
            </div>
            <p>{{ t "chat.analyzing" "Analyzing resource..." }}</p>
          </div>
        </div>

        <!-- Input area (fixed at bottom) -->
        <div class="chat-input p-3 border-top">
          <form id="chat-form">
            <div class="input-group">
              <input type="text" id="chat-input" class="form-control"
                     placeholder="{{ t "chat.inputPlaceholder" "Ask a question..." }}" autocomplete="off">
              <button type="submit" class="btn btn-primary" id="chat-send">
                <i data-lucide="send"></i>
              </button>
            </div>
          </form>
        </div>
        <div class="px-3 pb-2 text-center">
          <small class="text-muted">{{ tHTML "chat.ownAi" "Prefer your own AI? <a href=\"/connect.html\">Connect Visoto as an MCP server</a>" }}</small>
        </div>
      </div>
    </div>
  </div>
</aside>
