<!-- horizontal Topbar start -->
<header class="navbar navbar-expand-md sticky-top d-print-none">
  <div class="container-fluid d-flex align-items-center">

    <!-- hamburger button to toggle sidebar  -->
    <div class="nav-item">
        <button id="sidebar-toggle" class="nav-link px-0" type="button" aria-label="Toggle sidebar">
          <i data-lucide="menu" style="width: 1.25rem; height: 1.25rem;"></i>
        </button>
    </div>

    <!-- logo and title -->
    <a href="/" class="navbar-brand navbar-brand-autodark ms-3 mb-0 d-flex align-items-center text-decoration-none">
      <img src="/static/img/visoto_light.svg" alt="Logo" width="48" height="48" class="navbar-brand-image me-1 logo-light">
      <img src="/static/img/visoto_dark.svg" alt="Logo" width="48" height="48" class="navbar-brand-image me-1 logo-dark">
      <span class="d-none d-md-inline">visoto</span>
    </a>

    <!-- search field -->
    <div class="nav-item mx-auto" style="width: 50%; max-width: 800px;">
      <form action="/search" method="GET" id="topbar-search-form">
        <div class="input-icon">
          <input
            type="text"
            name="q"
            id="topbar-search-input"
            class="form-control form-control-rounded"
            placeholder="Search (Lucene syntax)..."
            aria-label="Search">
          <span class="input-icon-addon">
            <i data-lucide="search" style="width: 20px; height: 20px;"></i>
          </span>
        </div>
      </form>
    </div>

    <div class="d-none d-md-flex">
      <!-- SPARQL Endpoint selector -->
      {{ if .SparqlEndpoints }}
      <div class="nav-item me-2 d-flex align-items-center">
        <select class="form-select form-select-sm" id="endpoint-selector" name="endpoint" style="width: auto;" data-bs-toggle="tooltip" data-bs-placement="bottom" aria-label="Select SPARQL endpoint" data-bs-original-title="Select SPARQL endpoint">
          {{ range .SparqlEndpoints }}
            <option value="{{ .Name }}">{{ .Name }}</option>
          {{ end }}
        </select>
      </div>
      {{ end }}
      <!-- darkmode button -->
      <div class="nav-item">
        <a href="#" id="theme-toggle" class="nav-link" data-bs-toggle="tooltip" data-bs-placement="bottom" aria-label="Enable dark mode" data-bs-original-title="Enable dark mode">
          <i id="theme-icon" data-lucide="moon" aria-hidden="true" style="width: 1.25rem; height: 1.25rem;"></i>
        </a>
      </div>
      <!-- assistant button -->
      <div class="nav-item">
        <a href="#" id="right-sidebar-toggle" class="nav-link" data-bs-toggle="tooltip" data-bs-placement="bottom" aria-label="Otto, the assistant" data-bs-original-title="Otto, the assistant">
          <i data-lucide="sparkle" style="width: 1.25rem; height: 1.25rem;"></i>
        </a>
      </div>
      <!-- settings menu -->
      <div class="nav-item dropdown">
        <a href="#" class="nav-link" data-bs-toggle="dropdown" data-bs-placement="bottom" aria-label="Open settings menu" data-bs-original-title="Settings">
          <i data-lucide="more-vertical" style="width: 1.25rem; height: 1.25rem;"></i>
        </a>
        <div class="dropdown-menu dropdown-menu-end">
          <h6 class="dropdown-header">Settings</h6>
          <a class="dropdown-item d-flex align-items-center justify-content-between" href="#" id="monitoring-toggle">
            <span>Endpoint Monitoring</span>
            <span id="monitoring-toggle-icon" class="ms-2"></span>
          </a>
          <div class="dropdown-divider"></div>
          <a class="dropdown-item" href="/monitoring">
            <i data-lucide="chart-line" style="width: 1rem; height: 1rem;" class="me-2"></i>View response times
          </a>
        </div>
      </div>
    </div>
    
  </div>

</header>
<!-- horizontal Topbar end -->
