<!-- Default instance template, used for any instance without a specific template -->

{{ template "pageHeader" . }}

{{ define "pageContent" }}
<div>

  {{ template "literals" . }}

  <!-- Incoming / outgoing connections.
       Shares templates/components/relationships.html with the curated instance
       templates, so the two tables are defined once. Note this makes them
       synchronous (LIMIT 1000) rather than the async LIMIT 10000 pair this
       template previously hand-rolled. -->
  {{ template "relationships" . }}

</div>
{{ end }}
