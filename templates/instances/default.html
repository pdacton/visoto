<!-- Default instance template, used for any instance without a specific template -->

{{ template "pageHeader" . }}

<!-- No breadcrumb override: layout/header.html's default renders the class crumb
     from .TemplateType, which ResolveTemplate has already picked from the same
     sorted type list it used to choose this template — so the crumb cannot
     disagree with the page, and the extra per-page type query this template used
     to run is gone. Blank-node types are filtered there too. -->

{{ define "pageContent" }}
<div>

  {{ template "literals" . }}

  <!-- Incoming / outgoing connections.
       Shares templates/components/relationships.html with the curated instance
       templates, so the two tables are defined once. Note this makes them
       synchronous (LIMIT 1000) rather than the async LIMIT 10000 pair this
       template previously hand-rolled. -->
  {{ template "relationships" . }}

</div>
{{ end }}
