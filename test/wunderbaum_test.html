<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wunderbaum Test</title>

    <!-- Wunderbaum CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/wunderbaum@latest/dist/wunderbaum.min.css">
    <link rel="stylesheet" href="../static/css/wunderbaum_overrides.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            color: #333;
        }
        #tree-container {
            height: 400px;
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 10px;
        }
    </style>
</head>
<body>
    <h1>Wunderbaum Tree Example</h1>

    <div id="tree-container"></div>

    <!-- Wunderbaum JS -->
    <script src="https://cdn.jsdelivr.net/npm/wunderbaum@latest/dist/wunderbaum.umd.min.js"></script>

    <script>
        // Sample tree data
        const treeData = [
            {
                title: "Node 1",
                expanded: true,
                attr1: "alpha",
                attr2: 100,
                children: [
                    { title: "Node 1.1", attr1: "beta", attr2: 200 },
                    {
                        title: "Node 1.2",
                        attr1: "gamma",
                        attr2: 300,
                        children: [
                            { title: "Node 1.2.1", attr1: "delta", attr2: 400 },
                            { title: "Node 1.2.2", attr1: "epsilon", attr2: 500 }
                        ]
                    },
                    { title: "Node 1.3", attr1: "zeta", attr2: 600 }
                ]
            },
            {
                title: "<i>GUGUS</i> 2",
                expanded: true,
                attr1: "eta",
                attr2: 700,
                children: [
                    { title: "Node 2.1", attr1: "theta", attr2: 800 },
                    { title: "Node 2.2", attr1: "iota", attr2: 900 }
                ]
            },
            {
                title: "<a href='#'>Link 3</a>",
                attr1: "kappa",
                attr2: 1000,
                children: [
                    { title: "Node 3.1", attr1: "lambda", attr2: 1100 },
                    { title: "Node 3.2", attr1: "mu", attr2: 1200 },
                    { title: "Node 3.3", attr1: "nu", attr2: 1300 }
                ]
            }
        ];

        // Initialize Wunderbaum
        const tree = new mar10.Wunderbaum({
            element: document.getElementById("tree-container"),
            source: treeData,
            checkbox: true,
            selectMode: "multi",
            showSpinner: true,
            minExpandLevel: 1,
            rowHeightPx: 44,
            columns: [
                { id: "*", title: "Title", width: "250px" },
                { id: "attr1", title: "Attribute1", width: "150px" },
                { id: "attr2", title: "Attribute2", width: "150px" }
            ],
            render: function(e) {
                console.log("Rendering:", e.node.title);
                const newTitle = e.node.title.replace("Node", "<b>Vertex</b>");
                const titleSpan = e.nodeElem.querySelector(".wb-title");
                if (titleSpan) {
                    titleSpan.innerHTML = newTitle;
                }

                // Render column data
                if (e.renderColInfosById) {
                    for (const col of Object.values(e.renderColInfosById)) {
                        if (col.id === "*") continue;
                        const nodeData = e.node.data;
                        const colData = nodeData[col.id];
                        col.elem.textContent = colData !== undefined ? colData : "";
                    }
                }

                console.log("Rendering:", newTitle);
            }
        });
    </script>
</body>
</html>
